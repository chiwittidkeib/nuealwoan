<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="app-version" content="2026.10.09-0905">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17694f">
<title>NueaLwoan · สั่งอาหาร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@400;500&display=swap">
<style>
/* Layout: jade header with table number, scrolling menu grid, sticky cart bar at the bottom. */
:root{
  --bg:#f3f5f0; --surface:#ffffff; --sunk:#e9ece5; --line:#d9ded4;
  --fg:#1c2420; --muted:#5f6b64;
  --jade:#17694f; --jade-soft:#dcefe5; --on-jade:#ffffff;
  --chili:#b23d27; --amber:#946207; --amber-soft:#f5e8cc;
  --f-display:"Mitr","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111614; --surface:#1a201d; --sunk:#151a18; --line:#2b3430;
  --fg:#e8eee9; --muted:#9aa69f;
  --jade:#5ec59c; --jade-soft:#1c3a2e; --on-jade:#0b1912;
  --chili:#f08c74; --amber:#e4b75c; --amber-soft:#382d16; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;line-height:1.25;text-wrap:balance}
header{background:var(--jade);color:var(--on-jade);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px}
header .in{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-size:22px}
.hlogo{width:52px;height:52px;border-radius:12px;background:#fff;object-fit:contain;padding:3px;flex:none}
header small{opacity:.85}
.tno{font-family:var(--f-display);text-align:right;line-height:1}
.tno span{display:block;font-size:12px;opacity:.85;font-family:var(--f-body)}
.tno b{font-size:34px;font-weight:500}
main{flex:1;overflow-y:auto}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:16px 24px;display:flex;flex-direction:column;gap:14px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:0;overflow:hidden;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;position:relative}
.ph{width:100%;aspect-ratio:4/3;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:34px;color:var(--muted)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.item .tx{padding:8px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.item p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item.big{grid-column:1/-1}
.mini{width:44px;height:44px;border-radius:8px;overflow:hidden;flex:none;background:var(--sunk)}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.item:active{transform:scale(.98)}
.item b{font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1.3}
.item span{margin-top:auto;font-weight:600;color:var(--jade);font-variant-numeric:tabular-nums}
.item em{position:absolute;top:8px;right:8px;box-shadow:0 1px 4px rgba(0,0,0,.25);font-style:normal;background:var(--jade);color:var(--on-jade);border-radius:999px;min-width:24px;height:24px;line-height:24px;text-align:center;font-weight:600;font-size:13px;padding:0 6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .g{flex:1;min-width:0}
.row .r{font-variant-numeric:tabular-nums;white-space:nowrap}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stepper button{border:0;background:none;width:38px;height:38px;cursor:pointer;font-size:18px}
.stepper span{min-width:24px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px;min-height:46px}
.qn{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;font-weight:500}
.pill.ok{background:var(--jade-soft);color:var(--jade)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
footer{background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
footer .in{max-width:900px;margin:0 auto;display:flex;gap:10px;align-items:center}
.tot{flex:1;display:flex;flex-direction:column;min-width:0}
.tot small{color:var(--muted);font-size:12.5px}
.tot b{font-family:var(--f-display);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 16px;min-height:48px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{flex:1}
.msg{text-align:center;padding:48px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.msg h2{font-size:24px}
.muted{color:var(--muted)}
.err{color:var(--chili)}
.namebox{max-width:420px;width:100%;margin:24px auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px}
.namebox h2{font-size:24px}
.lnk-w{border:0;background:none;color:inherit;text-decoration:underline;cursor:pointer;padding:0;font:inherit;opacity:.95}
.lnk-g{border:0;background:none;color:var(--jade);cursor:pointer;padding:4px 0;font:inherit;font-weight:500}
.who{font-size:12px;color:var(--muted)}

/* ---- พื้นหลังรูปหน้าร้าน (หน้าต้อนรับลูกค้า) ---- */
body.welcome::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(8,6,5,0) 0%,rgba(8,6,5,.1) 35vw,#0b0a09 100vw),url(images/bg-m.jpg) 50% 0/100% auto no-repeat,url(bg-m.jpg) 50% 0/100% auto no-repeat,#0b0a09}
@media (min-width:701px){body.welcome::before{background:linear-gradient(180deg,rgba(8,6,5,.3),rgba(8,6,5,.85)),url(images/bg.jpg) center 40%/cover no-repeat,url(bg.jpg) center 40%/cover no-repeat}}
body.welcome header,body.welcome main{position:relative;z-index:1}
body.welcome header{background:transparent}
body.welcome main{display:flex;align-items:flex-end}
body.welcome .wrap{width:100%}
body.welcome .namebox{--surface:rgba(18,15,12,.62);--fg:#f6efe4;--muted:#cdbfae;--line:rgba(255,230,190,.18);--jade:#d9a65a;--on-jade:#1d1307;
  color:var(--fg);background:var(--surface);border-color:var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);margin-bottom:max(24px,env(safe-area-inset-bottom));box-shadow:0 20px 50px rgba(0,0,0,.5)}
body.welcome .namebox input{background:rgba(0,0,0,.35);color:var(--fg)}
body.welcome .namebox .btn.pri{background:linear-gradient(180deg,#e2b265,#c48d3d);border-color:#c48d3d;color:#1d1307}
@media (min-width:701px) and (orientation:portrait){body.welcome::before{background:linear-gradient(180deg,rgba(8,6,5,.25),rgba(8,6,5,.8)),url(images/bg-m.jpg) center 30%/cover no-repeat,url(bg-m.jpg) center 30%/cover no-repeat,#0b0a09}}

/* มือถือ: ช่องกรอกตัวอักษร 16px ขึ้นไป กัน iPhone ซูมเข้าเองตอนแตะช่องกรอก และกันหน้าเลื่อนออกด้านข้าง */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{max-width:100%;overflow-x:clip}
@media (pointer:coarse),(max-width:820px){input:not([type=checkbox]):not([type=radio]):not([type=range]),select,textarea{font-size:16px!important}}
/* ตัวเลือกเมนู (แบบ LINE MAN) */
.opop{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.op-card{position:relative;background:var(--bg);color:var(--fg);width:100%;max-width:520px;max-height:92%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -10px 40px rgba(0,0,0,.45)}
@media (min-width:700px){.opop{align-items:center}.op-card{border-radius:18px;max-height:88%}}
.op-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.op-img{margin:0 -16px;aspect-ratio:16/9;max-height:220px;overflow:hidden;background:var(--sunk)}
.op-img img{width:100%;height:100%;object-fit:cover;display:block}
.op-hd{display:flex;gap:12px;align-items:flex-start;padding-top:14px;padding-right:34px}
.op-hd .op-t{flex:1;min-width:0}.op-hd h2{margin:0;font-size:20px;line-height:1.3}.op-hd p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.op-hd>b{font-size:18px;white-space:nowrap}
.op-g{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.op-gh{display:flex;align-items:center;gap:8px;justify-content:space-between}.op-gh b{font-size:16px}
.op-rule{font-size:12px;color:var(--muted);background:var(--sunk);padding:2px 8px;border-radius:99px;white-space:nowrap}
.op-rule.req{color:#ffd58a;background:rgba(255,190,80,.14)}
.op-g.bad .op-rule.req{color:#fff;background:var(--chili)}
.op-c{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.op-c span{flex:1}.op-c em{font-style:normal;color:var(--muted);font-size:14px}
.op-c i{flex:none;width:20px;height:20px;border:2px solid var(--muted);border-radius:50%;position:relative}
.op-c i.ck{border-radius:5px}
.op-c.on{border-color:var(--jade);background:var(--jade-soft)}
.op-c.on i{border-color:var(--jade);background:var(--jade)}
.op-c.on i.rd::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--bg)}
.op-c.on i.ck::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid var(--on-jade,#fff);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.op-g input{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:9px;padding:10px 12px;min-height:44px;width:100%;font:inherit}
.op-qn{display:flex;gap:6px;flex-wrap:wrap}
.op-foot{display:flex;gap:10px;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.op-foot .op-add{flex:1;min-height:48px}
.op-x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:20px;line-height:1;cursor:pointer}
.optx{font-size:13px;color:#ffd58a;line-height:1.4}
.chip{cursor:pointer}

/* คิว / เรียกพนักงาน / ชำระเงิน */
.callb{flex:none;border:0;border-radius:999px;background:rgba(0,0,0,.28);color:#fff;font:inherit;font-weight:600;font-size:13.5px;padding:8px 12px;min-height:40px;cursor:pointer;white-space:nowrap}
.callb.on{background:#ffd58a;color:#3a2600}
body.welcome .callb{display:none}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px;text-align:center}
.qcard small{color:var(--muted)}.qcard b{font-family:var(--f-display);font-size:34px;line-height:1.15;color:#ffd58a}
.qcard.ok b{color:var(--jade);font-size:26px}
.qcard .t{font-size:14px}
.tm{font-size:12px;color:var(--muted)}
.bill .row.sum{font-size:18px}.bill .row.sum b{font-size:22px}
.payqr{background:#fff;color:#111;border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.payqr svg{width:220px;height:220px;max-width:70vw}
.payqr b{font-size:22px}.payqr small{color:#555}
.stack{display:flex;flex-direction:column;gap:10px}
.callpop{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.callpop .cc{background:var(--bg);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.callpop h2{font-size:20px}
@media (min-width:700px){.callpop{align-items:center}.callpop .cc{border-radius:18px}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#ffd58a;color:#3a2600;padding:10px 16px;border-radius:12px;font-weight:600;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:90vw;text-align:center}
.updbar{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:99;background:#ffd58a;color:#2b1c00;border-radius:12px;padding:8px 10px 8px 14px;display:flex;gap:10px;align-items:center;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.45);white-space:nowrap}
.updbar button{border:0;border-radius:9px;background:#2b1c00;color:#ffd58a;font:inherit;padding:6px 12px;cursor:pointer}
.pushbtn{display:flex;flex-direction:column;align-items:center;gap:2px;white-space:normal;text-align:center;border-color:#ffd58a;color:#ffd58a}
.pushbtn small{font-weight:400;font-size:12.5px;color:var(--muted)}
.pushc{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;text-align:center}
.pushc.on{color:var(--jade);border-style:solid}
.imgview{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.imgview img{max-width:100%;max-height:calc(100% - 60px);object-fit:contain;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.imgview .iv-cap{color:#fff;margin-top:12px;font-size:16px;text-align:center}
.imgview .iv-x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:24px;cursor:pointer}
.zoomable{cursor:zoom-in}
.stamp{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);width:92px;height:92px;border:3px solid #e5383b;border-radius:50%;color:#ff4d4f;font-weight:800;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;background:rgba(25,6,6,.82);box-shadow:inset 0 0 0 3px rgba(229,56,59,.35),0 0 0 2px rgba(229,56,59,.25);pointer-events:none;z-index:2}
.item.is-out{cursor:not-allowed}.item.is-out .ph img{filter:grayscale(1);opacity:.45}.item.is-out .tx{opacity:.55}
.leftq{display:inline-block;font-size:12px;font-weight:700;color:#ffd58a;background:rgba(255,190,80,.14);border-radius:999px;padding:1px 8px;align-self:flex-start}
.leftq.low{color:#fff;background:#c2410c}
.stamp{flex-direction:column;gap:3px}
.stamp b{display:block;font-weight:800;font-size:1em;line-height:1.15;padding-bottom:3px;border-bottom:2px solid currentColor;color:inherit;opacity:1;margin:0}
.stamp i{display:block;font-style:normal;font-weight:800;font-size:.62em;letter-spacing:.6px;text-transform:uppercase;line-height:1;color:inherit;opacity:1}
.stamp b,.stamp i{color:var(--jade)!important;opacity:1!important;font-family:var(--f-body)}
.item .stamp b{font-size:17px}
</style>
</head>
<body>
<header><div class="in"><img id="logo" class="hlogo" alt="" hidden><div style="flex:1;min-width:0"><h1 id="shop">กำลังโหลดเมนู…</h1><small id="sub">สั่งอาหารได้จากมือถือ</small></div><button class="callb" id="callBtn" type="button" data-a="callAsk" hidden>🔔 เรียกพนักงาน</button><div class="tno" id="tno" hidden><span>โต๊ะ</span><b id="tnum"></b></div></div></header>
<main><div class="wrap" id="view"><div class="msg"><p class="muted">กำลังโหลดเมนู…</p></div></div></main>
<footer id="foot" hidden><div class="in" id="footIn"></div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="js/config.js"></script>
<script>window.APP_CONFIG||document.write('<script src="config.js"><\/script>')</script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const baht=n=>'฿'+(Math.round((+n||0)*100)/100).toLocaleString('th-TH',{maximumFractionDigits:2});
const optLine=e=>e.opts&&e.opts.length?`<div class="optx">${esc(optNames(e.opts))}</div>`:'';

/* ---------- ตัวเลือกเมนู (แบบ LINE MAN) ใช้ร่วมกันทั้งหน้าพนักงานและหน้าลูกค้า ---------- */
const optGroups=m=>Array.isArray(m&&m.options)?m.options.filter(g=>g&&g.name&&(g.choices||[]).length):[];
const hasOpts=m=>optGroups(m).length>0;
const optKey=opts=>(opts||[]).map(o=>o.cid||o.n).join(',');
const optNames=opts=>(opts||[]).map(o=>o.n).join(', ');
const optRule=g=>g.req?(+g.max===1?'ต้องเลือก 1':'ต้องเลือก'+(+g.max>1?' สูงสุด '+g.max:'อย่างน้อย 1')):(+g.max===1?'เลือกได้ 1':'เลือกได้'+(+g.max>1?' สูงสุด '+g.max:'หลายอย่าง'));
const minPrice=m=>(+m.price||0)+optGroups(m).filter(g=>g.req).reduce((s,g)=>s+Math.min(...g.choices.map(c=>+c.price||0)),0);

/* ---------- ดูรูปเต็มจอ ---------- */
function viewImg(src,cap){if(!src)return;const o=document.getElementById('imgView');if(o)o.remove();const el=document.createElement('div');el.id='imgView';el.className='imgview';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');
  el.innerHTML=`<img src="${esc(src)}" alt="${esc(cap||'')}">${cap?`<div class="iv-cap">${esc(cap)}</div>`:''}<button type="button" class="iv-x" aria-label="ปิด">×</button>`;
  const close=()=>{el.remove();window.removeEventListener('keydown',k,true)};const k=e=>{if(e.key==='Escape'){e.stopPropagation();close()}};window.addEventListener('keydown',k,true);
  el.addEventListener('click',e=>{e.stopPropagation();close()});document.body.appendChild(el)}
function optPick(m,cfg){cfg=cfg||{};const G=optGroups(m);const pick={};G.forEach(g=>pick[g.id]=[]);let qty=1,note='',warn=false;
  const mul=cfg.mul||(x=>x);
  const old=document.getElementById('optPop');if(old)old.remove();
  const el=document.createElement('div');el.id='optPop';el.className='opop';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');document.body.appendChild(el);

const hm=t=>new Date(t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});

function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function ppPayload(id,amount){
  let t=String(id||'').replace(/\D/g,''),tag;
  if(t.length===15)tag='03';else if(t.length>=13){tag='02';t=t.slice(0,13)}else{tag='01';t=('0000000000000'+t.replace(/^0/,'66')).slice(-13)}
  const f=(k,v)=>k+String(v.length).padStart(2,'0')+v;
  let p=f('00','01')+f('01',amount>0?'12':'11')+f('29',f('00','A000000677010111')+f(tag,t))+f('58','TH')+f('53','764');
  if(amount>0)p+=f('54',amount.toFixed(2));
  p+='6304';return p+crc16(p);}

const PUSH={reg:null,key:null,

  standalone:()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}},
  fn:()=>String((window.APP_CONFIG||{}).SUPABASE_URL||'').replace(/\/$/,'')+'/functions/v1/push',
  async init(){if(this.reg||!('serviceWorker' in navigator))return this.reg;try{this.reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready}catch(e){this.reg=null}return this.reg},
  async loadKey(){if(this.key)return this.key;const cfg=window.APP_CONFIG||{};let r;try{r=await fetch(this.fn(),{method:'POST',headers:{'Content-Type':'application/json',apikey:cfg.SUPABASE_KEY||''},body:'{"op":"pubkey"}'})}catch(e){throw new Error('nofn')}
    if(!r.ok)throw new Error('nofn');const j=await r.json();if(!j.key)throw new Error('nofn');return this.key=j.key},
  b64(s){const p='='.repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))},
  async current(){const r=await this.init();return r?await r.pushManager.getSubscription():null},
  async subscribe(){if(!this.ok())throw new Error('unsupported');
    const perm=Notification.permission==='granted'?'granted':await Notification.requestPermission();if(perm!=='granted')throw new Error('denied');
    const reg=await this.init();if(!reg)throw new Error('nosw');const key=await this.loadKey();let sub=await reg.pushManager.getSubscription();
    if(sub){try{const k=sub.options&&sub.options.applicationServerKey;if(k&&btoa(String.fromCharCode(...new Uint8Array(k))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')!==key){await sub.unsubscribe();sub=null}}catch(e){}}

  async hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].slice(0,12).map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return 'h'+(h>>>0).toString(16)}},
  errText(e){const m=String(e&&e.message||e);return /denied/.test(m)?'ถูกปิดการแจ้งเตือนไว้ ไปเปิดที่ ตั้งค่าเบราว์เซอร์/ตั้งค่ามือถือ → การแจ้งเตือน':/unsupported/.test(m)?(this.ios&&!this.standalone()?'iPhone/iPad ต้องเพิ่มเว็บไปที่หน้าจอโฮมก่อน (Safari → ปุ่มแชร์ → เพิ่มไปยังหน้าจอโฮม) แล้วเปิดจากไอคอน':'เบราว์เซอร์นี้ไม่รองรับ ลองใช้ Chrome'):/nofn/.test(m)?'ติดต่อระบบแจ้งเตือนไม่ได้ (ตรวจว่าติดตั้ง Edge Function "push" และปิด Verify JWT แล้ว)':'เปิดแจ้งเตือนไม่สำเร็จ ลองอีกครั้ง'}};

function setCall(){const b=$('#callBtn');if(!b)return;const st=S.status||{};const can=!['name','closed','off'].includes(S.view)&&(!WALK||!!getWO());b.hidden=!can;
  const c=st.call,on=c&&(Date.now()+(S.skew||0)-c.at)<15*60000;b.classList.toggle('on',!!on);b.textContent=on?'🔔 เรียกแล้ว':'🔔 เรียกพนักงาน'}
async function doCall(kind){const {data,error}=await sb.rpc('customer_call',{p_key:K,p_table:T,p_order:WALK?getWO():null,p_kind:kind,p_name:S.name||''});
  if(error){toast(/no_order/.test(error.message)?'สั่งอาหารก่อน แล้วค่อยเรียกพนักงาน':'เรียกไม่สำเร็จ ลองอีกครั้ง');return false}
  if(S.status)S.status.call=data&&data.call;setCall();toast(kind==='paid'?'แจ้งพนักงานแล้ว รอตรวจสอบยอดสักครู่':'เรียกพนักงานแล้ว รอสักครู่นะครับ');return true}
function callAsk(){const o=document.querySelector('.callpop');if(o)o.remove();const st=S.status||{};const c=st.call;
  const el=document.createElement('div');el.className='callpop';el.innerHTML=`<div class="cc" role="dialog" aria-modal="true"><h2>ต้องการให้ช่วยอะไร</h2>${c&&(Date.now()+(S.skew||0)-c.at)<15*60000?`<p class="muted" style="margin:0">เรียกไปแล้วเมื่อ ${hm(c.at)} (${esc(callLabel(c.kind))}) พนักงานกำลังมา</p>`:''}
    ${callOpts().map((o,i)=>`<button class="btn${i?'':' pri'}" data-call="${esc(o.id)}" type="button">${esc(o.label)}</button>`).join('')}<button class="btn" data-call="" type="button">ยกเลิก</button></div>`;
  let downBg=false;el.addEventListener('pointerdown',e=>{downBg=e.target===el});
  el.addEventListener('click',async e=>{if(e.target===el){if(downBg)el.remove();return}const b=e.target.closest('[data-call]');if(!b)return;e.stopPropagation();el.remove();if(b.dataset.call)await doCall(b.dataset.call)});
  document.body.appendChild(el)}

const eUnit=e=>(+(S.menu.find(m=>m.id===e.menuId)||{}).price||0)+(e.opts||[]).reduce((a,o)=>a+(+o.p||0),0);
const cartN=()=>Object.values(S.cart).reduce((a,e)=>a+e.qty,0);
const cartT=()=>Object.values(S.cart).reduce((s,e)=>s+eUnit(e)*e.qty,0);
const inCart=id=>Object.values(S.cart).reduce((a,e)=>a+(e.menuId===id?e.qty:0),0);
function putCart(m,sel){const k=m.id+'|'+optKey(sel.opts)+'|'+sel.note;if(S.cart[k])S.cart[k].qty+=sel.qty;else S.cart[k]={menuId:m.id,opts:sel.opts,note:sel.note,qty:sel.qty};render()}

function render(){
  document.body.classList.toggle('welcome',S.view==='name'||S.view==='closed');setCall();
  const v=$('#view'),f=$('#footIn');let h='',ft='';
  if(S.view==='closed'){
    v.innerHTML=`<div class="namebox" style="text-align:center"><h2>โต๊ะ ${esc(T)} ยังไม่เปิด</h2><p class="muted" style="margin:0">แจ้งพนักงานให้เปิดโต๊ะ หน้านี้จะไปหน้าเมนูให้เองเมื่อโต๊ะเปิดแล้ว</p><p class="muted" style="margin:0;font-size:13px">กำลังรอ…</p></div>`;
    f.innerHTML='';$('#foot').hidden=true;return;
  }
  if(S.view==='name'){
    h=`<form class="namebox" id="nameForm"><h2>ยินดีต้อนรับ</h2><p class="muted" style="margin:0">${WALK?'สั่งอาหารเองได้เลย · ใส่ชื่อไว้ให้พนักงานเรียกตอนอาหารพร้อม':'โต๊ะ '+esc(T)+' · ใส่ชื่อของคุณ ร้านจะได้เสิร์ฟถูกคน'}</p>
      <div class="field"><label for="nm">ชื่อของคุณ</label><input id="nm" maxlength="40" autocomplete="given-name" placeholder="เช่น ต้น, พี่หนิง" value="${esc(S.name)}"></div>
      <p class="err" id="nmErr" role="alert"></p>
      <button class="btn pri" type="submit">เริ่มสั่งอาหาร</button>
      ${S.name||WALK?'':'<button class="lnk-g" data-a="skipName" type="button">ข้าม ไม่ใส่ชื่อ</button>'}</form>`;
    v.innerHTML=h;f.innerHTML='';$('#foot').hidden=true;
    $('#nameForm').addEventListener('submit',e=>{e.preventDefault();const n=$('#nm').value.trim().replace(/\s+/g,' ');
      if(!n){$('#nmErr').textContent=WALK?'ใส่ชื่อก่อน พนักงานจะเรียกชื่อนี้ตอนอาหารพร้อม':'ใส่ชื่อก่อน หรือกด "ข้าม"';return}
      S.name=n.slice(0,40);saveName(S.name);setSub();S.view=S.status&&S.status.open&&(S.status.items||[]).length?'status':'menu';render()});
    setTimeout(()=>$('#nm')?.focus(),50);return;
  }
  if(S.view==='menu'){
    h=`<div class="chips">${['all',...S.cats].map(c=>`<button class="chip" aria-pressed="${S.cat===c}" data-a="cat" data-v="${esc(c)}" type="button">${c==='all'?'ทั้งหมด':esc(c)}</button>`).join('')}</div>
    <div class="grid">${S.menu.filter(m=>S.cat==='all'||m.cat===S.cat).map(m=>`<button class="item${m.soldOut?' is-out':''}" data-a="add" data-m="${esc(m.id)}" type="button" ${m.soldOut?'disabled aria-label="'+esc(m.name)+' หมดแล้ว"':''}>${m.soldOut?'<span class="stamp"><b>หมดแล้ว</b><i>Sold Out</i></span>':''}<div class="ph">${m.img?`<img src="${esc(m.img)}" alt="${esc(m.name)}" loading="lazy">`:esc(String(m.name||'?').trim().charAt(0))}</div>${inCart(m.id)?`<em>${inCart(m.id)}</em>`:''}<div class="tx"><b>${esc(m.name)}</b>${m.desc?`<p>${esc(m.desc)}</p>`:''}<span>${hasOpts(m)&&minPrice(m)!==(+m.price||0)?'เริ่ม ':''}${baht(hasOpts(m)?minPrice(m):m.price)}${hasOpts(m)?' <small class="muted">· เลือกได้</small>':''}</span>${!m.soldOut&&m.left!=null?`<span class="leftq${m.left<=3?' low':''}">เหลือ ${m.left}</span>`:''}</div></button>`).join('')||'<p class="muted">ยังไม่มีเมนูเปิดขาย</p>'}</div>
    ${S.status&&S.status.items.length?`<button class="btn" data-a="view" data-v="status" type="button">ดูรายการที่สั่งแล้ว · ${baht(S.status.total)}</button>`:''}`;
    ft=`<div class="tot"><small>ในตะกร้า ${cartN()} รายการ</small><b>${baht(cartT())}</b></div><button class="btn pri" data-a="view" data-v="cart" ${cartN()?'':'disabled'} type="button">ดูตะกร้า</button>`;
  }else if(S.view==='cart'){
    const rows=Object.entries(S.cart).map(([k,e])=>{const m=S.menu.find(x=>x.id===e.menuId);return m?`<div class="row">${m.img?`<div class="mini"><img src="${esc(m.img)}" alt=""></div>`:''}<div class="g">${esc(m.name)}${optLine(e)}${e.note?`<div class="who">${esc(e.note)}</div>`:''}</div><div class="stepper"><button data-a="qty" data-k="${esc(k)}" data-d="-1" type="button" aria-label="ลด">−</button><span>${e.qty}</span><button data-a="qty" data-k="${esc(k)}" data-d="1" type="button" aria-label="เพิ่ม">+</button></div><div class="r" style="min-width:60px;text-align:right">${baht(eUnit(e)*e.qty)}</div></div>`:''}).join('');
    h=`<h2>ตะกร้า${where()}</h2>${S.name?`<p class="muted" style="margin:0">สั่งในชื่อ <b>คุณ${esc(S.name)}</b> · <button class="lnk-g" data-a="editName" type="button">เปลี่ยน</button></p>`:''}${rows?`<div class="list">${rows}</div>`:'<p class="muted">ยังไม่ได้เลือกเมนู</p>'}
    <div class="field"><label for="note">บอกครัว ทุกรายการ (ถ้ามี)</label><input id="note" placeholder="เช่น ไม่ใส่ผัก ไม่เผ็ด" maxlength="120" autocomplete="off"></div>
    <div class="qn">${NOTES.map(n=>`<button class="chip" data-a="note" data-v="${esc(n)}" type="button">${esc(n)}</button>`).join('')}</div>
    <p class="err" id="sendErr" role="alert"></p>`;
    ft=`<button class="btn" data-a="view" data-v="menu" type="button">เลือกเพิ่ม</button><button class="btn pri wide" data-a="send" ${cartN()&&!S.sending?'':'disabled'} type="button">${S.sending?'กำลังส่ง…':'ส่งรายการ '+baht(cartT())}</button>`;
  }else if(S.view==='bill'){
    const st=S.status||{items:[],total:0},bc=billCalc(st),pp=String(st.promptpay||'').replace(/\D/g,'');
    h=`<h2>ตรวจสอบยอด${where()}</h2>${st.orderNo?`<p class="muted" style="margin:0">เลขที่ ${esc(st.orderNo)}</p>`:''}`+
      (st.items.length?`<div class="list bill">${st.items.map(l=>`<div class="row"><div class="g">${l.qty}× ${esc(l.name)}${l.opt?`<div class="optx">${esc(l.opt)}</div>`:''}</div><div class="r">${baht(l.amount)}</div></div>`).join('')}
        ${bc.vat?`<div class="row"><div class="g muted">${bc.mode==='excl'?'รวมก่อนภาษี':'ยอดรวม'}</div><div class="r">${baht(bc.sub)}</div></div><div class="row"><div class="g muted">VAT ${bc.rate}%${bc.mode==='incl'?' (รวมในราคาแล้ว)':''}</div><div class="r">${baht(bc.vat)}</div></div>`:''}
        <div class="row sum"><div class="g"><b>ยอดที่ต้องชำระ</b></div><div class="r"><b>${baht(bc.total)}</b></div></div></div>
        ${st.waiting?`<p class="muted" style="margin:0">ยังมี ${st.waiting} รายการที่กำลังทำ ยอดนี้รวมไว้แล้ว</p>`:''}
        ${pp&&bc.total>0?`<div class="payqr"><small>สแกนจ่ายด้วยแอปธนาคาร (พร้อมเพย์)</small>${qrSvg(ppPayload(pp,bc.total))}<b>${baht(bc.total)}</b><small>โอนแล้วกด "แจ้งโอนแล้ว" ให้พนักงานตรวจสอบ</small></div>`:''}
        <div class="stack">${pp&&bc.total>0?`<button class="btn pri" data-a="call" data-v="paid" type="button">โอนแล้ว แจ้งพนักงาน</button>`:''}<button class="btn${pp?'':' pri'}" data-a="call" data-v="pay" type="button">ชำระเงินสด / เรียกพนักงานเก็บเงิน</button></div>
        <p class="muted" style="margin:0;font-size:13px">ส่วนลดหรือแต้มสะสม พนักงานจะหักให้ตอนชำระเงิน ยอดสุดท้ายตามใบเสร็จ</p>`:'<p class="muted">ยังไม่มีรายการ</p>');
    ft=`<button class="btn" data-a="view" data-v="status" type="button">ดูสถานะ</button><button class="btn pri wide" data-a="view" data-v="menu" type="button">สั่งเพิ่ม</button>`;
  }else{
    const st=S.status||{items:[],total:0};const now=Date.now()+(S.skew||0);
    const q=!st.items.length?'':st.waiting>0?`<div class="qcard"><small>คิวของคุณ</small><b>${st.ahead>0?'คิวที่ '+(st.ahead+1):'ถึงคิวคุณแล้ว'}</b><span class="t">${st.ahead>0?'รออีก '+st.ahead+' คิว ก่อนถึงของคุณ':'ครัวกำลังทำอาหารของคุณ'}</span><span class="tm">${st.waiting} รายการกำลังทำ${st.firstWait?' · สั่งเมื่อ '+hm(st.firstWait)+' · รอมาแล้ว '+Math.max(0,Math.floor((now-st.firstWait)/60000))+' นาที':''}</span></div>`
      :`<div class="qcard ok"><small>สถานะ</small><b>เสิร์ฟครบแล้ว ✓</b><span class="t">ทานให้อร่อยนะครับ ต้องการอะไรเพิ่มกด "สั่งเพิ่ม" หรือ "เรียกพนักงาน"</span></div>`;
    h=(S.view==='done'?`<div class="msg" style="padding:16px 8px 4px"><h2>ส่งรายการเข้าครัวแล้ว${S.name?' คุณ'+esc(S.name):''}</h2><p class="muted" style="margin:0">${WALK?'พนักงานจะเรียกชื่อ คุณ'+esc(S.name)+' เมื่ออาหารพร้อม':'รออาหารที่โต๊ะ '+esc(T)+' ได้เลย'}</p></div>`:`<h2>รายการ${where()}</h2>`)+q+
      (st.items.length?`<div class="list">${st.items.map(l=>`<div class="row"><div class="g">${l.qty}× ${esc(l.name)}${l.opt?`<div class="optx">${esc(l.opt)}</div>`:''}${l.note?`<div class="who">${esc(l.note)}</div>`:''}<div class="tm">${l.at?'สั่ง '+hm(l.at):''}${l.cname?' · คุณ'+esc(l.cname):''}</div></div><span class="pill ${l.served?'ok':'warn'}">${l.served?'เสิร์ฟแล้ว':'กำลังทำ'}</span><div class="r">${baht(l.amount)}</div></div>`).join('')}<div class="row"><div class="g"><b>ยอดรวมตอนนี้</b></div><div class="r"><b>${baht(st.total)}</b></div></div></div>
      <p class="tm" style="margin:0;text-align:center">อัปเดตสถานะอัตโนมัติ</p>${pushCard(st)}`:'<p class="muted">ยังไม่มีรายการ</p>');
    ft=st.items.length?`<button class="btn" data-a="view" data-v="menu" type="button">สั่งเพิ่ม</button><button class="btn pri wide" data-a="view" data-v="bill" type="button">ตรวจสอบยอด / ชำระเงิน</button>`:`<button class="btn pri wide" data-a="view" data-v="menu" type="button">สั่งเพิ่ม</button>`;
  }
  const keep=$('#note')?.value;
  v.innerHTML=h;f.innerHTML=ft;$('#foot').hidden=false;
  if(keep&&$('#note'))$('#note').value=keep;
}
async function send(){
  if(S.sending||!cartN())return;S.sending=true;const note=($('#note')?.value||'').trim();render();if($('#note'))$('#note').value=note;
  const items=Object.values(S.cart).map(e=>({menuId:e.menuId,qty:e.qty,opts:(e.opts||[]).map(o=>o.cid),note:e.note||''}));
  if(WALK&&!S.name){S.sending=false;S.view='name';render();return}
  const {data:res,error}=await sb.rpc('customer_add',{p_key:K,p_table:T,p_items:items,p_note:note,p_name:S.name||'',p_order:WALK?getWO():null});
  if(!error&&WALK&&res&&res.order){setWO(res.order);keepOrderInUrl(res.order)}
  S.sending=false;
  if(error){if(/table_closed/.test(String(error.message))){S.after='cart';S.view='closed';render();return}
    if(/moved/.test(String(error.message))){loadStatus();return}
    if(/sold_out/.test(String(error.message)))loadMenu();
    render();if($('#note'))$('#note').value=note;const [a,b]=rpcErr(error);$('#sendErr').textContent=a+' · '+b;return}
  S.cart={};S.view='done';render();loadStatus();loadMenu();window.scrollTo(0,0);$('main').scrollTop=0;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const d=b.dataset;
  if(d.a==='cat'){S.cat=d.v;render()}
  else if(d.a==='add'){const m=S.menu.find(x=>x.id===d.m);if(!m)return;if(hasOpts(m))optPick(m,{notes:NOTES,onAdd:sel=>putCart(m,sel)});else putCart(m,{opts:[],note:'',qty:1})}
  else if(d.a==='qty'){const e=S.cart[d.k];if(!e)return;e.qty+= +d.d;if(e.qty<1)delete S.cart[d.k];render()}
  else if(d.a==='view'){S.view=d.v;render();$('main').scrollTop=0;window.scrollTo(0,0);if(d.v==='status'||d.v==='bill')loadStatus()}
  else if(d.a==='callAsk')callAsk();
  else if(d.a==='pushOn')pushOn(b);
  else if(d.a==='call')doCall(d.v);
  else if(d.a==='note'){const n=$('#note');n.value=n.value?n.value+', '+d.v:d.v}
  else if(d.a==='send')send();
  else if(d.a==='editName'){S.view='name';render();$('main').scrollTop=0}
  else if(d.a==='skipName'){if(!WALK){S.view='menu';render()}}});
start();

/* ---------- แจ้งเตือนเวอร์ชันใหม่ (กันมือถือจำหน้าเก่าไว้) ---------- */
const APP_VER=(document.querySelector('meta[name="app-version"]')||{}).content||'';
async function checkUpdate(){try{const r=await fetch(location.pathname+'?vcheck='+Date.now(),{cache:'no-store'});if(!r.ok)return;const t=await r.text();const m=t.match(/name="app-version" content="([^"]+)"/);
  if(m&&APP_VER&&m[1]!==APP_VER&&!document.getElementById('updBar')){const b=document.createElement('div');b.id='updBar';b.className='updbar';b.innerHTML='มีเวอร์ชันใหม่ของเว็บ <button type="button">อัปเดตเลย</button>';
    b.querySelector('button').onclick=()=>{const u=new URL(location.href);u.searchParams.set('v',m[1]);location.replace(u.href)};document.body.appendChild(b)}}catch(e){}}
setTimeout(checkUpdate,3000);setInterval(checkUpdate,5*60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
</script>
</body>
</html>

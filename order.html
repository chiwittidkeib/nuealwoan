<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17694f">
<title>NueaLwoan · สั่งอาหาร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@400;500&display=swap">
<style>
/* Layout: jade header with table number, scrolling menu grid, sticky cart bar at the bottom. */
:root{
  --bg:#f3f5f0; --surface:#ffffff; --sunk:#e9ece5; --line:#d9ded4;
  --fg:#1c2420; --muted:#5f6b64;
  --jade:#17694f; --jade-soft:#dcefe5; --on-jade:#ffffff;
  --chili:#b23d27; --amber:#946207; --amber-soft:#f5e8cc;
  --f-display:"Mitr","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111614; --surface:#1a201d; --sunk:#151a18; --line:#2b3430;
  --fg:#e8eee9; --muted:#9aa69f;
  --jade:#5ec59c; --jade-soft:#1c3a2e; --on-jade:#0b1912;
  --chili:#f08c74; --amber:#e4b75c; --amber-soft:#382d16; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;line-height:1.25;text-wrap:balance}
header{background:var(--jade);color:var(--on-jade);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px}
header .in{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-size:22px}
.hlogo{width:52px;height:52px;border-radius:12px;background:#fff;object-fit:contain;padding:3px;flex:none}
header small{opacity:.85}
.tno{font-family:var(--f-display);text-align:right;line-height:1}
.tno span{display:block;font-size:12px;opacity:.85;font-family:var(--f-body)}
.tno b{font-size:34px;font-weight:500}
main{flex:1;overflow-y:auto}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:16px 24px;display:flex;flex-direction:column;gap:14px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:0;overflow:hidden;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;position:relative}
.ph{width:100%;aspect-ratio:4/3;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:34px;color:var(--muted)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.item .tx{padding:8px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.item p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item.big{grid-column:1/-1}
.mini{width:44px;height:44px;border-radius:8px;overflow:hidden;flex:none;background:var(--sunk)}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.item:active{transform:scale(.98)}
.item b{font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1.3}
.item span{margin-top:auto;font-weight:600;color:var(--jade);font-variant-numeric:tabular-nums}
.item em{position:absolute;top:8px;right:8px;box-shadow:0 1px 4px rgba(0,0,0,.25);font-style:normal;background:var(--jade);color:var(--on-jade);border-radius:999px;min-width:24px;height:24px;line-height:24px;text-align:center;font-weight:600;font-size:13px;padding:0 6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .g{flex:1;min-width:0}
.row .r{font-variant-numeric:tabular-nums;white-space:nowrap}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stepper button{border:0;background:none;width:38px;height:38px;cursor:pointer;font-size:18px}
.stepper span{min-width:24px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px;min-height:46px}
.qn{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;font-weight:500}
.pill.ok{background:var(--jade-soft);color:var(--jade)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
footer{background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
footer .in{max-width:900px;margin:0 auto;display:flex;gap:10px;align-items:center}
.tot{flex:1;display:flex;flex-direction:column;min-width:0}
.tot small{color:var(--muted);font-size:12.5px}
.tot b{font-family:var(--f-display);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 16px;min-height:48px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{flex:1}
.msg{text-align:center;padding:48px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.msg h2{font-size:24px}
.muted{color:var(--muted)}
.err{color:var(--chili)}
.namebox{max-width:420px;width:100%;margin:24px auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px}
.namebox h2{font-size:24px}
.lnk-w{border:0;background:none;color:inherit;text-decoration:underline;cursor:pointer;padding:0;font:inherit;opacity:.95}
.lnk-g{border:0;background:none;color:var(--jade);cursor:pointer;padding:4px 0;font:inherit;font-weight:500}
.who{font-size:12px;color:var(--muted)}

/* ---- พื้นหลังรูปหน้าร้าน (หน้าต้อนรับลูกค้า) ---- */
body.welcome::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(8,6,5,0) 0%,rgba(8,6,5,.1) 35vw,#0b0a09 100vw),url(images/bg-m.jpg) 50% 0/100% auto no-repeat,url(bg-m.jpg) 50% 0/100% auto no-repeat,#0b0a09}
@media (min-width:701px){body.welcome::before{background:linear-gradient(180deg,rgba(8,6,5,.3),rgba(8,6,5,.85)),url(images/bg.jpg) center 40%/cover no-repeat,url(bg.jpg) center 40%/cover no-repeat}}
body.welcome header,body.welcome main{position:relative;z-index:1}
body.welcome header{background:transparent}
body.welcome main{display:flex;align-items:flex-end}
body.welcome .wrap{width:100%}
body.welcome .namebox{--surface:rgba(18,15,12,.62);--fg:#f6efe4;--muted:#cdbfae;--line:rgba(255,230,190,.18);--jade:#d9a65a;--on-jade:#1d1307;
  color:var(--fg);background:var(--surface);border-color:var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);margin-bottom:max(24px,env(safe-area-inset-bottom));box-shadow:0 20px 50px rgba(0,0,0,.5)}
body.welcome .namebox input{background:rgba(0,0,0,.35);color:var(--fg)}
body.welcome .namebox .btn.pri{background:linear-gradient(180deg,#e2b265,#c48d3d);border-color:#c48d3d;color:#1d1307}
@media (min-width:701px) and (orientation:portrait){body.welcome::before{background:linear-gradient(180deg,rgba(8,6,5,.25),rgba(8,6,5,.8)),url(images/bg-m.jpg) center 30%/cover no-repeat,url(bg-m.jpg) center 30%/cover no-repeat,#0b0a09}}
</style>
</head>
<body>
<header><div class="in"><img id="logo" class="hlogo" alt="" hidden><div style="flex:1;min-width:0"><h1 id="shop">กำลังโหลดเมนู…</h1><small id="sub">สั่งอาหารได้จากมือถือ</small></div><div class="tno" id="tno" hidden><span>โต๊ะ</span><b id="tnum"></b></div></div></header>
<main><div class="wrap" id="view"><div class="msg"><p class="muted">กำลังโหลดเมนู…</p></div></div></main>
<footer id="foot" hidden><div class="in" id="footIn"></div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script>window.APP_CONFIG||document.write('<script src="config.js"><\/script>')</script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const baht=n=>'฿'+(Math.round((+n||0)*100)/100).toLocaleString('th-TH',{maximumFractionDigits:2});
const P=new URLSearchParams(location.search);
const T=(P.get('t')||'').replace(/\D/g,''),K=P.get('k')||'';
const NOTES=['ไม่ใส่ผัก','ไม่ใส่ถั่วงอก','ไม่เผ็ด','เผ็ดมาก','ไม่ใส่ผงชูรส','ใส่ห่อ'];
const S={menu:[],cats:[],cat:'all',cart:{},view:'menu',status:null,sending:false,name:''};
const NAME_KEY='nl_name';
const WALK=T==='0';
const WO_KEY='nl_wo_'+K;
const getWO=()=>{try{const v=JSON.parse(localStorage.getItem(WO_KEY)||'null');return v&&Date.now()-v.ts<12*3600e3?v.id:null}catch(e){return null}};
const setWO=id=>{try{id?localStorage.setItem(WO_KEY,JSON.stringify({id,ts:Date.now()})):localStorage.removeItem(WO_KEY)}catch(e){}};
const where=()=>WALK?'ของคุณ':'ของโต๊ะ '+esc(T);
const loadName=()=>{try{return localStorage.getItem(NAME_KEY)||''}catch(e){return ''}};
const saveName=n=>{try{localStorage.setItem(NAME_KEY,n)}catch(e){}};
function setSub(){$('#sub').innerHTML=S.name?`สวัสดี คุณ${esc(S.name)} · <button class="lnk-w" data-a="editName" type="button">แก้ชื่อ</button>`:'สั่งอาหารได้จากมือถือ'}
let sb=null;

function fail(title,text){$('#view').innerHTML=`<div class="msg"><h2>${esc(title)}</h2><p class="muted">${esc(text)}</p></div>`;$('#foot').hidden=true}
function rpcErr(e){const m=String(e&&e.message||'');
  if(/bad_key/.test(m))return ['QR นี้ใช้ไม่ได้แล้ว','ร้านเปลี่ยน QR ใหม่ รบกวนแจ้งพนักงานหรือสแกน QR ที่ติดอยู่บนโต๊ะอีกครั้ง'];
  if(/bad_table/.test(m))return ['ไม่พบโต๊ะนี้','สแกน QR บนโต๊ะอีกครั้ง หรือแจ้งพนักงาน'];
  if(/empty/.test(m))return ['เมนูที่เลือกปิดขายแล้ว','ลองเลือกเมนูอื่น'];
  if(/walkin_off/.test(m))return ['ร้านปิดรับออร์เดอร์แบบสั่งเอง','สั่งกับพนักงานที่เคาน์เตอร์ได้เลย'];
  if(/table_closed/.test(m))return ['โต๊ะนี้ยังไม่เปิด','แจ้งพนักงานให้เปิดโต๊ะก่อน แล้วสั่งได้เลย'];
  return ['เชื่อมต่อไม่ได้','ตรวจอินเทอร์เน็ตแล้วลองอีกครั้ง'];}

async function start(){
  const cfg=window.APP_CONFIG||{};
  if(!T||!K)return fail('สแกน QR ที่โต๊ะเพื่อสั่งอาหาร','ลิงก์นี้ไม่มีเลขโต๊ะ');
  if(!window.supabase||!cfg.SUPABASE_URL||!cfg.SUPABASE_KEY)return fail('ระบบยังไม่พร้อม','แจ้งพนักงานได้เลย');
  sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_KEY,{auth:{persistSession:false}});
  const {data,error}=await sb.rpc('public_menu',{p_key:K});
  if(error){const [a,b]=rpcErr(error);return fail(a,b)}
  if(!WALK&&(+T<1||+T>data.tables))return fail('ไม่พบโต๊ะนี้','สแกน QR บนโต๊ะอีกครั้ง หรือแจ้งพนักงาน');
  S.menu=data.menu||[];S.cats=(data.cats||[]).filter(c=>S.menu.some(m=>m.cat===c));
  document.title=(data.shopName||'NueaLwoan')+(WALK?' · สั่งอาหาร':' · โต๊ะ '+T);
  if(data.logo){$('#logo').src=data.logo;$('#logo').hidden=false}
  $('#shop').textContent=data.shopName||'สั่งอาหาร';$('#tnum').textContent=WALK?'':T;$('#tno').hidden=WALK;
  S.name=loadName();if(!S.name)S.view='name';setSub();
  await loadStatus();
  if(S.status&&S.status.requireOpen&&!S.status.open){S.after=S.view;S.view='closed'}
  render();
  setInterval(()=>{if(S.view==='status'&&!document.hidden)loadStatus()},15000);
}
async function loadStatus(){const {data,error}=await sb.rpc('customer_status',{p_key:K,p_table:T,p_order:WALK?getWO():null});if(error)return;S.status=data;
  if(WALK&&!data.open&&getWO())setWO(null);
  if(WALK&&data.walkinOn===false){fail('ร้านปิดรับออร์เดอร์แบบสั่งเอง','สั่งกับพนักงานที่เคาน์เตอร์ได้เลย');S.view='off';return}
  if(S.view==='closed'&&(data.open||!data.requireOpen)){S.view=S.after||'menu';render();return}
  if(S.view==='status'||S.view==='done')render()}
setInterval(()=>{if(S.view==='closed'&&!document.hidden)loadStatus()},6000);

const cartN=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);
const cartT=()=>Object.entries(S.cart).reduce((s,[id,q])=>s+(+(S.menu.find(m=>m.id===id)||{}).price||0)*q,0);

function render(){
  document.body.classList.toggle('welcome',S.view==='name'||S.view==='closed');
  const v=$('#view'),f=$('#footIn');let h='',ft='';
  if(S.view==='closed'){
    v.innerHTML=`<div class="namebox" style="text-align:center"><h2>โต๊ะ ${esc(T)} ยังไม่เปิด</h2><p class="muted" style="margin:0">แจ้งพนักงานให้เปิดโต๊ะ หน้านี้จะไปหน้าเมนูให้เองเมื่อโต๊ะเปิดแล้ว</p><p class="muted" style="margin:0;font-size:13px">กำลังรอ…</p></div>`;
    f.innerHTML='';$('#foot').hidden=true;return;
  }
  if(S.view==='name'){
    h=`<form class="namebox" id="nameForm"><h2>ยินดีต้อนรับ</h2><p class="muted" style="margin:0">${WALK?'สั่งอาหารเองได้เลย · ใส่ชื่อไว้ให้พนักงานเรียกตอนอาหารพร้อม':'โต๊ะ '+esc(T)+' · ใส่ชื่อของคุณ ร้านจะได้เสิร์ฟถูกคน'}</p>
      <div class="field"><label for="nm">ชื่อของคุณ</label><input id="nm" maxlength="40" autocomplete="given-name" placeholder="เช่น ต้น, พี่หนิง" value="${esc(S.name)}"></div>
      <p class="err" id="nmErr" role="alert"></p>
      <button class="btn pri" type="submit">เริ่มสั่งอาหาร</button>
      ${S.name||WALK?'':'<button class="lnk-g" data-a="skipName" type="button">ข้าม ไม่ใส่ชื่อ</button>'}</form>`;
    v.innerHTML=h;f.innerHTML='';$('#foot').hidden=true;
    $('#nameForm').addEventListener('submit',e=>{e.preventDefault();const n=$('#nm').value.trim().replace(/\s+/g,' ');
      if(!n){$('#nmErr').textContent=WALK?'ใส่ชื่อก่อน พนักงานจะเรียกชื่อนี้ตอนอาหารพร้อม':'ใส่ชื่อก่อน หรือกด "ข้าม"';return}
      S.name=n.slice(0,40);saveName(S.name);setSub();S.view='menu';render()});
    setTimeout(()=>$('#nm')?.focus(),50);return;
  }
  if(S.view==='menu'){
    h=`<div class="chips">${['all',...S.cats].map(c=>`<button class="chip" aria-pressed="${S.cat===c}" data-a="cat" data-v="${esc(c)}" type="button">${c==='all'?'ทั้งหมด':esc(c)}</button>`).join('')}</div>
    <div class="grid">${S.menu.filter(m=>S.cat==='all'||m.cat===S.cat).map(m=>`<button class="item" data-a="add" data-m="${esc(m.id)}" type="button"><div class="ph">${m.img?`<img src="${esc(m.img)}" alt="${esc(m.name)}" loading="lazy">`:esc(String(m.name||'?').trim().charAt(0))}</div>${S.cart[m.id]?`<em>${S.cart[m.id]}</em>`:''}<div class="tx"><b>${esc(m.name)}</b>${m.desc?`<p>${esc(m.desc)}</p>`:''}<span>${baht(m.price)}</span></div></button>`).join('')||'<p class="muted">ยังไม่มีเมนูเปิดขาย</p>'}</div>
    ${S.status&&S.status.items.length?`<button class="btn" data-a="view" data-v="status" type="button">ดูรายการที่สั่งแล้ว · ${baht(S.status.total)}</button>`:''}`;
    ft=`<div class="tot"><small>ในตะกร้า ${cartN()} รายการ</small><b>${baht(cartT())}</b></div><button class="btn pri" data-a="view" data-v="cart" ${cartN()?'':'disabled'} type="button">ดูตะกร้า</button>`;
  }else if(S.view==='cart'){
    const rows=Object.entries(S.cart).map(([id,q])=>{const m=S.menu.find(x=>x.id===id);return m?`<div class="row">${m.img?`<div class="mini"><img src="${esc(m.img)}" alt=""></div>`:''}<div class="g">${esc(m.name)}</div><div class="stepper"><button data-a="qty" data-m="${esc(id)}" data-d="-1" type="button" aria-label="ลด">−</button><span>${q}</span><button data-a="qty" data-m="${esc(id)}" data-d="1" type="button" aria-label="เพิ่ม">+</button></div><div class="r" style="min-width:60px;text-align:right">${baht(m.price*q)}</div></div>`:''}).join('');
    h=`<h2>ตะกร้า${where()}</h2>${S.name?`<p class="muted" style="margin:0">สั่งในชื่อ <b>คุณ${esc(S.name)}</b> · <button class="lnk-g" data-a="editName" type="button">เปลี่ยน</button></p>`:''}${rows?`<div class="list">${rows}</div>`:'<p class="muted">ยังไม่ได้เลือกเมนู</p>'}
    <div class="field"><label for="note">บอกครัว (ถ้ามี)</label><input id="note" placeholder="เช่น ไม่ใส่ผัก ไม่เผ็ด" maxlength="120" autocomplete="off"></div>
    <div class="qn">${NOTES.map(n=>`<button class="chip" data-a="note" data-v="${esc(n)}" type="button">${esc(n)}</button>`).join('')}</div>
    <p class="err" id="sendErr" role="alert"></p>`;
    ft=`<button class="btn" data-a="view" data-v="menu" type="button">เลือกเพิ่ม</button><button class="btn pri wide" data-a="send" ${cartN()&&!S.sending?'':'disabled'} type="button">${S.sending?'กำลังส่ง…':'ส่งรายการ '+baht(cartT())}</button>`;
  }else{
    const st=S.status||{items:[],total:0};
    h=(S.view==='done'?`<div class="msg" style="padding:24px 8px"><h2>ส่งรายการเข้าครัวแล้ว${S.name?' คุณ'+esc(S.name):''}</h2><p class="muted">${WALK?'พนักงานจะเรียกชื่อ คุณ'+esc(S.name)+' เมื่ออาหารพร้อม · ชำระเงินที่เคาน์เตอร์':'รออาหารที่โต๊ะ '+esc(T)+' ได้เลย ชำระเงินกับพนักงานเมื่อทานเสร็จ'}</p></div>`:`<h2>รายการ${where()}</h2>`)+
      (st.items.length?`<div class="list">${st.items.map(l=>`<div class="row"><div class="g">${l.qty}× ${esc(l.name)}${l.cname?`<div class="who">คุณ${esc(l.cname)}</div>`:''}</div><span class="pill ${l.served?'ok':'warn'}">${l.served?'เสิร์ฟแล้ว':'กำลังทำ'}</span><div class="r">${baht(l.amount)}</div></div>`).join('')}<div class="row"><div class="g"><b>ยอดรวมตอนนี้</b></div><div class="r"><b>${baht(st.total)}</b></div></div></div>`:'<p class="muted">ยังไม่มีรายการ</p>');
    ft=`<button class="btn pri wide" data-a="view" data-v="menu" type="button">สั่งเพิ่ม</button>`;
  }
  const keep=$('#note')?.value;
  v.innerHTML=h;f.innerHTML=ft;$('#foot').hidden=false;
  if(keep&&$('#note'))$('#note').value=keep;
}
async function send(){
  if(S.sending||!cartN())return;S.sending=true;const note=($('#note')?.value||'').trim();render();if($('#note'))$('#note').value=note;
  const items=Object.entries(S.cart).map(([menuId,qty])=>({menuId,qty}));
  if(WALK&&!S.name){S.sending=false;S.view='name';render();return}
  const {data:res,error}=await sb.rpc('customer_add',{p_key:K,p_table:T,p_items:items,p_note:note,p_name:S.name||'',p_order:WALK?getWO():null});
  if(!error&&WALK&&res&&res.order)setWO(res.order);
  S.sending=false;
  if(error){if(/table_closed/.test(String(error.message))){S.after='cart';S.view='closed';render();return}
    render();if($('#note'))$('#note').value=note;const [a,b]=rpcErr(error);$('#sendErr').textContent=a+' · '+b;return}
  S.cart={};S.view='done';render();loadStatus();window.scrollTo(0,0);$('main').scrollTop=0;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const d=b.dataset;
  if(d.a==='cat'){S.cat=d.v;render()}
  else if(d.a==='add'){S.cart[d.m]=(S.cart[d.m]||0)+1;render()}
  else if(d.a==='qty'){const q=(S.cart[d.m]||0)+ +d.d;if(q>0)S.cart[d.m]=q;else delete S.cart[d.m];render()}
  else if(d.a==='view'){S.view=d.v;render();$('main').scrollTop=0;if(d.v==='status')loadStatus()}
  else if(d.a==='note'){const n=$('#note');n.value=n.value?n.value+', '+d.v:d.v}
  else if(d.a==='send')send();
  else if(d.a==='editName'){S.view='name';render();$('main').scrollTop=0}
  else if(d.a==='skipName'){if(!WALK){S.view='menu';render()}}});
start();
</script>

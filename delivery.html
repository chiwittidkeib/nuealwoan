<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="app-version" content="2026.10.16-1830">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>สั่งเดลิเวอรี่ · เนื้อล้วนๆ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* หน้าลูกค้าสั่งเดลิเวอรี่: หัวดำ-ทอง แบบป้ายร้าน · เมนูการ์ดรูป · ตะกร้าติดล่าง · ติดตามสถานะทีละขั้น */
:root{--bg:#f6f1ea;--surface:#fff;--sunk:#efe8de;--line:#e4d9ca;--fg:#1d1612;--muted:#76695d;
  --red:#c8202a;--red-soft:#fbe4e2;--gold:#c48d3d;--gold-soft:#f7ead3;--green:#14a35a;--green-soft:#dff4e8;--ink:#14110f;
  --jade:var(--red);--jade-soft:var(--red-soft);--on-jade:#fff;--chili:#b3261e;
  --f-d:"Kanit","IBM Plex Sans Thai",system-ui,sans-serif;--f-b:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;max-width:100%;overflow-x:clip}
body{background:var(--bg);color:var(--fg);font-family:var(--f-b);font-size:15px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (pointer:coarse),(max-width:820px){input:not([type=checkbox]),textarea{font-size:16px!important}}
h1,h2,h3{font-family:var(--f-d);font-weight:600;margin:0;line-height:1.25;text-wrap:balance}
.top{background:var(--ink);color:#f6efe4;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;position:sticky;top:0;z-index:20}
.top .in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:10px}
.top img{width:44px;height:44px;border-radius:11px;object-fit:contain;background:#000;flex:none}
.top b{font-family:var(--f-d);font-size:19px;display:block;line-height:1.2}
.top small{color:#d9a65a;font-size:12px;letter-spacing:.05em}
.top .st{margin-left:auto;font-size:12.5px;font-weight:600;border-radius:999px;padding:5px 10px;white-space:nowrap}
.st.on{background:rgba(20,163,90,.18);color:#7be3a8}.st.off{background:rgba(200,32,42,.22);color:#ff9a9f}
main{flex:1}
.wrap{max-width:900px;margin:0 auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}.help{font-size:13px;color:var(--muted);margin:0}.err{color:var(--red);margin:0;font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 16px;min-height:48px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1d1307}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.wide{flex:1}.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.lnk{border:0;background:none;color:var(--red);font-weight:600;cursor:pointer;padding:4px 0}
.row2{display:flex;gap:8px;align-items:center}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field input,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
.notice{background:var(--gold-soft);border:1px solid #ecd3a6;color:#6b4a12;border-radius:12px;padding:10px 12px;font-size:14px}
.closed{background:#2a1416;color:#ffd9db;border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center}
.closed b{font-family:var(--f-d);font-size:18px;display:block;color:#fff}
.mine{display:flex;gap:10px;align-items:center;background:var(--ink);color:#f6efe4;border-radius:14px;padding:10px 12px;text-decoration:none}
.mine b{color:#ffd58a}.mine .grow{flex:1;min-width:0}
/* เมนู */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:#f6efe4;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:0;overflow:hidden;text-align:left;cursor:pointer;display:flex;flex-direction:column;position:relative}
.item:active{transform:scale(.98)}
.ph{width:100%;aspect-ratio:4/3;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-family:var(--f-d);font-size:34px;color:var(--muted)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.item .tx{padding:8px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.item b{font-family:var(--f-d);font-weight:500;font-size:16.5px;line-height:1.3}
.item p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .pr{margin-top:auto;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
.item em{position:absolute;top:8px;right:8px;font-style:normal;background:var(--red);color:#fff;border-radius:999px;min-width:26px;height:26px;line-height:26px;text-align:center;font-weight:700;font-size:13px;padding:0 7px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.item.is-out{cursor:not-allowed}.item.is-out .ph img{filter:grayscale(1);opacity:.45}.item.is-out .tx{opacity:.55}
.stamp{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);width:92px;height:92px;border:3px solid #e5383b;border-radius:50%;color:#ff4d4f;font-weight:800;font-size:17px;line-height:1;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;background:rgba(25,6,6,.82);box-shadow:inset 0 0 0 3px rgba(229,56,59,.35),0 0 0 2px rgba(229,56,59,.25);pointer-events:none;z-index:2}
.stamp b{display:block;font-weight:800;font-size:17px;line-height:1.15;padding-bottom:3px;border-bottom:2px solid currentColor;margin:0}
.stamp i{display:block;font-style:normal;font-weight:800;font-size:.62em;letter-spacing:.6px;text-transform:uppercase;line-height:1}
.stamp b,.stamp i{color:#5ec59c!important;opacity:1!important}
.leftq{display:inline-block;font-size:12px;font-weight:700;color:#8a5a00;background:var(--gold-soft);border-radius:999px;padding:1px 8px;align-self:flex-start}
.leftq.low{color:#fff;background:#c2410c}
.cath{font-size:18px;margin:6px 2px -4px;display:flex;align-items:center;gap:8px}.cath::after{content:"";flex:1;height:1px;background:var(--line)}
.optx{font-size:13px;color:#8a5a1f;line-height:1.4}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}.li .g{flex:1;min-width:0}.li .r{font-variant-numeric:tabular-nums;white-space:nowrap}
.li.sum{font-size:17px}.li.sum b{font-family:var(--f-d);font-size:21px}
.mini{width:46px;height:46px;border-radius:9px;overflow:hidden;flex:none;background:var(--sunk)}.mini img{width:100%;height:100%;object-fit:cover}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:none;width:38px;height:38px;cursor:pointer;font-size:18px}
.stepper span{min-width:24px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted)}
footer{position:sticky;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.06)}
footer .in{max-width:900px;margin:0 auto;display:flex;gap:10px;align-items:center}
.tot{flex:1;display:flex;flex-direction:column;min-width:0}.tot small{color:var(--muted);font-size:12.5px}.tot b{font-family:var(--f-d);font-size:22px;font-variant-numeric:tabular-nums}
/* ที่อยู่ + แผนที่ */
.map{position:relative;height:min(46vh,340px);border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#ddd}
.map .gm{position:absolute;inset:0}
.cpin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);pointer-events:none;z-index:5;transition:transform .15s;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.cpin.up{transform:translate(-50%,-118%)}
.cpin::after{content:"";position:absolute;left:50%;bottom:-3px;width:8px;height:4px;margin-left:-4px;border-radius:50%;background:rgba(0,0,0,.35)}
.maphint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,.78);color:#fff;font-size:12.5px;padding:5px 12px;border-radius:99px;z-index:5;pointer-events:none;white-space:nowrap}
.geores button small{display:block;color:var(--muted,#777);font-size:12px;margin-top:1px}
.feebox{background:var(--sunk);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.kv{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.georow{display:flex;gap:8px;flex-wrap:wrap}
.georow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;background:var(--surface)}
.geores{display:flex;flex-direction:column}
.geores button{border:0;border-top:1px solid var(--line);background:var(--surface);text-align:left;padding:10px 12px;cursor:pointer;font-size:14px}
.rdpin{background:none;border:0}
.feebox.okk{background:var(--green-soft);border:1px solid #9fd9b6}.feebox.over{background:var(--red-soft);border:1px solid #f0b3b0}
.pinbar{display:flex;gap:10px;align-items:center;background:var(--green-soft);border:1px solid #9fd9b6;border-radius:14px;padding:10px 12px}.pinbar small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pinbar .grow{flex:1;min-width:0}
.cpbar{display:flex;gap:10px;align-items:center;width:100%;border:1.5px dashed var(--gold);background:var(--gold-soft);color:#6b4a12;border-radius:14px;padding:11px 14px;font-weight:600;cursor:pointer;text-align:left}.cpbar .grow{flex:1}
.memrow{display:flex;gap:10px;align-items:center}.memrow small{display:block;color:var(--muted);font-size:12.5px}.memrow .grow{flex:1;min-width:0}
.chk{display:flex;gap:8px;align-items:center;background:var(--gold-soft);border-radius:10px;padding:9px 11px;font-size:14.5px;cursor:pointer}.chk input{width:20px;height:20px;accent-color:var(--red)}
.cp{display:flex;gap:10px;align-items:center;border:1.5px dashed var(--gold);border-radius:12px;padding:9px 11px;background:linear-gradient(90deg,#fffaf0,#fff)}.cp .grow{flex:1;min-width:0}.cp small{display:block;color:var(--muted);font-size:12.5px}
.cp.on{border-style:solid;border-color:var(--red);background:var(--red-soft)}.cp.dis{opacity:.6}
.li .neg{color:var(--red)}
/* สถานะ */
.stage{text-align:center;background:linear-gradient(160deg,#1c1714,#2a1d14);color:#fff;border:0;padding:20px 16px}
.stage .em{font-size:46px;line-height:1}
.stage h2{font-size:23px;color:#fff}.stage .sub{color:#e9dccb;font-size:15px}
.stage .big{font-family:var(--f-d);font-size:46px;line-height:1.05;color:#ffd58a}
.stage.ok{background:linear-gradient(160deg,#0f3d26,#14532d)}.stage.bad{background:linear-gradient(160deg,#3a1114,#5a1418)}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.25}
.steps div{display:flex;flex-direction:column;align-items:center;gap:5px}.steps i{width:100%;height:6px;border-radius:4px;background:var(--sunk)}
.steps .on{color:var(--fg);font-weight:600}.steps .on i{background:var(--green)}.steps .cur i{background:linear-gradient(90deg,var(--green),#7be3a8);animation:sh 1.2s infinite alternate}
@keyframes sh{from{opacity:.5}to{opacity:1}}
.payqr{background:#fff;color:#111;border:2px solid var(--gold);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.payqr svg{width:230px;height:230px;max-width:72vw}.payqr b{font-family:var(--f-d);font-size:26px}
.slipbox{display:flex;flex-direction:column;gap:10px;border:2px dashed var(--gold);border-radius:14px;padding:12px;background:var(--surface)}
.slipimg{max-height:340px;max-width:100%;align-self:center;border-radius:10px;border:1px solid var(--line)}
.slipok{display:flex;gap:12px;align-items:center;background:var(--green-soft);border:1px solid var(--green);border-radius:12px;padding:10px}
.slipok img{width:64px;height:84px;object-fit:cover;border-radius:8px;flex:none}.slipok b{color:#0d6b3b;display:block}
.warn{background:#fff3cd;border:1px solid #f0c36d;color:#6b4a00;border-radius:12px;padding:10px 12px;font-size:14px}
.rider{display:flex;gap:12px;align-items:center}.rider .av{width:54px;height:54px;border-radius:50%;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none;border:2px solid var(--gold)}
.rider b{font-family:var(--f-d);font-size:18px;display:block}.plate{display:inline-block;background:var(--ink);color:#fff;border-radius:6px;padding:1px 8px;font-weight:700;font-size:13px}
.proof{width:100%;max-height:420px;object-fit:contain;border-radius:12px;background:#000;cursor:zoom-in}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;font-weight:600}
.pill.ok{background:var(--green-soft);color:#0d6b3b}.pill.wait{background:var(--gold-soft);color:#8a5a00}
.pulse{width:12px;height:12px;border-radius:50%;background:#7be3a8;display:inline-block;vertical-align:middle;margin-right:6px;animation:p 1.6s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(123,227,168,.6)}70%{box-shadow:0 0 0 12px rgba(123,227,168,0)}100%{box-shadow:0 0 0 0 rgba(123,227,168,0)}}
.pushc{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;text-align:center}
.pushc.on{color:#0d6b3b;border-style:solid;border-color:var(--green)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#ffd58a;padding:10px 16px;border-radius:12px;font-weight:600;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.35);max-width:90vw;text-align:center}
.srvpop{position:fixed;inset:0;z-index:96;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;animation:fi .25s ease}
.srvpop .sc{background:var(--surface);border-radius:20px;padding:26px 20px 18px;max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;gap:8px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.srvpop .em{font-size:56px;line-height:1;animation:bob 1s ease-in-out infinite alternate}.srvpop h2{font-size:22px}.srvpop p{margin:0;color:var(--muted)}
@keyframes fi{from{opacity:0}to{opacity:1}}@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.imgview{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.imgview img{max-width:100%;max-height:calc(100% - 60px);object-fit:contain;border-radius:10px}
.imgview .iv-cap{color:#fff;margin-top:12px;text-align:center}
.updbar{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:99;background:#ffd58a;color:#2b1c00;border-radius:12px;padding:8px 10px 8px 14px;display:flex;gap:10px;align-items:center;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.35);white-space:nowrap}
.updbar button{border:0;border-radius:9px;background:#2b1c00;color:#ffd58a;padding:6px 12px;cursor:pointer}
/* ตัวเลือกเมนู */
.opop{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.op-card{position:relative;background:var(--bg);color:var(--fg);width:100%;max-width:520px;max-height:92%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -10px 40px rgba(0,0,0,.35)}
@media (min-width:700px){.opop{align-items:center}.op-card{border-radius:18px;max-height:88%}}
.op-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.op-img{margin:0 -16px;aspect-ratio:16/9;max-height:220px;overflow:hidden;background:var(--sunk)}.op-img img{width:100%;height:100%;object-fit:cover;display:block}
.op-hd{display:flex;gap:12px;align-items:flex-start;padding-top:14px;padding-right:34px}.op-hd .op-t{flex:1;min-width:0}.op-hd h2{font-size:20px}.op-hd p{margin:4px 0 0;color:var(--muted);font-size:13.5px}.op-hd>b{font-size:18px;white-space:nowrap}
.op-g{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.op-gh{display:flex;align-items:center;gap:8px;justify-content:space-between}.op-gh b{font-size:16px}
.op-rule{font-size:12px;color:var(--muted);background:var(--sunk);padding:2px 8px;border-radius:99px;white-space:nowrap}
.op-rule.req{color:#8a5a00;background:var(--gold-soft)}.op-g.bad .op-rule.req{color:#fff;background:var(--red)}
.op-c{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;cursor:pointer}
.op-c span{flex:1}.op-c em{font-style:normal;color:var(--muted);font-size:14px}
.op-c i{flex:none;width:20px;height:20px;border:2px solid var(--muted);border-radius:50%;position:relative}.op-c i.ck{border-radius:5px}
.op-c.on{border-color:var(--red);background:var(--red-soft)}.op-c.on i{border-color:var(--red);background:var(--red)}
.op-c.on i.rd::after{content:"";position:absolute;inset:4px;border-radius:50%;background:#fff}
.op-c.on i.ck::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.op-g input{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px;min-height:44px;width:100%}
.op-qn{display:flex;gap:6px;flex-wrap:wrap}
.op-foot{display:flex;gap:10px;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}.op-foot .op-add{flex:1}
.op-x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:20px;line-height:1;cursor:pointer}
.rnote{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:11px 13px;border:1px solid #f1c27d;background:#fff4e2;color:#5a3a06;margin-bottom:12px}
.rnote .ic{font-size:22px;line-height:1.2;flex:none}
.rnote b{display:block;font-size:15px}.rnote span{display:block;font-size:13px;line-height:1.45;opacity:.9}
.rnote.lm{border-color:#9be0b6;background:#e9f9ef;color:#0d4f2b}
</style>
</head>
<body>
<header class="top"><div class="in"><img id="logo" src="images/logo-nl-t.png" alt=""><div style="min-width:0"><b id="shop">เนื้อล้วนๆ</b><small>สั่งเดลิเวอรี่ · RAPTOR RIDER</small></div><span class="st" id="stBadge" hidden></span></div></header>
<main><div class="wrap" id="view"><div class="card"><p class="muted" style="margin:0">กำลังโหลดเมนู…</p></div></div></main>
<footer id="foot" hidden><div class="in" id="footIn"></div></footer>
<input id="slipIn" type="file" accept="image/*" hidden aria-hidden="true">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="js/config.js"></script>
<script>window.APP_CONFIG||document.write('<script src="config.js"><\/script>')</script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const baht=n=>'฿'+(Math.round((+n||0)*100)/100).toLocaleString('th-TH',{maximumFractionDigits:2});
const hm=t=>new Date(+t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Bangkok'});
const shortNo=n=>{const m=String(n||'').match(/(\d{3,})$/);return '#'+(m?m[1]:String(n||'').slice(-4))};
function toast(m){const o=document.querySelector('.toast');if(o)o.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3400)}
function viewImg(src,cap){if(!src)return;const el=document.createElement('div');el.className='imgview';el.setAttribute('role','dialog');el.innerHTML=`<img src="${esc(src)}" alt="">${cap?`<div class="iv-cap">${esc(cap)}</div>`:''}`;el.addEventListener('click',()=>el.remove());document.body.appendChild(el)}

/* ---------- ตัวเลือกเมนู (เหมือนหน้าสั่งในร้าน) ---------- */
const optGroups=m=>Array.isArray(m&&m.options)?m.options.filter(g=>g&&g.name&&(g.choices||[]).length):[];
const hasOpts=m=>optGroups(m).length>0;
const optKey=opts=>(opts||[]).map(o=>o.cid||o.n).join(',');
const optNames=opts=>(opts||[]).map(o=>o.n).join(', ');
const optLine=e=>e.opts&&e.opts.length?`<div class="optx">${esc(optNames(e.opts))}</div>`:'';
const optRule=g=>g.req?(+g.max===1?'ต้องเลือก 1':'ต้องเลือก'+(+g.max>1?' สูงสุด '+g.max:'อย่างน้อย 1')):(+g.max===1?'เลือกได้ 1':'เลือกได้'+(+g.max>1?' สูงสุด '+g.max:'หลายอย่าง'));
const minPrice=m=>(+m.price||0)+optGroups(m).filter(g=>g.req).reduce((s,g)=>s+Math.min(...g.choices.map(c=>+c.price||0)),0);
function optPick(m,cfg){cfg=cfg||{};const G=optGroups(m);const pick={};G.forEach(g=>pick[g.id]=[]);let qty=1,note='',warn=false;
  const old=document.getElementById('optPop');if(old)old.remove();
  const el=document.createElement('div');el.id='optPop';el.className='opop';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');document.body.appendChild(el);
  const sel=()=>{const opts=[];G.forEach(g=>g.choices.forEach(c=>{if(pick[g.id].includes(c.id))opts.push({gid:g.id,cid:c.id,g:g.name,n:c.name,p:+c.price||0})}));return opts};
  const unit=()=>(+m.price||0)+sel().reduce((s,o)=>s+o.p,0);
  const missing=()=>G.filter(g=>g.req&&!pick[g.id].length);
  const close=()=>{el.remove();window.removeEventListener('keydown',onKey,true)};
  const onKey=e=>{if(e.key==='Escape'){e.stopPropagation();close()}};window.addEventListener('keydown',onKey,true);
  function draw(){const miss=missing(),keepNote=el.querySelector('#opNote')?.value,sc=el.querySelector('.op-body')?.scrollTop||0;
    el.innerHTML=`<div class="op-card"><div class="op-body">
      ${m.img?`<div class="op-img"><img src="${esc(m.img)}" alt=""></div>`:''}
      <div class="op-hd"><div class="op-t"><h2>${esc(m.name)}</h2>${m.desc?`<p>${esc(m.desc)}</p>`:''}</div><b>${baht(+m.price||0)}</b></div>
      ${G.map(g=>{const bad=warn&&miss.includes(g);return `<section class="op-g${bad?' bad':''}"><div class="op-gh"><b>${esc(g.name)}</b><span class="op-rule${g.req?' req':''}">${optRule(g)}</span></div>
        ${g.choices.map(c=>{const on=pick[g.id].includes(c.id);return `<button type="button" class="op-c${on?' on':''}" data-og="${esc(g.id)}" data-oc="${esc(c.id)}" aria-pressed="${on}"><i class="${+g.max===1?'rd':'ck'}"></i><span>${esc(c.name)}</span><em>${+c.price?'+'+(+c.price):''}</em></button>`}).join('')}</section>`}).join('')}
      <section class="op-g"><div class="op-gh"><b>บอกครัว</b><span class="op-rule">ไม่บังคับ</span></div><input id="opNote" maxlength="80" placeholder="เช่น ไม่ใส่ผัก ไม่เผ็ด" autocomplete="off"></section>
    </div>
    <div class="op-foot"><div class="stepper"><button type="button" data-oq="-1" aria-label="ลด">−</button><span>${qty}</span><button type="button" data-oq="1" aria-label="เพิ่ม">+</button></div>
      <button type="button" class="btn pri op-add" data-oadd="1">${miss.length&&warn?'ยังไม่ได้เลือก: '+esc(miss[0].name):'ใส่ตะกร้า '+baht(unit()*qty)}</button></div>
    <button type="button" class="op-x" data-ox="1" aria-label="ปิด">×</button></div>`;
    const n=el.querySelector('#opNote');n.value=keepNote!=null?keepNote:note;n.addEventListener('input',()=>note=n.value);el.querySelector('.op-body').scrollTop=sc}
  let downBg=false;el.addEventListener('pointerdown',e=>{downBg=e.target===el});
  el.addEventListener('click',e=>{if(e.target===el){if(downBg)close();return}const b=e.target.closest('button');if(!b)return;e.stopPropagation();
    if(b.dataset.ox)return close();
    if(b.dataset.og){const g=G.find(x=>x.id===b.dataset.og),cid=b.dataset.oc,a=pick[g.id];
      if(+g.max===1)pick[g.id]=a.includes(cid)&&!g.req?[]:[cid];else if(a.includes(cid))pick[g.id]=a.filter(x=>x!==cid);else{if(+g.max>1&&a.length>=+g.max)return;a.push(cid)}return draw()}
    if(b.dataset.oq){qty=Math.max(1,Math.min(20,qty+ +b.dataset.oq));return draw()}
    if(b.dataset.oadd){const miss=missing();if(miss.length){warn=true;draw();return}note=(el.querySelector('#opNote')?.value||'').trim();const opts=sel();close();cfg.onAdd&&cfg.onAdd({opts,qty,note})}});
  draw()}

/* ---------- พร้อมเพย์ ---------- */
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function ppPayload(id,amount){let t=String(id||'').replace(/\D/g,''),tag;if(t.length===15)tag='03';else if(t.length>=13){tag='02';t=t.slice(0,13)}else{tag='01';t=('0000000000000'+t.replace(/^0/,'66')).slice(-13)}
  const f=(k,v)=>k+String(v.length).padStart(2,'0')+v;let p=f('00','01')+f('01',amount>0?'12':'11')+f('29',f('00','A000000677010111')+f(tag,t))+f('58','TH')+f('53','764');if(amount>0)p+=f('54',amount.toFixed(2));p+='6304';return p+crc16(p)}
function qrSvg(text){try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:6,margin:2,scalable:true})}catch(e){return ''}}

/* ---------- แจ้งเตือนบนหน้าจอล็อก ---------- */
const PUSH={reg:null,key:null,ok:()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window,
  ios:/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),
  standalone:()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}},
  fn:()=>String((window.APP_CONFIG||{}).SUPABASE_URL||'').replace(/\/$/,'')+'/functions/v1/push',
  async init(){if(this.reg||!('serviceWorker' in navigator))return this.reg;try{this.reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready}catch(e){this.reg=null}return this.reg},
  async loadKey(){if(this.key)return this.key;const cfg=window.APP_CONFIG||{};const r=await fetch(this.fn(),{method:'POST',headers:{'Content-Type':'application/json',apikey:cfg.SUPABASE_KEY||''},body:'{"op":"pubkey"}'}).catch(()=>null);
    if(!r||!r.ok)throw new Error('nofn');const j=await r.json();if(!j.key)throw new Error('nofn');return this.key=j.key},
  b64(s){const p='='.repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))},
  async subscribe(){if(!this.ok())throw new Error('unsupported');const perm=Notification.permission==='granted'?'granted':await Notification.requestPermission();if(perm!=='granted')throw new Error('denied');
    const reg=await this.init();if(!reg)throw new Error('nosw');const key=await this.loadKey();let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:this.b64(key)});return JSON.parse(JSON.stringify(sub))},
  errText(e){const m=String(e&&e.message||e);return /denied/.test(m)?'ถูกปิดการแจ้งเตือนไว้ เปิดได้ที่ตั้งค่าเบราว์เซอร์':/unsupported/.test(m)?(this.ios&&!this.standalone()?'iPhone ต้องเพิ่มหน้านี้ไว้ที่หน้าจอโฮมก่อน (ปุ่มแชร์ → เพิ่มไปยังหน้าจอโฮม)':'เบราว์เซอร์นี้ไม่รองรับ ลองใช้ Chrome'):/nofn/.test(m)?'ร้านยังไม่ได้เปิดระบบแจ้งเตือน':'เปิดแจ้งเตือนไม่สำเร็จ'}};

/* ---------- ข้อมูล ---------- */
const P=new URLSearchParams(location.search);
const S={view:'boot',cat:'all',cart:{},menu:[],cats:[],pub:null,id:(P.get('o')||'').slice(0,60),tok:(P.get('t')||'').slice(0,40),st:null,sending:false,cust:{},pick:{},cl:null,clPh:null,usePts:false};
let SB=null;
const LSget=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return v??d}catch(e){return d}};
const LSset=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const mine=()=>LSget('nl_dl_mine',[]).filter(x=>x&&Date.now()-x.at<24*3600e3);
function addMine(o){LSset('nl_dl_mine',[o,...mine().filter(x=>x.id!==o.id)].slice(0,8))}
S.cust=LSget('nl_dl_cust',{})||{};
const statusUrl=(id,tok)=>{const u=new URL(location.href);return u.origin+u.pathname+'?o='+encodeURIComponent(id)+'&t='+encodeURIComponent(tok)};

function fail(t,s){$('#view').innerHTML=`<div class="card" style="text-align:center"><h2>${esc(t)}</h2><p class="muted" style="margin:0">${esc(s||'')}</p></div>`;$('#foot').hidden=true}
async function start(){const c=window.APP_CONFIG||{};
  if(!window.supabase||!c.SUPABASE_URL)return fail('ระบบยังไม่พร้อม','ลองใหม่อีกครั้งในอีกสักครู่');
  SB=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_KEY,{auth:{persistSession:false}});
  if(S.id&&S.tok){S.view='status';render();await loadStatus(true);loadPub();return}
  await loadPub(true)}
async function loadPub(first){const {data,error}=await SB.rpc('dl_public');
  if(error){if(first)fail(/function|PGRST20/i.test(error.message)?'ร้านยังไม่เปิดระบบสั่งเดลิเวอรี่':'เชื่อมต่อไม่ได้',/function|PGRST20/i.test(error.message)?'ติดต่อร้านได้โดยตรง':'ตรวจอินเทอร์เน็ตแล้วลองใหม่');return}
  S.pub=data;S.menu=data.menu||[];S.cats=(data.cats||[]).filter(c=>S.menu.some(m=>m.cat===c));
  $('#shop').textContent=data.shopName||'เนื้อล้วนๆ';document.title='สั่งเดลิเวอรี่ · '+(data.shopName||'เนื้อล้วนๆ');if(data.logo)$('#logo').src=data.logo;
  const b=$('#stBadge');b.hidden=false;b.className='st '+(data.open?'on':'off');b.textContent=data.open?'● เปิดรับออร์เดอร์':'● ปิดอยู่';
  for(const k of Object.keys(S.cart)){if(!S.menu.some(m=>m.id===S.cart[k].menuId))delete S.cart[k]}
  if(first&&S.cust.lat)roadFetch();
  if(first||S.view==='boot')S.view='menu';if(['menu','cart'].includes(S.view)&&!typing())render()}
const typing=()=>{const a=document.activeElement;return a&&/INPUT|TEXTAREA/.test(a.tagName)&&a.closest('#view')};
setInterval(()=>{if(SB&&!document.hidden&&['menu','cart'].includes(S.view))loadPub()},45000);

/* ---------- ตะกร้า ---------- */
const eUnit=e=>{const m=S.menu.find(x=>x.id===e.menuId)||{};return (+m.price||0)+(e.opts||[]).reduce((a,o)=>a+(+o.p||0),0)};
const cartN=()=>Object.values(S.cart).reduce((a,e)=>a+e.qty,0);
const cartT=()=>Object.values(S.cart).reduce((s,e)=>s+eUnit(e)*e.qty,0);
const inCart=id=>Object.values(S.cart).reduce((a,e)=>a+(e.menuId===id?e.qty:0),0);
function putCart(m,sel){const k=m.id+'|'+optKey(sel.opts)+'|'+sel.note;if(S.cart[k])S.cart[k].qty+=sel.qty;else S.cart[k]={menuId:m.id,opts:sel.opts,note:sel.note,qty:sel.qty};render();toast('ใส่ตะกร้าแล้ว · '+m.name)}

/* ---------- ค่าส่ง (สูตรเดียวกับร้าน ร้านยืนยันอีกครั้งตอนกดรับ) ---------- */
function hav(a,b){const R=6371,t=x=>x*Math.PI/180,dLa=t(b.lat-a.lat),dLo=t(b.lng-a.lng);const h=Math.sin(dLa/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function feeCalc(lat,lng,food){const c=(S.pub&&S.pub.fee)||{};if(!(c.lat&&c.lng&&lat&&lng))return null;
  const rk=S.road&&S.road.k===pinKey(lat,lng)&&S.road.km;
  const km=rk?+rk:Math.round(hav({lat:+c.lat,lng:+c.lng},{lat:+lat,lng:+lng})*(+c.factor||1.3)*10)/10;
  if(+c.maxKm&&km>+c.maxKm)return {km,over:true,max:+c.maxKm};
  let f=+c.base||0;const ex=km-(+c.baseKm||0);if(ex>0)f+=Math.ceil(ex-1e-9)*(+c.perKm||0);const why=[];
  if(+c.minOrder&&food<+c.minOrder&&+c.smallFee){f+=+c.smallFee;why.push('ยอดไม่ถึง '+baht(c.minOrder)+' +'+baht(c.smallFee))}
  if(c.rain&&+c.rainFee){f+=+c.rainFee;why.push('ช่วงฝนตก +'+baht(c.rainFee))}
  if(+c.minFee)f=Math.max(f,+c.minFee);if(+c.maxFee)f=Math.min(f,+c.maxFee);
  if(+c.freeOver&&food>=+c.freeOver){f=0;why.push('ส่งฟรี ยอดถึง '+baht(c.freeOver))}
  return {km,fee:Math.round(f),why:why.join(' · '),road:!!rk}}
const pinKey=(lat,lng)=>(+lat).toFixed(6)+','+(+lng).toFixed(6);
// ระยะตามถนนจริง (Google · คำนวณที่เซิร์ฟเวอร์ร้าน) · ไม่ได้ = ใช้สูตรประมาณ
let RT=null;
function roadFetch(){const g=S.pub&&S.pub.gmap,c=S.cust;if(!(g&&g.road&&SB&&c.lat))return;const lat=+c.lat,lng=+c.lng,k=pinKey(lat,lng);
  if((S.road&&S.road.k===k)||S.roadBusy===k)return;clearTimeout(RT);S.roadBusy=k;
  RT=setTimeout(async()=>{let km=null;try{const {data,error}=await SB.functions.invoke('dl-route',{body:{lat,lng}});if(!error&&data&&data.road&&+data.km>0)km=+data.km}catch(e){}
    if(S.roadBusy!==k)return;S.roadBusy=null;S.road={k,km};
    if(S.view==='pin')feeView();else if(['menu','cart'].includes(S.view)&&!typing())render()},600)}

/* ---------- แผนที่: Google Maps (ถ้าร้านเปิดใช้) · สำรอง OpenStreetMap ฟรี ---------- */
let LL=null,MAP=null,GL=null,GFAIL=false;
const gTick=(k,n)=>{try{SB&&SB.rpc('gmap_tick',{p_kind:k,p_n:n||1}).then(()=>{},()=>{})}catch(e){}};
// ค้นหาแล้วไม่ได้เลือก = Google คิดเป็นครั้งค้นหา · นับตอนออกจากหน้าปักหมุด
const gAcFlush=()=>{if(S.gAc>0){gTick('ac',S.gAc);S.gAc=0;S.gTok=null}};
document.addEventListener('visibilitychange',()=>{if(document.hidden)gAcFlush()});
const gOn=()=>{const g=S.pub&&S.pub.gmap;return !!(g&&g.on&&g.key&&!GFAIL)};
const gReady=()=>!!(gOn()&&window.google&&google.maps&&google.maps.Map);
function loadG(key){if(gReady())return Promise.resolve(window.google);if(GL)return GL;
  GL=new Promise((ok,no)=>{window.__gmOk=()=>ok(window.google);
    window.gm_authFailure=()=>{GFAIL=true;toast('แผนที่ Google ใช้ไม่ได้ตอนนี้ ใช้แผนที่สำรองแทน');if(S.view==='pin')mountMap()};
    const s=document.createElement('script');s.async=true;s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(key)+'&v=weekly&libraries=places&language=th&region=TH&loading=async&callback=__gmOk';
    s.onerror=()=>{GL=null;no(new Error('gmap'))};document.head.appendChild(s);setTimeout(()=>no(new Error('gmap_timeout')),15000)});return GL}
async function mountG(){const el=$('#map');const g=await loadG(S.pub.gmap.key);if(!$('#map')||GFAIL)throw new Error('gone');
  if(MAP){try{MAP.remove()}catch(e){}MAP=null}
  el.innerHTML='<div class="gm"></div><div class="cpin" id="cpin">'+PIN('#c8202a')+'</div><div class="maphint" id="mhint">เลื่อนแผนที่ให้หมุดแดงตรงบ้านคุณ</div>';
  const f=(S.pub&&S.pub.fee)||{},shop=f.lat?{lat:+f.lat,lng:+f.lng}:null,c=S.cust,start=c.lat?{lat:+c.lat,lng:+c.lng}:shop||{lat:13.7563,lng:100.5018};
  gTick('map');
  const m=new g.maps.Map(el.firstChild,{center:start,zoom:c.lat?18:(shop?15:12),gestureHandling:'greedy',disableDefaultUI:true,zoomControl:true,clickableIcons:false});
  if(shop)try{new g.maps.Marker({position:shop,map:m,title:'ร้าน',icon:{url:'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(PIN('#c48d3d')),scaledSize:new g.maps.Size(26,35),anchor:new g.maps.Point(13,34)}})}catch(e){}
  const pin=$('#cpin'),hint=$('#mhint');if(c.lat)hint.hidden=true;
  const set=(lat,lng)=>{S.cust.lat=+(+lat).toFixed(6);S.cust.lng=+(+lng).toFixed(6);hint.hidden=true;feeView()};
  const here=()=>{const p=m.getCenter();set(p.lat(),p.lng())};
  m.addListener('dragstart',()=>pin.classList.add('up'));
  m.addListener('dragend',()=>{pin.classList.remove('up');here()});
  m.addListener('idle',()=>{if(!S.cust.lat)return;const p=m.getCenter();if(Math.abs(p.lat()-S.cust.lat)>2e-6||Math.abs(p.lng()-S.cust.lng)>2e-6)here()});
  m.addListener('click',e=>{m.panTo(e.latLng);set(e.latLng.lat(),e.latLng.lng())});
  MAP={g:true,remove(){try{g.maps.event.clearInstanceListeners(m)}catch(e){}},__set(lat,lng){m.setCenter({lat:+lat,lng:+lng});if(m.getZoom()<17)m.setZoom(18);set(lat,lng)}}}
function loadLeaflet(){if(window.L)return Promise.resolve(window.L);if(LL)return LL;LL=new Promise((ok,no)=>{const c=document.createElement('link');c.rel='stylesheet';c.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(c);
  const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=()=>ok(window.L);s.onerror=()=>{LL=null;no(new Error('leaflet'))};document.head.appendChild(s)});return LL}
const PIN=c=>`<svg xmlns="http://www.w3.org/2000/svg" width="34" height="46" viewBox="0 0 34 46"><path d="M17 45C17 45 33 27 33 17A16 16 0 1 0 1 17C1 27 17 45 17 45Z" fill="${c}" stroke="#fff" stroke-width="2"/><circle cx="17" cy="17" r="6" fill="#fff"/></svg>`;
async function mountMap(){const el=$('#map');if(!el)return;

function parseGLink(s){s=String(s||'').trim();let m;
  if(m=s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/))return {lat:+m[1],lng:+m[2]};
  if(m=s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/))return {lat:+m[1],lng:+m[2]};
  if(m=s.match(/[?&](?:q|query|destination|ll|daddr)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i))return {lat:+m[1],lng:+m[2]};
  if(m=s.match(/^(-?\d{1,2}\.\d+)\s*,\s*(-?\d{2,3}\.\d+)$/))return {lat:+m[1],lng:+m[2]};return null}

    picked:['🛵','<span class="pulse"></span>ไรเดอร์กำลังไปส่ง',`${esc(dv.riderName||'ไรเดอร์')} รับอาหารแล้ว${dv.pickedAt?' ตอน '+hm(dv.pickedAt):''}`],
    done:['🎉','ส่งอาหารสำเร็จ',`${dv.doneAt?'ส่งถึงเวลา '+hm(dv.doneAt)+' น. · ':''}ขอบคุณที่สั่งนะครับ`],
    rejected:['😢','ร้านรับออร์เดอร์ไม่ได้',esc(d.reason||'ขออภัยครับ')],cancelled:['🗑️','ยกเลิกออร์เดอร์แล้ว','สั่งใหม่ได้ทุกเมื่อ'],dlvcancel:['ℹ️','งานส่งถูกยกเลิก','ติดต่อร้านได้เลย']}[stg]||['🛵','กำลังดำเนินการ',''];
  if(dv.ext||d.via==='lineman'){const nm=String(dv.riderName||'').replace(/^LINE MAN( · )?/,'');
    if(stg==='ready')sc[2]=dv.status==='accepted'?`ไรเดอร์ LINE MAN ${esc(nm)} กำลังมารับที่ร้าน`:'<span class="pulse"></span>ร้านกำลังเรียกไรเดอร์ LINE MAN มารับ';
    if(stg==='ready_rider')sc[2]=`ไรเดอร์ LINE MAN ${esc(nm)} กำลังมารับที่ร้าน`;
    if(stg==='picked')sc[2]=`ไรเดอร์ LINE MAN ${esc(nm)} รับอาหารแล้ว${dv.pickedAt?' ตอน '+hm(dv.pickedAt):''}`}
  if(stg==='queue'&&k.ahead>0)sc[2]=`<div class="big">อีก ${k.ahead} คิว</div>ก่อนถึงออร์เดอร์ของคุณ`;
  let h=`<div class="card stage${stg==='done'?' ok':bad?' bad':''}"><div class="em">${sc[0]}</div><h2>${sc[1]}</h2><div class="sub">${sc[2]}</div></div>
   ${bad?'':`<div class="card"><div class="steps">${steps}</div></div>`}`;
  if((stg==='accepted'||stg==='slipbad')&&d.via==='lineman')h+=`<div class="rnote lm"><span class="ic">🟢</span><div><b>ส่งโดยไรเดอร์ LINE MAN</b><span>ไรเดอร์ร้านไม่ว่างตอนนี้ ร้านจะเรียก LINE MAN ไปส่งให้ · ค่าส่ง ${baht(d.fee)} ตามแอป LINE MAN</span></div></div>`;
  if(stg==='accepted'||stg==='slipbad'){
    h+=`<div class="card">${stg==='slipbad'?`<div class="warn">⚠️ ร้านแจ้ง: <b>${esc(d.slipBad||'')}</b></div>`:''}
      ${pp?`<div class="payqr"><small>สแกนจ่ายด้วยแอปธนาคาร (พร้อมเพย์)</small>${qrSvg(ppPayload(pp,amt))}<b>${baht(amt)}</b><small>ค่าอาหาร ${baht(d.food)} + ค่าส่ง${d.via==='lineman'?' LINE MAN':''} ${baht(d.fee)}</small></div><p class="help" style="text-align:center">กดค้างที่ QR เพื่อบันทึกรูป แล้วเปิดในแอปธนาคาร</p>`:`<div class="warn">ร้านยังไม่ได้ตั้งพร้อมเพย์ โทรถามเลขบัญชีกับร้าน${d.shopPhone?` <a href="tel:${esc(d.shopPhone)}">${esc(d.shopPhone)}</a>`:''}</div>`}
      ${slipBox()}</div>`}
  if(stg==='slip')h+=`<div class="card">${S.slipSent&&S.slipSent.id===S.id?`<div class="slipok"><img src="${S.slipSent.img}" alt="สลิป" data-a="viewSlip"><div class="grow"><b>✓ ส่งสลิปแล้ว</b><small class="muted">ร้านกำลังตรวจยอด ${baht(amt)}</small></div></div>`:`<div class="slipok"><span style="font-size:30px">📎</span><div class="grow"><b>✓ ส่งสลิปแล้ว</b><small class="muted">ร้านกำลังตรวจยอด ${baht(amt)}</small></div></div>`}<label class="btn sm" for="slipIn">ส่งสลิปใหม่</label></div>`;
  if(dv.ext&&['accepted','picked'].includes(dv.status)){const nm=String(dv.riderName||'').replace(/^LINE MAN( · )?/,'');
    h+=`<div class="card"><div class="rider"><span class="av" style="background:#06c755;color:#fff">LM</span><div style="flex:1"><b>LINE MAN${nm?' · '+esc(nm):''}</b><div class="help">${dv.status==='picked'?'กำลังไปส่งอาหารให้คุณ':'กำลังไปรับอาหารที่ร้าน'} · ร้านเรียกไรเดอร์ให้</div></div></div>
    <div class="row2">${dv.extUrl?`<a class="btn ok wide" href="${esc(dv.extUrl)}" target="_blank" rel="noopener">📍 ติดตามไรเดอร์ LINE MAN</a>`:'<span class="help" style="flex:1">ติดตามสถานะได้ที่หน้านี้</span>'}${dv.riderPhone?`<a class="btn" href="tel:${esc(dv.riderPhone)}">📞</a>`:''}</div></div>`}
  else if(dv.status&&['accepted','picked'].includes(dv.status)&&dv.riderName)h+=`<div class="card"><div class="rider"><span class="av">🛵</span><div style="flex:1"><b>${esc(dv.riderName)}</b>${dv.riderPlate?`<span class="plate">${esc(dv.riderPlate)}</span>`:''}<div class="help">${dv.status==='picked'?'กำลังไปส่งอาหารให้คุณ':'กำลังไปรับอาหารที่ร้าน'}</div></div></div>
    <div class="row2"><a class="btn ok wide" href="track.html?d=${encodeURIComponent(d.orderId)}&t=${encodeURIComponent(dv.tok||'')}">📍 ดูไรเดอร์บนแผนที่</a>${dv.riderPhone?`<a class="btn" href="tel:${esc(dv.riderPhone)}">📞</a>`:''}</div></div>`;
  if(stg==='done'){h+=`<div class="card">${S.proof&&S.proof.img?`<b>📷 รูปตอนส่งอาหาร</b><img class="proof" src="${esc(S.proof.img)}" alt="รูปตอนส่งอาหาร" data-a="viewProof">`:dv.proofAt?'<span class="help">กำลังโหลดรูปตอนส่ง…</span>':''}
    ${d.receipt&&d.receipt.tok?`<a class="btn" href="receipt.html?r=${encodeURIComponent(d.receipt.id)}&t=${encodeURIComponent(d.receipt.tok)}">🧾 ดู / บันทึกใบเสร็จ</a>`:''}<button class="btn pri" data-a="again" type="button">สั่งอีกครั้ง</button></div>`}
  if(['rejected','cancelled','dlvcancel'].includes(stg))h+=`<button class="btn pri" data-a="again" type="button">กลับไปหน้าเมนู</button>`;
  h+=`<div class="card"><div class="kv"><b>ออร์เดอร์ ${esc(shortNo(d.orderNo))}</b><span class="muted">สั่งเมื่อ ${hm(d.at)}</span></div>
    <div class="list">${(d.items||[]).map(l=>`<div class="li"><div class="g">${l.qty}× ${esc(l.name)}${optLine(l)}${l.note?`<div class="note">${esc(l.note)}</div>`:''}</div><div class="r">${baht(((+l.price||0)+(+l.extra||0))*l.qty)}</div></div>`).join('')}
     <div class="li"><div class="g">ค่าอาหาร</div><div class="r">${baht(d.food)}</div></div>${(d.cpns||[]).filter(c=>c.type!=='fee').map(c=>`<div class="li"><div class="g">🎟️ ${esc(c.name)}</div><div class="r neg">−${baht(c.disc)}</div></div>`).join('')}
     ${+(d.status==='new'?d.ptsDisc:(d.ptsUse!=null?d.ptsDisc:d.ptsDisc))?`<div class="li"><div class="g">⭐ ใช้ ${d.status==='new'?d.ptsReq:(d.ptsUse??d.ptsReq)} แต้ม${d.status==='new'?' (รอร้านยืนยัน)':''}</div><div class="r neg">−${baht(d.ptsDisc)}</div></div>`:''}
     <div class="li"><div class="g">ค่าส่ง${d.via==='lineman'?' LINE MAN':''} ${d.km!=null?'('+d.km+' กม.)':''}</div><div class="r">${baht(d.fee)}</div></div>${(d.cpns||[]).filter(c=>c.type==='fee').map(c=>`<div class="li"><div class="g">🎟️ ${esc(c.name)}</div><div class="r neg">−${baht(d.cpnFee!=null?Math.min(+d.cpnFee,+d.fee):c.disc)}</div></div>`).join('')}
     <div class="li sum"><div class="g"><b>${['new'].includes(d.status)?'ยอดโดยประมาณ':'ยอดรวม'}</b></div><b>${baht(amt)}</b></div></div>
    <div class="help">📍 ส่งที่: คุณ${esc(d.name)} · ${esc(d.addr||'')}${d.note?' · '+esc(d.note):''}</div>
    <div class="row2" style="flex-wrap:wrap">${d.shopPhone?`<a class="btn sm" href="tel:${esc(d.shopPhone)}">📞 โทรหาร้าน</a>`:''}${['new','accepted'].includes(d.status)?'<button class="btn sm" data-a="cancel" type="button">ยกเลิกออร์เดอร์</button>':''}</div></div>`;
  if(!bad&&stg!=='done')h+=pushCard();
  h+=mineBar()+`<p class="help" style="text-align:center">หน้านี้อัปเดตเองอัตโนมัติ · บันทึกลิงก์ไว้กลับมาดูได้</p>`;
  v.innerHTML=h}

/* ---------- สลิป ---------- */
function slipBox(){const dr=S.slipDraft;
  if(dr)return `<div class="slipbox"><b>ตรวจสลิปก่อนส่ง</b><img src="${dr}" alt="สลิป" class="slipimg"><div class="row2"><button class="btn" data-a="slipDel" type="button">เลือกรูปใหม่</button><button class="btn pri wide" data-a="slipSend" type="button" ${S.slipBusy?'disabled':''}>${S.slipBusy?'กำลังส่ง…':'ยืนยันส่งสลิป'}</button></div></div>`;
  return `<label class="btn pri" for="slipIn">📎 โอนแล้ว แนบสลิป</label>`}
function shrink(file){return new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=no;fr.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{
  let w=im.width,h=im.height,mx=1280;if(Math.max(w,h)>mx){const r=mx/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r)}
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);let q=.75,u=c.toDataURL('image/jpeg',q);while(u.length>450000&&q>.35){q-=.1;u=c.toDataURL('image/jpeg',q)}ok(u)};im.src=fr.result};fr.readAsDataURL(file)})}
document.addEventListener('change',async e=>{const i=e.target;if(i.id!=='slipIn'||!i.files||!i.files[0])return;const f=i.files[0];i.value='';
  try{S.slipDraft=await shrink(f)}catch(x){return toast('เปิดรูปไม่ได้ ลองรูปอื่น')}
  if(S.st&&S.st.status==='slip'){S.st.status='accepted'}renderStatus();setTimeout(()=>document.querySelector('.slipbox')?.scrollIntoView({block:'center',behavior:'smooth'}),80)});
async function slipSend(){if(!S.slipDraft||S.slipBusy)return;S.slipBusy=true;renderStatus();
  const {error}=await SB.rpc('dl_slip',{p_id:S.id,p_tok:S.tok,p_img:S.slipDraft});S.slipBusy=false;
  if(error){const m=String(error.message||'');toast(/bad_slip/.test(m)?'ไฟล์รูปใหญ่หรือใช้ไม่ได้ ลองแคปหน้าจอสลิปใหม่':/bad_state/.test(m)?'สถานะออร์เดอร์เปลี่ยนแล้ว':'ส่งสลิปไม่สำเร็จ ลองอีกครั้ง');renderStatus();return}
  S.slipSent={id:S.id,img:S.slipDraft};S.slipDraft=null;toast('✓ ส่งสลิปแล้ว ร้านกำลังตรวจยอด');loadStatus()}

/* ---------- แจ้งเตือน ---------- */
const pushKey=()=>'nl_dl_push_'+S.id;
function pushCard(){let on=false;try{on=!!localStorage.getItem(pushKey())}catch(e){}
  if(on&&PUSH.ok()&&Notification.permission==='granted')return '<div class="pushc on">🔔 เปิดแจ้งเตือนแล้ว · ล็อกจอได้เลย จะแจ้งเมื่อร้านรับ ถึงคิว และไรเดอร์ออกเดินทาง</div>';
  if(!PUSH.ok())return PUSH.ios&&!PUSH.standalone()?'<div class="pushc">📱 iPhone: เปิดหน้านี้ค้างไว้ สถานะอัปเดตเอง และมีเสียงเตือน (แจ้งเตือนบนหน้าจอล็อกใช้ได้เมื่อเพิ่มหน้านี้ไว้ที่หน้าจอโฮม)</div>':'';
  return '<button class="btn" data-a="pushOn" type="button" style="flex-direction:column;gap:0;white-space:normal">🔔 แจ้งเตือนบนหน้าจอล็อก<small class="muted" style="font-weight:400">ร้านรับ · ถึงคิว · ไรเดอร์กำลังไปส่ง</small></button>'}
async function pushOn(b){if(b)b.disabled=true;try{const sub=await PUSH.subscribe();const {error}=await SB.rpc('dl_push_sub',{p_id:S.id,p_tok:S.tok,p_sub:sub,p_url:statusUrl(S.id,S.tok)});if(error)throw new Error('rpc');
  try{localStorage.setItem(pushKey(),'1')}catch(e){}toast('เปิดแจ้งเตือนแล้ว');renderStatus()}catch(e){toast(/rpc/.test(String(e.message))?'ร้านยังไม่ได้เปิดระบบแจ้งเตือน':PUSH.errText(e));if(b)b.disabled=false}}

/* ---------- ปุ่ม ---------- */
async function act(a,b){const d=(b&&b.dataset)||{};
  if(a==='cat'){S.cat=d.v;render()}
  else if(a==='add'){const m=S.menu.find(x=>x.id===d.m);if(!m||m.soldOut)return;if(hasOpts(m))optPick(m,{onAdd:sel=>putCart(m,sel)});else putCart(m,{opts:[],note:'',qty:1})}
  else if(a==='qty'){const e=S.cart[d.k];if(!e)return;e.qty+= +d.d;if(e.qty<1)delete S.cart[d.k];render()}
  else if(a==='go'){S.view=d.v;render();window.scrollTo(0,0)}
  else if(a==='send')send();
  else if(a==='pinGo'){gAcFlush();if(!pinOk())return;const c=S.cust;try{const {data,error}=await SB.rpc('dl_quote',{p_lat:c.lat,p_lng:c.lng,p_food:cartT()});if(!error&&data&&data.over){toast('ไกลเกินระยะส่ง ('+data.km+' กม.)');return}}catch(e){}
    saveCust();S.view=S.pinBack||'menu';S.pinBack=null;render();window.scrollTo(0,0)}
  else if(a==='pinEdit'){S.pinBack=S.view==='addr'?'addr':'menu';S.view='pin';render();window.scrollTo(0,0)}
  else if(a==='pinCancel'){gAcFlush();S.view=S.pinBack||'menu';S.pinBack=null;render()}
  else if(a==='cpPick'){S.pickTouched=true;S.pick[d.t]=S.pick[d.t]===d.id?null:d.id;memView()}
  else if(a==='cpLoad'){S.cust.phone=$('#cpPh').value;S.clPh=null;S.cl=null;loadCl()}
  else if(a==='cpClaim'){const ph=String(S.cust.phone||'').replace(/\D/g,'');b.disabled=true;const {error}=await SB.rpc('cpn_claim',{p_id:d.id,p_phone:ph});
    if(error){b.disabled=false;return toast(/cpn_gone/.test(error.message)?'คูปองถูกเก็บครบแล้ว':/cpn_limit/.test(error.message)?'คุณเก็บคูปองนี้ครบสิทธิ์แล้ว':/cpn_member/.test(error.message)?'ต้องสมัครสมาชิกก่อน':/cpn_not_yet/.test(error.message)?'ยังไม่ถึงเวลาเปิดให้เก็บ':/cpn_off/.test(error.message)?'คูปองนี้ปิดรับเก็บแล้ว':'เก็บคูปองไม่สำเร็จ')}
    toast('🎟️ เก็บคูปองแล้ว');S.clPh=null;S.pickTouched=false;loadCl()}
  else if(a==='join'){const ph=String(S.cust.phone||'').replace(/\D/g,'');b.disabled=true;const {error}=await SB.rpc('member_signup',{p_phone:ph,p_name:String(S.cust.name||'').trim()});
    if(error){b.disabled=false;return toast(/points_off/.test(error.message)?'ร้านปิดระบบสมาชิกอยู่':'สมัครไม่สำเร็จ ลองอีกครั้ง')}toast('⭐ สมัครสมาชิกแล้ว');S.clPh=null;loadCl()}
  else if(a==='gps'){if(!navigator.geolocation)return toast('เครื่องนี้หาตำแหน่งไม่ได้');toast('กำลังหาตำแหน่ง…');
    navigator.geolocation.getCurrentPosition(p=>setPin(p.coords.latitude,p.coords.longitude),()=>toast('หาตำแหน่งไม่ได้ อนุญาตตำแหน่งในเบราว์เซอร์ หรือปักหมุดเอง'),{enableHighAccuracy:true,timeout:15000})}
  else if(a==='gLink'){const p=parseGLink($('#gLink').value);if(!p)return toast(/goo\.gl|maps\.app/.test($('#gLink').value)?'ลิงก์สั้นอ่านพิกัดไม่ได้ ใช้ค้นหาหรือปักหมุดแทน':'ไม่พบพิกัดในลิงก์นี้');setPin(p.lat,p.lng);toast('ใช้พิกัดจากลิงก์แล้ว')}
  else if(a==='gSearch'){clearTimeout(S.gT);doSearch($('#gQ').value.trim())}
  else if(a==='gPick'){const r=(S.geo||[])[+d.i];if(!r)return;
    if(r.pred){try{const pl=r.pred.toPlace();await pl.fetchFields({fields:['location']});S.gTok=null;S.gAc=0;gTick('pick');setPin(pl.location.lat(),pl.location.lng());if(!S.cust.addr)S.cust.addr=r.main+(r.sub?' '+r.sub.split(',')[0]:'')}catch(e){return toast('ดึงตำแหน่งไม่ได้ ลองใหม่ หรือเลื่อนแผนที่เอง')}}
    else{setPin(r.lat,r.lng);if(!S.cust.addr)S.cust.addr=r.name.split(',').slice(0,3).join(',')}
    $('#gRes').innerHTML='';const q=$('#gQ');if(q)q.value=r.pred?r.main:q.value}
  else if(a==='slipDel'){S.slipDraft=null;renderStatus();setTimeout(()=>$('#slipIn').click(),50)}
  else if(a==='slipSend')slipSend();
  else if(a==='viewSlip')viewImg(S.slipSent&&S.slipSent.img,'สลิป');
  else if(a==='viewProof')viewImg(S.proof&&S.proof.img,'รูปตอนส่งอาหาร');
  else if(a==='pushOn')pushOn(b);
  else if(a==='cancel'){if(!confirm('ยกเลิกออร์เดอร์นี้?'))return;const {error}=await SB.rpc('dl_cancel',{p_id:S.id,p_tok:S.tok});if(error)return toast(/cannot_cancel/.test(error.message)?'ร้านยืนยันยอดแล้ว ยกเลิกเองไม่ได้ โทรหาร้าน':'ยกเลิกไม่สำเร็จ');toast('ยกเลิกออร์เดอร์แล้ว');loadStatus()}
  else if(a==='again'){clearTimeout(stT);S.id='';S.tok='';S.st=null;S.proof=null;history.replaceState(null,'',location.pathname);S.view='menu';if(!S.pub)await loadPub(true);else{loadPub();render()}window.scrollTo(0,0)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;act(b.dataset.a,b)});

/* ---------- อัปเดตเวอร์ชันอัตโนมัติ ---------- */
const APP_VER=(document.querySelector('meta[name="app-version"]')||{}).content||'';
async function checkUpdate(){try{const r=await fetch(location.pathname+'?vcheck='+Date.now(),{cache:'no-store'});if(!r.ok)return;const t=await r.text();const m=t.match(/name="app-version" content="([^"]+)"/);
  if(!m||!APP_VER||m[1]===APP_VER||document.getElementById('updBar'))return;
  if((S.view==='status'&&!S.slipDraft&&!S.slipBusy)||(S.view==='menu'&&!cartN())){const u=new URL(location.href);u.searchParams.set('v',m[1]);location.replace(u.href);return}
  const b=document.createElement('div');b.id='updBar';b.className='updbar';b.innerHTML='มีเวอร์ชันใหม่ <button type="button">อัปเดต</button>';b.querySelector('button').onclick=()=>{const u=new URL(location.href);u.searchParams.set('v',m[1]);location.replace(u.href)};document.body.appendChild(b)}catch(e){}}
setTimeout(checkUpdate,4000);setInterval(checkUpdate,5*60000);
start();
</script>

<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="app-version" content="2026.10.15-1710">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0d0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Raptor Rider · เนื้อล้วนๆ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
:root{--bg:#0f0d0c;--surface:#1a1716;--sunk:#252120;--line:rgba(255,230,190,.14);--fg:#f6efe4;--muted:#b9ab99;
  --red:#e0262b;--gold:#d9a65a;--green:#2bd47d;--green-d:#0f7a43;--amber:#ffb347;
  --f-d:"Kanit","IBM Plex Sans Thai",system-ui,sans-serif;--f-b:"IBM Plex Sans Thai",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-b);font-size:16px;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;background:radial-gradient(120% 60% at 50% -10%,rgba(224,38,43,.22),transparent 60%),var(--bg)}
button,input,select{font:inherit}
h1,h2,h3{font-family:var(--f-d);margin:0;font-weight:600}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:10px;padding-top:calc(4px + env(safe-area-inset-top,0px))}
.top img.logo{width:42px;height:42px;border-radius:10px;border:1px solid var(--line)}
.top .ttl{flex:1;min-width:0}.top .ttl b{font-family:var(--f-d);font-size:20px;display:block;line-height:1.1}
.top .ttl small{color:var(--gold);letter-spacing:.14em;font-size:11px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:14px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--sunk);color:var(--fg);border-radius:12px;padding:12px 13px;min-height:48px;width:100%}
.field input:focus{outline:none;border-color:var(--gold)}
.btn{border:1px solid var(--line);background:var(--sunk);color:var(--fg);border-radius:12px;padding:12px 16px;min-height:48px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.pri{background:linear-gradient(180deg,#e9b96d,#c48d3d);color:#1d1307;border:0}
.btn.red{background:var(--red);border:0;color:#fff}.btn.green{background:linear-gradient(180deg,#34e08b,#16a35c);color:#032414;border:0}
.btn.wide{width:100%}.btn:disabled{opacity:.5}
.lnk{background:none;border:0;color:var(--gold);text-decoration:underline;cursor:pointer;padding:6px}
.err{color:#ff7b7b;min-height:1.2em;margin:0;font-size:14px}
.muted{color:var(--muted)}.help{font-size:13px;color:var(--muted);margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo{display:flex;gap:12px;align-items:center}.photo .box{width:84px;height:84px;border-radius:50%;background:var(--sunk);border:1px dashed var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:30px;flex:none}
.photo .box img{width:100%;height:100%;object-fit:cover}
/* โปรไฟล์ */
.me{display:flex;gap:12px;align-items:center}.me .av{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--sunk);border:2px solid var(--gold);flex:none;display:flex;align-items:center;justify-content:center;font-size:26px}
.me b{font-family:var(--f-d);font-size:18px;display:block}.me .plate{display:inline-block;margin-top:3px;background:#f6efe4;color:#111;border-radius:6px;padding:1px 8px;font-weight:700;font-size:13px;letter-spacing:.04em}
/* สวิตช์ Ready */
.ready{position:relative;border-radius:24px;padding:22px 18px;text-align:center;cursor:pointer;border:1px solid var(--line);background:linear-gradient(160deg,#211d1b,#141110);overflow:hidden;user-select:none}
.ready .badge{width:138px;height:138px;margin:4px auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#2a2523;border:3px solid #3a3330;position:relative;transition:.3s}
.ready .badge img{width:62px;height:62px;border-radius:14px;filter:grayscale(1) brightness(.75)}
.ready .badge span{font-family:var(--f-d);font-size:24px;letter-spacing:.14em;color:var(--muted);font-weight:700;padding-left:.14em}
.ready h2{font-size:26px}.ready p{margin:6px 0 0;color:var(--muted)}
.ready:not(.on):not(.busy){border-color:rgba(224,38,43,.45);background:radial-gradient(90% 80% at 50% 20%,rgba(224,38,43,.22),transparent 70%),linear-gradient(160deg,#261212,#140c0c)}
.ready:not(.on):not(.busy) .badge{background:radial-gradient(circle,#e0262b,#7d0f14);border-color:#ff8a8f;box-shadow:0 0 22px rgba(224,38,43,.45)}
.ready:not(.on):not(.busy) .badge span{color:#fff}.ready:not(.on):not(.busy) h2{color:#ff6b70}
.ready.on{background:radial-gradient(90% 80% at 50% 20%,rgba(43,212,125,.28),transparent 70%),linear-gradient(160deg,#10261a,#0b1510);border-color:rgba(43,212,125,.45)}
.ready.on .badge{background:radial-gradient(circle,#1fbf6c,#0b6b39);border-color:#7dffb7;box-shadow:0 0 0 0 rgba(43,212,125,.6);animation:pulse 1.8s infinite}
.ready.on .badge img{filter:none}.ready.on .badge span{color:#eafff3}
.ready.on h2{color:#7dffb7}
.ready .q{display:inline-flex;gap:6px;align-items:baseline;margin-top:10px;background:rgba(0,0,0,.35);border-radius:999px;padding:6px 14px;font-family:var(--f-d)}
.ready .q b{font-size:22px;color:#fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(43,212,125,.55)}70%{box-shadow:0 0 0 26px rgba(43,212,125,0)}100%{box-shadow:0 0 0 0 rgba(43,212,125,0)}}
.ready.busy{background:linear-gradient(160deg,#2b1f0c,#171108);border-color:rgba(255,179,71,.45)}.ready.busy h2{color:var(--amber)}
.ready.busy .badge{background:radial-gradient(circle,#e59a2c,#7a4a0a);border-color:#ffd58a}.ready.busy .badge img{filter:none}.ready.busy .badge span{color:#fff3dc;text-shadow:0 1px 2px rgba(0,0,0,.5)}
/* งาน */
.job{border:1px solid rgba(217,166,90,.5);background:linear-gradient(180deg,#221c15,#171310)}
.job .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.job .fee{font-family:var(--f-d);font-size:30px;color:var(--gold);line-height:1}
.steps{display:flex;gap:6px}.steps i{flex:1;height:6px;border-radius:4px;background:#3a3330}.steps i.on{background:var(--green)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:15px}.kv span:first-child{color:var(--muted)}
.addr{background:var(--sunk);border-radius:12px;padding:10px 12px;line-height:1.5}
.items{font-size:14px;color:var(--muted);line-height:1.6}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat div{background:var(--sunk);border-radius:14px;padding:12px}.stat b{font-family:var(--f-d);font-size:24px;display:block}.stat span{font-size:13px;color:var(--muted)}
.list .it{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.list .it:first-child{border-top:0}
/* ป๊อปอัปงานใหม่ */
.offer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;animation:fin .2s}
.offer .sc{width:100%;max-width:520px;background:linear-gradient(180deg,#1e1a17,#120f0e);border-radius:24px 24px 0 0;border-top:3px solid var(--gold);padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.offer .ring{display:flex;align-items:center;gap:12px}.offer .ring .t{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-d);font-size:22px;background:conic-gradient(var(--gold) var(--p),#3a3330 0);position:relative}
.offer .ring .t::before{content:"";position:absolute;inset:5px;border-radius:50%;background:#1a1716}.offer .ring .t b{position:relative}
.offer h2{font-size:24px}
@keyframes fin{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#f6efe4;color:#1a1310;padding:10px 16px;border-radius:12px;font-weight:600;z-index:80;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.ok{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:24px 10px}.ok .big{font-size:56px}
.approved{border-color:rgba(43,212,125,.5);background:radial-gradient(90% 70% at 50% 0%,rgba(43,212,125,.25),transparent 70%),var(--surface)}
.okbadge{width:150px;height:150px;border-radius:50%;margin:6px auto 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#1fbf6c,#0b6b39);border:3px solid #7dffb7;animation:pulse 1.8s infinite;color:#eafff3}
.okbadge span{font-size:52px;line-height:1;font-weight:700}.okbadge b{font-family:var(--f-d);letter-spacing:.14em;font-size:17px;margin-top:4px}
.cred{background:var(--sunk);border-radius:12px;padding:10px 14px;font-size:15px}.cred b{color:#7dffb7;font-size:18px;letter-spacing:.04em}
.big.wait{animation:spin 3s ease-in-out infinite}@keyframes spin{50%{transform:rotate(180deg)}}
.pushc{font-size:14px;background:rgba(255,179,71,.12);border:1px solid rgba(255,179,71,.4);border-radius:12px;padding:10px 12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><img class="logo" src="images/logo-nl.png" alt=""><div class="ttl"><b>Raptor Rider</b><small>NUEA LWOON DELIVERY</small></div><button class="lnk" id="outBtn" hidden type="button">ออกจากระบบ</button></header>
  <main id="view"><div class="card"><p class="muted" style="margin:0">กำลังโหลด…</p></div></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script>window.APP_CONFIG||document.write('<script src="config.js"><\/script>')</script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const baht=n=>'฿'+(+n||0).toLocaleString('th-TH',{maximumFractionDigits:2});
const hm=t=>new Date(t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Bangkok'});
const dshort=t=>new Date(t).toLocaleDateString('th-TH',{day:'numeric',month:'short',timeZone:'Asia/Bangkok'});
function toast(m){const o=$('.toast');if(o)o.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
const CFG=window.APP_CONFIG||{};const DOMAIN=String(CFG.LOGIN_DOMAIN||'nuealwoan.com').replace(/^@/,'');
const P=new URLSearchParams(location.search);
let APPH='',ST=null,stT=null;
const bkDay=()=>new Date(Date.now()+7*3600e3).toISOString().slice(0,10);
async function dayOut(){try{await SB.rpc('rider_ready',{p_on:false})}catch(e){}try{await SB.auth.signOut()}catch(e){}try{localStorage.removeItem('nl_rider_day')}catch(e){}location.replace(location.pathname+'?out=day')}
let SB=null,ME=null,mode=P.has('join')?'join':'boot',poll=null,busy=false,photoData='',lastOffer='',wake=null;

/* ---------- เสียงแจ้งงานใหม่ ---------- */
let AC=null;function acUnlock(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}}
document.addEventListener('pointerdown',acUnlock,{passive:true});
function ring(){try{if(!AC)return;const t=AC.currentTime;[[988,0],[1319,.16],[988,.32],[1319,.48]].forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.12,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.15);o.connect(g).connect(AC.destination);o.start(t+d);o.stop(t+d+.16)})}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([300,120,300,120,300])}catch(e){}}
async function keepAwake(on){try{if(on&&!wake&&'wakeLock' in navigator){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}else if(!on&&wake){await wake.release();wake=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(ME&&ME.ready)keepAwake(true);refresh()}});

/* ---------- แชร์ตำแหน่งให้ลูกค้า (เฉพาะตอนมีงาน) ---------- */
const kmBetween=(a,b)=>{const t=x=>x*Math.PI/180,dLa=t(b.lat-a.lat),dLo=t(b.lng-a.lng);const h=Math.sin(dLa/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLo/2)**2;return 12742*Math.asin(Math.sqrt(h))};
let geoW=null,lastSent=null,geoErr='';
function geoSync(on){if(on&&geoW==null&&navigator.geolocation){geoW=navigator.geolocation.watchPosition(p=>{const c=p.coords,now=Date.now(),cur={lat:c.latitude,lng:c.longitude};if(geoErr){geoErr='';render()}
    if(lastSent&&now-lastSent.t<15000&&kmBetween(lastSent,cur)<0.04)return;lastSent={t:now,...cur};SB.rpc('rider_loc',{p_lat:cur.lat,p_lng:cur.lng,p_acc:c.accuracy||0}).then(()=>{},()=>{})},
    e=>{const was=geoErr;geoErr=e.code===1?'denied':'err';if(was!==geoErr)render()},{enableHighAccuracy:true,maximumAge:10000,timeout:30000})}
  else if(!on&&geoW!=null){navigator.geolocation.clearWatch(geoW);geoW=null;lastSent=null;geoErr=''}}
/* ---------- แจ้งเตือนบนหน้าจอล็อก ---------- */
const PUSH={reg:null,key:null,
  ok:()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window,
  ios:/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),
  standalone:()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}},
  fn:()=>String(CFG.SUPABASE_URL||'').replace(/\/$/,'')+'/functions/v1/push',
  async init(){if(this.reg||!('serviceWorker' in navigator))return this.reg;try{this.reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready}catch(e){this.reg=null}return this.reg},
  async loadKey(){if(this.key)return this.key;let r;try{r=await fetch(this.fn(),{method:'POST',headers:{'Content-Type':'application/json',apikey:CFG.SUPABASE_KEY||''},body:'{"op":"pubkey"}'})}catch(e){throw new Error('nofn')}
    if(!r.ok)throw new Error('nofn');const j=await r.json();if(!j.key)throw new Error('nofn');return this.key=j.key},
  b64(s){const p='='.repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))},
  async current(){const r=await this.init();return r?await r.pushManager.getSubscription():null},
  async subscribe(){if(!this.ok())throw new Error('unsupported');
    const perm=Notification.permission==='granted'?'granted':await Notification.requestPermission();if(perm!=='granted')throw new Error('denied');
    const reg=await this.init();if(!reg)throw new Error('nosw');const key=await this.loadKey();let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:this.b64(key)});return JSON.parse(JSON.stringify(sub))}};
let pushOn=false;
async function pushCheck(){try{pushOn=PUSH.ok()&&Notification.permission==='granted'&&!!(await PUSH.current());if(pushOn){const s=await PUSH.current();SB.rpc('rider_push_sub',{p_sub:JSON.parse(JSON.stringify(s)),p_url:location.origin+location.pathname}).then(()=>{},()=>{})}}catch(e){pushOn=false}}
async function pushEnable(){try{const sub=await PUSH.subscribe();const {error}=await SB.rpc('rider_push_sub',{p_sub:sub,p_url:location.origin+location.pathname});if(error)throw new Error('rpc');pushOn=true;toast('เปิดแจ้งเตือนแล้ว ล็อกจอก็ยังได้รับงาน');render()}
  catch(e){const m=String(e&&e.message||e);toast(/denied/.test(m)?'ถูกปิดการแจ้งเตือนไว้ ไปเปิดที่ตั้งค่ามือถือ':/unsupported/.test(m)?(PUSH.ios&&!PUSH.standalone()?'iPhone: เพิ่มหน้านี้ไว้ที่หน้าจอโฮมก่อน (ปุ่มแชร์ → เพิ่มไปยังหน้าจอโฮม)':'เครื่องนี้ไม่รองรับการแจ้งเตือน'):/nofn|rpc/.test(m)?'ร้านยังไม่ได้เปิดระบบแจ้งเตือน':'เปิดแจ้งเตือนไม่สำเร็จ')}}

/* ---------- เริ่มต้น ---------- */
async function start(){
  if(!window.supabase||!CFG.SUPABASE_URL||!CFG.SUPABASE_KEY){$('#view').innerHTML='<div class="card"><h2>ระบบยังไม่พร้อม</h2><p class="muted">แจ้งร้านได้เลย</p></div>';return}
  SB=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'nl-rider-auth',lock:async(n,t,fn)=>await fn()}});
  if(mode==='join')return render();
  let ses=null;try{ses=(await SB.auth.getSession()).data.session}catch(e){}
  if(ses){let d='';try{d=localStorage.getItem('nl_rider_day')||''}catch(e){}if(!d){try{localStorage.setItem('nl_rider_day',bkDay())}catch(e){}}else if(d!==bkDay())return dayOut()}
  if(P.get('out')==='day')setTimeout(()=>toast('ข้ามวันแล้ว กรุณาเข้าสู่ระบบใหม่'),300);
  if(!ses){try{const pw=JSON.parse(localStorage.getItem('nl_rider_pw')||'null');if(pw&&Date.now()-pw.at<3*86400e3){PW=pw;mode='pwwait';render();return pwCheck()}}catch(e){}
    let ap='';try{ap=localStorage.getItem('nl_rider_apply')||''}catch(e){}if(ap){APPH=ap;mode='status';return checkStatus()}mode='login';return render()}
  await refresh(true);
}
async function refresh(first){if(!SB||['join','login','applied','status','forgot','pwwait'].includes(mode))return;
  const {data,error}=await SB.rpc('rider_me');
  if(error){const m=String(error.message||'');if(/not_rider/.test(m)){mode='notrider';render();return}
    if(/jwt|token|session|401/i.test(m)){await SB.auth.signOut().catch(()=>{});mode='login';render();return}
    if(first){$('#view').innerHTML='<div class="card"><h2>เชื่อมต่อไม่ได้</h2><p class="muted">ตรวจอินเทอร์เน็ตแล้วลองใหม่</p><button class="btn" onclick="location.reload()">โหลดใหม่</button></div>'}return}
  const prevOffer=lastOffer;ME=data;mode='app';
  const off=(ME.jobs||[]).find(j=>j.status==='offer');lastOffer=off?off.id+':'+off.offerAt:'';
  if(off&&lastOffer!==prevOffer)ring();
  if(first){pushCheck();if(ME.ready)keepAwake(true)}
  {const act=(ME.jobs||[]).some(j=>j.status==='accepted'||j.status==='picked');geoSync(act);if(act)keepAwake(true)}
  render();
  clearTimeout(poll);poll=setTimeout(refresh,document.hidden?15000:4000);
}

/* ---------- สถานะการสมัคร ---------- */
async function checkStatus(){clearTimeout(stT);const {data,error}=await SB.rpc('rider_status',{p_phone:APPH});
  if(error){ST={status:'err',msg:/rider_status|function|PGRST20/i.test(error.message)?'ร้านยังไม่ได้เปิดระบบตรวจสถานะ':'เชื่อมต่อไม่ได้ ลองใหม่'};render();stT=setTimeout(checkStatus,30000);return}
  const was=ST&&ST.status;ST=data;
  if(data.status==='none'){try{localStorage.removeItem('nl_rider_apply')}catch(e){}mode='login';toast('ไม่พบใบสมัครของเบอร์นี้');return render()}
  if(data.status==='active'&&was&&was!=='active'){ring();try{if(Notification.permission==='granted'){const r=await navigator.serviceWorker?.getRegistration();r&&r.showNotification('✅ อนุมัติแล้ว · Raptor Rider',{body:'เข้าสู่ระบบด้วยชื่อผู้ใช้ '+(data.username||'')+' ได้เลย',icon:'images/icon-192.png'})}}catch(e){}}
  render();if(data.status==='pending')stT=setTimeout(checkStatus,document.hidden?60000:20000)}
function renderStatus(v){const st=ST||{status:'loading'};

   <div class="field"><label for="jPhone">เบอร์โทร</label><input id="jPhone" type="tel" inputmode="tel" maxlength="12" autocomplete="tel"></div>
   <div class="row2"><div class="field"><label for="jPlate">ทะเบียนรถ</label><input id="jPlate" maxlength="30" placeholder="เช่น 1กข 1234 กทม"></div><div class="field"><label for="jBrand">ยี่ห้อ/รุ่นรถ</label><input id="jBrand" maxlength="40" placeholder="เช่น Honda Wave"></div></div>
   <label style="display:flex;gap:8px;align-items:flex-start;font-size:14px" class="muted"><input type="checkbox" id="jOk" style="margin-top:4px"> ยินยอมให้ร้านเก็บข้อมูลและรูปนี้ เพื่อใช้ติดต่อและยืนยันตัวตนไรเดอร์เท่านั้น</label>
   <p class="err" id="jE" role="alert"></p><button class="btn pri wide" id="jB" type="submit">ส่งใบสมัคร</button>
   <button class="lnk" data-a="toLogin" type="button">มีบัญชีแล้ว เข้าสู่ระบบ</button></form>`;
  $('#jPh').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;try{photoData=await shrink(f,360,.72);$('#jPhBox').innerHTML=`<img src="${photoData}" alt="">`}catch(x){toast('อ่านรูปไม่ได้')}});
  $('#jF').addEventListener('submit',async e=>{e.preventDefault();const E=$('#jE');E.textContent='';
    const d={name:$('#jName').value.trim(),phone:$('#jPhone').value.replace(/\D/g,''),plate:$('#jPlate').value.trim(),brand:$('#jBrand').value.trim(),photo:photoData};
    if(d.name.length<2)return E.textContent='ใส่ชื่อ-นามสกุล';if(!/^0\d{8,9}$/.test(d.phone))return E.textContent='เบอร์โทรไม่ถูกต้อง';if(!d.plate)return E.textContent='ใส่ทะเบียนรถ';
    if(!d.photo)return E.textContent='ใส่รูปตัวเองด้วย';if(!$('#jOk').checked)return E.textContent='กดยินยอมการเก็บข้อมูลก่อน';
    const b=$('#jB');b.disabled=true;b.textContent='กำลังส่ง…';const {error}=await SB.rpc('rider_apply',{p:d});b.disabled=false;b.textContent='ส่งใบสมัคร';
    if(error){const m=String(error.message||'');return E.textContent=/exists/.test(m)?'เบอร์นี้เป็นไรเดอร์ของร้านอยู่แล้ว เข้าสู่ระบบได้เลย':/busy/.test(m)?'มีคนสมัครพร้อมกันเยอะ ลองใหม่อีกสักครู่':/bad_photo/.test(m)?'รูปใหญ่เกินไป ลองรูปอื่น':/rider_apply|function|PGRST20/i.test(m)?'ร้านยังไม่ได้เปิดรับสมัครไรเดอร์':'ส่งไม่สำเร็จ ลองอีกครั้ง'}
    APPH=d.phone;try{localStorage.setItem('nl_rider_apply',d.phone)}catch(e){}try{if('Notification' in window&&Notification.permission==='default'){PUSH.init();Notification.requestPermission()}}catch(e){}
    ST={status:'pending'};mode='status';render();stT=setTimeout(checkStatus,20000)})}
async function shrink(file,max,q){const bmp=await createImageBitmap(file).catch(()=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)}));
  const s=Math.min(1,max/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}

/* ---------- ปุ่ม ---------- */
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b||!b.dataset.a||busy)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==='toJoin'){mode='join';render();return}
  if(a==='toLogin'){clearTimeout(stT);clearTimeout(pwT);mode='login';render();return}
  if(a==='toLoginU'){clearTimeout(stT);try{localStorage.removeItem('nl_rider_apply');localStorage.setItem('nl_rider_user',b.dataset.u||'')}catch(e){}mode='login';render();setTimeout(()=>$('#lgP')?.focus(),50);return}
  if(a==='recheck'){checkStatus();return}
  if(a==='forgot'){mode='forgot';PW={u:($('#lgU')||{}).value||''};render();return}
  if(a==='askStatus'){const p=(prompt('ใส่เบอร์มือถือที่ใช้สมัคร')||'').replace(/\D/g,'');if(!/^0\d{8,9}$/.test(p))return p&&toast('เบอร์ไม่ถูกต้อง');APPH=p;try{localStorage.setItem('nl_rider_apply',p)}catch(e){}ST=null;mode='status';render();checkStatus();return}
  if(a==='logout'){await SB.auth.signOut().catch(()=>{});location.replace(location.pathname);return}
  if(a==='push'){pushEnable();return}
  if(a==='toggle'){acUnlock();const on=!ME.ready;
    if(!confirm(on?'เปิด Raptor Rider พร้อมรับงานส่งตอนนี้ใช่ไหม?':'ปิด Raptor Rider (พัก / เลิกงาน) ใช่ไหม?\nคิวของคุณจะถูกยกเลิก'))return;
    busy=true;const {error}=await SB.rpc('rider_ready',{p_on:on});busy=false;
    if(error)return toast(/has_job/.test(error.message)?'ส่งงานที่รับไว้ให้เสร็จก่อน':'ทำรายการไม่สำเร็จ');
    keepAwake(on);toast(on?'🟢 เปิด Raptor Rider แล้ว รอรับงานได้เลย':'ปิด Raptor Rider แล้ว');refresh();return}
  if(['accept','decline','picked','done'].includes(a)){
    if(a==='done'&&!confirm('ส่งอาหารถึงมือลูกค้าแล้วใช่ไหม?'))return;
    busy=true;b.disabled=true;const {error}=await SB.rpc('rider_job',{p_id:id,p_act:a});busy=false;b.disabled=false;
    if(error)toast(/gone/.test(error.message)?'งานนี้ถูกส่งให้คนอื่นแล้ว':'ทำรายการไม่สำเร็จ ลองอีกครั้ง');
    else toast(a==='accept'?'รับงานแล้ว ไปรับอาหารที่ร้านได้เลย':a==='decline'?'ข้ามงานนี้แล้ว (ไปต่อท้ายคิว)':a==='picked'?'ออกเดินทาง ขับขี่ปลอดภัยนะ':'🎉 ส่งสำเร็จ! กลับเข้าคิวแล้ว');
    if(a==='accept'||a==='decline'){const o=$('#offer');if(o)o.remove()}
    refresh();return}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.ready[data-a="toggle"]')){e.preventDefault();e.target.click()}});
$('#outBtn').addEventListener('click',async()=>{if(!confirm('ออกจากระบบ?'))return;try{await SB.rpc('rider_ready',{p_on:false})}catch(e){}await SB.auth.signOut().catch(()=>{});location.replace(location.pathname)});
// ข้ามวัน: ออกจากระบบอัตโนมัติ (ถ้ากำลังส่งงานอยู่ รอส่งเสร็จก่อน)
setInterval(()=>{if(mode!=='app'||!ME)return;let d='';try{d=localStorage.getItem('nl_rider_day')||''}catch(e){}if(!d||d===bkDay())return;
  if((ME.jobs||[]).some(j=>j.status==='accepted'||j.status==='picked'))return;dayOut()},60000);
start();
</script>

<style>

:root{--bg:#0b0907;--page:#15110d;--page2:#1d1712;--gold:#d9a441;--gold2:#f2c46d;--goldd:#8a6420;--fg:#f6efe4;--muted:#b7a68f;--line:rgba(217,164,65,.28);--red:#e5383b;

.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;perspective:1600px;min-height:0;padding:12px 0}
.book{width:min(100vw,520px);height:100%;max-height:900px;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;transform-style:preserve-3d}

.inner{position:relative;z-index:1;flex:1;overflow-y:auto;padding:24px 22px 46px;scrollbar-width:none}

/* ปก */
.cover .inner{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.cover img.lg{width:min(62%,250px);aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 8px 30px rgba(217,164,65,.25))}
.cover h1{font-size:44px;font-weight:800;background:linear-gradient(180deg,#fff3d6,var(--gold2) 45%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.02em}
.cover .en{font-family:var(--f-d);letter-spacing:.35em;color:var(--gold);font-size:13px}

/* สารบัญ */

.items{display:flex;flex-direction:column;gap:14px}

.it.off .ph img{filter:grayscale(1);opacity:.4}.it.off .tx{opacity:.55}
.it .ph{position:relative}
.stamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);width:74px;height:74px;border:3px solid #e5383b;border-radius:50%;color:#ff4d4f;font-weight:800;font-size:14px;line-height:1;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;background:rgba(25,6,6,.82);box-shadow:inset 0 0 0 3px rgba(229,56,59,.35),0 0 0 2px rgba(229,56,59,.25);pointer-events:none;z-index:2}

.stamp i{display:block;font-style:normal;font-weight:800;font-size:.62em;letter-spacing:.6px;text-transform:uppercase;line-height:1}
.stamp b,.stamp i{color:#5ec59c!important;opacity:1!important}
.leftq{display:inline-block;align-self:flex-start;width:max-content;font-size:12px;font-weight:700;color:#ffd58a;background:rgba(255,190,80,.14);border-radius:999px;padding:1px 8px;margin-top:4px}
.leftq.low{color:#fff;background:#c2410c}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-top:2px;align-self:flex-start}
.badge.rec{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#1d1307}.badge.out{background:rgba(229,56,59,.18);color:#ff8a8c;border:1px solid rgba(229,56,59,.5)}
.it+.it{padding-top:14px;border-top:1px solid rgba(217,164,65,.12)}
/* ปกหลัง */
.back .inner{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.back h2{font-size:26px;color:var(--gold2)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:300px;min-height:52px;border-radius:14px;text-decoration:none;font-family:var(--f-d);font-weight:600;font-size:17px;border:1px solid var(--gold);color:var(--gold2);background:rgba(217,164,65,.06)}
.cta.pri{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1d1307;border:0}
.back .info{color:var(--muted);font-size:14px;line-height:1.6}
/* แถบล่าง */
.nav{display:flex;align-items:center;justify-content:center;gap:14px;padding:6px 14px calc(12px + env(safe-area-inset-bottom,0px))}

.nav .cnt{font-family:var(--f-d);color:var(--muted);min-width:70px;text-align:center;letter-spacing:.1em}
.nav .cnt b{color:var(--gold2)}

.imgview img{max-width:100%;max-height:78%;object-fit:contain;border-radius:12px}.imgview b{font-family:var(--f-d);font-size:20px}.imgview span{color:var(--gold2);font-family:var(--f-d);font-size:20px}
.msg{padding:40px 24px;text-align:center;color:var(--muted)}

/* ===== ลูกเล่นเล่มเมนู ===== */
.prog{height:2px;background:rgba(217,164,65,.12)}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--goldd),var(--gold2));box-shadow:0 0 8px var(--gold);transition:width .35s ease}
.tz{position:absolute;top:12%;bottom:12%;width:14%;z-index:3;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}.tz.l{left:0}.tz.r{right:0}
.sheet{--sh:0}
.sheet .flipsh{display:none}

.pg .sheet::after{background:radial-gradient(80% 50% at 50% 0%,rgba(242,196,109,.07),transparent 70%),linear-gradient(90deg,rgba(0,0,0,calc(var(--sh)*.55)),transparent 40%)}
.corners span{position:absolute;width:46px;height:46px;color:var(--gold);opacity:.75;z-index:0;pointer-events:none}
.corners .cn{width:100%;height:100%;display:block}
.c-tl{top:14px;left:14px}.c-tr{top:14px;right:14px;transform:scaleX(-1)}.c-bl{bottom:14px;left:14px;transform:scaleY(-1)}.c-br{bottom:14px;right:14px;transform:scale(-1,-1)}
/* ปก */
.cover{background:radial-gradient(70% 45% at 50% 32%,rgba(217,164,65,.18),transparent 70%),linear-gradient(90deg,#0d0a08 0%,var(--page) 4%,var(--page2) 50%,var(--page) 100%)}
.lgw{position:relative;width:min(78%,300px);aspect-ratio:478/362;margin-bottom:4px}
.lgw.sm{width:150px}

  background:linear-gradient(105deg,transparent 35%,rgba(255,250,230,.95) 48%,transparent 60%) no-repeat;background-size:250% 100%;animation:shine 3.6s ease-in-out infinite;mix-blend-mode:screen}
@keyframes shine{0%{background-position:150% 0}55%,100%{background-position:-60% 0}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 12px rgba(242,196,109,.25))}50%{filter:drop-shadow(0 0 26px rgba(242,196,109,.55))}}
.cover .lg{aspect-ratio:auto}
.gt{background:linear-gradient(100deg,#b8862e 0%,#fff3d6 20%,var(--gold2) 35%,#b8862e 50%,#fff3d6 70%,var(--gold2) 85%,#b8862e 100%)!important;background-size:200% 100%!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent;animation:tshine 6s linear infinite}
@keyframes tshine{to{background-position:-200% 0}}
.cover .menu{display:flex;gap:.55em;padding:8px 0 8px .2em;letter-spacing:0}
.cover .menu span{display:inline-block;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.cover .menu span:nth-child(2){animation-delay:.08s}.cover .menu span:nth-child(3){animation-delay:.16s}.cover .menu span:nth-child(4){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
button.hint{border:1px solid var(--line);background:rgba(217,164,65,.08);border-radius:999px;padding:8px 16px;cursor:pointer;font:inherit;font-size:13px;color:var(--gold2)}
.embers{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.embers i{position:absolute;bottom:-10px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle,#ffe2a3,rgba(242,160,60,.0) 70%);box-shadow:0 0 8px 2px rgba(242,180,80,.55);opacity:0;animation:ember var(--t) linear var(--d) infinite}
@keyframes ember{0%{opacity:0;transform:translate(0,0)}10%{opacity:.9}70%{opacity:.6}100%{opacity:0;transform:translate(24px,-95vh)}}
/* หน้าในเล่ม: รายการค่อยๆ ลอยขึ้นเมื่อเปิดถึงหน้า */
.pg .it,.pg .toc li{opacity:0;transform:translateY(12px)}
.pg.on .it,.pg.on .toc li{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0)*70ms + 120ms)}
.cat h2,.toc h2{position:relative}
.orn{margin-bottom:18px}
.pg.on .orn::before,.pg.on .orn::after{animation:line .8s ease both .1s}
@keyframes line{from{width:0}to{width:60px}}
.toc li button{border-radius:10px;padding:12px 8px}
.toc li button:hover,.toc li button:active{background:rgba(217,164,65,.08)}
.toc .tn{font-style:normal;font-family:var(--f-d);font-size:13px;color:var(--goldd);min-width:22px}
.it .ph{box-shadow:0 6px 18px rgba(0,0,0,.45);transition:transform .25s}
.it .ph:active{transform:scale(.97)}
.it .ph img{transition:transform .5s}.it:hover .ph img{transform:scale(1.06)}
.rib{position:absolute;top:8px;left:-24px;transform:rotate(-40deg);background:linear-gradient(90deg,var(--gold),var(--gold2));color:#1d1307;font-size:10.5px;font-weight:800;padding:2px 26px;box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:2;font-family:var(--f-d)}
.it .nm em{display:inline-flex;align-items:baseline;gap:1px;background:rgba(217,164,65,.1);border:1px solid var(--line);border-radius:999px;padding:1px 10px}

@media (prefers-reduced-motion:reduce){.lgw .lg,.lgw .shine,.gt,.embers i,.cover .menu span{animation:none!important}.pg .it,.pg .toc li{opacity:1;transform:none;animation:none!important}}

/* ===== ธีมโต๊ะไม้ + กลิ่นอายจีน ===== */
:root{--f-cn:"Chonburi","Kanit",serif;--cnred:#b3261e}
.sheet{background:linear-gradient(180deg,rgba(12,8,5,.30),rgba(8,5,3,.55)),url(images/eb-wood.jpg?v=20261018b) center/cover,#1a120c!important}

.cover h1,.toc h2,.cat h2,.back h2{font-family:var(--f-cn)!important;font-weight:400!important;letter-spacing:.01em}

</head>
<body>
<header class="top"><img id="logo" src="images/logo-nl-t.png?v=20261016b" alt=""><div><b id="shop">ร้านเนื้อล้วนๆ</b><small>MENU · E-BOOK</small></div><span class="sp"></span><button class="tbtn" data-a="toc" type="button">☰ สารบัญ</button></header>
<div class="prog"><i id="prog"></i></div><main class="stage"><button class="tz l" data-a="prev" type="button" aria-label="หน้าก่อน" tabindex="-1"></button><button class="tz r" data-a="next" type="button" aria-label="หน้าถัดไป" tabindex="-1"></button><div class="book" id="book" aria-live="polite"><div class="pg"><div class="sheet"><div class="inner msg">กำลังเปิดเล่มเมนู…</div></div></div></div></main>
<nav class="nav"><button data-a="prev" type="button" aria-label="หน้าก่อน">‹</button><span class="cnt" id="cnt"></span><button data-a="next" type="button" aria-label="หน้าถัดไป">›</button></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script>window.APP_CONFIG||document.write('<script src="config.js"><\/script>')</script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const baht=n=>(Math.round((+n||0)*100)/100).toLocaleString('th-TH',{maximumFractionDigits:2});
const PER=4; // รายการต่อหน้า (จัดแบบจานวางบนโต๊ะ)
let D=null,PAGES=[];
const BOOK_NAME='ร้านเนื้อล้วนๆ',BOOK_EN='NUEA LWOAN';
const LOGO='images/logo-nl-t.png?v=20261016b';
const CORNERS='<div class="corners">'+['tl','tr','bl','br'].map(k=>`<span class="c-${k}"><svg class="cn" viewBox="0 0 60 60" aria-hidden="true"><path d="M2 58V20Q2 2 20 2h38" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 58V24Q8 8 24 8h34" fill="none" stroke="currentColor" stroke-width=".7" opacity=".6"/><circle cx="14" cy="14" r="2.2" fill="currentColor"/><path d="M20 14q8-10 16 0q-8 6-16 0z" fill="currentColor" opacity=".55"/><path d="M14 20q-10 8 0 16q6-8 0-16z" fill="currentColor" opacity=".55"/></svg></span>`).join('')+'</div>';
const base=f=>new URL(f,location.href).href.split('?')[0];

// จานอาหารวางบนโต๊ะ: สลับซ้าย-ขวา ขนาดต่างกันเล็กน้อย แบบเมนูนิตยสาร
const SZ=[48,42,46,41];
const cbEnd=e=>{try{const d=new Date(e+':00+07:00');return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit',timeZone:'Asia/Bangkok'})}catch(x){return e}};
function dish(m,k){const r=k%2===1,sz=SZ[k%SZ.length];
  return `<div class="dish${r?' r':''}${m.soldOut?' off':''}" style="--k:${k};--sz:${sz}%">
    <div class="plate" data-a="zoom" data-id="${esc(m.id)}"><div class="rim"><img src="${esc(m.img||'images/menu-ph.jpg?v=20261016b')}" alt="" loading="lazy"${m.img?'':' class="noimg"'}></div>${m.soldOut?'<span class="stamp"><b>หมดแล้ว</b><i>Sold Out</i></span>':''}</div>
    <div class="lbl">${m.combo?'<span class="ptag">🎁 COMBO</span>':''}<b>${esc(m.name)}</b>${m.rec?'<span class="rtag">★ แนะนำ</span>':''}${m.combo&&+m.combo.regular>(+m.price||0)?`<s class="reg">${baht(m.combo.regular)}.-</s>`:''}<em>${baht(m.price)}.-</em>${m.combo&&+m.combo.regular>(+m.price||0)?`<span class="save">ประหยัด ${baht(m.combo.regular-(+m.price||0))}.-</span>`:''}${m.desc?`<p>${esc(m.desc)}</p>`:''}${m.combo&&m.combo.end?`<p class="until">⏰ ถึง ${esc(cbEnd(m.combo.end))}</p>`:''}${m.opts?`<p class="op">${esc(m.opts)}</p>`:''}${!m.soldOut&&m.left!=null?`<span class="leftq${m.left<=3?' low':''}">เหลือ ${m.left}</span>`:''}</div></div>`}
function build(d){D=d;PAGES=[];const all=d.menu||[],combos=all.filter(m=>m.combo&&!m.soldOut),menu=all.filter(m=>!m.combo);
  $('#shop').textContent=BOOK_NAME;document.title='เมนู · '+BOOK_NAME;
  const order=[...(d.cats||[]).filter(c=>menu.some(m=>m.cat===c)),...new Set(menu.map(m=>m.cat||'').filter(c=>!(d.cats||[]).includes(c)))];
  const catPages=[];order.forEach(c=>{const L=menu.filter(m=>(m.cat||'')===c).sort((a,b)=>(b.rec?1:0)-(a.rec?1:0));for(let i=0;i<L.length;i+=PER)catPages.push({c:c||'เมนูอื่นๆ',items:L.slice(i,i+PER),cont:i>0})});
  PAGES.push({k:'cover'});for(let i=0;i<combos.length;i+=3)PAGES.push({k:'cat',c:'โปรโมชั่น',en:'COMBO SET',items:combos.slice(i,i+3),promo:true,cont:i>0});PAGES.push({k:'toc'});{const R=menu.filter(m=>m.rec&&!m.soldOut).slice(0,4);if(R.length)PAGES.push({k:'cat',c:'เมนูแนะนำ',en:'RECOMMENDED',items:R,rec:true})}catPages.forEach(p=>PAGES.push({k:'cat',...p}));PAGES.push({k:'back'});
  const firstOf={};PAGES.forEach((p,i)=>{if(p.k==='cat'&&!p.rec&&!(p.c in firstOf))firstOf[p.c]=i});
  const upd=new Date().toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Bangkok'});
  const html=PAGES.map((p,i)=>{let h='';
    if(p.k==='cover')h=`<div class="sheet cover">${CORNERS}<div class="seal" aria-hidden="true"><span>เนื้อ</span><span>ล้วน</span></div><div class="embers">${Array.from({length:16},(_,k)=>`<i style="--x:${(k*37+11)%100}%;--d:${(k*0.73)%6}s;--t:${5+(k*1.3)%5}s;--s:${2+(k%3)}px"></i>`).join('')}</div><div class="inner"><div class="lgw"><img class="lg" src="${LOGO}" alt=""><span class="shine"></span></div><h1 class="gt">${esc(BOOK_NAME)}</h1><div class="en">${esc(BOOK_EN)}</div><div class="menu"><span>M</span><span>E</span><span>N</span><span>U</span></div>${d.tag?`<div class="tag">${esc(d.tag)}</div>`:''}<button class="hint" data-a="next" type="button">แตะหรือปัดเพื่อเปิดเล่ม <span>›</span></button><small style="color:var(--goldd)">อัปเดต ${esc(upd)}</small></div></div>`;
    else if(p.k==='toc')h=`<div class="sheet toc">${CORNERS}<div class="inner"><h2>สารบัญ</h2><div class="orn">✦</div><ol>${Object.entries(firstOf).map(([c,ix])=>`<li style="--k:${Object.keys(firstOf).indexOf(c)}"><button data-a="go" data-i="${ix}" type="button"><i class="tn">${String(Object.keys(firstOf).indexOf(c)+1).padStart(2,'0')}</i>${esc(c)}<span>${ix+1}</span></button></li>`).join('')}</ol></div><div class="pno">${i+1}</div></div>`;
    else if(p.k==='cat')h=`<div class="sheet cat${p.rec?' recp':''}${p.promo?' promo':''}">${CORNERS}<div class="inner"><h2>${esc(p.c)}${p.cont?' <small style="font-size:14px;color:var(--muted)">(ต่อ)</small>':''}</h2>${p.en?`<div class="en2">${esc(p.en)}</div>`:''}<div class="orn">✦</div><div class="spread">${p.items.map((m,k)=>dish(m,k)).join('')}</div></div><div class="pno">${i+1}</div></div>`;
    else h=`<div class="sheet back">${CORNERS}<div class="inner"><div class="lgw sm"><img class="lg" src="${LOGO}" alt=""><span class="shine"></span></div><h2>ขอบคุณที่แวะมาครับ</h2><div class="orn">✦</div>
      ${d.deliveryOn?`<a class="cta pri" href="${esc(base('delivery.html'))}">🛵 สั่งเดลิเวอรี่${d.open?'':' <small style="font-weight:400">(ตอนนี้ปิด)</small>'}</a>`:''}
      <a class="cta" href="${esc(base('card.html'))}">⭐ บัตรสะสมแต้ม / คูปอง</a>
      ${d.phone?`<a class="cta" href="tel:${esc(d.phone)}">📞 ${esc(d.phone)}</a>`:''}${d.map?`<a class="cta" href="${esc(d.map)}" target="_blank" rel="noopener">📍 แผนที่ร้าน</a>`:''}
      <div class="info">${d.address?esc(d.address)+'<br>':''}ราคาและเมนูอาจเปลี่ยนแปลง · อัปเดตอัตโนมัติจากระบบร้าน</div></div><div class="pno">${i+1}</div></div>`;
    return `<section class="pg" data-i="${i}">${h}</section>`}).join('');
  const b=$('#book'),keep=b.scrollLeft;b.innerHTML=html;b.scrollLeft=keep;flip();}
// เอฟเฟกต์พลิกหน้า: หน้าที่กำลังเลื่อนออกจะหมุนตามแกนสันเล่ม
let cur=0;
function flip(){const b=$('#book'),w=b.clientWidth||1;const x=b.scrollLeft/w;cur=Math.round(x);
  b.querySelectorAll('.pg').forEach((p,i)=>{const s=p.firstElementChild;if(!s)return;const o=i-x;const r=Math.max(-1,Math.min(1,o));
    s.style.transform=Math.abs(o)<.001?'':`rotateY(${-r*28}deg) scale(${1-Math.abs(r)*.06})`;s.style.transformOrigin=o<0?'right center':'left center';s.style.opacity=String(1-Math.min(.5,Math.abs(r)*.5));s.style.setProperty('--sh',String(Math.min(1,Math.abs(r)*1.4)))});
  b.querySelectorAll('.pg').forEach((p,i)=>p.classList.toggle('on',i===cur));
  {const pr=$('#prog');if(pr)pr.style.width=(PAGES.length>1?cur/(PAGES.length-1)*100:0)+'%'}
  $('#cnt').innerHTML=PAGES.length?`<b>${cur+1}</b> / ${PAGES.length}`:'';
  document.querySelector('[data-a=prev]').disabled=cur<=0;document.querySelector('[data-a=next]').disabled=cur>=PAGES.length-1;
  try{sessionStorage.setItem('nl_book_pg',String(cur))}catch(e){}}
$('#book').addEventListener('scroll',()=>requestAnimationFrame(flip),{passive:true});
window.addEventListener('resize',()=>{go(cur,true)});
function go(i,instant){const b=$('#book');i=Math.max(0,Math.min(PAGES.length-1,i));b.scrollTo({left:i*b.clientWidth,behavior:instant?'auto':'smooth'})}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
  if(a==='next')go(cur+1);else if(a==='prev')go(cur-1);else if(a==='toc')go(1);else if(a==='go')go(+t.dataset.i);
  else if(a==='zoom'){const m=(D.menu||[]).find(x=>x.id===t.dataset.id);if(!m||!m.img)return;const el=document.createElement('div');el.className='imgview';el.innerHTML=`<img src="${esc(m.img)}" alt=""><b>${esc(m.name)}</b><span>฿${baht(m.price)}</span>${m.desc?`<p style="color:var(--muted);margin:0;text-align:center;max-width:420px">${esc(m.desc)}</p>`:''}`;el.addEventListener('click',()=>el.remove());document.body.appendChild(el)}});
async function load(){const c=window.APP_CONFIG||{};let cached=null;try{cached=JSON.parse(localStorage.getItem('nl_book')||'null')}catch(e){}
  if(cached){build(cached);let p=0;try{p=+sessionStorage.getItem('nl_book_pg')||0}catch(e){}setTimeout(()=>go(p,true),30)}
  if(!window.supabase||!c.SUPABASE_URL){if(!cached)$('#book').innerHTML='<div class="pg"><div class="sheet"><div class="inner msg">ระบบยังไม่พร้อม ลองใหม่อีกครั้ง</div></div></div>';return}
  const sb=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_KEY,{auth:{persistSession:false}});
  const {data,error}=await sb.rpc('menu_book');
  if(error){if(!cached)$('#book').innerHTML=`<div class="pg"><div class="sheet"><div class="inner msg">${/function|PGRST20/i.test(error.message)?'ร้านกำลังจัดเตรียมเมนู E-book':'เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ต'}</div></div></div>`;return}
  try{localStorage.setItem('nl_book',JSON.stringify(data))}catch(e){}
  if(JSON.stringify(data)!==JSON.stringify(cached))build(data)}
load();
</script>
</body>
</html>

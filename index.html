<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="app-version" content="2026.10.09-1730">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111614">
<meta name="color-scheme" content="dark">
<script>document.documentElement.setAttribute("data-theme","dark")</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>NueaLwoan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="images/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NueaLwoan">
<meta name="application-name" content="NueaLwoan">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@400;500&family=Kanit:wght@600;700;800&display=swap">
<style>
/* Layout: sticky shop header, single working column (max 1080px), bottom tab bar on every width; work happens in a slide-up sheet. */
:root{
  --bg:#f3f5f0; --surface:#ffffff; --sunk:#e9ece5; --line:#d9ded4; --veil-rgb:243,245,240; --veil-a:.5;
  --fg:#1c2420; --muted:#5f6b64;
  --jade:#17694f; --jade-soft:#dcefe5; --on-jade:#ffffff;
  --chili:#b23d27; --chili-soft:#f7e2db;
  --amber:#946207; --amber-soft:#f5e8cc;
  --shadow:0 10px 30px rgba(20,40,30,.14);
  --f-display:"Mitr","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#1a201d; --sunk:#151a18; --line:#2b3430; --veil-rgb:17,22,20;
  --fg:#e8eee9; --muted:#9aa69f;
  --jade:#5ec59c; --jade-soft:#1c3a2e; --on-jade:#0b1912;
  --chili:#f08c74; --chili-soft:#3d231c;
  --amber:#e4b75c; --amber-soft:#382d16;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1a201d; --sunk:#151a18; --line:#2b3430; --veil-rgb:17,22,20;
  --fg:#e8eee9; --muted:#9aa69f;
  --jade:#5ec59c; --jade-soft:#1c3a2e; --on-jade:#0b1912;
  --chili:#f08c74; --chili-soft:#3d231c;
  --amber:#e4b75c; --amber-soft:#382d16;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea.qrs{display:grid!important;grid-template-columns:repeat(3,1fr);gap:10mm;padding:8mm}
  #printArea.qrs.one{grid-template-columns:90mm;justify-content:center}
  #printArea.rcpt{display:block!important}
  #printArea .rc{width:100%;box-shadow:none;border:0;padding:0;margin:0}
  body{background:#fff;color:#000}
}
.pq{border:1px dashed #999;border-radius:8px;padding:8px;text-align:center;break-inside:avoid;color:#000;background:#fff}
.pq svg{width:100%;max-width:200px;height:auto}
.pq b{display:block;font-family:var(--f-display);font-size:22px;font-weight:500}
.pq small{display:block;font-size:12px}
.qrbig{max-width:340px;margin:0 auto;width:100%}.qrbig .pq{border:0;border-radius:16px;padding:16px}.qrbig .pq svg{max-width:280px}.qrbig .pq b{font-size:30px}
.login{max-width:380px;margin:40px auto;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.login h2{font-size:22px}
.sm-sel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;min-height:34px;font-size:13.5px}
.lg-brand{display:flex;gap:12px;align-items:center;margin-bottom:4px}
.lg-mark{width:48px;height:48px;border-radius:12px;background:var(--jade);display:flex;align-items:center;justify-content:center;flex:none}
.lg-mark svg{width:28px;height:28px;stroke:var(--on-jade);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pw{position:relative}
.pw input{padding-right:64px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--jade);font-weight:500;cursor:pointer;padding:6px}
.err{color:var(--chili);font-size:13.5px;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.num,.money{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;line-height:1.25}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand h1{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);font-size:12.5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:6px;vertical-align:1px}
.dot.on{background:var(--jade)}.dot.off{background:var(--chili)}

.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:16px 110px;display:flex;flex-direction:column;gap:18px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;cursor:pointer;position:relative}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="true"]{color:var(--jade);font-weight:600}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--chili);color:#fff;font-size:11px;line-height:18px;font-weight:600}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.btn.pri:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--chili);border-color:var(--chili-soft)}
.btn.danger[data-armed]{background:var(--chili);color:#fff;border-color:var(--chili)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13.5px;border-radius:8px}
.btn.wide{flex:1}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:19px}
.sec-h .hint{color:var(--muted);font-size:13px}
.muted{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--jade-soft);color:var(--jade)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.bad{background:var(--chili-soft);color:var(--chili)}
.pill.mute{background:var(--sunk);color:var(--muted)}

/* stat strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{color:var(--muted);font-size:12.5px}
@media (max-width:560px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* tables */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{border:1px dashed var(--line);background:transparent;border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:118px}
.tcard .no{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--muted)}
.tcard .no small{font-size:13px;font-family:var(--f-body);margin-left:4px}
.tcard.busy{border:1.5px solid var(--jade);background:var(--surface);box-shadow:0 1px 0 var(--line)}
.tcard.busy .no{color:var(--fg)}
.tcard .meta{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;margin-top:auto}
.tcard .tot{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.tcard.add{border-style:dashed;align-items:center;justify-content:center;color:var(--jade);font-weight:600}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted)}
.row .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.click{cursor:pointer}
.row.click:hover{background:var(--sunk)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-weight:500;font-size:17px;margin-bottom:4px}

.subtabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:11px}
.subtabs button{flex:1;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
.subtabs button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:5px;max-width:220px}
.meter i{display:block;height:100%;background:var(--jade)}
.meter.low i{background:var(--chili)}

/* kitchen */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;align-items:start}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kcard header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--sunk);gap:8px}
.kcard header h3{font-size:17px}
.kline{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-top:1px solid var(--line)}
.kline .q{font-family:var(--f-display);font-size:18px;min-width:30px}
.kline .grow{flex:1;min-width:0}
.note{font-size:13px;color:var(--amber)}

/* report */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi b{display:block;font-family:var(--f-display);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.kpi.hero{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.kpi.hero span{color:var(--on-jade);opacity:.85}
.kpi.neg b{color:var(--chili)}
.kpi.hero.neg{background:var(--chili);border-color:var(--chili)}
.kpi.hero.neg b{color:#fff}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:16px}
.kv{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.kv.tot{border-top:1px solid var(--line);padding-top:8px;font-weight:600}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:62px 1fr 78px;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.bar .track{height:14px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--jade);border-radius:0 3px 3px 0}
.bar .v{text-align:right}
.bar .d{color:var(--muted)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,20,15,.42);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:94%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden}
@media (min-width:760px){.sheet{align-items:stretch;justify-content:flex-end}.panel{max-height:none;height:100%;border-radius:0;max-width:560px}}
.sh-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.sh-head .grow{flex:1;min-width:0}
.sh-head h2{font-size:20px}
.sh-head small{color:var(--muted);font-size:13px}
.sh-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.sh-body>*,.cust-body>*{flex-shrink:0}
.sh-foot{border-top:1px solid var(--line);background:var(--surface);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.x{border:0;background:var(--sunk);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px;min-height:44px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--jade);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--jade)}
.help{font-size:12.5px;color:var(--muted)}

/* order lines */
.lines{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.line{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.line:first-child{border-top:0}
.line-top{display:flex;gap:10px;align-items:center}
.line-top .grow{flex:1;min-width:0}
.line-top .nm{font-weight:500}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stepper button{border:0;background:none;width:34px;height:34px;cursor:pointer;font-size:18px}
.stepper span{min-width:24px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.line-act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lnk{border:0;background:none;color:var(--jade);cursor:pointer;padding:2px 0;font-size:13px;font-weight:500}
.editor{background:var(--sunk);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:8px}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pitem{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:68px}
.pitem:active{transform:scale(.98)}
.pitem b{font-weight:500;font-size:14px;line-height:1.35}
.pitem span{color:var(--jade);font-variant-numeric:tabular-nums;font-weight:600;margin-top:auto}
.pitem.flash{border-color:var(--jade);background:var(--jade-soft)}

.total-line{display:flex;flex-direction:column;flex:1;min-width:120px}
.total-line small{color:var(--muted);font-size:12.5px}
.total-line b{font-family:var(--f-display);font-weight:500;font-size:24px;font-variant-numeric:tabular-nums}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--jade);background:var(--jade-soft);color:var(--jade)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.bigsum{text-align:center;padding:6px 0}
.bigsum small{color:var(--muted)}
.bigsum b{display:block;font-family:var(--f-display);font-weight:500;font-size:40px;font-variant-numeric:tabular-nums;line-height:1.15}
.change{display:flex;justify-content:space-between;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.change b{font-family:var(--f-display);font-weight:500;font-size:26px;font-variant-numeric:tabular-nums}
.qrbox{background:#fff;color:#123;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line)}
.qrbox svg{width:min(240px,70vw);height:auto;display:block}
.qrbox .pp{font-weight:700;letter-spacing:.06em;color:#103e6e;font-size:13px}
.qrbox .amt{font-family:var(--f-display);font-size:22px}

/* customer mode */
.cust{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.cust-head{background:var(--jade);color:var(--on-jade);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;display:flex;align-items:center;gap:12px}
.cust-head .grow{flex:1;min-width:0}
.cust-head h2{font-size:22px}
.cust-head small{opacity:.85}
.cust-head .btn{background:transparent;color:var(--on-jade);border-color:currentColor;min-height:36px}
.cust-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;max-width:900px;width:100%;margin:0 auto}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.citem{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:104px;position:relative}
.citem b{font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1.3}
.citem span{margin-top:auto;font-weight:600;color:var(--jade);font-variant-numeric:tabular-nums}
.citem em{position:absolute;top:8px;right:8px;font-style:normal;background:var(--jade);color:var(--on-jade);border-radius:999px;min-width:24px;height:24px;line-height:24px;text-align:center;font-weight:600;font-size:13px}
.cust-foot{background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 10px}
.done h2{font-size:26px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:80;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.bad{background:var(--chili);color:#fff}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
.thumb{width:52px;height:52px;border-radius:9px;overflow:hidden;flex:none;background:var(--sunk)}
.thumb img,.cimg img,.photo-box img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.none,.cimg.none{display:flex;align-items:center;justify-content:center;font-family:var(--f-display);color:var(--muted);font-size:20px}
.pimg{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:7px;margin-bottom:4px;background:var(--sunk)}
.citem{padding:0;overflow:hidden}
.citem>b,.citem>span{padding:0 14px}

<script>
"use strict";
/* ---------- บัตรสมาชิก (ใช้ได้ทั้งร้านเนื้อล้วนๆ และข้าวมันไก่) ---------- */
function showMemberCard(m){const o=document.getElementById('mCardOv');if(o)o.remove();if(!m)return;
  const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pts=(+m.points||0).toLocaleString('th-TH');
  const el=document.createElement('div');el.id='mCardOv';el.className='mcard-ov';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','บัตรสมาชิก');
  const bg=[...String(m.phone||m.name||'')].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7)%2?'po':'nl';
  el.innerHTML=`<div class="mcard mc-${bg}" style="--mcbg:url(images/card-${bg}.png)"><div class="mc-top"><div class="mc-logos"><img src="images/logo-nl.png" alt=""><img src="images/logo-po.png" alt=""></div><span>MEMBER CARD</span></div>
    <div class="mc-mid"><b>${m.name?'คุณ'+e(m.name):'สมาชิก'}</b><span>${e(m.phone||'')}</span></div>
    <div class="mc-bot"><div><small>แต้มสะสม</small><strong>${pts}</strong></div><em>ใช้ได้ทั้ง 2 ร้าน<br>เนื้อล้วนๆ · ข้าวมันไก่</em></div><i class="mc-shine"></i></div>
    ${m.note?`<p class="mc-note">${e(m.note)}</p>`:''}
    ${m.action?`<button type="button" class="mc-act" data-mc="act">${e(m.action)}</button>`:''}
    <button type="button" class="mc-x" data-mc="x">ปิด</button>`;
  const close=()=>{el.remove();window.removeEventListener('keydown',k,true)};const k=ev=>{if(ev.key==='Escape'){ev.stopPropagation();close()}};window.addEventListener('keydown',k,true);
  el.addEventListener('click',ev=>{const b=ev.target.closest('[data-mc]');if(ev.target===el||(b&&b.dataset.mc==='x'))return close();if(b&&b.dataset.mc==='act'){close();m.onAction&&m.onAction()}});
  document.body.appendChild(el);}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const num=n=>r2(n).toLocaleString('th-TH',{maximumFractionDigits:2});
const baht=n=>(n<0?'−':'')+'฿'+num(Math.abs(n));
const DAY=864e5;
const sod=(t=Date.now())=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);

/* ---------- ตัวเลือกเมนู (แบบ LINE MAN) ใช้ร่วมกันทั้งหน้าพนักงานและหน้าลูกค้า ---------- */
const optGroups=m=>Array.isArray(m&&m.options)?m.options.filter(g=>g&&g.name&&(g.choices||[]).length):[];
const hasOpts=m=>optGroups(m).length>0;
const optKey=opts=>(opts||[]).map(o=>o.cid||o.n).join(',');
const optNames=opts=>(opts||[]).map(o=>o.n).join(', ');
const optRule=g=>g.req?(+g.max===1?'ต้องเลือก 1':'ต้องเลือก'+(+g.max>1?' สูงสุด '+g.max:'อย่างน้อย 1')):(+g.max===1?'เลือกได้ 1':'เลือกได้'+(+g.max>1?' สูงสุด '+g.max:'หลายอย่าง'));
const minPrice=m=>(+m.price||0)+optGroups(m).filter(g=>g.req).reduce((s,g)=>s+Math.min(...g.choices.map(c=>+c.price||0)),0);

/* ---------- ดูรูปเต็มจอ ---------- */
function viewImg(src,cap){if(!src)return;const o=document.getElementById('imgView');if(o)o.remove();const el=document.createElement('div');el.id='imgView';el.className='imgview';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');
  el.innerHTML=`<img src="${esc(src)}" alt="${esc(cap||'')}">${cap?`<div class="iv-cap">${esc(cap)}</div>`:''}<button type="button" class="iv-x" aria-label="ปิด">×</button>`;
  const close=()=>{el.remove();window.removeEventListener('keydown',k,true)};const k=e=>{if(e.key==='Escape'){e.stopPropagation();close()}};window.addEventListener('keydown',k,true);
  el.addEventListener('click',e=>{e.stopPropagation();close()});document.body.appendChild(el)}
function optPick(m,cfg){cfg=cfg||{};const G=optGroups(m);const pick={};G.forEach(g=>pick[g.id]=[]);let qty=1,note='',warn=false;
  const mul=cfg.mul||(x=>x);
  const old=document.getElementById('optPop');if(old)old.remove();
  const el=document.createElement('div');el.id='optPop';el.className='opop';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');document.body.appendChild(el);
  const sel=()=>{const opts=[];G.forEach(g=>g.choices.forEach(c=>{if(pick[g.id].includes(c.id))opts.push({gid:g.id,cid:c.id,g:g.name,n:c.name,p:+c.price||0})}));return opts};
  const unit=()=>mul((+m.price||0)+sel().reduce((s,o)=>s+o.p,0));
  const missing=()=>G.filter(g=>g.req&&!pick[g.id].length);
  const close=()=>{el.remove();window.removeEventListener('keydown',onKey,true)};
  const onKey=e=>{if(e.key==='Escape'){e.stopPropagation();close()}};window.addEventListener('keydown',onKey,true);
  function draw(){const miss=missing(),keepNote=el.querySelector('#opNote')?.value,sc=el.querySelector('.op-body')?.scrollTop||0;
    el.innerHTML=`<div class="op-card"><div class="op-body">
      ${m.img?`<div class="op-img zoomable" data-oimg="1"><img src="${esc(m.img)}" alt=""></div>`:''}
      <div class="op-hd"><div class="op-t"><h2>${esc(m.name)}</h2>${m.desc?`<p>${esc(m.desc)}</p>`:''}</div><b>${baht(mul(+m.price||0))}</b></div>
      ${G.map(g=>{const bad=warn&&miss.includes(g);return `<section class="op-g${bad?' bad':''}" data-g="${esc(g.id)}"><div class="op-gh"><b>${esc(g.name)}</b><span class="op-rule${g.req?' req':''}">${optRule(g)}</span></div>
        ${g.choices.map(c=>{const on=pick[g.id].includes(c.id);return `<button type="button" class="op-c${on?' on':''}" data-og="${esc(g.id)}" data-oc="${esc(c.id)}" aria-pressed="${on}"><i class="${+g.max===1?'rd':'ck'}"></i><span>${esc(c.name)}</span><em>${+c.price?'+'+baht(mul(+c.price)).replace('฿',''):''}</em></button>`}).join('')}</section>`}).join('')}
      <section class="op-g"><div class="op-gh"><b>บอกครัว</b><span class="op-rule">ไม่บังคับ</span></div>
        <input id="opNote" maxlength="80" placeholder="เช่น ไม่ใส่ผัก ไม่เผ็ด" autocomplete="off">
        ${(cfg.notes||[]).length?`<div class="op-qn">${cfg.notes.map(n=>`<button type="button" class="chip" data-on="${esc(n)}">${esc(n)}</button>`).join('')}</div>`:''}</section>
    </div>
    <div class="op-foot"><div class="stepper"><button type="button" data-oq="-1" aria-label="ลด">−</button><span>${qty}</span><button type="button" data-oq="1" aria-label="เพิ่ม">+</button></div>
      <button type="button" class="btn pri wide op-add" data-oadd="1">${miss.length&&warn?'ยังไม่ได้เลือก: '+esc(miss[0].name):(cfg.addLabel||'ใส่ตะกร้า')+' '+baht(unit()*qty)}</button></div>
    <button type="button" class="op-x" data-ox="1" aria-label="ปิด">×</button></div>`;
    const n=el.querySelector('#opNote');n.value=keepNote!=null?keepNote:note;n.addEventListener('input',()=>note=n.value);
    el.querySelector('.op-body').scrollTop=sc;}
  let downBg=false;el.addEventListener('pointerdown',e=>{downBg=e.target===el});
  el.addEventListener('click',e=>{if(e.target===el){if(downBg)close();return}if(e.target.closest('[data-oimg]'))return viewImg(m.img,m.name);const b=e.target.closest('button');if(!b)return;e.stopPropagation();
    if(b.dataset.ox)return close();
    if(b.dataset.og){const g=G.find(x=>x.id===b.dataset.og),cid=b.dataset.oc,a=pick[g.id];
      if(+g.max===1)pick[g.id]=a.includes(cid)&&!g.req?[]:[cid];
      else if(a.includes(cid))pick[g.id]=a.filter(x=>x!==cid);
      else{if(+g.max>1&&a.length>=+g.max)return;a.push(cid)}
      return draw()}
    if(b.dataset.on){const n=el.querySelector('#opNote');n.value=n.value?n.value+', '+b.dataset.on:b.dataset.on;note=n.value;return}
    if(b.dataset.oq){qty=Math.max(1,Math.min(20,qty+ +b.dataset.oq));return draw()}
    if(b.dataset.oadd){const miss=missing();if(miss.length){warn=true;draw();const s=el.querySelector('.op-g.bad');if(s)s.scrollIntoView({block:'center',behavior:'smooth'});return}
      note=(el.querySelector('#opNote')?.value||'').trim();const opts=sel();close();cfg.onAdd&&cfg.onAdd({opts,qty,note,unit:unit()})}});
  draw();}


/* ---------- แจ้งเตือนแม้ล็อกจอ (Web Push) ใช้ร่วมกันทั้งหน้าพนักงานและหน้าลูกค้า ---------- */
const PUSH={reg:null,key:null,
  ok:()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window,
  ios:/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),
  standalone:()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}},

function ppPayload(id,amount){
  let t=String(id||'').replace(/\D/g,''),tag;
  if(t.length===15)tag='03';else if(t.length>=13){tag='02';t=t.slice(0,13)}else{tag='01';t=('0000000000000'+t.replace(/^0/,'66')).slice(-13)}
  const f=(k,v)=>k+String(v.length).padStart(2,'0')+v;
  let p=f('00','01')+f('01',amount>0?'12':'11')+f('29',f('00','A000000677010111')+f(tag,t))+f('58','TH')+f('53','764');
  if(amount>0)p+=f('54',amount.toFixed(2));
  p+='6304';return p+crc16(p);}

const isLow=s=>(+s.qty||0)<=(+s.min||0);

function viewTables(){
  const n=Math.max(1,Math.min(60,+S.settings.tables||10));
  const byTable={};const ta=[];
  Object.values(S.open).forEach(o=>{if(o.table==='TA')ta.push(o);else byTable[o.table]=o});
  const sales=S.today.reduce((s,o)=>s+(+o.total||0),0);
  const pend=Object.values(S.open).reduce((s,o)=>s+linesTotal(o.items),0);
  const busy=Object.keys(byTable).length;
  let h=`<div class="strip">
    <div class="stat"><b class="money">${baht(sales)}</b><span>ยอดขายวันนี้</span></div>
    <div class="stat"><b class="num">${S.today.length}</b><span>บิลที่ชำระแล้ว</span></div>
    <div class="stat"><b class="num">${busy}/${n}</b><span>โต๊ะที่มีลูกค้า</span></div>
    <div class="stat"><b class="money">${baht(pend)}</b><span>ยอดรอชำระ</span></div></div>`;
  h+=`<div class="quickbar"><button class="btn pri qb" data-act="quickOrder" type="button"><b>+ สั่ง Order</b><small>ไม่ต้องเลือกโต๊ะ</small></button>${S.settings.qrWalkin!==false?`<button class="btn qb" data-act="walkinQr" type="button"><b>QR ให้ลูกค้าสั่งเอง</b><small>ไม่ต้องเลือกโต๊ะ</small></button>`:''}</div>`;
  const fl=['tables','other','deliv'].includes(S.floor)?S.floor:'tables';
  const walk=ta.filter(o=>chOf(o)==='walkin'),dl=ta.filter(o=>chOf(o)!=='walkin');
  const tabBtn=(v,label,cnt)=>`<button role="tab" aria-selected="${fl===v}" data-act="floor" data-v="${v}" type="button">${label} <span class="cnt">${cnt}</span></button>`;
  h+=`<div class="sec-h floorbar"><div class="floorseg" role="tablist" aria-label="มุมมองผังโต๊ะ">${tabBtn('tables','เปิดโต๊ะ',busy+'/'+n)}${tabBtn('other','ไม่ระบุโต๊ะ',walk.length)}${tabBtn('deliv','<span class="nw">กลับบ้าน /</span> <span class="nw">เดลิเวอรี่</span>',dl.length)}</div><span class="hint">${fl==='tables'?'แตะโต๊ะเพื่อเปิดโต๊ะหรือสั่งเพิ่ม':fl==='other'?'ออร์เดอร์ที่ไม่ได้นั่งโต๊ะ และลูกค้าสั่งเองผ่าน QR':'เลือกช่องทางเพื่อเปิดออร์เดอร์ใหม่'}</span></div>`;
  if(fl==='tables'){h+=`<div class="tgrid">`;
  for(let i=1;i<=n;i++){const o=byTable[String(i)];
    if(o){const un=(o.items||[]).filter(l=>!l.served).reduce((a,l)=>a+l.qty,0);
      const cn=custNames(o);
      const cl=callOf(o);h+=`<button class="tcard busy" data-act="openTable" data-t="${i}" type="button"><div class="no">${i}<small>โต๊ะ</small></div>${cl?`<span class="bell">🔔 ${esc((callLabel(cl.kind)).split(' /')[0])}</span>`:''}${ordNoTag(o)}${cn.length?`<div class="tname">คุณ${esc(cn.join(', คุณ'))}</div>`:''}
      <div>${un?`<span class="pill warn">รอเสิร์ฟ ${un}</span>`:(o.items||[]).length?'<span class="pill ok">เสิร์ฟครบ</span>':'<span class="pill info">เปิดแล้ว · รอสั่ง</span>'}<span class="pill ${o.guests>seatsOf(i)?'warn':'mute'}">${o.guests?o.guests+'/':''}${seatsOf(i)} ที่นั่ง</span></div>
      <div class="meta"><span>${ago(o.openedAt)}</span><span class="tot">${baht(linesTotal(o.items))}</span></div></button>`}
    else h+=`<button class="tcard" data-act="openTable" data-t="${i}" type="button"><div class="no">${i}<small>โต๊ะ</small></div><div class="seats">${'<i></i>'.repeat(Math.min(seatsOf(i),8))}<span>${seatsOf(i)} ที่นั่ง</span></div><div class="meta"><span>ปิดอยู่</span><span>+ เปิดโต๊ะ</span></div></button>`}
  h+=`</div>`;return h}
  const list=fl==='other'?walk:dl;
  if(fl==='deliv'){const chans=['takeaway',...DELIV.filter(c=>chCfg(c).on)];
    h+=`<div class="newch">${chans.map(c=>`<button class="btn ch-btn" style="--chc:${CH[c].c}" data-act="newDel" data-ch="${c}" type="button">${CH[c].n}</button>`).join('')}</div>`}
  h+=`<div class="tgrid">`;
  list.sort((a,b)=>a.openedAt-b.openedAt).forEach(o=>{const un=(o.items||[]).filter(l=>!l.served).reduce((a,l)=>a+l.qty,0);
    h+=`<button class="tcard busy del" style="--chc:${CH[chOf(o)].c}" data-act="openOrder" data-id="${o.id}" type="button"><div>${chChip(o)}</div><div class="no" style="font-size:18px">${esc(orderTitle(o))}</div>${ordNoTag(o)}${o.customerName&&(o.ref)?`<div class="tname">คุณ${esc(o.customerName)}</div>`:''}
    <div>${un?`<span class="pill warn">รอทำ ${un}</span>`:(o.items||[]).length?'<span class="pill ok">พร้อมส่ง</span>':'<span class="pill info">รอใส่รายการ</span>'}</div>
    <div class="meta"><span>${ago(o.openedAt)}</span><span class="tot">${baht(linesTotal(o.items))}</span></div></button>`});
  if(!list.length)h+=`<div class="empty" style="grid-column:1/-1;padding:16px">${fl==='other'?'ยังไม่มีออร์เดอร์ไม่ระบุโต๊ะ กด "+ สั่ง Order" หรือให้ลูกค้าสแกน QR สั่งเอง':'ยังไม่มีออร์เดอร์กลับบ้านหรือเดลิเวอรี่ กดเลือกช่องทางด้านบนเพื่อเปิดออร์เดอร์'}</div>`;
  h+=`</div>`;
  return h;
}

function viewKitchen(){
  const os=Object.values(S.open).filter(o=>(o.items||[]).some(l=>!l.served)).sort((a,b)=>a.openedAt-b.openedAt);
  let h=`<div class="sec-h"><h2>รายการรอทำ</h2><span class="hint">เรียงตามบิลที่เปิดก่อน แตะ "เสิร์ฟแล้ว" เมื่อยกออก</span></div>`;
  if(!os.length)return h+`<div class="empty"><b>ไม่มีรายการค้าง</b>เมื่อมีการสั่งอาหาร รายการจะขึ้นที่นี่ตามลำดับโต๊ะ</div>`;
  h+='<div class="kgrid">';
  os.forEach(o=>{const ls=(o.items||[]).filter(l=>!l.served);
    h+=`<article class="kcard"><header><h3 title="${esc(o.orderNo||'')}">${o.table==='TA'?chChip(o)+' '+esc(orderTitle(o)):esc(tableLabel(o))}</h3><span class="muted" style="font-size:13px">${ago(o.openedAt)}</span><button class="btn sm" data-act="serveAll" data-id="${o.id}" type="button">เสิร์ฟครบ</button></header>${o.orderNo?`<div class="kno">${esc(o.orderNo)}</div>`:''}`;
    ls.forEach(l=>{h+=`<div class="kline"><span class="q">${l.qty}×</span><div class="grow"><div>${esc(l.name)} ${custTag(l)}</div>${optLine(l)}${l.note?`<div class="note">${esc(l.note)}</div>`:''}</div><button class="btn sm" data-act="serve" data-id="${o.id}" data-l="${l.id}" type="button">เสิร์ฟแล้ว</button></div>`});
    h+='</article>'});
  return h+'</div>';
}

function viewMenu(){
  const cats=curCats();
  let h=`<div class="sec-h"><h2>${isPo()?'เมนูร้านพรีออเดอร์':'เมนูและราคา'}${can('menu_edit')?'':' <span class="pill mute" style="font-size:12px;vertical-align:middle">👁 ดูอย่างเดียว</span>'}</h2>${can('menu_edit')?(S.role==='owner'?'<button class="btn sm" data-act="catOpen" type="button">จัดการหมวด</button>':'')+'<button class="btn sm" data-act="optBulk" type="button">ตั้งตัวเลือกหลายเมนู</button>'+'<button class="btn pri sm" data-act="menuEdit" type="button">+ เพิ่มเมนู</button>':''}</div>
  <div class="chips"><button class="chip" aria-pressed="${S.menuCat==='all'}" data-act="menuCat" data-v="all" type="button">ทั้งหมด (${S.menu.length})</button>${cats.map(c=>`<button class="chip" aria-pressed="${S.menuCat===c}" data-act="menuCat" data-v="${esc(c)}" type="button">${esc(c)}</button>`).join('')}</div>`;
  const list=S.menu.filter(m=>S.menuCat==='all'||m.cat===S.menuCat);
  if(!list.length)return h+`<div class="empty"><b>ยังไม่มีเมนูในหมวดนี้</b>กด "เพิ่มเมนู" แล้วใส่ชื่อ ราคาขาย และต้นทุนต่อจาน</div>`;
  h+='<div class="list">';
  list.forEach(m=>{const p=+m.price||0,c=+m.cost||0,mg=p?Math.round((p-c)/p*100):0;
    h+=`<div class="row click" data-act="menuEdit" data-id="${m.id}">${m.img?`<span data-act="imgv" data-src="${esc(m.img)}" data-cap="${esc(m.name)}" class="zoomable" title="ดูรูปเต็ม">${thumb(m,'thumb')}</span>`:thumb(m,'thumb')}<div class="grow"><div class="t">${esc(m.name)} ${isSoldOut(m)?'<span class="pill" style="background:#e5383b;color:#fff">หมดแล้ว</span>':''}${m.hidden?' <span class="pill mute">ซ่อน</span>':''}${m.consign?` <span class="pill info">📦 ฝากขาย · เหลือ ${consignLeft(m)}</span>`:''}${typeof m.dailyLimit==='number'?` <span class="leftq${menuLeft(m)<=3?' low':''}">วันนี้ ${soldToday(m.id)}/${m.dailyLimit}</span>`:''}</div><div class="s">${esc(m.cat||'ไม่มีหมวด')} · ต้นทุน ${baht(c)} · กำไร ${mg}%${hasOpts(m)?' · มีตัวเลือก '+optGroups(m).length+' กลุ่ม':''}${(m.recipe||[]).length?' · ตัดสต็อกอัตโนมัติ':''}</div></div>${(can('menu_edit')||can('menu_toggle'))?`<button class="btn sm${m.active===false?' pri':''}" data-act="menuToggle" data-id="${m.id}" type="button" style="white-space:nowrap">${m.active===false?'เปิดขาย':'ปิด (หมด)'}</button>`:''}<div class="r"><b>${baht(p)}</b></div></div>`});
  return h+'</div>';
}

function viewBack(){
  const BT={stock:can('stock'),purch:can('stock'),consign:can('stock'),exp:can('expenses'),inc:can('expenses'),mem:can('members')};
  if(!BT[S.backTab])S.backTab=Object.keys(BT).find(k=>BT[k])||'stock';
  const t=S.backTab;
  let h=`<div class="subtabs" role="group">${BT.stock?`<button aria-pressed="${t==='stock'}" data-act="backTab" data-v="stock" type="button">สต็อกวัตถุดิบ</button><button aria-pressed="${t==='purch'}" data-act="backTab" data-v="purch" type="button">ซื้อของเข้า</button>`:''}${BT.exp?`<button aria-pressed="${t==='exp'}" data-act="backTab" data-v="exp" type="button">รายจ่ายร้าน</button>`:''}${BT.exp?`<button aria-pressed="${t==='inc'}" data-act="backTab" data-v="inc" type="button">รายรับอื่นๆ</button>`:''}${BT.stock?`<button aria-pressed="${t==='consign'}" data-act="backTab" data-v="consign" type="button">ฝากขาย</button>`:''}${BT.mem?`<button aria-pressed="${t==='mem'}" data-act="backTab" data-v="mem" type="button">สมาชิก</button>`:''}</div>`;
  if(t==='consign')return h+viewConsign();
  if(t==='inc')return h+viewIncome();
  if(t==='mem'){const tot=S.members.reduce((a,m)=>a+(+m.points||0),0);
    h+=`<div class="sec-h"><h2>สมาชิกสะสมแต้ม</h2><span class="hint">${S.settings.pointsOn?`ทุก ${baht(+S.settings.pointsPer||50)} = 1 แต้ม · 1 แต้ม = ${baht(+S.settings.pointValue||1)}`:'ปิดระบบแต้มอยู่ เปิดได้ที่ตั้งค่าร้าน'}</span></div>
    <div class="strip" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="stat"><b class="num">${S.members.length}</b><span>สมาชิกทั้งหมด</span></div><div class="stat"><b class="num">${num(tot)}</b><span>แต้มค้างในระบบ (≈ ${baht(tot*(+S.settings.pointValue||1))})</span></div></div>`;
    if(!S.members.length)return h+`<div class="empty"><b>ยังไม่มีสมาชิก</b>ตอนรับเงิน ใส่เบอร์โทรลูกค้า ระบบจะสมัครสมาชิกและเริ่มสะสมแต้มให้</div>`;
    return h+'<div class="list">'+S.members.slice(0,300).map(m=>`<div class="row click" data-act="memEdit" data-id="${esc(m.id)}"><div class="grow"><div class="t">${esc(m.name||'ไม่ระบุชื่อ')}</div><div class="s">${esc(m.id)} · มา ${m.visits||0} ครั้ง · ใช้จ่ายรวม ${baht(m.totalSpent||0)}</div></div><div class="r"><b>${num(m.points||0)}</b> <span class="muted">แต้ม</span></div></div>`).join('')+'</div>';}
  if(t==='stock'){
    const low=S.stock.filter(isLow);
    h+=`<div class="sec-h"><h2>ของที่ต้องเติม</h2><span class="hint">คงเหลือต่ำกว่าหรือเท่าจุดสั่งซื้อ</span></div>`;
    h+=low.length?'<div class="list">'+low.map(s=>`<div class="row"><div class="grow"><div class="t">${esc(s.name)}</div><div class="s">เหลือ ${num(s.qty)} ${esc(s.unit)} · จุดสั่งซื้อ ${num(s.min)} ${esc(s.unit)}</div></div><button class="btn sm pri" data-act="purchase" data-id="${s.id}" type="button">ซื้อเติม</button></div>`).join('')+'</div>':`<div class="empty"><b>ของยังพอใช้ทุกรายการ</b>รายการที่ใกล้หมดจะขึ้นที่นี่ให้ซื้อเติมได้ทันที</div>`;
    h+=`<div class="sec-h"><h2>วัตถุดิบทั้งหมด</h2><button class="btn sm" data-act="stockEdit" type="button">+ เพิ่มวัตถุดิบ</button></div>`;
    if(!S.stock.length)return h+`<div class="empty"><b>ยังไม่มีวัตถุดิบ</b>เพิ่มเส้น ลูกชิ้น เนื้อสัตว์ ผัก เพื่อติดตามของคงเหลือและต้นทุน</div>`;
    h+='<div class="list">'+S.stock.map(s=>{const q=+s.qty||0,m=+s.min||0,pct=Math.min(100,m>0?q/(m*3)*100:100);
      return `<div class="row click" data-act="stockEdit" data-id="${s.id}"><div class="grow"><div class="t">${esc(s.name)} ${isLow(s)?'<span class="pill bad">ต้องเติม</span>':''}</div><div class="s">ทุนล่าสุด ${baht(s.unitCost||0)}/${esc(s.unit)}</div><div class="meter ${isLow(s)?'low':''}"><i style="width:${Math.max(3,pct)}%"></i></div></div><div class="r"><b class="num">${num(q)}</b> <span class="muted">${esc(s.unit)}</span></div></div>`}).join('')+'</div>';
    return h;}
  if(t==='purch'){
    const sum=S.purch.filter(p=>p.at>=sod()-29*DAY).reduce((s,p)=>s+(+p.amount||0),0);
    h+=`<div class="sec-h"><h2>ซื้อของ 30 วันล่าสุด</h2><button class="btn pri sm" data-act="purchase" type="button">+ บันทึกการซื้อ</button></div>
    <div class="strip" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="stat"><b class="money">${baht(sum)}</b><span>รวมค่าซื้อของ</span></div><div class="stat"><b class="num">${S.purch.length}</b><span>รายการ</span></div></div>`;
    if(!S.purch.length)return h+`<div class="empty"><b>ยังไม่มีการซื้อของ</b>บันทึกทุกครั้งที่ไปตลาด ระบบจะเติมจำนวนในสต็อกและอัปเดตต้นทุนให้</div>`;
    return h+'<div class="list">'+S.purch.map(p=>`<div class="row"><div class="grow"><div class="t">${esc(p.name)} <span class="muted">${num(p.qty)} ${esc(p.unit||'')}</span></div><div class="s">${dshort(p.at)} ${hm(p.at)}${p.note?' · '+esc(p.note):''}</div></div><div class="r"><b>${baht(p.amount)}</b></div><button class="btn sm danger" data-act="delPurch" data-id="${p.id}" data-confirm="1" type="button">ลบ</button></div>`).join('')+'</div>';}
  const sum=S.exp.reduce((s,e)=>s+(+e.amount||0),0);
  h+=`<div class="sec-h"><h2>รายจ่าย 30 วันล่าสุด</h2><button class="btn pri sm" data-act="expense" type="button">+ บันทึกรายจ่าย</button></div>
  <div class="strip" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="stat"><b class="money">${baht(sum)}</b><span>รวมรายจ่าย</span></div><div class="stat"><b class="num">${S.exp.length}</b><span>รายการ</span></div></div>`;
  if(!S.exp.length)return h+`<div class="empty"><b>ยังไม่มีรายจ่าย</b>บันทึกค่าเช่า ค่าแรง ค่าไฟ ค่าแก๊ส เพื่อดูกำไรสุทธิที่แท้จริง</div>`;
  return h+'<div class="list">'+S.exp.map(e=>`<div class="row"><div class="grow"><div class="t">${esc(e.cat)}</div><div class="s">${dshort(e.at)}${e.note?' · '+esc(e.note):''}</div></div><div class="r"><b>${baht(e.amount)}</b></div><button class="btn sm danger" data-act="delExp" data-id="${e.id}" data-confirm="1" type="button">ลบ</button></div>`).join('')+'</div>';
}

/* ---------- report ---------- */
const RANGES={today:'วันนี้',yesterday:'เมื่อวาน',week:'7 วัน',month:'เดือนนี้',lastmonth:'เดือนก่อน'};
function rangeOf(k){const t0=sod(),d=new Date(t0);
  if(k==='yesterday')return [t0-DAY,t0];
  if(k==='week')return [t0-6*DAY,t0+DAY];
  if(k==='month')return [new Date(d.getFullYear(),d.getMonth(),1).getTime(),new Date(d.getFullYear(),d.getMonth()+1,1).getTime()];
  if(k==='lastmonth')return [new Date(d.getFullYear(),d.getMonth()-1,1).getTime(),new Date(d.getFullYear(),d.getMonth(),1).getTime()];
  return [t0,t0+DAY];}
async function loadReport(){
  if(!S.db)return;const key=S.report.range,[a,b]=rangeOf(key);S.report.loading=true;render();
  try{const [os,ps,es,is]=await Promise.all([
      S.db.collection('orders').where('status','==','paid').where('paidAt','>=',a).get(),
      S.db.collection('purchases').where('at','>=',a).get(),
      S.db.collection('expenses').where('at','>=',a).get(),
      S.db.collection('incomes').where('at','>=',a).get().catch(()=>({docs:[]}))]);
    const f=(snap,k)=>snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x[k]<b);
    if(S.report.range===key)S.report.data={key,a,b,orders:f(os,'paidAt').sort((x,y)=>y.paidAt-x.paidAt),purch:f(ps,'at'),exp:f(es,'at'),inc:f(is,'at')};
  }catch(e){toast(errMsg(e),'bad')}
  S.report.loading=false;render();}
function viewReport(){
  let h=`<div class="sec-h"><h2>สรุปการเงิน</h2><button class="btn sm" data-act="reload" type="button">${S.report.loading?'กำลังโหลด…':'โหลดใหม่'}</button></div>
  <div class="chips">${Object.entries(RANGES).map(([k,v])=>`<button class="chip" aria-pressed="${S.report.range===k}" data-act="range" data-v="${k}" type="button">${v}</button>`).join('')}</div>`;
  const D=S.report.data;
  if(!D||D.key!==S.report.range){if(!S.report.loading)setTimeout(loadReport,0);return h+`<div class="empty"><b>กำลังรวมยอด…</b>คำนวณยอดขาย ต้นทุน และรายจ่ายของช่วงที่เลือก</div>`}
  const sales=D.orders.reduce((s,o)=>s+(+o.total||0),0);
  const disc=D.orders.reduce((s,o)=>s+(+o.discount||0),0);
  const cogs=D.orders.reduce((s,o)=>s+(+o.cost||0),0);
  const sumBy=f=>D.orders.filter(f).reduce((s,o)=>s+(+o.total||0),0);
  const cash=sumBy(o=>o.method==='cash'),pp=sumBy(o=>o.method==='promptpay');
  const gpT=D.orders.reduce((s,o)=>s+(+o.gp||0),0),platGross=sumBy(o=>DELIV.includes(o.method)),platNet=r2(platGross-gpT);
  const buy=D.purch.reduce((s,p)=>s+(+p.amount||0),0);
  const exp=D.exp.reduce((s,e)=>s+(+e.amount||0),0);
  const vatT=D.orders.reduce((s,o)=>s+(+o.vat||0),0);
  const oinc=(D.inc||[]).reduce((s,e)=>s+(+e.amount||0),0);
  const gross=sales-vatT-cogs-gpT,net=gross+oinc-exp,flow=cash+pp+platNet+oinc-buy-exp-vatT;
  const gm=sales?Math.round(gross/sales*100):0;
  h+=`<p class="muted" style="margin:0">${dshort(D.a)}${D.b-D.a>DAY?' – '+dshort(D.b-1):''} · ${D.orders.length} บิล${disc?' · ส่วนลดรวม '+baht(disc):''}</p>
  <div class="kpis">
    <div class="kpi"><span>ยอดขาย</span><b>${baht(sales)}</b></div>
    ${vatT?`<div class="kpi"><span>VAT ในยอดขาย</span><b>${baht(vatT)}</b></div>`:''}
    <div class="kpi"><span>ต้นทุนอาหาร${gpT?' + GP':''}</span><b>${baht(cogs+gpT)}</b></div>
    <div class="kpi"><span>กำไรขั้นต้น · ${gm}%</span><b>${baht(gross)}</b></div>
    ${oinc?`<div class="kpi"><span>รายรับอื่นๆ</span><b>${baht(oinc)}</b></div>`:''}
    <div class="kpi"><span>รายจ่ายร้าน</span><b>${baht(exp)}</b></div>
    <div class="kpi hero ${net<0?'neg':''}"><span>กำไรสุทธิ</span><b>${baht(net)}</b></div></div>
  <div class="two">
   <div class="card"><h3>เงินเข้า–ออกจริง</h3>
    <div class="kv"><span>รับเงินสด</span><span>${baht(cash)}</span></div>
    <div class="kv"><span>รับพร้อมเพย์</span><span>${baht(pp)}</span></div>
    ${platGross?`<div class="kv"><span>รับจากแอปเดลิเวอรี่ (หัก GP แล้ว)</span><span>${baht(platNet)}</span></div>`:''}
    ${vatT?`<div class="kv"><span>ภาษีขาย (VAT) ที่ต้องนำส่ง</span><span>${baht(-vatT)}</span></div>`:''}
    ${oinc?`<div class="kv"><span>รายรับอื่นๆ</span><span>${baht(oinc)}</span></div>`:''}
    <div class="kv"><span>จ่ายซื้อของ</span><span>${baht(-buy)}</span></div>
    <div class="kv"><span>จ่ายรายจ่ายร้าน</span><span>${baht(-exp)}</span></div>
    <div class="kv tot"><span>เงินคงเหลือสุทธิ</span><span style="color:var(${flow<0?'--chili':'--jade'})">${baht(flow)}</span></div>
    <p class="help" style="margin:0">กำไรสุทธิคิดต้นทุนจาก "ต้นทุนต่อจาน" ของเมนูที่ขายได้ ส่วนเงินคงเหลือนับค่าซื้อของที่จ่ายจริงในช่วงนี้ ของที่ซื้อตุนไว้จึงทำให้สองตัวเลขต่างกัน</p></div>`;
  // by channel
  const chs=['dinein','walkin','takeaway',...DELIV].map(c=>{const os=D.orders.filter(o=>chOf(o)===c);return [c,os.length,os.reduce((s,o)=>s+(+o.total||0),0),os.reduce((s,o)=>s+(+o.gp||0),0)]}).filter(x=>x[1]);
  if(chs.length)h=h.replace('<div class="two">',`<div class="two"><div class="card"><h3>ยอดขายแยกช่องทาง</h3>${chs.map(([c,n,v,g])=>`<div class="kv"><span><span class="chip-ch" style="--chc:${CH[c].c}">${CH[c].n}</span> ${n} บิล</span><span>${baht(v)}${g?` <small class="muted">GP ${baht(g)}</small>`:''}</span></div>`).join('')}</div>`);
  // top items
  const agg={};D.orders.forEach(o=>(o.items||[]).forEach(l=>{const k=l.name;agg[k]=agg[k]||{q:0,v:0};agg[k].q+=l.qty;agg[k].v+=lineAmt(l)}));
  const top=Object.entries(agg).sort((a,b)=>b[1].q-a[1].q).slice(0,8);
  h+=`<div class="card"><h3>เมนูขายดี</h3>${top.length?top.map(([n,x])=>`<div class="kv"><span>${esc(n)}</span><span>${x.q} จาน · ${baht(x.v)}</span></div>`).join(''):'<p class="muted" style="margin:0">ยังไม่มีการขายในช่วงนี้</p>'}</div>`;
  // by day
  if(D.b-D.a>DAY){const days=[];for(let t=D.a;t<D.b&&t<=sod();t+=DAY){const e=t+DAY;days.push([t,D.orders.filter(o=>o.paidAt>=t&&o.paidAt<e).reduce((s,o)=>s+(+o.total||0),0)])}
    const mx=Math.max(1,...days.map(d=>d[1]));
    h+=`<div class="card"><h3>ยอดขายรายวัน</h3><div class="bars">${days.map(([t,v])=>`<div class="bar"><span class="d">${dshort(t)}</span><div class="track"><i style="width:${v/mx*100}%"></i></div><span class="v">${baht(v)}</span></div>`).join('')}</div></div>`}
  // other income
  if((D.inc||[]).length)h+=`<div class="card"><h3>รายรับอื่นๆ</h3>${D.inc.sort((x,y)=>y.at-x.at).map(e=>`<div class="kv"><span>${esc(e.cat||'รายรับอื่นๆ')}<small class="muted" style="display:block">${dshort(e.at)}${e.note?' · '+esc(e.note):''}</small></span><span>${baht(e.amount)}</span></div>`).join('')}<div class="kv tot"><span>รวม</span><span>${baht(oinc)}</span></div></div>`;
  // expenses by cat
  const ec={};D.exp.forEach(e=>ec[e.cat]=(ec[e.cat]||0)+(+e.amount||0));
  h+=`<div class="card"><h3>รายจ่ายตามหมวด</h3>${Object.keys(ec).length?Object.entries(ec).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="kv"><span>${esc(k)}</span><span>${baht(v)}</span></div>`).join(''):'<p class="muted" style="margin:0">ไม่มีรายจ่ายร้านในช่วงนี้</p>'}${buy?`<div class="kv tot"><span>ค่าซื้อวัตถุดิบ (${D.purch.length} รายการ)</span><span>${baht(buy)}</span></div>`:''}</div></div>`;
  h+=`<div class="sec-h"><h2>บิลที่ชำระแล้ว</h2><span class="hint">แตะเพื่อดูรายละเอียด</span></div>`;
  h+=D.orders.length?'<div class="list">'+D.orders.slice(0,100).map(o=>`<div class="row click" data-act="bill" data-id="${o.id}"><div class="grow"><div class="t">${esc(tableLabel(o))} <span class="pill ${o.method==='cash'?'mute':'ok'}">${methodName(o.method)}</span></div><div class="s">${o.orderNo?esc(o.orderNo)+' · ':''}${dshort(o.paidAt)} ${hm(o.paidAt)} · ${linesCount(o.items)} รายการ</div></div><div class="r"><b>${baht(o.total)}</b></div></div>`).join('')+'</div>':`<div class="empty"><b>ยังไม่มีบิลในช่วงนี้</b>บิลจะขึ้นที่นี่หลังกดรับเงิน</div>`;
  return h;
}

async function confirmPay(){const id=S.sheet.id,o=S.open[id];if(!o)return;const c=payCalc(),m=S.sheet.method,sh=S.sheet;
  $('#payOk').disabled=true;
  let paidItems=null,changed=false,fail=false,patch=null;
  const mem=S.settings.pointsOn&&(sh.member||sh.memberNew)?{phone:sh.phone,name:sh.member?(sh.member.name||''):(val('payName')||'')}:null;
  const billNo=o.orderNo||await nextBillNo();
  const memFields=mem?{memberPhone:mem.phone,memberName:mem.name,ptsUsed:c.use,ptsEarned:c.earn,redeem:c.redeem,ptsBalance:Math.max(0,(+(sh.member?.points)||0)-c.use)+c.earn}:{};
  try{await S.db.doc('orders/'+id).transform(d=>{
      if(d.status!=='open')return null;
      const tot=vatCalc(linesTotal(d.items)-c.disc-c.redeem).total;
      if(Math.abs(tot-c.total)>0.001){changed=true;return null}
      paidItems=(d.items||[]).map(l=>({...l,served:true}));
      patch={status:'paid',paidAt:Date.now(),billNo,method:m,subtotal:r2(c.sub),discount:r2(c.disc),total:c.total,cost:r2(linesCost(d.items)),received:m==='cash'?c.recv:c.total,change:m==='cash'?c.change:0,channel:chOf(d),ref:d.ref||'',gp:c.gp,net:c.net,vat:c.vat,vatRate:c.vatRate,vatMode:c.vatMode,beforeVat:c.beforeVat,roundOff:c.round||0,rcptTok:rcTok(),items:paidItems,...memFields};
      return patch;
    })}catch(e){fail=true;toast(errMsg(e),'bad')}
  if(fail){$('#payOk').disabled=false;return}
  if(changed){toast('มีรายการเพิ่มเข้ามาในบิลนี้ ตรวจยอดใหม่ก่อนรับเงิน','bad');payUpdate();return}
  if(!paidItems){closeSheet();toast('บิลนี้ถูกปิดไปแล้วจากอีกเครื่อง','bad');return}
  deductStock(paidItems);consignSell(paidItems);
  {const cl=callOf(o);if(cl){S.calls=S.calls.filter(c=>c.id!==cl.id);renderCalls();write('calls/'+cl.id,r=>r.delete())}}
  const paid={id,table:o.table,label:o.label,openedAt:o.openedAt,...patch};
  if(mem){try{const bal=await applyPoints(mem.phone,mem.name,c.use,c.earn,c.total);if(bal!==paid.ptsBalance){paid.ptsBalance=bal;write('orders/'+id,r=>r.update({ptsBalance:bal}))}}catch(e){toast('บันทึกแต้มไม่สำเร็จ: '+errMsg(e),'bad')}}
  openSheet({type:'receipt',order:paid,mode:'receipt'});
  if(paid.memberPhone)setTimeout(()=>{if(S.sheet&&S.sheet.type==='receipt')ACT.memCard()},500);
  toast(m==='cash'?`รับเงิน ${baht(c.total)} · ทอน ${baht(c.change)}`:m==='promptpay'?`รับพร้อมเพย์ ${baht(c.total)} แล้ว`:`ปิดออร์เดอร์ ${CH[m].n} แล้ว`);}
async function nextBillNo(){const d=new Date(),day=String(d.getFullYear()%100).padStart(2,'0')+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  const ref=S.db.doc('config/counter');
  try{const p=await ref.transform(x=>({day,n:x.day===day?(+x.n||0)+1:1}));return day+'-'+String(p.n).padStart(3,'0')}
  catch(e){if(e.code==='not_found'){try{await ref.set({day,n:1});return day+'-001'}catch(e2){}}}
  return day+'-'+String(Date.now()).slice(-5);}
async function applyPoints(phone,name,used,earned,spent){const ref=S.db.doc('members/'+phone);
  try{const p=await ref.transform(d=>({points:Math.max(0,(+d.points||0)-used)+earned,totalSpent:r2((+d.totalSpent||0)+spent),visits:(+d.visits||0)+1,lastAt:Date.now(),...(name&&!d.name?{name}:{})}));return p.points}
  catch(e){if(e.code!=='not_found')throw e;
    await ref.set({phone,name:name||'',points:earned,totalSpent:r2(spent),visits:1,createdAt:Date.now(),lastAt:Date.now()});return earned}}
function deductStock(items){const need={};
  (items||[]).forEach(l=>{const m=S.menu.find(x=>x.id===l.menuId);(m?.recipe||[]).forEach(g=>{if(g.stockId)need[g.stockId]=(need[g.stockId]||0)+(+g.qty||0)*l.qty})});
  Object.entries(need).forEach(([sid,q])=>{const s=S.stock.find(x=>x.id===sid);if(!s)return;s.qty=r2((+s.qty||0)-q);write('stock/'+sid,r=>r.transform(d=>({qty:r2((+d.qty||0)-q)})))});}

async function shrinkImage(file,max=900,q=0.82){
  let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){bmp=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)})}
  const w=bmp.width,h=bmp.height,k=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(ok=>c.toBlob(ok,'image/jpeg',q));}
async function uploadMenuPhoto(menuId,file){
  const blob=await shrinkImage(file);if(!blob)throw {code:'invalid_argument',message:'resize'};
  const path=menuId+'/'+Date.now()+'.jpg';
  const {error}=await SB.storage.from('menu-photos').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000',upsert:false});
  if(error)throw {code:/policy|security|Unauthorized|403/i.test(error.message)?'invalid_argument':'unavailable',message:error.message};
  return {path,url:SB.storage.from('menu-photos').getPublicUrl(path).data.publicUrl};}

function renderCo(){const box=$('#coList');if(!box)return;const L=S.sheet.co;
  box.innerHTML=L.map((o,i)=>`<div class="oc-row" style="grid-template-columns:minmax(0,1fr) auto 40px;margin-top:8px"><input data-co="${i}" value="${esc(o.label)}" maxlength="40" placeholder="เช่น ขอช้อนส้อมเพิ่ม" aria-label="ประโยคเรียกพนักงาน">

function renderOpts(){const box=$('#optList');if(!box)return;const O=S.sheet.opts;
  box.innerHTML=O.map((g,i)=>`<div class="og"><div class="og-h"><input data-eg="${i}" data-k="name" value="${esc(g.name)}" placeholder="ชื่อกลุ่ม เช่น เลือกเส้น" aria-label="ชื่อกลุ่มตัวเลือก"><button class="btn sm ghost" data-act="ogDel" data-i="${i}" type="button">ลบกลุ่ม</button></div>

    ${g.choices.map((c,j)=>`<div class="oc-row"><input data-eg="${i}" data-ec="${j}" data-k="name" value="${esc(c.name)}" placeholder="ชื่อตัวเลือก" aria-label="ชื่อตัวเลือก"><input data-eg="${i}" data-ec="${j}" data-k="price" inputmode="decimal" value="${c.price||''}" placeholder="+0 บาท" aria-label="บวกราคา"><button class="btn sm ghost" data-act="ocDel" data-i="${i}" data-j="${j}" type="button" aria-label="ลบตัวเลือก">×</button></div>`).join('')}

  const src=S.menu.filter(x=>x.id!==S.sheet.id&&hasOpts(x)),cb=$('#ogCopyBox');
  if(cb)cb.innerHTML=src.length?`<select id="ogFrom" aria-label="คัดลอกตัวเลือกจากเมนู"><option value="">คัดลอกตัวเลือกจากเมนูอื่น…</option>${src.map(x=>`<option value="${x.id}">${esc(x.name)} (${optGroups(x).map(g=>esc(g.name)).join(', ')})</option>`).join('')}</select><button class="btn sm" data-act="ogCopy" type="button">คัดลอก</button>`:'';}
function readOpts(){document.querySelectorAll('[data-eg]').forEach(e=>{const g=S.sheet.opts[+e.dataset.eg];if(!g)return;
  if(e.dataset.ec!=null){const c=g.choices[+e.dataset.ec];if(!c)return;c[e.dataset.k]=e.dataset.k==='price'?Math.max(0,parseFloat(e.value)||0):e.value.trim()}else g[e.dataset.k]=e.dataset.k==='name'?e.value.trim():e.value})}
const cleanOpts=O=>O.map(g=>({id:g.id,name:g.name,req:g.type==='req1',max:g.type==='multi'?0:1,choices:g.choices.filter(c=>c.name).map(c=>({id:c.id,name:c.name,price:+c.price||0}))})).filter(g=>g.name&&g.choices.length);
function readIng(){document.querySelectorAll('[data-ing]').forEach(e=>{const g=S.sheet.recipe[+e.dataset.ing];if(!g)return;g[e.dataset.k]=e.dataset.k==='qty'?(parseFloat(e.value)||0):e.value})}
async function saveMenu(){readIng();const name=val('mName');if(!name)return toast('ใส่ชื่อเมนูก่อน','bad');
  readOpts();const bad=S.sheet.opts.find(g=>!g.name&&g.choices.some(c=>c.name))||S.sheet.opts.find(g=>g.name&&!g.choices.some(c=>c.name));if(bad)return toast(bad.name?'กลุ่ม "'+bad.name+'" ยังไม่มีตัวเลือก':'ตั้งชื่อกลุ่มตัวเลือกก่อน','bad');
  const data={name,desc:val('mDesc'),cat:val('mCat'),price:nval('mPrice'),cost:nval('mCost'),active:$('#mActive').checked,hidden:$('#mHidden').checked,dailyLimit:(v=>v===''?null:Math.max(0,Math.round(+v)||0))(val('mLimit').replace(/[^0-9]/g,'')),recipe:S.sheet.recipe.filter(g=>g.stockId&&g.qty>0),options:cleanOpts(S.sheet.opts)};if(isPo()||(S.menu.find(m=>m.id===S.sheet.id)||{}).shop==='po')data.shop='po';
  {const ex=S.menu.find(m=>m.id===S.sheet.id)||{};const cOn=$('#mConsign')&&$('#mConsign').checked;
   if(cOn){const owner=val('mOwner');if(!owner)return toast('ใส่ชื่อผู้ฝากขายก่อน','bad');data.consign={owner:owner.slice(0,40)}}
   ['consignIn','consignSold','consignRet','consignPaidQty'].forEach(k=>{if(ex[k]!=null)data[k]=ex[k]})}
  const id=S.sheet.id||S.sheet.newId||(S.sheet.newId=S.db.collection('menu').doc().id);
  const ph=S.sheet.photo,oldPath=ph.path;let drop=null;
  if(ph.file){const btn=document.querySelector('[data-act="saveMenu"]');btn.disabled=true;btn.textContent='กำลังอัปโหลดรูป…';
    try{const up=await uploadMenuPhoto(id,ph.file);data.img=up.url;data.imgPath=up.path;drop=oldPath}
    catch(e){btn.disabled=false;btn.textContent='บันทึกเมนู';return toast(e.code==='invalid_argument'?'อัปโหลดรูปไม่ได้ บัญชีนี้ไม่มีสิทธิ์':'อัปโหลดรูปไม่สำเร็จ ลองอีกครั้ง','bad')}}
  else if(ph.removed){data.img='';data.imgPath='';drop=oldPath}
  else{data.img=ph.url||'';data.imgPath=ph.path||''}
  const ok=await write('menu/'+id,r=>r.set(data));
  if(ok){removePhoto(drop);S.sheet.id=id;S.sheet.newId=null;S.sheet.photo={url:data.img||'',path:data.imgPath||'',file:null,removed:false};
    const ex=S.menu.find(m=>m.id===id);if(ex)Object.assign(ex,data);else{S.menu.push({id,...data});sortMenu()}render();
    const b=document.querySelector('[data-act="saveMenu"]');if(b){b.disabled=false;b.textContent='✓ บันทึกแล้ว';b.classList.add('ok-flash');clearTimeout(b._t);b._t=setTimeout(()=>{b.textContent='บันทึกเมนู';b.classList.remove('ok-flash')},2000)}
    const hd=$('#panel .sh-head h2');if(hd)hd.textContent='แก้ไขเมนู';if(!$('[data-act="delMenu"]')){const f=$('#panel .sh-foot');if(f)f.insertAdjacentHTML('afterbegin','<button class="btn danger" data-act="delMenu" data-confirm="1" type="button">ลบเมนู</button>')}
    toast('บันทึกเมนูแล้ว')}
  else{const btn=document.querySelector('[data-act="saveMenu"]');if(btn){btn.disabled=false;btn.textContent='บันทึกเมนู'}}}

function sheetPurchase(){const sid=S.sheet.id||'';
  $('#panel').innerHTML=head('บันทึกการซื้อของ','ระบบจะเติมจำนวนเข้าสต็อกให้')+

  <p class="help" id="pUnitCost" style="margin:0"></p>
  <div class="grid2"><div class="field"><label for="pDate">วันที่ซื้อ</label><input id="pDate" type="date" value="${toDateInput(Date.now())}"></div><div class="field"><label for="pNote">ร้าน / หมายเหตุ</label><input id="pNote" placeholder="เช่น ตลาดสด" autocomplete="off"></div></div></form>
  <div class="sh-foot"><button class="btn pri wide" data-act="savePurch" type="button">บันทึกการซื้อ</button></div>`;
  const upd=()=>{$('#pNew').hidden=$('#pItem').value!=='__new';const q=nval('pQty'),a=nval('pAmt');$('#pUnitCost').textContent=q&&a?'ตกหน่วยละ '+baht(a/q):''};
  ['pItem','pQty','pAmt'].forEach(i=>$('#'+i).addEventListener('input',upd));upd();}
async function savePurch(){let sid=val('pItem');const qty=nval('pQty'),amount=nval('pAmt');
  if(!(qty>0))return toast('ใส่จำนวนที่ซื้อ','bad');
  let s=S.stock.find(x=>x.id===sid);
  if(sid==='__new'){const name=val('pName');if(!name)return toast('ใส่ชื่อของใหม่','bad');sid=S.db.collection('stock').doc().id;s={name,unit:val('pUnit')||'หน่วย',qty:0,min:0,unitCost:0}}
  const uc=amount>0?r2(amount/qty):(+s.unitCost||0);const isNew=!S.stock.some(x=>x.id===sid);
  const ok=await write('stock/'+sid,r=>isNew?r.set({name:s.name,unit:s.unit,qty,min:0,unitCost:uc}):r.transform(d=>({qty:r2((+d.qty||0)+qty),unitCost:uc})));if(!ok)return;
  const ref=S.db.collection('purchases').doc();
  await write('purchases/'+ref.id,r=>r.set({stockId:sid,name:s.name,unit:s.unit,qty,amount,note:val('pNote'),at:fromDateInput(val('pDate'))}));
  closeSheet();toast(`เติม ${s.name} +${num(qty)} ${s.unit} แล้ว`);}

const BG_KEY='nl_bg';
const getBg=()=>{try{const v=localStorage.getItem(BG_KEY);return v===null?50:Math.max(0,Math.min(100,+v))}catch(e){return 50}};
function applyBg(v){document.documentElement.style.setProperty('--veil-a',String(1-v/100));document.body.classList.toggle('nobg',v===0)}
applyBg(getBg());
const bgCard=()=>`<div class="card"><h3>รูปพื้นหลัง (เฉพาะเครื่องนี้)</h3><div class="bgctl"><span class="help">จาง</span><input id="bgRange" type="range" min="0" max="100" step="5" value="${getBg()}" aria-label="ความชัดของรูปพื้นหลัง"><span class="help">ชัด</span><output id="bgOut">${getBg()}%</output></div><p class="help" style="margin:0">ตั้ง 0% เพื่อปิดรูปพื้นหลัง</p></div>`;

     <div class="inrow" style="margin-top:6px;flex-wrap:wrap">${S.role==='owner'?`<button class="btn sm pri" data-act="vOpen" type="button">🎙 อัดเสียงเรียกโต๊ะ (${Object.keys(S.voice||{}).length} คลิป)</button>`:''}<button class="btn sm" data-act="bellSay" type="button">🗣 ฟังตัวอย่างเสียงพูด</button><span class="help" id="bVoiceHelp">${voiceHelp()}</span></div>

function bellBind(){pushStatus();if(PUSH.ok())PUSH.loadKey().catch(()=>{});document.querySelectorAll('[data-bell]').forEach(e=>e.addEventListener(e.type==='range'&&e.dataset.bell!=='rate'?'input':'change',()=>{const c=bellCfg(),k=e.dataset.bell;c[k]=k==='vol'||k==='rate'?(+e.value/100):k==='rep'?+e.value:e.value;bellSave(c);if(k==='mode')return;
    if(k==='rate'){const l=e.closest('.field').querySelector('label');if(l)l.textContent='ความเร็วพูด '+e.value+'%';Bell.sayNow('โต๊ะ 2 ขอชำระเงิน เช็คบิล');return}if(k==='voice'){Bell.sayNow('โต๊ะ 2 ขอชำระเงิน เช็คบิล');return}
    if(k==='vol'){const l=e.closest('.field').querySelector('label');if(l)l.textContent='ความดัง '+e.value+'%'}else if(k!=='rep'){Bell.unlock();Bell.ring(null,e.value)}}));
  const f=$('#bFile');if(f)f.addEventListener('change',()=>{const x=f.files&&f.files[0];if(!x)return;if(x.size>1048576)return toast('ไฟล์ใหญ่เกิน 1 MB ตัดเสียงให้สั้นลงก่อน','bad');
    const r=new FileReader();r.onload=()=>{try{localStorage.setItem('nl_bell_custom',r.result)}catch(e){return toast('เครื่องนี้เก็บไฟล์ไม่พอ ลองไฟล์ที่เล็กลง','bad')}const c=bellCfg();c.staff='custom';bellSave(c);Bell.unlock();Bell.ring(null,'custom');toast('ใช้เสียงของคุณแล้ว');refreshBellCard()};r.readAsDataURL(x)})}
async function pushBoot(){try{SB.rpc('push_setup',{p_url:PUSH.fn()}).then(()=>{},()=>{})}catch(e){}
  if(!PUSH.ok())return;await PUSH.init();try{if(Notification.permission==='granted'){const sub=await PUSH.current();if(sub)await pushSaveStaff(JSON.parse(JSON.stringify(sub)))}}catch(e){}}
async function pushSaveStaff(sub){const id='s-'+await PUSH.hash(sub.endpoint);return write('push/'+id,r=>r.set({role:'staff',email:S.email||'',sub,at:Date.now(),ua:navigator.userAgent.slice(0,90)}))}
async function pushStatus(){const el=$('#pushStat');if(!el)return;let t,on=false;
  if(!PUSH.ok())t=PUSH.errText('unsupported');else if(Notification.permission==='denied')t=PUSH.errText('denied');
  else{const sub=await PUSH.current().catch(()=>null);on=!!sub&&Notification.permission==='granted';t=on?'✓ เปิดอยู่บนเครื่องนี้ · ล็อกจอก็ยังได้รับแจ้งเตือน':'ยังไม่ได้เปิดบนเครื่องนี้'}
  el.textContent=t;const b1=$('#pushOnBtn'),b2=$('#pushTestBtn');if(b1)b1.textContent=on?'เปิดใหม่อีกครั้ง':'เปิดแจ้งเตือนบนเครื่องนี้';if(b2)b2.hidden=!on;}

    S.poOrders=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.at-b.at);

  staffName:async d=>{const n=prompt('ชื่อเรียกของ '+d.user+' (เว้นว่าง = ใช้ชื่อผู้ใช้)',d.name||'');if(n===null)return;
    const {error}=await SB.from('staff').update({display_name:n.trim().slice(0,40)||null}).eq('email',d.email);
    if(error)return toast(/display_name|column/i.test(error.message||'')?'ยังไม่ได้รัน SQL ชื่อพนักงาน (nuealwoan-patch-staffname.sql)':'ตั้งชื่อไม่สำเร็จ','bad');toast('บันทึกชื่อแล้ว');loadStaff()},
  sgTab:d=>{S.sheet.sg=+d.v;document.querySelectorAll('#panel .sg').forEach(x=>x.hidden=x.dataset.sg!==d.v);document.querySelectorAll('#panel .sgtabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===d.v)));const b=$('#panel .sh-body');if(b)b.scrollTop=0},
  memQrPrint:()=>{const card=`<div class="pq"><small style="font-weight:600">${esc(S.settings.rcName||'เนื้อล้วนๆ')}</small>${qrSvg(memberUrl())}<b>สมัครสมาชิกสะสมแต้ม</b><small>ทุก ${num(+S.settings.pointsPer||50)} บาท ได้ 1 แต้ม · ใช้ได้ทั้ง 2 ร้าน</small></div>`;$('#printArea').className='qrs one';$('#printArea').innerHTML=card;setTimeout(()=>window.print(),50)},
  memCard:()=>{const sh=S.sheet;const o=sh&&(sh.order||S.poOrders.find(x=>x.id===sh.id));if(!o||!o.memberPhone)return;const m=S.members.find(x=>x.id===o.memberPhone)||{};
    showMemberCard({phone:maskPhone(o.memberPhone),name:o.memberName||m.name||o.name||'',points:o.ptsBalance!=null?o.ptsBalance:m.points,note:+o.ptsEarned?`ได้รับ +${+o.ptsEarned} แต้มจากบิลนี้ 🎉`:''})},
  rcLogoReset:d=>{RCLOGO[d.id]='';if(S.sheet)S.sheet.dirty=true;const b=$('#'+d.id+'Box');if(b)b.innerHTML=`<img src="${esc(d.def)}" alt="โลโก้">`;const m=$('#'+d.id+'Msg');if(m)m.textContent='ใช้โลโก้ตั้งต้น · กด "บันทึก" เพื่อใช้งาน'},
  poRc:async d=>{const o=S.poOrders.find(x=>x.id===d.id);if(!o)return;if(!o.rcptTok){const t=rcTok();const ok=await write('po_orders/'+o.id,r=>r.update({rcptTok:t}));if(!ok)return;o.rcptTok=t}openSheet({type:'poRcQr',id:o.id})}
});

/* ---------- ดูเมนูแบบอ่านอย่างเดียว (ตำแหน่งที่ไม่มีสิทธิ์แก้เมนู เช่น หุ้นส่วน) ---------- */
function sheetMenuView(){const m=S.menu.find(x=>x.id===S.sheet.id);if(!m)return closeSheet();const p=+m.price||0,c=+m.cost||0,mg=p?Math.round((p-c)/p*100):0;
  const G=optGroups(m),R=(m.recipe||[]).map(g=>{const st=S.stock.find(x=>x.id===g.stockId);return st?`${esc(st.name)} ${num(g.qty)} ${esc(st.unit||'')}`:''}).filter(Boolean);
  $('#panel').innerHTML=head(esc(m.name),'👁 ดูอย่างเดียว · แก้ไขได้เฉพาะตำแหน่งที่มีสิทธิ์ "แก้เมนูและราคา"')+`<div class="sh-body">
   ${m.img?`<img src="${esc(m.img)}" alt="" class="zoomable" data-act="imgv" data-src="${esc(m.img)}" data-cap="${esc(m.name)}" style="width:100%;max-height:240px;object-fit:cover;border-radius:12px">`:''}
   <div class="strip" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="stat"><b class="num">${baht(p)}</b><span>ราคาขาย</span></div><div class="stat"><b class="num">${baht(c)}</b><span>ต้นทุน</span></div><div class="stat"><b class="num">${mg}%</b><span>กำไรขั้นต้น</span></div></div>
   <div class="list">
    <div class="row"><div class="grow">หมวด</div><b>${esc(m.cat||'ไม่มีหมวด')}</b></div>
    <div class="row"><div class="grow">สถานะ</div><b>${isSoldOut(m)?'หมดแล้ว / ปิดขาย':'เปิดขาย'}${m.hidden?' · ซ่อน':''}</b></div>
    <div class="row"><div class="grow">จำนวนขายต่อวัน</div><b>${typeof m.dailyLimit==='number'?`ขายแล้ว ${soldToday(m.id)} / ${m.dailyLimit}`:'ไม่จำกัด'}</b></div>
    ${m.desc?`<div class="row"><div class="grow">รายละเอียด</div><span style="text-align:right">${esc(m.desc)}</span></div>`:''}</div>
   ${G.length?`<div class="card"><h3>ตัวเลือก</h3>${G.map(g=>`<div><b>${esc(g.name)}</b> <small class="muted">${esc(optRule(g))}</small><div class="help" style="margin:2px 0 0">${g.choices.map(ch=>esc(ch.name)+(+ch.price?` (+${num(ch.price)})`:'')).join(' · ')}</div></div>`).join('')}</div>`:''}
   ${R.length?`<div class="card"><h3>วัตถุดิบที่ตัดสต็อกต่อจาน</h3><p class="help" style="margin:0">${R.join(' · ')}</p></div>`:''}</div>
   <div class="sh-foot"><button class="btn pri wide" data-act="close" type="button">ปิด</button></div>`}

/* ---------- สินค้าฝากขาย ---------- */
const consignLeft=m=>Math.max(0,(+m.consignIn||0)-(+m.consignSold||0)-(+m.consignRet||0));
const consignOwe=m=>Math.max(0,(+m.consignSold||0)-(+m.consignPaidQty||0))*(+m.cost||0);
function consignSell(items){const q={};(items||[]).forEach(l=>{const m=S.nMenu.find(x=>x.id===l.menuId);if(m&&m.consign)q[m.id]=(q[m.id]||0)+(+l.qty||0)});
  Object.entries(q).forEach(([id,n])=>{const m=S.nMenu.find(x=>x.id===id);if(m){m.consignSold=(+m.consignSold||0)+n}
    write('menu/'+id,r=>r.transform(d=>{const sold=(+d.consignSold||0)+n,left=(+d.consignIn||0)-sold-(+d.consignRet||0);return {consignSold:sold,...(d.consignIn&&left<=0?{active:false}:{})}}))})}
function viewConsign(){const L=S.nMenu.filter(m=>m.consign);const ed=can('menu_edit');
  let h=`<div class="sec-h"><h2>สินค้าฝากขาย</h2>${ed?'<button class="btn pri sm" data-act="consignNew" type="button">+ เพิ่มสินค้าฝากขาย</button>':''}</div>
   <p class="help" style="margin:0">สินค้าฝากขายอยู่ในเมนูตามหมวดที่เลือก ขายได้เหมือนเมนูปกติ · ขายแล้วระบบนับให้เอง · ของหมดระบบปิดขายให้อัตโนมัติ</p>`;
  if(!L.length)return h+`<div class="empty"><b>ยังไม่มีสินค้าฝากขาย</b>กด "+ เพิ่มสินค้าฝากขาย" ใส่ชื่อ ราคาขาย ราคาที่ต้องจ่ายผู้ฝาก (ต้นทุน) และหมวดในเมนู</div>`;
  const by={};L.forEach(m=>{(by[m.consign.owner]=by[m.consign.owner]||[]).push(m)});
  const tot=L.reduce((a,m)=>a+consignOwe(m),0);
  h+=`<div class="strip" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="stat"><b class="num">${Object.keys(by).length}</b><span>ผู้ฝากขาย</span></div><div class="stat"><b class="num">${L.length}</b><span>รายการ</span></div><div class="stat"><b class="num">${baht(tot)}</b><span>ค้างจ่ายผู้ฝากรวม</span></div></div>`;
  Object.entries(by).sort((a,b)=>a[0].localeCompare(b[0],'th')).forEach(([o,ms])=>{const owe=ms.reduce((a,m)=>a+consignOwe(m),0);
    h+=`<div class="card"><div class="sec-h" style="align-items:center"><h3>📦 ${esc(o)}</h3><span class="grow"></span>${owe?`<span class="pill warn">ค้างจ่าย ${baht(owe)}</span>`:'<span class="pill ok">จ่ายครบ</span>'}${owe&&can('stock')?`<button class="btn sm pri" data-act="consignPay" data-o="${esc(o)}" data-confirm="1" type="button">จ่ายเงินผู้ฝากแล้ว</button>`:''}</div>
     <div class="list">${ms.map(m=>{const left=consignLeft(m),unpaid=Math.max(0,(+m.consignSold||0)-(+m.consignPaidQty||0));return `<div class="row" style="flex-wrap:wrap;row-gap:6px"><div class="grow" style="flex-basis:160px"><div class="t">${esc(m.name)} ${m.active===false?'<span class="pill bad">ปิดขาย</span>':''}</div>
       <div class="s">${esc(m.cat||'')} · ขาย ${baht(+m.price||0)} · จ่ายผู้ฝาก ${baht(+m.cost||0)}/ชิ้น · กำไร ${baht((+m.price||0)-(+m.cost||0))}/ชิ้น</div>
       <div class="s">รับเข้า ${+m.consignIn||0} · ขายแล้ว ${+m.consignSold||0} · คืน ${+m.consignRet||0} · <b>เหลือ ${left}</b>${unpaid?` · ยังไม่จ่าย ${unpaid} ชิ้น = ${baht(consignOwe(m))}`:''}</div></div>
       ${can('stock')?`<button class="btn sm" data-act="consignIn" data-id="${m.id}" type="button">+ รับของเข้า</button><button class="btn sm ghost" data-act="consignRet" data-id="${m.id}" type="button">คืนของ</button>`:''}${ed?`<button class="btn sm ghost" data-act="menuEdit" data-id="${m.id}" type="button">แก้ไข</button>`:''}</div>`}).join('')}</div></div>`});
  const log=(S.consignLog||[]).slice(0,15);
  if(log.length)h+=`<div class="sec-h"><h2>ประวัติล่าสุด</h2></div><div class="list">${log.map(x=>`<div class="row"><div class="grow"><div class="t">${x.type==='in'?'รับเข้า':x.type==='ret'?'คืนของ':'จ่ายเงินผู้ฝาก'} · ${esc(x.name||x.owner||'')}</div><div class="s">${esc(dlong(x.at))} ${hm(x.at)}${x.by?' · '+esc(x.by):''}</div></div><b>${x.type==='pay'?baht(x.amount):(x.type==='ret'?'-':'+')+x.qty}</b></div>`).join('')}</div>`;
  return h}
async function consignAdj(id,kind){const m=S.nMenu.find(x=>x.id===id);if(!m)return;
  const n=Math.round(+((prompt(kind==='in'?'รับ "'+m.name+'" เข้ากี่ชิ้น?':'คืน "'+m.name+'" ให้ผู้ฝากกี่ชิ้น?','')||'').replace(/[^0-9]/g,''))||0);if(n<=0)return;
  if(kind==='ret'&&n>consignLeft(m))return toast('คืนได้ไม่เกินที่เหลือ ('+consignLeft(m)+' ชิ้น)','bad');
  const ok=await write('menu/'+id,r=>r.transform(d=>{const inn=(+d.consignIn||0)+(kind==='in'?n:0),ret=(+d.consignRet||0)+(kind==='ret'?n:0),left=inn-(+d.consignSold||0)-ret;
    return {consignIn:inn,consignRet:ret,...(kind==='in'&&left>0&&d.active===false?{active:true}:{}),...(left<=0?{active:false}:{})}}));
  if(!ok)return;await write('consign_log/'+uid(),r=>r.set({type:kind,menuId:id,name:m.name,owner:m.consign.owner,qty:n,at:Date.now(),by:S.me||''}));
  toast((kind==='in'?'รับเข้า ':'คืน ')+n+' ชิ้น · '+m.name);}
Object.assign(ACT,{
  consignNew:()=>{if(!can('menu_edit'))return deny();openSheet({type:'menuEdit',id:null,consign:true})},
  consignIn:d=>consignAdj(d.id,'in'),
  consignRet:d=>consignAdj(d.id,'ret'),
  consignPay:async d=>{const ms=S.nMenu.filter(m=>m.consign&&m.consign.owner===d.o);let amt=0;
    for(const m of ms){const owe=consignOwe(m);if(!(+m.consignSold>(+m.consignPaidQty||0)))continue;amt+=owe;await write('menu/'+m.id,r=>r.transform(x=>({consignPaidQty:+x.consignSold||0})))}
    if(amt>0){await write('consign_log/'+uid(),r=>r.set({type:'pay',owner:d.o,name:d.o,amount:r2(amt),at:Date.now(),by:S.me||''}));
      if(confirm('บันทึกเป็นรายจ่ายร้านด้วยไหม? ('+baht(amt)+' จ่ายผู้ฝากขาย '+d.o+')'))await write('expenses/'+uid(),r=>r.set({at:Date.now(),amount:r2(amt),cat:'ค่าสินค้าฝากขาย',note:'จ่ายผู้ฝาก '+d.o,by:S.me||''}))}
    toast('บันทึกจ่ายเงินผู้ฝาก '+d.o+' '+baht(amt)+' แล้ว');render()}
});

/* ---------- รายรับอื่นๆ (เช่น ค่าเช่าที่ขายของ เก็บเป็นครั้งๆ) ---------- */
const INC_CATS=['ค่าเช่าที่ขายของ','ค่าเช่าอุปกรณ์/พื้นที่','ค่าคอมมิชชั่น / ค่าฝากขาย','ขายของเหลือใช้','เงินสนับสนุน / สปอนเซอร์','อื่นๆ'];
const incCats=()=>{const set=new Set([...(S.settings.incCats||[]),...INC_CATS,...(S.inc||[]).map(e=>e.cat).filter(Boolean)]);return [...set]};
function viewIncome(){const L=S.inc||[];const sum=L.reduce((s,e)=>s+(+e.amount||0),0);
  let h=`<div class="sec-h"><h2>รายรับอื่นๆ 30 วันล่าสุด</h2><button class="btn pri sm" data-act="income" type="button">+ บันทึกรายรับ</button></div>
  <p class="help" style="margin:0">รายรับที่ไม่ได้มาจากการขายอาหาร เช่น ให้เช่าที่ขายของ เก็บเป็นครั้งๆ · นับรวมในกำไรสุทธิที่หน้า "สรุปเงิน"</p>
  <div class="strip" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="stat"><b class="money">${baht(sum)}</b><span>รวมรายรับอื่นๆ</span></div><div class="stat"><b class="num">${L.length}</b><span>ครั้ง</span></div></div>`;
  if(!L.length)return h+`<div class="empty"><b>ยังไม่มีรายรับอื่นๆ</b>กด "+ บันทึกรายรับ" ทุกครั้งที่เก็บเงิน เช่น ค่าเช่าที่หน้าร้านวันละ 100 บาท</div>`;
  return h+'<div class="list">'+L.map(e=>`<div class="row"><div class="grow"><div class="t">${esc(e.cat||'รายรับอื่นๆ')}</div><div class="s">${dshort(e.at)} ${hm(e.at)}${e.note?' · '+esc(e.note):''}${e.by?' · บันทึกโดย '+esc(e.by):''}</div></div><div class="r"><b style="color:var(--jade)">+${baht(e.amount)}</b></div><button class="btn sm danger" data-act="delInc" data-id="${e.id}" data-confirm="1" type="button">ลบ</button></div>`).join('')+'</div>'}
function sheetIncome(){const cats=incCats();
  $('#panel').innerHTML=head('บันทึกรายรับอื่นๆ')+`<form class="sh-body">
   <div class="field"><label for="iCat">ประเภท</label><select id="iCat">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}<option value="__new">+ พิมพ์ประเภทใหม่…</option></select></div>
   <div class="field" id="iNewWrap" hidden><label for="iNew">ชื่อประเภทใหม่</label><input id="iNew" maxlength="40" placeholder="เช่น ค่าจอดรถ" autocomplete="off"></div>
   <div class="grid2"><div class="field"><label for="iAmt">จำนวนเงิน (บาท)</label><input id="iAmt" inputmode="decimal" placeholder="0"></div><div class="field"><label for="iDate">วันที่</label><input id="iDate" type="date" value="${toDateInput(Date.now())}"></div></div>
   <div class="field"><label for="iNote">หมายเหตุ</label><input id="iNote" maxlength="120" placeholder="เช่น ให้เช่าที่ขายของหน้าร้าน ร้านลูกชิ้นป้าแดง" autocomplete="off"></div>
   <div class="field"><label for="iWho">รับเงินจาก (ถ้ามี)</label><input id="iWho" maxlength="60" placeholder="ชื่อผู้เช่า / ผู้จ่าย" autocomplete="off"></div></form>
   <div class="sh-foot"><button class="btn pri wide" data-act="saveInc" type="button">บันทึกรายรับ</button></div>`;
  $('#iCat').addEventListener('change',e=>{$('#iNewWrap').hidden=e.target.value!=='__new';if(!$('#iNewWrap').hidden)$('#iNew').focus()});setTimeout(()=>$('#iAmt')?.focus(),60)}
Object.assign(ACT,{
  income:()=>{if(!can('expenses'))return deny();openSheet({type:'income'})},
  saveInc:async()=>{const amount=nval('iAmt');if(!(amount>0))return toast('ใส่จำนวนเงิน','bad');let cat=val('iCat');if(cat==='__new'){cat=val('iNew');if(!cat)return toast('ใส่ชื่อประเภท','bad')}
    const note=[val('iNote'),val('iWho')?'จาก '+val('iWho'):''].filter(Boolean).join(' · ');
    const ok=await write('incomes/'+uid(),r=>r.set({cat:cat.slice(0,40),amount:r2(amount),note,at:fromDateInput(val('iDate')),by:S.me||''}));
    if(ok){closeSheet();toast('บันทึกรายรับ '+baht(amount)+' แล้ว');S.report.data=null}},
  delInc:d=>write('incomes/'+d.id,r=>r.delete()).then(ok=>{if(ok){toast('ลบรายรับแล้ว');S.report.data=null}})
});

init();
</script>
</body>
</html>

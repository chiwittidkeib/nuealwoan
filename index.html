<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111614">
<meta name="color-scheme" content="dark">
<script>document.documentElement.setAttribute("data-theme","dark")</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>NueaLwoan</title>
<meta name="apple-mobile-web-app-title" content="NueaLwoan">
<meta name="application-name" content="NueaLwoan">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@400;500&display=swap">
<style>
/* Layout: sticky shop header, single working column (max 1080px), bottom tab bar on every width; work happens in a slide-up sheet. */
:root{
  --bg:#f3f5f0; --surface:#ffffff; --sunk:#e9ece5; --line:#d9ded4; --veil-rgb:243,245,240; --veil-a:.5;
  --fg:#1c2420; --muted:#5f6b64;
  --jade:#17694f; --jade-soft:#dcefe5; --on-jade:#ffffff;
  --chili:#b23d27; --chili-soft:#f7e2db;
  --amber:#946207; --amber-soft:#f5e8cc;
  --shadow:0 10px 30px rgba(20,40,30,.14);
  --f-display:"Mitr","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#1a201d; --sunk:#151a18; --line:#2b3430; --veil-rgb:17,22,20;
  --fg:#e8eee9; --muted:#9aa69f;
  --jade:#5ec59c; --jade-soft:#1c3a2e; --on-jade:#0b1912;
  --chili:#f08c74; --chili-soft:#3d231c;
  --amber:#e4b75c; --amber-soft:#382d16;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1a201d; --sunk:#151a18; --line:#2b3430; --veil-rgb:17,22,20;
  --fg:#e8eee9; --muted:#9aa69f;
  --jade:#5ec59c; --jade-soft:#1c3a2e; --on-jade:#0b1912;
  --chili:#f08c74; --chili-soft:#3d231c;
  --amber:#e4b75c; --amber-soft:#382d16;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea.qrs{display:grid!important;grid-template-columns:repeat(3,1fr);gap:10mm;padding:8mm}
  #printArea.rcpt{display:block!important}
  #printArea .rc{width:100%;box-shadow:none;border:0;padding:0;margin:0}
  body{background:#fff;color:#000}
}
.pq{border:1px dashed #999;border-radius:8px;padding:8px;text-align:center;break-inside:avoid;color:#000;background:#fff}
.pq svg{width:100%;max-width:200px;height:auto}
.pq b{display:block;font-family:var(--f-display);font-size:22px;font-weight:500}
.pq small{display:block;font-size:12px}
.login{max-width:380px;margin:40px auto;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.login h2{font-size:22px}
.sm-sel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;min-height:34px;font-size:13.5px}
.lg-brand{display:flex;gap:12px;align-items:center;margin-bottom:4px}
.lg-mark{width:48px;height:48px;border-radius:12px;background:var(--jade);display:flex;align-items:center;justify-content:center;flex:none}
.lg-mark svg{width:28px;height:28px;stroke:var(--on-jade);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pw{position:relative}
.pw input{padding-right:64px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--jade);font-weight:500;cursor:pointer;padding:6px}
.err{color:var(--chili);font-size:13.5px;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.num,.money{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;line-height:1.25}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand h1{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);font-size:12.5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:6px;vertical-align:1px}
.dot.on{background:var(--jade)}.dot.off{background:var(--chili)}

.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:16px 110px;display:flex;flex-direction:column;gap:18px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;cursor:pointer;position:relative}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="true"]{color:var(--jade);font-weight:600}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--chili);color:#fff;font-size:11px;line-height:18px;font-weight:600}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.btn.pri:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--chili);border-color:var(--chili-soft)}
.btn.danger[data-armed]{background:var(--chili);color:#fff;border-color:var(--chili)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13.5px;border-radius:8px}
.btn.wide{flex:1}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:19px}
.sec-h .hint{color:var(--muted);font-size:13px}
.muted{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--jade-soft);color:var(--jade)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.bad{background:var(--chili-soft);color:var(--chili)}
.pill.mute{background:var(--sunk);color:var(--muted)}

/* stat strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{color:var(--muted);font-size:12.5px}
@media (max-width:560px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* tables */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{border:1px dashed var(--line);background:transparent;border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:118px}
.tcard .no{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--muted)}
.tcard .no small{font-size:13px;font-family:var(--f-body);margin-left:4px}
.tcard.busy{border:1.5px solid var(--jade);background:var(--surface);box-shadow:0 1px 0 var(--line)}
.tcard.busy .no{color:var(--fg)}
.tcard .meta{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;margin-top:auto}
.tcard .tot{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.tcard.add{border-style:dashed;align-items:center;justify-content:center;color:var(--jade);font-weight:600}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted)}
.row .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.click{cursor:pointer}
.row.click:hover{background:var(--sunk)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-weight:500;font-size:17px;margin-bottom:4px}

.subtabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:11px}
.subtabs button{flex:1;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
.subtabs button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:5px;max-width:220px}
.meter i{display:block;height:100%;background:var(--jade)}
.meter.low i{background:var(--chili)}

/* kitchen */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;align-items:start}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kcard header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--sunk);gap:8px}
.kcard header h3{font-size:17px}
.kline{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-top:1px solid var(--line)}
.kline .q{font-family:var(--f-display);font-size:18px;min-width:30px}
.kline .grow{flex:1;min-width:0}
.note{font-size:13px;color:var(--amber)}

/* report */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi b{display:block;font-family:var(--f-display);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.kpi.hero{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.kpi.hero span{color:var(--on-jade);opacity:.85}
.kpi.neg b{color:var(--chili)}
.kpi.hero.neg{background:var(--chili);border-color:var(--chili)}
.kpi.hero.neg b{color:#fff}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:16px}
.kv{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.kv.tot{border-top:1px solid var(--line);padding-top:8px;font-weight:600}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:62px 1fr 78px;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.bar .track{height:14px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--jade);border-radius:0 3px 3px 0}
.bar .v{text-align:right}
.bar .d{color:var(--muted)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,20,15,.42);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:94%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden}
@media (min-width:760px){.sheet{align-items:stretch;justify-content:flex-end}.panel{max-height:none;height:100%;border-radius:0;max-width:560px}}
.sh-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.sh-head .grow{flex:1;min-width:0}
.sh-head h2{font-size:20px}
.sh-head small{color:var(--muted);font-size:13px}
.sh-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.sh-foot{border-top:1px solid var(--line);background:var(--surface);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.x{border:0;background:var(--sunk);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px;min-height:44px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--jade);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--jade)}
.help{font-size:12.5px;color:var(--muted)}

/* order lines */
.lines{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.line{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.line:first-child{border-top:0}
.line-top{display:flex;gap:10px;align-items:center}
.line-top .grow{flex:1;min-width:0}
.line-top .nm{font-weight:500}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stepper button{border:0;background:none;width:34px;height:34px;cursor:pointer;font-size:18px}
.stepper span{min-width:24px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.line-act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lnk{border:0;background:none;color:var(--jade);cursor:pointer;padding:2px 0;font-size:13px;font-weight:500}
.editor{background:var(--sunk);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:8px}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pitem{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:68px}
.pitem:active{transform:scale(.98)}
.pitem b{font-weight:500;font-size:14px;line-height:1.35}
.pitem span{color:var(--jade);font-variant-numeric:tabular-nums;font-weight:600;margin-top:auto}
.pitem.flash{border-color:var(--jade);background:var(--jade-soft)}

.total-line{display:flex;flex-direction:column;flex:1;min-width:120px}
.total-line small{color:var(--muted);font-size:12.5px}
.total-line b{font-family:var(--f-display);font-weight:500;font-size:24px;font-variant-numeric:tabular-nums}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--jade);background:var(--jade-soft);color:var(--jade)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.bigsum{text-align:center;padding:6px 0}
.bigsum small{color:var(--muted)}
.bigsum b{display:block;font-family:var(--f-display);font-weight:500;font-size:40px;font-variant-numeric:tabular-nums;line-height:1.15}
.change{display:flex;justify-content:space-between;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.change b{font-family:var(--f-display);font-weight:500;font-size:26px;font-variant-numeric:tabular-nums}
.qrbox{background:#fff;color:#123;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line)}
.qrbox svg{width:min(240px,70vw);height:auto;display:block}
.qrbox .pp{font-weight:700;letter-spacing:.06em;color:#103e6e;font-size:13px}
.qrbox .amt{font-family:var(--f-display);font-size:22px}

/* customer mode */
.cust{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.cust-head{background:var(--jade);color:var(--on-jade);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;display:flex;align-items:center;gap:12px}
.cust-head .grow{flex:1;min-width:0}
.cust-head h2{font-size:22px}
.cust-head small{opacity:.85}
.cust-head .btn{background:transparent;color:var(--on-jade);border-color:currentColor;min-height:36px}
.cust-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;max-width:900px;width:100%;margin:0 auto}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.citem{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:104px;position:relative}
.citem b{font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1.3}
.citem span{margin-top:auto;font-weight:600;color:var(--jade);font-variant-numeric:tabular-nums}
.citem em{position:absolute;top:8px;right:8px;font-style:normal;background:var(--jade);color:var(--on-jade);border-radius:999px;min-width:24px;height:24px;line-height:24px;text-align:center;font-weight:600;font-size:13px}
.cust-foot{background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 10px}
.done h2{font-size:26px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:80;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.bad{background:var(--chili);color:#fff}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
.thumb{width:52px;height:52px;border-radius:9px;overflow:hidden;flex:none;background:var(--sunk)}
.thumb img,.cimg img,.photo-box img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.none,.cimg.none{display:flex;align-items:center;justify-content:center;font-family:var(--f-display);color:var(--muted);font-size:20px}
.pimg{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:7px;margin-bottom:4px;background:var(--sunk)}
.citem{padding:0;overflow:hidden}
.citem>b,.citem>span{padding:0 14px}
.citem>span{padding-bottom:12px}
.cimg{width:100%;aspect-ratio:4/3;background:var(--sunk)}
.cimg.none{font-size:34px}
.photo-edit{display:flex;gap:14px;align-items:center}
.photo-box{width:120px;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--sunk);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;flex:none}
.photo-act{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);

const num=n=>r2(n).toLocaleString('th-TH',{maximumFractionDigits:2});
const baht=n=>(n<0?'−':'')+'฿'+num(Math.abs(n));

const queues={};
function errMsg(e){const c=e&&e.code;
  if(c==='not_found')return 'ไม่พบรายการนี้แล้ว อาจถูกลบหรือปิดจากอีกเครื่อง';
  if(c==='quota_exceeded')return 'พื้นที่ฐานข้อมูลเต็ม ลบบิลหรือรายการเก่าบางส่วนก่อน';
  if(c==='invalid_argument')return 'บันทึกไม่สำเร็จ บัญชีนี้ไม่มีสิทธิ์แก้ไข หรือข้อมูลไม่ถูกต้อง';
  if(c==='resource_exhausted')return 'ใช้งานถี่เกินไป รอสักครู่แล้วลองใหม่';
  if(c==='revoked'||c==='not_granted')return 'การเชื่อมต่อฐานข้อมูลถูกปิด เปิดหน้านี้ใหม่';
  return 'เชื่อมต่อฐานข้อมูลไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองอีกครั้ง';}
function write(path,fn){
  if(!S.db){toast('ยังไม่ได้เชื่อมฐานข้อมูล','bad');return Promise.resolve(false)}
  const run=async()=>{try{await fn(S.db.doc(path));return true}catch(e){
    if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,500+Math.random()*700));try{await fn(S.db.doc(path));return true}catch(e2){toast(errMsg(e2),'bad');return false}}
    toast(errMsg(e),'bad');return false}};
  const q=(queues[path]||Promise.resolve()).then(run);queues[path]=q;return q;}
let toastT;
function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.className='toast'+(kind?' '+kind:'');t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,kind==='bad'?4200:2200)}

function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function ppPayload(id,amount){
  let t=String(id||'').replace(/\D/g,''),tag;
  if(t.length===15)tag='03';else if(t.length>=13){tag='02';t=t.slice(0,13)}else{tag='01';t=('0000000000000'+t.replace(/^0/,'66')).slice(-13)}
  const f=(k,v)=>k+String(v.length).padStart(2,'0')+v;
  let p=f('00','01')+f('01',amount>0?'12':'11')+f('29',f('00','A000000677010111')+f(tag,t))+f('58','TH')+f('53','764');
  if(amount>0)p+=f('54',amount.toFixed(2));
  p+='6304';return p+crc16(p);}
function qrSvg(text){try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:6,margin:2,scalable:true})}catch(e){return '<p>สร้าง QR ไม่ได้</p>'}}
const ppValid=id=>{const d=String(id||'').replace(/\D/g,'');return d.length===10||d.length===13||d.length===15};

const LOGIN_DOMAIN=()=>String((window.APP_CONFIG||{}).LOGIN_DOMAIN||'nuealwoan.com').replace(/^@/,'');
const cleanUser=u=>String(u||'').trim().toLowerCase();
const userToEmail=u=>{u=cleanUser(u);return u.includes('@')?u:u+'@'+LOGIN_DOMAIN()};
const emailToUser=e=>{e=String(e||'');const d='@'+LOGIN_DOMAIN();return e.toLowerCase().endsWith(d)?e.slice(0,-d.length):e};

async function login(){

}

async function startData(){
  S.state='loading';render();
  const st=await SB.rpc('my_role');
  if(st.error){S.state='offline';render();return}
  if(!['owner','staff','waiter','chef','partner'].includes(st.data)){S.state='nostaff';render();return}
  S.role=st.data;
  if(S.role==='owner'){try{const m=localStorage.getItem('nl_mode');if(m&&ROLES[m]&&m!=='owner')S.viewAs=m}catch(e){}}
  const u=await SB.auth.getUser();S.me=emailToUser(u.data.user?.email||'');

  const db=makeDb(SB);
  S.db=db;S.state='ready';render();
  const day0=sod();setInterval(()=>{if(sod()!==day0&&!S.sheet&&!S.cust)location.reload()},60000);
  db.doc('config/permissions').onSnapshot(s=>{S.perms=s.exists?(s.data().roles||null):null;render();refreshSheet()},onErr);
  db.doc('config/settings').onSnapshot(s=>{S.settings={...DEFAULTS,...(s.exists?s.data():{})};render();refreshSheet()},onErr);
  db.collection('menu').onSnapshot(s=>{S.menu=s.docs.map(d=>({id:d.id,...d.data()}));sortMenu();render();refreshSheet('menu')},onErr);
  db.collection('stock').onSnapshot(s=>{S.stock=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.name).localeCompare(String(b.name),'th'));render()},onErr);
  db.collection('orders').where('status','==','open').onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]={id:d.id,...d.data()});S.open=o;render();refreshSheet('order')},onErr);
  db.collection('orders').where('status','==','paid').where('paidAt','>=',sod()).onSnapshot(s=>{S.today=s.docs.map(d=>({id:d.id,...d.data()}));render()},onErr);
  db.collection('members').onSnapshot(s=>{S.members=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.lastAt||0)-(a.lastAt||0));if(S.tab==='back')render()},onErr);
  const since=sod()-30*DAY;
  db.collection('purchases').where('at','>=',since).onSnapshot(s=>{S.purch=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at);render()},onErr);
  db.collection('expenses').where('at','>=',since).onSnapshot(s=>{S.exp=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at);render()},onErr);
}

    h+=low.length?'<div class="list">'+low.map(s=>`<div class="row"><div class="grow"><div class="t">${esc(s.name)}</div><div class="s">เหลือ ${num(s.qty)} ${esc(s.unit)} · จุดสั่งซื้อ ${num(s.min)} ${esc(s.unit)}</div></div><button class="btn sm pri" data-act="purchase" data-id="${s.id}" type="button">ซื้อเติม</button></div>`).join('')+'</div>':`<div class="empty"><b>ของยังพอใช้ทุกรายการ</b>รายการที่ใกล้หมดจะขึ้นที่นี่ให้ซื้อเติมได้ทันที</div>`;
    h+=`<div class="sec-h"><h2>วัตถุดิบทั้งหมด</h2><button class="btn sm" data-act="stockEdit" type="button">+ เพิ่มวัตถุดิบ</button></div>`;
    if(!S.stock.length)return h+`<div class="empty"><b>ยังไม่มีวัตถุดิบ</b>เพิ่มเส้น ลูกชิ้น เนื้อสัตว์ ผัก เพื่อติดตามของคงเหลือและต้นทุน</div>`;

    const sum=S.purch.filter(p=>p.at>=sod()-29*DAY).reduce((s,p)=>s+(+p.amount||0),0);
    h+=`<div class="sec-h"><h2>ซื้อของ 30 วันล่าสุด</h2><button class="btn pri sm" data-act="purchase" type="button">+ บันทึกการซื้อ</button></div>

    return h+'<div class="list">'+S.purch.map(p=>`<div class="row"><div class="grow"><div class="t">${esc(p.name)} <span class="muted">${num(p.qty)} ${esc(p.unit||'')}</span></div><div class="s">${dshort(p.at)} ${hm(p.at)}${p.note?' · '+esc(p.note):''}</div></div><div class="r"><b>${baht(p.amount)}</b></div><button class="btn sm danger" data-act="delPurch" data-id="${p.id}" data-confirm="1" type="button">ลบ</button></div>`).join('')+'</div>';}
  const sum=S.exp.reduce((s,e)=>s+(+e.amount||0),0);

  if(!S.exp.length)return h+`<div class="empty"><b>ยังไม่มีรายจ่าย</b>บันทึกค่าเช่า ค่าแรง ค่าไฟ ค่าแก๊ส เพื่อดูกำไรสุทธิที่แท้จริง</div>`;
  return h+'<div class="list">'+S.exp.map(e=>`<div class="row"><div class="grow"><div class="t">${esc(e.cat)}</div><div class="s">${dshort(e.at)}${e.note?' · '+esc(e.note):''}</div></div><div class="r"><b>${baht(e.amount)}</b></div><button class="btn sm danger" data-act="delExp" data-id="${e.id}" data-confirm="1" type="button">ลบ</button></div>`).join('')+'</div>';

/* ---------- report ---------- */
const RANGES={today:'วันนี้',yesterday:'เมื่อวาน',week:'7 วัน',month:'เดือนนี้',lastmonth:'เดือนก่อน'};
function rangeOf(k){const t0=sod(),d=new Date(t0);
  if(k==='yesterday')return [t0-DAY,t0];
  if(k==='week')return [t0-6*DAY,t0+DAY];
  if(k==='month')return [new Date(d.getFullYear(),d.getMonth(),1).getTime(),new Date(d.getFullYear(),d.getMonth()+1,1).getTime()];
  if(k==='lastmonth')return [new Date(d.getFullYear(),d.getMonth()-1,1).getTime(),new Date(d.getFullYear(),d.getMonth(),1).getTime()];
  return [t0,t0+DAY];}
async function loadReport(){
  if(!S.db)return;const key=S.report.range,[a,b]=rangeOf(key);S.report.loading=true;render();
  try{const [os,ps,es]=await Promise.all([
      S.db.collection('orders').where('status','==','paid').where('paidAt','>=',a).get(),
      S.db.collection('purchases').where('at','>=',a).get(),
      S.db.collection('expenses').where('at','>=',a).get()]);
    const f=(snap,k)=>snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x[k]<b);
    if(S.report.range===key)S.report.data={key,a,b,orders:f(os,'paidAt').sort((x,y)=>y.paidAt-x.paidAt),purch:f(ps,'at'),exp:f(es,'at')};
  }catch(e){toast(errMsg(e),'bad')}
  S.report.loading=false;render();}
function viewReport(){
  let h=`<div class="sec-h"><h2>สรุปการเงิน</h2><button class="btn sm" data-act="reload" type="button">${S.report.loading?'กำลังโหลด…':'โหลดใหม่'}</button></div>
  <div class="chips">${Object.entries(RANGES).map(([k,v])=>`<button class="chip" aria-pressed="${S.report.range===k}" data-act="range" data-v="${k}" type="button">${v}</button>`).join('')}</div>`;
  const D=S.report.data;
  if(!D||D.key!==S.report.range){if(!S.report.loading)setTimeout(loadReport,0);return h+`<div class="empty"><b>กำลังรวมยอด…</b>คำนวณยอดขาย ต้นทุน และรายจ่ายของช่วงที่เลือก</div>`}
  const sales=D.orders.reduce((s,o)=>s+(+o.total||0),0);
  const disc=D.orders.reduce((s,o)=>s+(+o.discount||0),0);
  const cogs=D.orders.reduce((s,o)=>s+(+o.cost||0),0);
  const sumBy=f=>D.orders.filter(f).reduce((s,o)=>s+(+o.total||0),0);
  const cash=sumBy(o=>o.method==='cash'),pp=sumBy(o=>o.method==='promptpay');
  const gpT=D.orders.reduce((s,o)=>s+(+o.gp||0),0),platGross=sumBy(o=>DELIV.includes(o.method)),platNet=r2(platGross-gpT);
  const buy=D.purch.reduce((s,p)=>s+(+p.amount||0),0);
  const exp=D.exp.reduce((s,e)=>s+(+e.amount||0),0);
  const vatT=D.orders.reduce((s,o)=>s+(+o.vat||0),0);
  const gross=sales-vatT-cogs-gpT,net=gross-exp,flow=cash+pp+platNet-buy-exp-vatT;
  const gm=sales?Math.round(gross/sales*100):0;
  h+=`<p class="muted" style="margin:0">${dshort(D.a)}${D.b-D.a>DAY?' – '+dshort(D.b-1):''} · ${D.orders.length} บิล${disc?' · ส่วนลดรวม '+baht(disc):''}</p>
  <div class="kpis">
    <div class="kpi"><span>ยอดขาย</span><b>${baht(sales)}</b></div>
    ${vatT?`<div class="kpi"><span>VAT ในยอดขาย</span><b>${baht(vatT)}</b></div>`:''}
    <div class="kpi"><span>ต้นทุนอาหาร${gpT?' + GP':''}</span><b>${baht(cogs+gpT)}</b></div>
    <div class="kpi"><span>กำไรขั้นต้น · ${gm}%</span><b>${baht(gross)}</b></div>
    <div class="kpi"><span>รายจ่ายร้าน</span><b>${baht(exp)}</b></div>
    <div class="kpi hero ${net<0?'neg':''}"><span>กำไรสุทธิ</span><b>${baht(net)}</b></div></div>
  <div class="two">
   <div class="card"><h3>เงินเข้า–ออกจริง</h3>
    <div class="kv"><span>รับเงินสด</span><span>${baht(cash)}</span></div>
    <div class="kv"><span>รับพร้อมเพย์</span><span>${baht(pp)}</span></div>
    ${platGross?`<div class="kv"><span>รับจากแอปเดลิเวอรี่ (หัก GP แล้ว)</span><span>${baht(platNet)}</span></div>`:''}
    ${vatT?`<div class="kv"><span>ภาษีขาย (VAT) ที่ต้องนำส่ง</span><span>${baht(-vatT)}</span></div>`:''}
    <div class="kv"><span>จ่ายซื้อของ</span><span>${baht(-buy)}</span></div>
    <div class="kv"><span>จ่ายรายจ่ายร้าน</span><span>${baht(-exp)}</span></div>
    <div class="kv tot"><span>เงินคงเหลือสุทธิ</span><span style="color:var(${flow<0?'--chili':'--jade'})">${baht(flow)}</span></div>
    <p class="help" style="margin:0">กำไรสุทธิคิดต้นทุนจาก "ต้นทุนต่อจาน" ของเมนูที่ขายได้ ส่วนเงินคงเหลือนับค่าซื้อของที่จ่ายจริงในช่วงนี้ ของที่ซื้อตุนไว้จึงทำให้สองตัวเลขต่างกัน</p></div>`;
  // by channel
  const chs=['dinein','walkin','takeaway',...DELIV].map(c=>{const os=D.orders.filter(o=>chOf(o)===c);return [c,os.length,os.reduce((s,o)=>s+(+o.total||0),0),os.reduce((s,o)=>s+(+o.gp||0),0)]}).filter(x=>x[1]);
  if(chs.length)h=h.replace('<div class="two">',`<div class="two"><div class="card"><h3>ยอดขายแยกช่องทาง</h3>${chs.map(([c,n,v,g])=>`<div class="kv"><span><span class="chip-ch" style="--chc:${CH[c].c}">${CH[c].n}</span> ${n} บิล</span><span>${baht(v)}${g?` <small class="muted">GP ${baht(g)}</small>`:''}</span></div>`).join('')}</div>`);
  // top items
  const agg={};D.orders.forEach(o=>(o.items||[]).forEach(l=>{const k=l.name;agg[k]=agg[k]||{q:0,v:0};agg[k].q+=l.qty;agg[k].v+=lineAmt(l)}));
  const top=Object.entries(agg).sort((a,b)=>b[1].q-a[1].q).slice(0,8);
  h+=`<div class="card"><h3>เมนูขายดี</h3>${top.length?top.map(([n,x])=>`<div class="kv"><span>${esc(n)}</span><span>${x.q} จาน · ${baht(x.v)}</span></div>`).join(''):'<p class="muted" style="margin:0">ยังไม่มีการขายในช่วงนี้</p>'}</div>`;
  // by day
  if(D.b-D.a>DAY){const days=[];for(let t=D.a;t<D.b&&t<=sod();t+=DAY){const e=t+DAY;days.push([t,D.orders.filter(o=>o.paidAt>=t&&o.paidAt<e).reduce((s,o)=>s+(+o.total||0),0)])}
    const mx=Math.max(1,...days.map(d=>d[1]));
    h+=`<div class="card"><h3>ยอดขายรายวัน</h3><div class="bars">${days.map(([t,v])=>`<div class="bar"><span class="d">${dshort(t)}</span><div class="track"><i style="width:${v/mx*100}%"></i></div><span class="v">${baht(v)}</span></div>`).join('')}</div></div>`}
  // expenses by cat
  const ec={};D.exp.forEach(e=>ec[e.cat]=(ec[e.cat]||0)+(+e.amount||0));
  h+=`<div class="card"><h3>รายจ่ายตามหมวด</h3>${Object.keys(ec).length?Object.entries(ec).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="kv"><span>${esc(k)}</span><span>${baht(v)}</span></div>`).join(''):'<p class="muted" style="margin:0">ไม่มีรายจ่ายร้านในช่วงนี้</p>'}${buy?`<div class="kv tot"><span>ค่าซื้อวัตถุดิบ (${D.purch.length} รายการ)</span><span>${baht(buy)}</span></div>`:''}</div></div>`;
  h+=`<div class="sec-h"><h2>บิลที่ชำระแล้ว</h2><span class="hint">แตะเพื่อดูรายละเอียด</span></div>`;
  h+=D.orders.length?'<div class="list">'+D.orders.slice(0,100).map(o=>`<div class="row click" data-act="bill" data-id="${o.id}"><div class="grow"><div class="t">${esc(tableLabel(o))} <span class="pill ${o.method==='cash'?'mute':'ok'}">${methodName(o.method)}</span></div><div class="s">${o.orderNo?esc(o.orderNo)+' · ':''}${dshort(o.paidAt)} ${hm(o.paidAt)} · ${linesCount(o.items)} รายการ</div></div><div class="r"><b>${baht(o.total)}</b></div></div>`).join('')+'</div>':`<div class="empty"><b>ยังไม่มีบิลในช่วงนี้</b>บิลจะขึ้นที่นี่หลังกดรับเงิน</div>`;
  return h;
}

/* ---------- sheets ---------- */
function openSheet(s){S.sheet=s;renderSheet();$('#sheet').hidden=false}
function closeSheet(){S.sheet=null;$('#sheet').hidden=true;$('#panel').innerHTML=''}
function refreshSheet(kind){const s=S.sheet;if(!s)return;
  if((s.type==='order'||s.type==='pay')&&kind!=='menu'){if(!S.open[s.id]){closeSheet();return}
    if(s.type==='order')renderOrderLines();else payUpdate()}

  ({order:sheetOrder,pay:sheetPay,menuEdit:sheetMenu,stockEdit:sheetStock,purchase:sheetPurchase,expense:sheetExpense,settings:sheetSettings,walkinQr:sheetWalkinQr,openTbl:sheetOpenTbl,newDel:sheetNewDel,staffNew:sheetStaffNew,staffPw:sheetStaffPw,bill:sheetBill,qr:sheetQr,receipt:sheetReceipt,member:sheetMember}[s.type])();}
const head=(t,sub)=>`<div class="sh-head"><div class="grow"><h2>${t}</h2>${sub?`<small>${sub}</small>`:''}</div><button class="x" data-act="close" type="button" aria-label="ปิด">×</button></div>`;

/* order */
async function openTable(t){

function sheetWalkinQr(){const k=S.settings.qrKey;
  if(!k){$('#panel').innerHTML=head('QR ให้ลูกค้าสั่งเอง')+`<div class="sh-body"><div class="empty"><b>ยังไม่มีรหัส QR</b>ให้แอดมินเปิด ตั้งค่าร้าน → QR ประจำโต๊ะ ก่อน</div></div>`;return}

function payCalc(){const o=S.open[S.sheet.id],s=S.sheet,st=S.settings;const sub=linesTotal(o.items);const disc=Math.min(sub,Math.max(0,parseFloat(s.discount)||0));

async function confirmPay(){const id=S.sheet.id,o=S.open[id];if(!o)return;const c=payCalc(),m=S.sheet.method,sh=S.sheet;
  $('#payOk').disabled=true;
  let paidItems=null,changed=false,fail=false,patch=null;
  const mem=S.settings.pointsOn&&(sh.member||sh.memberNew)?{phone:sh.phone,name:sh.member?(sh.member.name||''):(val('payName')||'')}:null;
  const billNo=o.orderNo||await nextBillNo();
  const memFields=mem?{memberPhone:mem.phone,memberName:mem.name,ptsUsed:c.use,ptsEarned:c.earn,redeem:c.redeem,ptsBalance:Math.max(0,(+(sh.member?.points)||0)-c.use)+c.earn}:{};
  try{await S.db.doc('orders/'+id).transform(d=>{
      if(d.status!=='open')return null;
      const tot=vatCalc(linesTotal(d.items)-c.disc-c.redeem).total;
      if(Math.abs(tot-c.total)>0.001){changed=true;return null}
      paidItems=(d.items||[]).map(l=>({...l,served:true}));
      patch={status:'paid',paidAt:Date.now(),billNo,method:m,subtotal:r2(c.sub),discount:r2(c.disc),total:c.total,cost:r2(linesCost(d.items)),received:m==='cash'?c.recv:c.total,change:m==='cash'?c.change:0,channel:chOf(d),ref:d.ref||'',gp:c.gp,net:c.net,vat:c.vat,vatRate:c.vatRate,vatMode:c.vatMode,beforeVat:c.beforeVat,items:paidItems,...memFields};
      return patch;
    })}catch(e){fail=true;toast(errMsg(e),'bad')}
  if(fail){$('#payOk').disabled=false;return}
  if(changed){toast('มีรายการเพิ่มเข้ามาในบิลนี้ ตรวจยอดใหม่ก่อนรับเงิน','bad');payUpdate();return}
  if(!paidItems){closeSheet();toast('บิลนี้ถูกปิดไปแล้วจากอีกเครื่อง','bad');return}
  deductStock(paidItems);
  const paid={id,table:o.table,label:o.label,openedAt:o.openedAt,...patch};
  if(mem){try{const bal=await applyPoints(mem.phone,mem.name,c.use,c.earn,c.total);if(bal!==paid.ptsBalance){paid.ptsBalance=bal;write('orders/'+id,r=>r.update({ptsBalance:bal}))}}catch(e){toast('บันทึกแต้มไม่สำเร็จ: '+errMsg(e),'bad')}}
  openSheet({type:'receipt',order:paid,mode:'receipt'});
  toast(m==='cash'?`รับเงิน ${baht(c.total)} · ทอน ${baht(c.change)}`:m==='promptpay'?`รับพร้อมเพย์ ${baht(c.total)} แล้ว`:`ปิดออร์เดอร์ ${CH[m].n} แล้ว`);}
async function nextBillNo(){const d=new Date(),day=String(d.getFullYear()%100).padStart(2,'0')+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  const ref=S.db.doc('config/counter');
  try{const p=await ref.transform(x=>({day,n:x.day===day?(+x.n||0)+1:1}));return day+'-'+String(p.n).padStart(3,'0')}
  catch(e){if(e.code==='not_found'){try{await ref.set({day,n:1});return day+'-001'}catch(e2){}}}
  return day+'-'+String(Date.now()).slice(-5);}
async function applyPoints(phone,name,used,earned,spent){const ref=S.db.doc('members/'+phone);
  try{const p=await ref.transform(d=>({points:Math.max(0,(+d.points||0)-used)+earned,totalSpent:r2((+d.totalSpent||0)+spent),visits:(+d.visits||0)+1,lastAt:Date.now(),...(name&&!d.name?{name}:{})}));return p.points}
  catch(e){if(e.code!=='not_found')throw e;
    await ref.set({phone,name:name||'',points:earned,totalSpent:r2(spent),visits:1,createdAt:Date.now(),lastAt:Date.now()});return earned}}
function deductStock(items){const need={};
  (items||[]).forEach(l=>{const m=S.menu.find(x=>x.id===l.menuId);(m?.recipe||[]).forEach(g=>{if(g.stockId)need[g.stockId]=(need[g.stockId]||0)+(+g.qty||0)*l.qty})});
  Object.entries(need).forEach(([sid,q])=>{const s=S.stock.find(x=>x.id===sid);if(!s)return;s.qty=r2((+s.qty||0)-q);write('stock/'+sid,r=>r.transform(d=>({qty:r2((+d.qty||0)-q)})))});}

async function shrinkImage(file,max=900,q=0.82){
  let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){bmp=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)})}
  const w=bmp.width,h=bmp.height,k=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(ok=>c.toBlob(ok,'image/jpeg',q));}

  if(error)throw {code:/policy|security|Unauthorized|403/i.test(error.message)?'invalid_argument':'unavailable',message:error.message};
  return {path,url:SB.storage.from('menu-photos').getPublicUrl(path).data.publicUrl};}

  box.innerHTML=R.length?R.map((g,i)=>{const s=S.stock.find(x=>x.id===g.stockId);return `<div style="display:grid;grid-template-columns:1fr 92px auto;gap:6px;align-items:end;margin-top:8px">
   <div class="field"><label for="ig${i}">วัตถุดิบ</label><select id="ig${i}" data-ing="${i}" data-k="stockId"><option value="">เลือก</option>${S.stock.map(s=>`<option value="${s.id}" ${s.id===g.stockId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
   <div class="field"><label for="iq${i}">ใช้ (${esc(s?.unit||'หน่วย')})</label><input id="iq${i}" data-ing="${i}" data-k="qty" inputmode="decimal" value="${g.qty??''}"></div>
   <button class="btn sm ghost" data-act="delIng" data-i="${i}" type="button" aria-label="ลบ">×</button></div>`}).join(''):(S.stock.length?'':'<p class="help" style="margin:8px 0 0">ยังไม่มีวัตถุดิบในสต็อก เพิ่มได้ที่แท็บหลังบ้าน</p>');}
function readIng(){document.querySelectorAll('[data-ing]').forEach(e=>{const g=S.sheet.recipe[+e.dataset.ing];if(!g)return;g[e.dataset.k]=e.dataset.k==='qty'?(parseFloat(e.value)||0):e.value})}
async function saveMenu(){readIng();const name=val('mName');if(!name)return toast('ใส่ชื่อเมนูก่อน','bad');
  const data={name,desc:val('mDesc'),cat:val('mCat'),price:nval('mPrice'),cost:nval('mCost'),active:$('#mActive').checked,recipe:S.sheet.recipe.filter(g=>g.stockId&&g.qty>0)};
  const id=S.sheet.id||S.sheet.newId||(S.sheet.newId=S.db.collection('menu').doc().id);
  const ph=S.sheet.photo,oldPath=ph.path;let drop=null;
  if(ph.file){const btn=document.querySelector('[data-act="saveMenu"]');btn.disabled=true;btn.textContent='กำลังอัปโหลดรูป…';
    try{const up=await uploadMenuPhoto(id,ph.file);data.img=up.url;data.imgPath=up.path;drop=oldPath}
    catch(e){btn.disabled=false;btn.textContent='บันทึกเมนู';return toast(e.code==='invalid_argument'?'อัปโหลดรูปไม่ได้ บัญชีนี้ไม่มีสิทธิ์':'อัปโหลดรูปไม่สำเร็จ ลองอีกครั้ง','bad')}}
  else if(ph.removed){data.img='';data.imgPath='';drop=oldPath}
  else{data.img=ph.url||'';data.imgPath=ph.path||''}
  const ok=await write('menu/'+id,r=>r.set(data));
  if(ok){removePhoto(drop);closeSheet();toast('บันทึกเมนูแล้ว')}
  else{const btn=document.querySelector('[data-act="saveMenu"]');if(btn){btn.disabled=false;btn.textContent='บันทึกเมนู'}}}

function sheetPurchase(){const sid=S.sheet.id||'';
  $('#panel').innerHTML=head('บันทึกการซื้อของ','ระบบจะเติมจำนวนเข้าสต็อกให้')+
  `<form class="sh-body"><div class="field"><label for="pItem">ซื้ออะไร</label><select id="pItem">${S.stock.map(s=>`<option value="${s.id}" ${s.id===sid?'selected':''}>${esc(s.name)} (${esc(s.unit)})</option>`).join('')}<option value="__new" ${!S.stock.length?'selected':''}>+ ของใหม่ที่ยังไม่มีในสต็อก</option></select></div>
  <div class="grid2" id="pNew" hidden><div class="field"><label for="pName">ชื่อของใหม่</label><input id="pName" autocomplete="off"></div><div class="field"><label for="pUnit">หน่วย</label><input id="pUnit" value="กก."></div></div>
  <div class="grid2"><div class="field"><label for="pQty">จำนวน</label><input id="pQty" inputmode="decimal"></div><div class="field"><label for="pAmt">ราคารวม (บาท)</label><input id="pAmt" inputmode="decimal"></div></div>
  <p class="help" id="pUnitCost" style="margin:0"></p>
  <div class="grid2"><div class="field"><label for="pDate">วันที่ซื้อ</label><input id="pDate" type="date" value="${toDateInput(Date.now())}"></div><div class="field"><label for="pNote">ร้าน / หมายเหตุ</label><input id="pNote" placeholder="เช่น ตลาดสด" autocomplete="off"></div></div></form>
  <div class="sh-foot"><button class="btn pri wide" data-act="savePurch" type="button">บันทึกการซื้อ</button></div>`;
  const upd=()=>{$('#pNew').hidden=$('#pItem').value!=='__new';const q=nval('pQty'),a=nval('pAmt');$('#pUnitCost').textContent=q&&a?'ตกหน่วยละ '+baht(a/q):''};
  ['pItem','pQty','pAmt'].forEach(i=>$('#'+i).addEventListener('input',upd));upd();}
async function savePurch(){let sid=val('pItem');const qty=nval('pQty'),amount=nval('pAmt');
  if(!(qty>0))return toast('ใส่จำนวนที่ซื้อ','bad');
  let s=S.stock.find(x=>x.id===sid);
  if(sid==='__new'){const name=val('pName');if(!name)return toast('ใส่ชื่อของใหม่','bad');sid=S.db.collection('stock').doc().id;s={name,unit:val('pUnit')||'หน่วย',qty:0,min:0,unitCost:0}}
  const uc=amount>0?r2(amount/qty):(+s.unitCost||0);const isNew=!S.stock.some(x=>x.id===sid);
  const ok=await write('stock/'+sid,r=>isNew?r.set({name:s.name,unit:s.unit,qty,min:0,unitCost:uc}):r.transform(d=>({qty:r2((+d.qty||0)+qty),unitCost:uc})));if(!ok)return;
  const ref=S.db.collection('purchases').doc();
  await write('purchases/'+ref.id,r=>r.set({stockId:sid,name:s.name,unit:s.unit,qty,amount,note:val('pNote'),at:fromDateInput(val('pDate'))}));
  closeSheet();toast(`เติม ${s.name} +${num(qty)} ${s.unit} แล้ว`);}

const BG_KEY='nl_bg';

    const from=cur.table,rn=n=>n?{orderNo:String(n).replace(/^T(X|\d+)-/,'T'+t+'-')}:{};
    const ok=await write('orders/'+id,r=>r.transform(d=>d.status==='open'&&d.table===from?{table:t,channel:'dinein',...(from==='TA'?{label:''}:{}),movedFrom:from,...rn(d.orderNo)}:null));
    if(ok){const o=S.open[id];if(o&&o.table===from)S.open[id]={...o,table:t,channel:'dinein',...(from==='TA'?{label:''}:{}),movedFrom:from,...rn(o.orderNo)};S.floor='tables';closeSheet();render();toast(from==='TA'?'ย้ายไปโต๊ะ '+t+' แล้ว':'ย้ายโต๊ะ '+from+' → โต๊ะ '+t+' แล้ว')}},
  floor:d=>{S.floor=d.v;try{localStorage.setItem('nl_floor',d.v)}catch(e){}render()},
  newTakeaway:()=>openSheet({type:'newDel',ch:'takeaway'}),
  newDel:d=>can('tables')?openSheet({type:'newDel',ch:d.ch}):deny(),
  gst:d=>{S.sheet.guests=Math.max(1,Math.min(50,S.sheet.guests+ +d.d));$('#gN').textContent=S.sheet.guests;seatUpdate()},
  doOpenTbl:()=>{const s=S.sheet;if(Object.values(S.open).some(o=>o.table===s.t))return openTable(s.t);createOrder({table:s.t,channel:'dinein',guests:s.guests,customerName:val('otName')});toast('เปิดโต๊ะ '+s.t+' แล้ว')},
  doNewDel:()=>{S.floor='deliv';const s=S.sheet,ref=val('ndRef').toUpperCase(),nm=val('ndName');createOrder({table:'TA',channel:s.ch,ref,customerName:nm,label:CH[s.ch].n+(ref?' #'+ref:' '+hm(Date.now()))})},
  closeTbl:async()=>{const id=S.sheet.id,o=S.open[id];if(!o)return;if((o.items||[]).length)return toast('มีรายการอยู่ ต้องยกเลิกบิลแทน','bad');
    const ok=await write('orders/'+id,r=>r.transform(d=>d.status==='open'&&!(d.items||[]).length?{status:'void',closedEmpty:true,voidedAt:Date.now()}:null));if(ok){closeSheet();toast(o.table==='TA'?'ยกเลิกออร์เดอร์แล้ว':'ปิดโต๊ะแล้ว')}},
  pcat:d=>{S.sheet.cat=d.v;renderPicker()},
  add:(d,b)=>{addItem(S.sheet.id,d.m);b.classList.add('flash');setTimeout(()=>b.classList.remove('flash'),250)},
  qty:d=>mutateItems(S.sheet.id,items=>{const l=items.find(x=>x.id===d.l);if(!l)return items;l.qty+= +d.d;return l.qty>0?items:items.filter(x=>x!==l)}),
  toggleServe:d=>{const cur=(S.open[S.sheet.id]?.items||[]).find(x=>x.id===d.l);if(!cur)return;const to=!cur.served;mutateItems(S.sheet.id,items=>{const l=items.find(x=>x.id===d.l);if(l)l.served=to;return items})},
  editLine:d=>{S.sheet.edit=S.sheet.edit===d.l?null:d.l;renderOrderLines()},
  qnote:d=>{const n=$('#edNote');if(!n)return;n.value=n.value?n.value+', '+d.v:d.v;if(d.v==='พิเศษ'&&!parseFloat($('#edExtra').value))$('#edExtra').value=S.settings.extraPrice??10},
  saveLine:d=>{const note=val('edNote'),extra=nval('edExtra');S.sheet.edit=null;mutateItems(S.sheet.id,items=>{const l=items.find(x=>x.id===d.l);if(l){l.note=note;l.extra=extra}return items})},
  voidOrder:async()=>{if(!can('void'))return deny();const id=S.sheet.id;const ok=await write('orders/'+id,r=>r.update({status:'void',voidedAt:Date.now()}));if(ok){closeSheet();toast('ยกเลิกบิลแล้ว')}},
  pay:()=>!can('pay')?deny():openSheet(payOpen(S.sheet.id))||0,
  backOrder:()=>openSheet({type:'order',id:S.sheet.id,cat:'all',q:'',edit:null}),
  method:d=>{S.sheet.method=d.v;document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===d.v)));payUpdate()},
  recv:d=>{S.sheet.received=d.v;$('#payRecv').value=d.v;payUpdate()},
  confirmPay,
  custMode:()=>custOpen(S.sheet.id),
  cCat:d=>{S.cust.cat=d.v;renderCust()},
  cAdd:d=>{S.cust.cart[d.m]=(S.cust.cart[d.m]||0)+1;renderCust()},
  cQty:d=>{const q=(S.cust.cart[d.m]||0)+ +d.d;if(q>0)S.cust.cart[d.m]=q;else delete S.cust.cart[d.m];renderCust()},
  cView:d=>{S.cust.view=d.v;renderCust()},
  cSend:custSend,
  cExitAsk:()=>{S.cust.confirmExit=true;renderCust();setTimeout(()=>{if(S.cust){S.cust.confirmExit=false;renderCust()}},4000)},
  cExit:()=>{const id=S.cust.id;S.cust=null;$('#cust').hidden=true;$('#cust').innerHTML='';if(S.open[id])openSheet({type:'order',id,cat:'all',q:'',edit:null})},
  serve:d=>mutateItems(d.id,items=>{const l=items.find(x=>x.id===d.l);if(l)l.served=true;return items}),
  serveAll:d=>mutateItems(d.id,items=>items.map(l=>({...l,served:true}))),
  menuCat:d=>{S.menuCat=d.v;render()},
  menuEdit:d=>{if(!can('menu_edit'))return deny();openSheet({type:'menuEdit',id:d.id||null})},
  addIng:()=>{readIng();S.sheet.recipe.push({stockId:'',qty:0});renderIng()},
  delIng:d=>{readIng();S.sheet.recipe.splice(+d.i,1);renderIng()},
  calcCost:()=>{readIng();const c=S.sheet.recipe.reduce((s,g)=>{const st=S.stock.find(x=>x.id===g.stockId);return s+(st?(+st.unitCost||0)*(+g.qty||0):0)},0);$('#mCost').value=r2(c);toast('ต้นทุนวัตถุดิบ '+baht(c)+' ปรับเพิ่มค่าน้ำซุป/เครื่องปรุงได้')},
  saveMenu,
  delMenu:async()=>{const p=S.sheet.photo&&S.sheet.photo.path;const ok=await write('menu/'+S.sheet.id,r=>r.delete());if(ok){removePhoto(p);closeSheet();toast('ลบเมนูแล้ว')}},
  photoRemove:()=>{const ph=S.sheet.photo;if(ph.preview)URL.revokeObjectURL(ph.preview);ph.preview='';ph.file=null;ph.removed=true;$('#mPhoto').value='';renderPhoto()},
  backTab:d=>{S.backTab=d.v;render()},
  stockEdit:d=>openSheet({type:'stockEdit',id:d.id||null}),
  saveStock,
  delStock:async()=>{const ok=await write('stock/'+S.sheet.id,r=>r.delete());if(ok){closeSheet();toast('ลบแล้ว')}},
  purchase:d=>!can('stock')?deny():openSheet({type:'purchase',id:d.id||null}),
  savePurch,
  delPurch:d=>write('purchases/'+d.id,r=>r.delete()).then(ok=>ok&&toast('ลบรายการซื้อแล้ว (สต็อกไม่เปลี่ยน)')),
  expense:()=>!can('expenses')?deny():openSheet({type:'expense'}),
  saveExp,
  delExp:d=>write('expenses/'+d.id,r=>r.delete()).then(ok=>ok&&toast('ลบรายจ่ายแล้ว')),
  saveSettings,
  logout,
  qrSheet:()=>openSheet({type:'qr'}),
  staffNew:()=>openSheet({type:'staffNew'}),
  viewAs:d=>{try{localStorage.setItem('nl_mode',d.r)}catch(e){}S.viewAs=d.r;S.tab='tables';S.backTab='stock';closeSheet();render();window.scrollTo(0,0);toast('สลับเป็นมุมมอง '+roleName(d.r))},
  viewAsOff:()=>{try{localStorage.removeItem('nl_mode')}catch(e){}S.viewAs=null;render();toast('กลับเป็นมุมมองแอดมินแล้ว')},
  permReset:()=>{renderPerm(DEFAULT_PERMS);toast('คืนค่าเริ่มต้นแล้ว กด "บันทึกสิทธิ์" เพื่อใช้งาน')},
  permSave:async()=>{const roles={waiter:{},chef:{},partner:{}};document.querySelectorAll('[data-perm]').forEach(c=>{const [r,k]=c.dataset.perm.split(':');roles[r][k]=c.checked});
    const ok=await write('config/permissions',r=>r.set({roles}));if(ok){S.perms=roles;toast('บันทึกสิทธิ์แล้ว มีผลกับทุกเครื่องทันที')}},
  staffCreate,
  staffDel:async d=>{const {error}=await SB.rpc('admin_delete_user',{p_username:d.user});if(error)toast(adminErr(error),'bad');else{toast('ลบบัญชีแล้ว เข้าระบบไม่ได้อีก');loadStaff()}},
  staffPwOpen:d=>openSheet({type:'staffPw',user:d.user}),
  staffPwSave:async()=>{const pw=$('#spPw').value,er=$('#spErr');if(pw.length<6){er.textContent='รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร';return}
    const btn=$('#spBtn');btn.disabled=true;const {error}=await SB.rpc('admin_set_password',{p_username:S.sheet.user,p_password:pw});btn.disabled=false;
    if(error){er.textContent=adminErr(error);return}toast('ตั้งรหัสผ่านใหม่ให้ '+S.sheet.user+' แล้ว');openSheet({type:'settings'})},
  myPwSave:async()=>{const pw=$('#myPw').value;if(pw.length<6)return toast('รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร','bad');
    const {error}=await SB.auth.updateUser({password:pw});if(error)toast(/same|different/i.test(error.message)?'รหัสใหม่ต้องไม่ซ้ำรหัสเดิม':'เปลี่ยนรหัสไม่สำเร็จ: '+error.message,'bad');else{$('#myPw').value='';toast('เปลี่ยนรหัสผ่านแล้ว')}},
  pwToggle:(d,b)=>{const i=document.getElementById(d.for);if(!i)return;const show=i.type==='password';i.type=show?'text':'password';b.textContent=show?'ซ่อน':'แสดง'},
  logoRemove:()=>{S.sheet.logo='';$('#cLogo').value='';renderLogo()},
  findMember,
  clearMember:()=>{Object.assign(S.sheet,{member:null,memberNew:false,phone:'',usePts:'',newName:''});const p=$('#payPhone');if(p)p.value='';renderMem();payUpdate()},
  useMax:()=>{const c=S.sheet;c.usePts=String(Math.floor(+c.member.points||0));c.usePts=String(payCalc().use);const e=$('#payUse');if(e)e.value=c.usePts;payUpdate()},
  billPreview:()=>{const sh=S.sheet;openSheet({type:'receipt',order:billPreviewOrder(),mode:'bill',back:{...sh}})},
  backPay:()=>{const b=S.sheet.back;if(b&&S.open[b.id])openSheet(b);else closeSheet()},
  rcPrint:printReceipt,
  rcShare:shareReceipt,
  billReceipt:d=>{const o=(S.report.data?.orders||[]).find(x=>x.id===d.id);if(o)openSheet({type:'receipt',order:o,mode:'receipt'})},
  memEdit:d=>openSheet({type:'member',id:d.id}),
  memSave:async()=>{const id=S.sheet.id;const ok=await write('members/'+id,r=>r.update({name:val('mbName'),points:Math.max(0,Math.round(nval('mbPts')))}));if(ok){closeSheet();toast('บันทึกสมาชิกแล้ว')}},
  memDel:async()=>{const ok=await write('members/'+S.sheet.id,r=>r.delete());if(ok){closeSheet();toast('ลบสมาชิกแล้ว')}},
  qrPrint:()=>{sheetQr();setTimeout(()=>window.print(),50)},
  qrRotate:async()=>{const k=newQrKey();const ok=await write('config/settings',r=>r.update({qrKey:k}));if(ok){S.settings={...S.settings,qrKey:k};sheetQr();toast('สร้างรหัส QR ใหม่แล้ว พิมพ์ชุดใหม่ไปติดโต๊ะ')}},
  range:d=>{S.report.range=d.v;S.report.data=null;render()},
  reload:()=>{S.report.data=null;loadReport()},
  bill:d=>openSheet({type:'bill',id:d.id}),
  voidPaid:async d=>{if(!can('void'))return deny();const ok=await write('orders/'+d.id,r=>r.update({status:'void',voidedAt:Date.now()}));if(ok){closeSheet();S.report.data=null;loadReport();toast('ยกเลิกบิลแล้ว')}},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  if(b.closest('form')&&b.tagName==='BUTTON')e.preventDefault();
  if(b.dataset.confirm&&!b.dataset.armed){b.dataset.armed='1';b.dataset.label=b.textContent;b.textContent='แตะอีกครั้งเพื่อยืนยัน';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=b.dataset.label}},3500);return}
  const f=ACT[b.dataset.act];if(f)f({...b.dataset},b,e);});
document.addEventListener('submit',e=>e.preventDefault());
$('#hdrMode').addEventListener('change',e=>{const v=e.target.value;if(v)ACT.viewAs({r:v});else ACT.viewAsOff()});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)closeSheet()});
setInterval(()=>{if(S.state==='ready'&&(!S.sheet||S.sheet.type!=='pay'))render()},60000);
init();
</script>
</body>
</html>

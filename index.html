/* ---------- พนักงาน / แม่ครัว เข้าสู่ระบบด้วย LINE (แอดมินสร้างบัญชีก่อน → เข้าด้วยรหัสผ่านครั้งแรก → ผูก LINE) ---------- */
const SL_ID=()=>String((window.APP_CONFIG||{}).LINE_CHANNEL_ID||'2012035513');
const SL_FN=()=>String((window.APP_CONFIG||{}).SUPABASE_URL||'').replace(/\/$/,'')+'/functions/v1/line-login';
const slSelf=()=>location.origin+location.pathname;
function slStart(op){const st=op+'-'+Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,'0')).join('');
  try{localStorage.setItem('nl_sline',JSON.stringify({st,op,at:Date.now()}))}catch(e){}
  location.href='https://access.line.me/oauth2/v2.1/authorize?'+new URLSearchParams({response_type:'code',client_id:SL_ID(),redirect_uri:slSelf(),state:st,scope:'profile openid'})}
async function slCall(body,tok){const cfg=window.APP_CONFIG||{};let r;try{r=await fetch(SL_FN(),{method:'POST',headers:{'Content-Type':'application/json',apikey:cfg.SUPABASE_KEY||'',...(tok?{'x-user-token':tok}:{})},body:JSON.stringify({...body,app:'staff',redirect:slSelf()})})}catch(e){return {error:'net'}}
  let j={};try{j=await r.json()}catch(e){}if(!r.ok&&!j.error)j.error='fn_'+r.status;return j}
const slErr=e=>({not_linked:'บัญชี LINE นี้ยังไม่ได้ผูกกับพนักงาน · เข้าสู่ระบบด้วยชื่อผู้ใช้/รหัสผ่านครั้งแรก แล้วกด 👤 → ผูกบัญชี LINE',line_used:'บัญชี LINE นี้ผูกกับพนักงานคนอื่นอยู่แล้ว',need_login:'เข้าสู่ระบบก่อน แล้วค่อยผูก LINE',not_staff:'บัญชีนี้ไม่ใช่พนักงานของร้าน',bad_redirect:'ลิงก์แอปร้านไม่ตรงกับที่ตั้งไว้',not_configured:'ร้านยังตั้งค่า LINE ไม่เสร็จ',net:'อินเทอร์เน็ตหลุด ลองอีกครั้ง'})[e]||(/fn_404/.test(e)?'ยังไม่ได้ติดตั้งฟังก์ชัน line-login':'ทำรายการกับ LINE ไม่สำเร็จ ลองอีกครั้ง');
// กลับมาจาก LINE: คืน 'login' (เข้าสู่ระบบสำเร็จ) / 'link' / false
async function slReturn(){const P=new URLSearchParams(location.search),code=P.get('code'),state=String(P.get('state')||''),err=P.get('error');if(!code&&!err)return false;
  history.replaceState(null,'',slSelf());let saved=null;try{saved=JSON.parse(localStorage.getItem('nl_sline')||'null');localStorage.removeItem('nl_sline')}catch(e){}
  if(err){S.lineMsg='ยกเลิกการเข้าสู่ระบบด้วย LINE';return false}
  const op=saved&&saved.st===state?saved.op:state.split('-')[0];
  if(op==='link'){const ses=(await SB.auth.getSession()).data.session;if(!ses){S.lineMsg='หน้านี้ยังไม่ได้เข้าสู่ระบบ · เข้าด้วยชื่อผู้ใช้/รหัสผ่าน แล้วกดผูก LINE อีกครั้ง';return false}
    const j=await slCall({op:'link',code},ses.access_token);if(j.ok)try{localStorage.setItem('nl_line_done',String(Date.now()))}catch(e){}setTimeout(()=>toast(j.ok?'✅ ผูกบัญชี LINE แล้ว ครั้งหน้ากด "เข้าสู่ระบบด้วย LINE" ได้เลย':slErr(j.error),j.ok?'':'bad'),800);return 'link'}
  if(op!=='login'){S.lineMsg='ลิงก์ LINE ไม่ถูกต้อง ลองใหม่';return false}
  const j=await slCall({op:'login',code});if(!j.ok){S.lineMsg=slErr(j.error);return false}
  const {error}=await SB.auth.verifyOtp({token_hash:j.token_hash,type:'magiclink'});if(error){S.lineMsg='เข้าสู่ระบบด้วย LINE ไม่สำเร็จ ลองอีกครั้ง';return false}
  try{localStorage.setItem('nl_login_day',bkDay());localStorage.setItem('nl_user',emailToUser(j.email||''));localStorage.setItem('nl_line_done',String(Date.now()))}catch(e){}return 'login'}
// มือถือ: LINE มักเปิดแท็บใหม่ตอนกลับมา → แท็บเดิมที่ค้างหน้าเข้าสู่ระบบ / หน้าบัญชี จะรีเฟรชตามเองเมื่อแท็บใหม่เข้าสู่ระบบหรือผูกสำเร็จ
window.addEventListener('storage',e=>{if(e.key!=='nl_line_done'||!e.newValue)return;if(S.state==='login'||(S.sheet&&S.sheet.type==='myAcct'))location.replace(slSelf())});
async function sheetMyAcct(){const s=S.sheet;
  if(!s.loaded){s.loaded=true;try{let {data,error}=await SB.from('staff').select('line_name,line_at,display_name').eq('email',S.email).maybeSingle();if(error&&/display_name/.test(String(error.message||'')))({data,error}=await SB.from('staff').select('line_name,line_at').eq('email',S.email).maybeSingle());s.row=error?{err:/line_name|line_at/i.test(String(error.message||''))?'sql':'load',msg:String(error.message||error.code||'')}:(data||{})}catch(e){s.row={err:'load',msg:String(e&&e.message||e)}}}
  const r=s.row||{};
  $('#panel').innerHTML=head('👤 บัญชีของฉัน',esc(r.display_name||S.me)+' · '+esc(roleName(S.role)))+`<div class="sh-body">
   <div class="card"><div class="kv"><span>ชื่อผู้ใช้</span><b>${esc(S.me)}</b></div><div class="kv"><span>ตำแหน่ง</span><b>${esc(roleName(S.role))}</b></div></div>
   <div class="card"><h3>เข้าสู่ระบบด้วย LINE</h3>
    ${r.err?`<p class="help" style="margin:0">${r.err==='sql'?'ร้านยังไม่ได้รัน SQL เข้าสู่ระบบด้วย LINE ของพนักงาน':'โหลดข้อมูลบัญชีไม่ได้'}</p><p class="help" style="margin:0;font-size:12px;opacity:.75">รายละเอียด: ${esc(r.msg||'')}</p><button class="btn sm" data-act="myAcctRe" type="button">ลองใหม่</button>`:r.line_name?`<div class="kv"><span>🟢 ผูกกับ LINE</span><b>${esc(r.line_name)}</b></div><p class="help" style="margin:0">หน้าเข้าสู่ระบบ กด "เข้าสู่ระบบด้วย LINE" ได้เลย ไม่ต้องจำรหัส</p><button class="btn sm" data-act="slUnlink" data-confirm="1" type="button">ยกเลิกการผูก LINE</button>`
      :`<p class="help" style="margin:0">ผูกครั้งเดียว ครั้งหน้ากดปุ่ม LINE เข้าได้เลย (ยังใช้ชื่อผู้ใช้/รหัสผ่านเดิมได้)</p><button class="btn lineb" data-act="slLink" type="button">ผูกบัญชี LINE</button>`}</div></div>
   ${verRow()}<div class="sh-foot"><button class="btn wide" data-act="close" type="button">ปิด</button></div>`}
Object.assign(ACT,{
  myAcct:()=>openSheet({type:'myAcct'}),
  myAcctRe:()=>{S.sheet.loaded=false;sheetMyAcct()},
  slLogin:()=>slStart('login'),
  slLink:()=>slStart('link'),
  slUnlink:async()=>{const {error}=await SB.rpc('staff_line_unlink',{p_email:null});if(error)return toast('ยกเลิกไม่สำเร็จ','bad');toast('ยกเลิกการผูก LINE แล้ว');S.sheet.loaded=false;sheetMyAcct()},
  slUnlinkOther:async d=>{const {error}=await SB.rpc('staff_line_unlink',{p_email:d.email});if(error)return toast(adminErr(error),'bad');toast('ยกเลิกการผูก LINE ของ '+d.user+' แล้ว');loadStaff()}
});

init();
</script>
</body>
</html>

<style>
/* Layout: sticky shop header, single working column (max 1080px), bottom tab bar on every width; work happens in a slide-up sheet. */
:root{
  --bg:#f3f5f0; --surface:#ffffff; --sunk:#e9ece5; --line:#d9ded4; --veil-rgb:243,245,240; --veil-a:.5;
  --fg:#1c2420; --muted:#5f6b64;
  --jade:#17694f; --jade-soft:#dcefe5; --on-jade:#ffffff;
  --chili:#b23d27; --chili-soft:#f7e2db;
  --amber:#946207; --amber-soft:#f5e8cc;
  --shadow:0 10px 30px rgba(20,40,30,.14);
  --f-display:"Mitr","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#1a201d; --sunk:#151a18; --line:#2b3430; --veil-rgb:17,22,20;
  --fg:#e8eee9; --muted:#9aa69f;
  --jade:#5ec59c; --jade-soft:#1c3a2e; --on-jade:#0b1912;
  --chili:#f08c74; --chili-soft:#3d231c;
  --amber:#e4b75c; --amber-soft:#382d16;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1a201d; --sunk:#151a18; --line:#2b3430; --veil-rgb:17,22,20;
  --fg:#e8eee9; --muted:#9aa69f;
  --jade:#5ec59c; --jade-soft:#1c3a2e; --on-jade:#0b1912;
  --chili:#f08c74; --chili-soft:#3d231c;
  --amber:#e4b75c; --amber-soft:#382d16;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  html,body{background:#fff!important;background-image:none!important}body::before,body::after{display:none!important}
  #printArea.qrs{display:grid!important;grid-template-columns:repeat(3,1fr);gap:10mm;padding:8mm}
  #printArea.qrs.one{grid-template-columns:90mm;justify-content:center}
  #printArea.rcpt{display:block!important}
  #printArea.posum{display:block!important;font:11pt/1.4 'IBM Plex Sans Thai',sans-serif;color:#000}
  #printArea.posum h1{font-size:16pt;margin:0 0 2mm}#printArea.posum h2{font-size:12pt;margin:5mm 0 2mm}#printArea.posum p{margin:0 0 3mm}
  #printArea.posum table{width:100%;border-collapse:collapse}#printArea.posum th,#printArea.posum td{border:1px solid #999;padding:1.5mm 2mm;vertical-align:top;text-align:left}
  #printArea.posum th{background:#eee}#printArea.posum td.r{text-align:right;white-space:nowrap}#printArea.posum td.ck{font-size:14pt;text-align:center;width:8mm}
  #printArea.posum table.sm{width:auto;min-width:60%}#printArea.posum tr{page-break-inside:avoid}#printArea.posum .ft{margin-top:4mm;font-size:9pt;color:#555}
  #printArea .rc{width:100%;box-shadow:none;border:0;padding:0;margin:0}
  body{background:#fff;color:#000}
}
.pq{border:1px dashed #999;border-radius:8px;padding:8px;text-align:center;break-inside:avoid;color:#000;background:#fff}
.pq svg{width:100%;max-width:200px;height:auto}
.pq b{display:block;font-family:var(--f-display);font-size:22px;font-weight:500}
.pq small{display:block;font-size:12px}
.qrbig{max-width:340px;margin:0 auto;width:100%}.qrbig .pq{border:0;border-radius:16px;padding:16px}.qrbig .pq svg{max-width:280px}.qrbig .pq b{font-size:30px}
.login{max-width:380px;margin:40px auto;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.login h2{font-size:22px}
.sm-sel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;min-height:34px;font-size:13.5px}
.lg-brand{display:flex;gap:12px;align-items:center;margin-bottom:4px}
.lg-mark{width:48px;height:48px;border-radius:12px;background:var(--jade);display:flex;align-items:center;justify-content:center;flex:none}
.lg-mark svg{width:28px;height:28px;stroke:var(--on-jade);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pw{position:relative}
.pw input{padding-right:64px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--jade);font-weight:500;cursor:pointer;padding:6px}
.err{color:var(--chili);font-size:13.5px;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.num,.money{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;line-height:1.25}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand h1{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);font-size:12.5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:6px;vertical-align:1px}
.dot.on{background:var(--jade)}.dot.off{background:var(--chili)}

.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:16px 110px;display:flex;flex-direction:column;gap:18px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;cursor:pointer;position:relative}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="true"]{color:var(--jade);font-weight:600}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--chili);color:#fff;font-size:11px;line-height:18px;font-weight:600}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.btn.pri:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--chili);border-color:var(--chili-soft)}
.btn.danger[data-armed]{background:var(--chili);color:#fff;border-color:var(--chili)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13.5px;border-radius:8px}
.btn.wide{flex:1}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:19px}
.sec-h .hint{color:var(--muted);font-size:13px}
.muted{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--jade-soft);color:var(--jade)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.bad{background:var(--chili-soft);color:var(--chili)}
.pill.mute{background:var(--sunk);color:var(--muted)}

/* stat strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{color:var(--muted);font-size:12.5px}
@media (max-width:560px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* tables */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{border:1px dashed var(--line);background:transparent;border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:118px}
.tcard .no{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--muted)}
.tcard .no small{font-size:13px;font-family:var(--f-body);margin-left:4px}
.tcard.busy{border:1.5px solid var(--jade);background:var(--surface);box-shadow:0 1px 0 var(--line)}
.tcard.busy .no{color:var(--fg)}
.tcard .meta{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;margin-top:auto}
.tcard .tot{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.tcard.add{border-style:dashed;align-items:center;justify-content:center;color:var(--jade);font-weight:600}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted)}
.row .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.click{cursor:pointer}
.row.click:hover{background:var(--sunk)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-weight:500;font-size:17px;margin-bottom:4px}

.subtabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:11px}
.subtabs button{flex:1;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
.subtabs button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:5px;max-width:220px}
.meter i{display:block;height:100%;background:var(--jade)}
.meter.low i{background:var(--chili)}

/* kitchen */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;align-items:start}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kcard header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--sunk);gap:8px}
.kcard header h3{font-size:17px}
.kline{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-top:1px solid var(--line)}
.kline .q{font-family:var(--f-display);font-size:18px;min-width:30px}
.kline .grow{flex:1;min-width:0}
.note{font-size:13px;color:var(--amber)}

/* report */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi b{display:block;font-family:var(--f-display);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.kpi.hero{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.kpi.hero span{color:var(--on-jade);opacity:.85}
.kpi.neg b{color:var(--chili)}
.kpi.hero.neg{background:var(--chili);border-color:var(--chili)}
.kpi.hero.neg b{color:#fff}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:16px}
.kv{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.kv.tot{border-top:1px solid var(--line);padding-top:8px;font-weight:600}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:62px 1fr 78px;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.bar .track{height:14px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--jade);border-radius:0 3px 3px 0}
.bar .v{text-align:right}
.bar .d{color:var(--muted)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,20,15,.42);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:94%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden}
@media (min-width:760px){.sheet{align-items:stretch;justify-content:flex-end}.panel{max-height:none;height:100%;border-radius:0;max-width:560px}}
.sh-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.sh-head .grow{flex:1;min-width:0}
.sh-head h2{font-size:20px}
.sh-head small{color:var(--muted);font-size:13px}
.sh-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.sh-body>*,.cust-body>*{flex-shrink:0}
.sh-foot{border-top:1px solid var(--line);background:var(--surface);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.x{border:0;background:var(--sunk);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px;min-height:44px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--jade);outline:none}
[data-cl],#clNew{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:9px;padding:8px 11px;min-height:40px;font:inherit}[data-cl]:focus,#clNew:focus{border-color:var(--jade);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--jade)}
.help{font-size:12.5px;color:var(--muted)}

/* order lines */
.lines{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.line{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.line:first-child{border-top:0}
.line-top{display:flex;gap:10px;align-items:center}
.line-top .grow{flex:1;min-width:0}
.line-top .nm{font-weight:500}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stepper button{border:0;background:none;width:34px;height:34px;cursor:pointer;font-size:18px}
.stepper span{min-width:24px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.line-act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lnk{border:0;background:none;color:var(--jade);cursor:pointer;padding:2px 0;font-size:13px;font-weight:500}
.editor{background:var(--sunk);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:8px}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pitem{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:68px}
.pitem:active{transform:scale(.98)}
.pitem b{font-weight:500;font-size:14px;line-height:1.35}
.pitem span{color:var(--jade);font-variant-numeric:tabular-nums;font-weight:600;margin-top:auto}
.pitem.flash{border-color:var(--jade);background:var(--jade-soft)}

.total-line{display:flex;flex-direction:column;flex:1;min-width:120px}
.total-line small{color:var(--muted);font-size:12.5px}
.total-line b{font-family:var(--f-display);font-weight:500;font-size:24px;font-variant-numeric:tabular-nums}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--jade);background:var(--jade-soft);color:var(--jade)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.bigsum{text-align:center;padding:6px 0}
.bigsum small{color:var(--muted)}
.bigsum b{display:block;font-family:var(--f-display);font-weight:500;font-size:40px;font-variant-numeric:tabular-nums;line-height:1.15}
.change{display:flex;justify-content:space-between;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.change b{font-family:var(--f-display);font-weight:500;font-size:26px;font-variant-numeric:tabular-nums}
.qrbox{background:#fff;color:#123;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line)}
.qrbox svg{width:min(240px,70vw);height:auto;display:block}
.qrbox .pp{font-weight:700;letter-spacing:.06em;color:#103e6e;font-size:13px}
.qrbox .amt{font-family:var(--f-display);font-size:22px}

/* customer mode */
.cust{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.cust-head{background:var(--jade);color:var(--on-jade);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;display:flex;align-items:center;gap:12px}
.cust-head .grow{flex:1;min-width:0}
.cust-head h2{font-size:22px}
.cust-head small{opacity:.85}
.cust-head .btn{background:transparent;color:var(--on-jade);border-color:currentColor;min-height:36px}
.cust-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;max-width:900px;width:100%;margin:0 auto}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.citem{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:104px;position:relative}
.citem b{font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1.3}
.citem span{margin-top:auto;font-weight:600;color:var(--jade);font-variant-numeric:tabular-nums}
.citem em{position:absolute;top:8px;right:8px;font-style:normal;background:var(--jade);color:var(--on-jade);border-radius:999px;min-width:24px;height:24px;line-height:24px;text-align:center;font-weight:600;font-size:13px}
.cust-foot{background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center}

.btn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%) no-repeat;background-size:250% 100%;background-position:150% 0;opacity:0}
.btn:hover:not(:disabled){border-color:rgba(20,184,166,.6);box-shadow:0 0 0 3px rgba(20,184,166,.13),0 6px 16px rgba(13,148,136,.18);transform:translateY(-1px)}
.btn:hover:not(:disabled)::after{opacity:1;animation:btnSheen .8s ease-out}
.btn:active:not(:disabled){transform:translateY(0) scale(.97)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(20,184,166,.45)}
.btn.pri,.btn.wdbtn{color:#fff;border:0;font-weight:700;text-shadow:0 1px 1px rgba(0,0,0,.18);background:linear-gradient(135deg,#14b8a6 0%,#0d9488 55%,#0f766e 100%);box-shadow:0 0 0 1px rgba(45,212,191,.55),0 4px 14px rgba(13,148,136,.4),0 0 16px rgba(45,212,191,.45)}
.btn.pri:hover:not(:disabled){filter:brightness(1.06);box-shadow:0 0 0 1px rgba(94,234,212,.9),0 6px 20px rgba(13,148,136,.5),0 0 26px rgba(45,212,191,.75)}
main .btn.pri:not(.sm),.view .btn.pri:not(.sm){animation:wdglow 2.4s ease-in-out infinite}
#panel .btn.pri,#sheet .btn.pri{animation:none}
.btn.pri:disabled{filter:grayscale(.5);box-shadow:none}
.btn.danger{color:#e34948;border-color:rgba(227,73,72,.45);background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 88%,#e34948))}
.btn.danger:hover:not(:disabled){border-color:#e34948;box-shadow:0 0 0 3px rgba(227,73,72,.14),0 6px 16px rgba(227,73,72,.22)}
.btn.danger.wide,.sh-foot .btn.danger.wide{color:#fff;border:0;background:linear-gradient(135deg,#f0525a,#e5383b 55%,#b91c1c);box-shadow:0 0 0 1px rgba(248,113,113,.5),0 4px 14px rgba(229,56,59,.35),0 0 14px rgba(248,113,113,.35)}
.btn.ghost{background:none;box-shadow:none}
.closeround{border:0!important;color:#fff!important;background:linear-gradient(135deg,#8b5cf6,#7c3aed 55%,#5b21b6)!important;box-shadow:0 0 0 1px rgba(167,139,250,.6),0 4px 14px rgba(124,58,237,.35),0 0 14px rgba(167,139,250,.45)!important;text-shadow:0 1px 1px rgba(0,0,0,.2)}
.closeround:hover{box-shadow:0 0 0 1px rgba(196,181,253,.9),0 6px 20px rgba(124,58,237,.45),0 0 24px rgba(167,139,250,.7)!important}
.btn.lineb{border:0;background:linear-gradient(135deg,#22d36b,#06c755 55%,#05a346);box-shadow:0 0 0 1px rgba(74,222,128,.5),0 4px 14px rgba(6,199,85,.35)}
.btn.offsale{border:0;background:linear-gradient(135deg,#ef4444,#c62828);box-shadow:0 4px 14px rgba(198,40,40,.35)}
.chip{transition:transform .15s,box-shadow .2s,border-color .2s,background .2s;box-shadow:0 1px 3px rgba(30,20,10,.05)}
.chip:hover{border-color:rgba(20,184,166,.55);box-shadow:0 0 0 3px rgba(20,184,166,.12);transform:translateY(-1px)}
.chip[aria-pressed="true"]{box-shadow:0 4px 12px rgba(0,0,0,.18)}
body.shop-po .chip[aria-pressed="true"]{border-color:transparent;background:linear-gradient(135deg,#ef3b4f,#c8102e 60%,#9b0d23);box-shadow:0 0 0 1px rgba(248,113,113,.45),0 4px 12px rgba(200,16,46,.35),0 0 12px rgba(248,113,113,.35)}
.prgrp button[aria-pressed=true]{background:linear-gradient(135deg,#14b8a6,#0d9488);color:#fff;box-shadow:0 0 0 1px rgba(45,212,191,.5),0 3px 10px rgba(13,148,136,.35)}
@keyframes btnSheen{from{background-position:150% 0}to{background-position:-60% 0}}
@media (prefers-reduced-motion:reduce){.btn,.btn::after,.chip{transition:none;animation:none!important}}
.stsearch{position:sticky;top:6px;z-index:5;display:flex;align-items:center;gap:10px;margin:10px 0 4px;padding:6px;border-radius:14px;background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,.10)}
.stsearch input{flex:1;min-width:0;padding:11px 14px;border-radius:11px;border:1.5px solid rgba(20,184,166,.45);font:inherit;font-size:16px;background:var(--surface)}
.stsearch input:focus{outline:none;border-color:#14b8a6;box-shadow:0 0 0 3px rgba(20,184,166,.18)}.stsearch span{font-size:12.5px;white-space:nowrap;padding-right:6px}
.cashk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.cashbar{display:flex;flex-direction:column;gap:6px}.cashbar>div{display:flex;align-items:center;gap:8px}.cashbar small{width:46px;font-size:12px;color:var(--muted)}.cashbar i{display:block;height:14px;border-radius:6px;min-width:2px}.cashbar i.owe{background:repeating-linear-gradient(135deg,rgba(27,175,122,.45) 0 6px,rgba(27,175,122,.15) 6px 12px);margin-left:-6px}
.cashrec summary{cursor:pointer;padding:4px 0}.cashrec .list{margin-top:6px}
@media (max-width:620px){.cashk{grid-template-columns:1fr}}
.wdlist{display:flex;flex-direction:column;gap:8px}
.wdsrch input{width:100%;padding:10px 14px;border-radius:12px;border:1.5px solid rgba(20,184,166,.4);font:inherit;font-size:16px;background:var(--surface)}

.wdr2.over{border-color:#e34948;box-shadow:0 0 0 3px rgba(227,73,72,.14)}.wdr2.empty:not(.on){opacity:.6}
.wda{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-weight:700;font-size:18px;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 55% 58%),hsl(calc(var(--h) + 30) 55% 42%));overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}.wda .thumb{width:44px;height:44px;border-radius:13px}
.wdm{min-width:0;display:flex;flex-direction:column;gap:4px}.wdt{display:flex;align-items:center;gap:6px}.wdt b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.wds{display:flex;gap:4px;flex-wrap:wrap}.wdchip{font-size:11.5px;padding:1px 8px;border-radius:99px;background:rgba(0,0,0,.05);color:var(--muted);white-space:nowrap}.wdchip.bad{background:rgba(227,73,72,.12);color:#c22b2b}
.wdmeter{height:4px;border-radius:9px;background:rgba(0,0,0,.06);overflow:hidden}.wdmeter i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#14b8a6,#0f766e);transition:width .25s}.wdr2.over .wdmeter i{background:#e34948}
.wdctl{display:grid;grid-template-columns:auto auto;grid-template-areas:"s s" "u c";gap:2px 6px;justify-items:end;align-items:center}
.wdstep{grid-area:s;display:flex;align-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);overflow:hidden}

.wdstep input{width:58px;height:38px;border:0;text-align:center;font:inherit;font-size:16px;font-weight:700;background:transparent;padding:0}.wdstep input:focus{outline:none;background:rgba(20,184,166,.06)}
.wdu{grid-area:u;font-size:11px;color:var(--muted)}.wdc{grid-area:c;font-size:14px;font-variant-numeric:tabular-nums;color:#0f766e}.wdc.neg{color:#c22b2b}
.wdsum{position:sticky;bottom:-1px;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-radius:16px;color:#fff;background:linear-gradient(135deg,#14b8a6,#0d9488 55%,#0f766e);box-shadow:0 6px 18px rgba(13,148,136,.35)}
.wdsum.neg{background:linear-gradient(135deg,#f0525a,#e5383b 55%,#b91c1c);box-shadow:0 6px 18px rgba(229,56,59,.3)}
.wdsum small{display:block;font-size:12px;opacity:.9}.wdsum span{font-size:12.5px;opacity:.85}.wdsum b{font-size:22px;font-variant-numeric:tabular-nums}
.wdseg button[aria-pressed=true][data-v=sell]{background:linear-gradient(135deg,#14b8a6,#0f766e);box-shadow:0 0 0 1px rgba(45,212,191,.5),0 4px 12px rgba(13,148,136,.35);color:#fff}
.wdseg button[aria-pressed=true][data-v=waste]{background:linear-gradient(135deg,#f0525a,#b91c1c);box-shadow:0 4px 12px rgba(229,56,59,.3);color:#fff}
@media (max-width:420px){.wdr2{grid-template-columns:40px minmax(0,1fr);grid-template-areas:"a m" "c c"}.wdr2 .wda{grid-area:a;width:40px;height:40px}.wdr2 .wdm{grid-area:m}.wdr2 .wdctl{grid-area:c;grid-template-columns:1fr auto auto;grid-template-areas:"u s c";justify-items:start}.wdr2 .wdc{justify-self:end;min-width:64px;text-align:right}}
.subtabs{gap:6px;padding:6px;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--surface) 80%,transparent),color-mix(in srgb,var(--surface) 55%,transparent));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid color-mix(in srgb,var(--line) 60%,transparent);box-shadow:0 8px 24px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.12)}
.subtabs button{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:13px;font-weight:600;color:var(--muted);transition:background .25s,color .25s,box-shadow .25s,transform .15s}

.subtabs button[aria-pressed="true"]{color:#fff;background:linear-gradient(135deg,#14b8a6,#0d9488 55%,#0f766e);box-shadow:0 0 0 1px rgba(45,212,191,.55),0 6px 16px rgba(13,148,136,.35),0 0 18px rgba(45,212,191,.35);text-shadow:0 1px 1px rgba(0,0,0,.15)}
.subtabs button[aria-pressed="true"] i{background:rgba(255,255,255,.22)}
.subtabs button[aria-pressed="true"]::after{content:"";position:absolute;left:50%;bottom:-3px;width:26px;height:3px;margin-left:-13px;border-radius:3px;background:#5eead4;box-shadow:0 0 8px #5eead4}
.subtabs button:active{transform:scale(.97)}
@media (max-width:560px){.subtabs button{padding:8px 12px}.subtabs button i{width:24px;height:24px;font-size:15px}}
.stl{display:flex;flex-direction:column;gap:8px}
.str{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 8px rgba(30,20,10,.05);transition:transform .15s,box-shadow .2s,border-color .2s}

.wdchip.sale{color:#1d4ed8;background:rgba(42,120,214,.10)}.wdchip.use{color:#0f766e;background:rgba(20,184,166,.12)}
.wdmeter.lw i{background:linear-gradient(90deg,#eda100,#eb6834)}.str.out .wdmeter i{background:#e34948}
.stq{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;min-width:64px}.stq b{font-size:22px;font-variant-numeric:tabular-nums}.stq small{font-size:12px;color:var(--muted)}.stq em{font-style:normal;font-size:11px;color:var(--muted);margin-top:2px}

.str .wda .zoomable{display:block}
@media (max-width:420px){.str{grid-template-columns:40px minmax(0,1fr) auto;gap:10px;padding:10px 12px}.str .wda{width:40px;height:40px}.str .btn.sm{padding:5px 8px}}
.stava{position:relative;overflow:visible!important}.stava .thumb,.stava .zoomable{border-radius:13px;overflow:hidden;display:block;width:100%;height:100%}.stava .thumb img,.stava img{width:100%;height:100%;object-fit:cover;border-radius:13px}

.stini{display:grid;place-items:center;width:100%;height:100%;cursor:pointer}
.stcam{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);background:linear-gradient(135deg,#14b8a6,#0f766e);color:#fff;font-size:11px;line-height:1;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 6px rgba(13,148,136,.4);padding:0;transition:transform .15s}
.stcam:hover{transform:scale(1.15)}.str .wda,.wdr2 .wda{width:52px;height:52px}.str{grid-template-columns:52px minmax(0,1fr) auto}

<script>
"use strict";
/* ---------- บัตรสมาชิก (ใช้ได้ทั้งร้านเนื้อล้วนๆ และข้าวมันไก่) ---------- */
function showMemberCard(m){const o=document.getElementById('mCardOv');if(o)o.remove();if(!m)return;
  const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pts=(+m.points||0).toLocaleString('th-TH');
  const el=document.createElement('div');el.id='mCardOv';el.className='mcard-ov';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','บัตรสมาชิก');
  const bg=[...String(m.phone||m.name||'')].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7)%2?'po':'nl';
  el.innerHTML=`<div class="mcard mc-${bg}" style="--mcbg:url(images/card-${bg}.png)"><div class="mc-top"><div class="mc-logos"><img src="images/logo-nl.png?v=20261016b" alt=""><img src="images/logo-po.png" alt=""></div><span>MEMBER CARD</span></div>
    <div class="mc-mid"><b>${m.name?'คุณ'+e(m.name):'สมาชิก'}</b><span>${e(m.phone||'')}</span></div>
    <div class="mc-bot"><div><small>แต้มสะสม</small><strong>${pts}</strong></div><em>ใช้ได้ทั้ง 2 ร้าน<br>เนื้อล้วนๆ · ข้าวมันไก่</em></div><i class="mc-shine"></i></div>
    ${m.note?`<p class="mc-note">${e(m.note)}</p>`:''}
    ${m.action?`<button type="button" class="mc-act" data-mc="act">${e(m.action)}</button>`:''}
    <button type="button" class="mc-x" data-mc="x">ปิด</button>`;
  const close=()=>{el.remove();window.removeEventListener('keydown',k,true)};const k=ev=>{if(ev.key==='Escape'){ev.stopPropagation();close()}};window.addEventListener('keydown',k,true);
  el.addEventListener('click',ev=>{const b=ev.target.closest('[data-mc]');if(ev.target===el||(b&&b.dataset.mc==='x'))return close();if(b&&b.dataset.mc==='act'){close();m.onAction&&m.onAction()}});
  document.body.appendChild(el);}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const num=n=>r2(n).toLocaleString('th-TH',{maximumFractionDigits:2});
const baht=n=>(n<0?'−':'')+'฿'+num(Math.abs(n));
const DAY=864e5;
const bkDay=()=>new Date(Date.now()+7*3600e3).toISOString().slice(0,10);
const sod=(t=Date.now())=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);

/* ---------- ตัวเลือกเมนู (แบบ LINE MAN) ใช้ร่วมกันทั้งหน้าพนักงานและหน้าลูกค้า ---------- */
const optGroups=m=>Array.isArray(m&&m.options)?m.options.filter(g=>g&&g.name&&(g.choices||[]).length):[];
const hasOpts=m=>optGroups(m).length>0;
const optKey=opts=>(opts||[]).map(o=>o.cid||o.n).join(',');
const optNames=opts=>(opts||[]).map(o=>o.n).join(', ');
const optPx=opts=>(opts||[]).map(o=>+o.p>0?(/เพิ่ม|ท็อป|topping/i.test(o.g||'')?'เพิ่ม':'')+o.n+' +'+(Math.round(+o.p*100)/100):o.n).join(', ');
const optRule=g=>g.req?(+g.max===1?'ต้องเลือก 1':'ต้องเลือก'+(+g.max>1?' สูงสุด '+g.max:'อย่างน้อย 1')):(+g.max===1?'เลือกได้ 1':'เลือกได้'+(+g.max>1?' สูงสุด '+g.max:'หลายอย่าง'));
const minPrice=m=>(+m.price||0)+optGroups(m).filter(g=>g.req).reduce((s,g)=>s+Math.min(...g.choices.map(c=>+c.price||0)),0);

/* ---------- ดูรูปเต็มจอ ---------- */
// หน้าต่างซ้อน (รูป / หน้าในแอป) ปิดได้ด้วยปุ่มกลับของ Android และไม่ติดค้างในโหมดแอปบน iPhone
const OVL=[];let OVL_SKIP=0;
function ovlPush(close){OVL.push(close);try{history.pushState({ovl:OVL.length},'')}catch(e){}}
function ovlClose(close){const i=OVL.indexOf(close);if(i<0)return;OVL.splice(i,1);try{if(history.state&&history.state.ovl){OVL_SKIP++;history.back()}}catch(e){}}
window.addEventListener('popstate',()=>{if(OVL_SKIP){OVL_SKIP--;return}const c=OVL.pop();if(c)c(true)});
function viewImg(src,cap){if(!src)return;const o=document.getElementById('imgView');if(o)o.remove();const el=document.createElement('div');el.id='imgView';el.className='imgview';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');
  el.innerHTML=`<img src="${esc(src)}" alt="${esc(cap||'')}">${cap?`<div class="iv-cap">${esc(cap)}</div>`:''}<button type="button" class="iv-x" aria-label="ปิด">×</button><button type="button" class="iv-close">✕ ปิด กลับหน้าเดิม</button>`;
  let done=false;const close=fromPop=>{if(done)return;done=true;el.remove();window.removeEventListener('keydown',k,true);if(fromPop!==true)ovlClose(close)};const k=e=>{if(e.key==='Escape'){e.stopPropagation();close()}};window.addEventListener('keydown',k,true);
  el.addEventListener('click',e=>{e.stopPropagation();close()});document.body.appendChild(el);ovlPush(close)}
// เปิดหน้าเว็บของร้าน (ใบเสร็จ / สั่งเพิ่มให้ลูกค้า ฯลฯ) ในหน้าต่างซ้อน มีปุ่ม ← กลับ
function openFrame(url,title){const old=document.getElementById('frmView');if(old)old.remove();
  const el=document.createElement('div');el.id='frmView';el.className='frmview';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');
  el.innerHTML=`<div class="fv-bar"><button type="button" class="fv-back">← กลับ</button><b>${esc(title||'')}</b></div><iframe src="${esc(url)}" title="${esc(title||'หน้าเว็บ')}"></iframe>`;
  let done=false;const close=fromPop=>{if(done)return;done=true;el.remove();if(fromPop!==true)ovlClose(close);try{render()}catch(e){}};
  el.querySelector('.fv-back').addEventListener('click',()=>close());document.body.appendChild(el);ovlPush(close)}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[target="_blank"]');if(!a||a.dataset.noframe)return;
  let u;try{u=new URL(a.href,location.href)}catch(x){return}if(u.origin!==location.origin||!/\.html$/.test(u.pathname))return;
  const mobile=matchMedia('(pointer:coarse)').matches||matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;if(!mobile)return;
  e.preventDefault();openFrame(u.href,(a.textContent||'').replace(/\s+/g,' ').trim().slice(0,40))},true);
function optPick(m,cfg){cfg=cfg||{};const G=optGroups(m);const pick={};G.forEach(g=>pick[g.id]=[]);let qty=1,note='',warn=false;
  const mul=cfg.mul||(x=>x);

  const el=document.createElement('div');el.id='optPop';el.className='opop';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');document.body.appendChild(el);
  const sel=()=>{const opts=[];G.forEach(g=>g.choices.forEach(c=>{if(pick[g.id].includes(c.id))opts.push({gid:g.id,cid:c.id,g:g.name,n:c.name,p:+c.price||0})}));return opts};
  const unit=()=>mul((+m.price||0)+sel().reduce((s,o)=>s+o.p,0));
  const missing=()=>G.filter(g=>g.req&&!pick[g.id].length);
  const close=()=>{el.remove();window.removeEventListener('keydown',onKey,true)};
  const onKey=e=>{if(e.key==='Escape'){e.stopPropagation();close()}};window.addEventListener('keydown',onKey,true);
  function draw(){const miss=missing(),keepNote=el.querySelector('#opNote')?.value,sc=el.querySelector('.op-body')?.scrollTop||0;
    el.innerHTML=`<div class="op-card"><div class="op-body">
      ${m.img?`<div class="op-img zoomable" data-oimg="1"><img src="${esc(m.img)}" alt=""></div>`:''}
      <div class="op-hd"><div class="op-t"><h2>${esc(m.name)}</h2>${m.desc?`<p>${esc(m.desc)}</p>`:''}</div><b>${baht(mul(+m.price||0))}</b></div>
      ${G.map(g=>{const bad=warn&&miss.includes(g);return `<section class="op-g${bad?' bad':''}" data-g="${esc(g.id)}"><div class="op-gh"><b>${esc(g.name)}</b><span class="op-rule${g.req?' req':''}">${optRule(g)}</span></div>
        ${g.choices.map(c=>{const on=pick[g.id].includes(c.id);return `<button type="button" class="op-c${on?' on':''}" data-og="${esc(g.id)}" data-oc="${esc(c.id)}" aria-pressed="${on}"><i class="${+g.max===1?'rd':'ck'}"></i><span>${esc(c.name)}</span><em>${+c.price?'+'+baht(mul(+c.price)).replace('฿',''):''}</em></button>`}).join('')}</section>`}).join('')}
      <section class="op-g"><div class="op-gh"><b>บอกครัว</b><span class="op-rule">ไม่บังคับ</span></div>
        <input id="opNote" maxlength="80" placeholder="เช่น ไม่ใส่ผัก ไม่เผ็ด" autocomplete="off">
        ${(cfg.notes||[]).length?`<div class="op-qn">${cfg.notes.map(n=>`<button type="button" class="chip" data-on="${esc(n)}">${esc(n)}</button>`).join('')}</div>`:''}</section>
    </div>
    <div class="op-foot"><div class="stepper"><button type="button" data-oq="-1" aria-label="ลด">−</button><span>${qty}</span><button type="button" data-oq="1" aria-label="เพิ่ม">+</button></div>
      <button type="button" class="btn pri wide op-add" data-oadd="1">${miss.length&&warn?'ยังไม่ได้เลือก: '+esc(miss[0].name):(cfg.addLabel||'ใส่ตะกร้า')+' '+baht(unit()*qty)}</button></div>
    <button type="button" class="op-x" data-ox="1" aria-label="ปิด">×</button></div>`;
    const n=el.querySelector('#opNote');n.value=keepNote!=null?keepNote:note;n.addEventListener('input',()=>note=n.value);
    el.querySelector('.op-body').scrollTop=sc;}
  let downBg=false;el.addEventListener('pointerdown',e=>{downBg=e.target===el});
  el.addEventListener('click',e=>{if(e.target===el){if(downBg)close();return}if(e.target.closest('[data-oimg]'))return viewImg(m.img,m.name);const b=e.target.closest('button');if(!b)return;e.stopPropagation();
    if(b.dataset.ox)return close();
    if(b.dataset.og){const g=G.find(x=>x.id===b.dataset.og),cid=b.dataset.oc,a=pick[g.id];
      if(+g.max===1)pick[g.id]=a.includes(cid)&&!g.req?[]:[cid];
      else if(a.includes(cid))pick[g.id]=a.filter(x=>x!==cid);
      else{if(+g.max>1&&a.length>=+g.max)return;a.push(cid)}
      return draw()}
    if(b.dataset.on){const n=el.querySelector('#opNote');n.value=n.value?n.value+', '+b.dataset.on:b.dataset.on;note=n.value;return}
    if(b.dataset.oq){qty=Math.max(1,Math.min(20,qty+ +b.dataset.oq));return draw()}
    if(b.dataset.oadd){const miss=missing();if(miss.length){warn=true;draw();const s=el.querySelector('.op-g.bad');if(s)s.scrollIntoView({block:'center',behavior:'smooth'});return}
      note=(el.querySelector('#opNote')?.value||'').trim();const opts=sel();close();cfg.onAdd&&cfg.onAdd({opts,qty,note,unit:unit()})}});
  draw();}

function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
const pcFmt=n=>{n=String(n||'').replace(/\D/g,'');return n.length===10?n.replace(/(\d{3})(\d{3})(\d{4})/,'$1 $2 $3'):n.length===13?n.replace(/(\d)(\d{4})(\d{5})(\d{2})(\d)/,'$1-$2-$3-$4-$5'):n};

function ppPayload(id,amount){
  let t=String(id||'').replace(/\D/g,''),tag;
  if(t.length===15)tag='03';else if(t.length>=13){tag='02';t=t.slice(0,13)}else{tag='01';t=('0000000000000'+t.replace(/^0/,'66')).slice(-13)}
  const f=(k,v)=>k+String(v.length).padStart(2,'0')+v;
  let p=f('00','01')+f('01',amount>0?'12':'11')+f('29',f('00','A000000677010111')+f(tag,t))+f('58','TH')+f('53','764');
  if(amount>0)p+=f('54',amount.toFixed(2));
  p+='6304';return p+crc16(p);}

// รายการรอทำ = บิลที่เปิดอยู่ + บิลเดลิเวอรี่ Raptor Rider ที่ลูกค้าโอนก่อนแล้ว (จ่ายแล้วแต่ยังทำไม่เสร็จ)

function mutateAny(oid,fn){if(S.open[oid])return mutateItems(oid,fn);const i=(S.today||[]).findIndex(o=>o.id===oid);if(i<0)return Promise.resolve(false);
  const o=S.today[i];S.today[i]={...o,items:fn((o.items||[]).map(l=>({...l})))};render();
  return write('orders/'+oid,r=>r.transform(d=>d.status==='paid'?{items:fn((d.items||[]).map(l=>({...l})))}:null));}

/* ---------- แต้ม: เก็บแยกตามเดือนที่ได้ (lots) หมดอายุสิ้นเดือนเดียวกันของปีถัดไป ใช้แต้มใหม่ก่อน ---------- */
const lotKey=(t=Date.now())=>{const d=new Date(t+7*3600e3);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')};
const lotExp=k=>{const m=/^(\d{4})-(\d{2})$/.exec(k);return m?Date.UTC(+m[1]+1,+m[2],1)-7*3600e3:Infinity};
const lotSum=L=>Object.values(L).reduce((a,b)=>a+(+b||0),0);
// ใช้แต้มใหม่ก่อน (แต้มเก่าไม่ถูกใช้อัตโนมัติ — ลูกค้าได้รับแจ้งเตือนก่อนหมดอายุ 30 วัน)
function lotTake(L,n){for(const k of Object.keys(L).sort().reverse()){if(n<=0)break;const t=Math.min(L[k],n);L[k]-=t;n-=t;if(L[k]<=0)delete L[k]}return L}
function memLots(d,now=Date.now()){const L={};Object.entries((d&&d.lots)||{}).forEach(([k,v])=>{v=+v||0;if(v>0)L[k]=v});
  const diff=Math.max(0,+(d&&d.points)||0)-lotSum(L);if(diff>0)L[lotKey(now)]=(L[lotKey(now)]||0)+diff;else if(diff<0)lotTake(L,-diff);
  let expired=0;Object.keys(L).forEach(k=>{if(lotExp(k)<=now){expired+=L[k];delete L[k]}});return {L,expired,points:lotSum(L)}}
const memPts=m=>memLots(m).points;
function memExpSoon(m,days=30){const now=Date.now(),{L}=memLots(m,now);let pts=0,at=0;Object.entries(L).forEach(([k,v])=>{const e=lotExp(k);if(e>now&&e-now<=days*DAY){pts+=v;if(!at||e<at)at=e-1}});return pts?{pts,at}:null}
const dExp=t=>new Date(t).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit',timeZone:'Asia/Bangkok'});
const expTxt=x=>x?`${num(x.pts)} แต้มจะหมดอายุ ${dExp(x.at)}`:'';
const histPush=(h,e)=>[{...e,at:Date.now()},...(Array.isArray(h)?h:[])].slice(0,30);

async function memRedeem(phone,pts,note){let short=false;
  const p=await S.db.doc('members/'+phone).transform(d=>{const r=memLots(d);if(r.points<pts){short=true;return null}const L=lotTake(r.L,pts);let h=d.hist;if(r.expired)h=histPush(h,{k:'expire',p:-r.expired});h=histPush(h,{k:'redeem',p:-pts,n:note});return {points:lotSum(L),lots:L,hist:h,lastAt:Date.now()}});
  if(short||!p)throw {code:'invalid_argument',message:'แต้มไม่พอ'};return p.points}
function rwUsed(id){write('rewards/'+id,r=>r.transform(d=>({redeemed:(+d.redeemed||0)+1,...(typeof d.stock==='number'?{stock:Math.max(0,d.stock-1)}:{})})))}

const stockList=()=>S.stock.filter(inShop);
const purchList=()=>(S.purch||[]).filter(inShop);
const expList=()=>(S.exp||[]).filter(inShop);
const incList=()=>(S.inc||[]).filter(inShop);
const shopTag=()=>isPo()?{shop:'po'}:isKn()?{shop:'kn'}:{};
function deductStock(items,menus,sign){const need={},M=menus||S.menu,k=sign||1;
  (items||[]).forEach(l=>{const m=M.find(x=>x.id===l.menuId);(m?.recipe||[]).forEach(g=>{if(g.stockId)need[g.stockId]=(need[g.stockId]||0)+(+g.qty||0)*(+l.qty||0)})});
  Object.entries(need).forEach(([sid,q])=>{q*=k;const s=S.stock.find(x=>x.id===sid);if(!s||stCut(s)==='use')return;s.qty=r2((+s.qty||0)-q);write('stock/'+sid,r=>r.transform(d=>({qty:r2((+d.qty||0)-q)})))});}

  const po=o.shop==='po',pc=po?poCfg():null;
  const B=po?{logo:pc.rcLogo||'images/logo-po-t.png?v=20261018',name:pc.rcName||pc.shopName||'ข้าวมันไก่',en:pc.rcNameEn??'KHAO MAN GAI',phone:pc.phone,fb:pc.rcFb}
    :{logo:st.rcLogo||'images/logo-nl-t.png?v=20261016b',name:st.rcName||'เนื้อล้วนๆ',en:st.rcNameEn??'NUEA LWOON',phone:st.phone,fb:st.rcFb??'เนื้อล้วนๆ ก๋วยเตี๋ยวเนื้อ'};
  let h=`<div class="rc rc-brand${po?' rc-po':''}">`;
  h+=`<img class="rc-logo" src="${esc(B.logo)}" alt=""><div class="rc-shop">${esc(B.name)}</div>${B.en?`<div class="rc-en">${esc(B.en)}</div>`:''}`;
  [B.fb?'Facebook: '+B.fb:'',B.phone?'โทร '+B.phone:'',st.address,st.taxId&&!po?'เลขประจำตัวผู้เสียภาษี '+st.taxId:''].filter(Boolean).forEach(x=>h+=`<div class="rc-sub">${esc(x)}</div>`);
  h+=`<div class="rc-title"><span>${isBill?'ใบแจ้งยอด':(vatCfg().on&&st.taxId?'ใบเสร็จรับเงิน/ใบกำกับภาษีอย่างย่อ':'ใบเสร็จรับเงิน')}</span><small>${isBill?'BILL':'RECEIPT'}</small></div>${!isBill&&vatCfg().on&&st.taxId?'<div class="rc-sub">VAT included</div>':''}`;
  if(o.orderNo||(!isBill&&o.billNo))h+=ln('เลขที่',esc(o.orderNo||o.billNo));
  h+=ln('วันที่',d)+(o.table==='TA'?ln('ช่องทาง',(o.selfOrder?'สั่งเองผ่าน QR':CH[chOf(o)].n)+(o.ref?' #'+esc(o.ref):'')):ln('โต๊ะ',esc(o.table)));
  const cn=custNames(o);if(cn.length)h+=ln('ลูกค้า',esc(cn.map(n=>'คุณ'+n).join(', ')));
  h+='<hr>';
  items.forEach(l=>{const unit=(+l.price||0)+(+l.extra||0);const notes=[optNames(l.opts),l.extra?'พิเศษ +'+num(l.extra):'',l.note||''].filter(Boolean);
    h+=`<div class="rc-item">${ln(`${l.qty} × ${esc(l.name)}`,num(lineAmt(l)))}${l.qty>1?`<div class="rc-note">@ ${num(unit)}</div>`:''}${notes.length?`<div class="rc-note">${esc(notes.join(' · '))}</div>`:''}</div>`});
  h+='<hr>'+ln(`รวม ${linesCount(items)} รายการ`,num(o.subtotal));
  if(o.discount)h+=ln('ส่วนลด','-'+num(o.discount));
  if(o.redeem)h+=ln(`ใช้แต้ม ${o.ptsUsed} แต้ม`,'-'+num(o.redeem));
  if(o.vat&&o.vatMode==='excl')h+=ln('ก่อนภาษี',num(o.beforeVat))+ln(`ภาษีมูลค่าเพิ่ม ${o.vatRate}%`,num(o.vat));
  if(o.roundOff)h+=ln('ส่วนลดปัดเศษ','-'+num(o.roundOff));
  h+=`<div class="rc-totbox">${ln(isBill?'ยอดที่ต้องชำระ':'ยอดสุทธิ','฿'+num(o.total),'rc-total')}</div>`;
  if(o.vat&&o.vatMode!=='excl')h+=`<div class="rc-note" style="padding-left:0">ราคารวมภาษีมูลค่าเพิ่ม ${o.vatRate}% แล้ว · มูลค่าก่อนภาษี ${num(o.beforeVat)} · VAT ${num(o.vat)}</div>`;
  if(!isBill){h+=ln('ชำระโดย',methodName(o.method));if(o.method==='cash')h+=ln('รับเงิน',num(o.received))+ln('เงินทอน',num(o.change))}
  if(o.memberPhone){h+=`<div class="rc-mem"><div class="rc-memh">⭐ สมาชิก${o.memberName?' คุณ'+esc(o.memberName):''}<span>${maskPhone(o.memberPhone)}</span></div>`;

    else h+=(o.ptsUsed?ln('แลกแต้ม','-'+o.ptsUsed):'')+ln('ได้รับแต้ม','+'+(o.ptsEarned||0))+ln('แต้มคงเหลือ',num(o.ptsBalance||0),'rc-b');h+='</div>'}
  else if(st.pointsOn&&!isBill)h+=`<hr><div class="rc-sub">สมัครสมาชิกด้วยเบอร์โทร รับ 1 แต้มทุก ${num(+st.pointsPer||50)} บาท</div>`;

  h+=`<div class="rc-foot"><div class="rc-ty">${esc((po?pc.rcThanks:st.receiptFooter)||'ขอบคุณที่อุดหนุน')}</div>${(po?pc.rcThanks2:st.rcThanks2??'แล้วพบกันใหม่นะคะ')?`<small>${esc(po?pc.rcThanks2:st.rcThanks2??'แล้วพบกันใหม่นะคะ')}</small>`:''}<div class="rc-hrt">♡</div></div>`;
  return h+'</div>';}

function printReceipt(){const pa=$('#printArea');pa.className='rcpt';pa.innerHTML=$('#rcView').innerHTML;
  const w=+S.settings.paper===58?58:80;let ps=$('#pageStyle');if(!ps){ps=document.createElement('style');ps.id='pageStyle';document.head.appendChild(ps)}

const loadScript=src=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=no;document.head.appendChild(e)});
async function shareReceipt(){const el=$('#rcView .rc'),btn=$('#rcShare');if(!el)return;btn.disabled=true;btn.textContent='กำลังสร้างรูป…';
  try{if(!window.html2canvas)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    const cv=await html2canvas(el,{scale:2,backgroundColor:'#ffffff'});
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));const o=S.sheet.order;
    const name=(S.sheet.mode==='bill'?'bill-':'receipt-')+(o.billNo||Date.now())+'.png';const file=new File([blob],name,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:S.settings.shopName})}catch(e){}}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('บันทึกรูปใบเสร็จแล้ว')}
  }catch(e){toast('สร้างรูปไม่สำเร็จ ลองกดพิมพ์แทน','bad')}
  if(btn.isConnected){btn.disabled=false;btn.textContent='ส่งเป็นรูป'}}

function menuAutoCost(m){const z={c:0,n:0,how:'none'};if(!m||!m.id||!isPo())return z;const RS=poRounds(),R=RS[1]&&roundOrders(RS[1]).length?RS[1]:RS[0];if(!R)return z;
  let n=0;roundOrders(R).forEach(o=>(o.items||[]).forEach(l=>{if(l.menuId===m.id)n+=+l.qty||0}));if(!n)return {...z,R};
  const A=cpActual(R),row=A.rows.find(r=>r.menuId===m.id&&!r.opt)||A.rows.find(r=>r.menuId===m.id);if(row&&row.sold>0)return {c:r2(row.cost),n,R,how:'plan'};
  const u=cpUnit(m.id).c;if(poIsDrink({menuId:m.id,name:m.name})&&A.BD>0&&A.dq>0)return {c:r2(A.BD/A.dq+u),n,R,how:'drink'};return {c:r2(u),n,R,how:'recipe'}}

async function shrinkImage(file,max=900,q=0.82){
  let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){bmp=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)})}
  const w=bmp.width,h=bmp.height,k=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(ok=>c.toBlob(ok,'image/jpeg',q));}
async function uploadMenuPhoto(menuId,file){

  if(error)throw {code:/policy|security|Unauthorized|403/i.test(error.message)?'invalid_argument':'unavailable',message:error.message};
  return {path,url:SB.storage.from('menu-photos').getPublicUrl(path).data.publicUrl};}

async function savePurch(){let sid=val('pItem');const qty=nval('pQty'),amount=nval('pAmt');

   <div class="grid2" style="margin-top:8px"><div class="field"><label for="bStaff">เรียกพนักงาน / ขอน้ำ</label><div class="inrow"><select id="bStaff" data-bell="staff">${opt(c.staff)}</select><button class="btn sm" data-act="bellTest" data-k="staff" type="button" aria-label="ฟังเสียง">▶</button></div></div>

function bellBind(){pushStatus();if(PUSH.ok())PUSH.loadKey().catch(()=>{});document.querySelectorAll('[data-bell]').forEach(e=>e.addEventListener(e.type==='range'&&e.dataset.bell!=='rate'?'input':'change',()=>{const c=bellCfg(),k=e.dataset.bell;c[k]=k==='vol'||k==='rate'?(+e.value/100):k==='rep'?+e.value:e.value;bellSave(c);if(k==='mode')return;
    if(k==='rate'){const l=e.closest('.field').querySelector('label');if(l)l.textContent='ความเร็วพูด '+e.value+'%';Bell.sayNow('โต๊ะ 2 ขอชำระเงิน เช็คบิล');return}if(k==='voice'){Bell.sayNow('โต๊ะ 2 ขอชำระเงิน เช็คบิล');return}
    if(k==='vol'){const l=e.closest('.field').querySelector('label');if(l)l.textContent='ความดัง '+e.value+'%'}else if(k!=='rep'){Bell.unlock();Bell.ring(null,e.value)}}));
  const f=$('#bFile');if(f)f.addEventListener('change',()=>{const x=f.files&&f.files[0];if(!x)return;if(x.size>1048576)return toast('ไฟล์ใหญ่เกิน 1 MB ตัดเสียงให้สั้นลงก่อน','bad');
    const r=new FileReader();r.onload=()=>{try{localStorage.setItem('nl_bell_custom',r.result)}catch(e){return toast('เครื่องนี้เก็บไฟล์ไม่พอ ลองไฟล์ที่เล็กลง','bad')}const c=bellCfg();c.staff='custom';bellSave(c);Bell.unlock();Bell.ring(null,'custom');toast('ใช้เสียงของคุณแล้ว');refreshBellCard()};r.readAsDataURL(x)})}
async function pushBoot(){try{SB.rpc('push_setup',{p_url:PUSH.fn()}).then(()=>{},()=>{})}catch(e){}

function verRow(){const v=APP_VER.replace(/^(\d{4})\.(\d\d)\.(\d\d)-(\d\d)(\d\d).*/,(m,y,mo,d,h,mi)=>`${+d}/${+mo}/${+y+543} ${h}:${mi} น.`);return `<div class="verrow"><span>📱 เวอร์ชันที่ใช้อยู่: <b>${esc(v||'-')}</b></span><button type="button" class="btn sm" data-act="verCheck">🔄 ตรวจสอบอัปเดต</button></div>`}
async function checkUpdate(manual){try{const r=await fetch(location.pathname+'?vcheck='+Date.now(),{cache:'no-store'});if(!r.ok)return;const t=await r.text();const m=t.match(/name="app-version" content="([^"]+)"/);
  if(m&&APP_VER&&m[1]!==APP_VER&&!document.getElementById('updBar')){const b=document.createElement('div');b.id='updBar';b.className='updbar';b.innerHTML='มีเวอร์ชันใหม่ของเว็บ <button type="button">อัปเดตเลย</button>';
    b.querySelector('button').onclick=()=>{const u=new URL(location.href);u.searchParams.set('v',m[1]);location.replace(u.href)};document.body.appendChild(b);if(manual)toast('มีเวอร์ชันใหม่ กด "อัปเดตเลย" ด้านบน')}else if(manual)toast(m&&m[1]===APP_VER?'✅ เป็นเวอร์ชันล่าสุดแล้ว · ถ้าเพิ่งอัปโหลด รอ GitHub อัปเดต 1–5 นาทีแล้วลองใหม่':'ตรวจสอบไม่ได้ ลองใหม่')}catch(e){if(manual)toast('ตรวจสอบไม่ได้ (ไม่มีอินเทอร์เน็ต?)','bad')}}
Object.assign(ACT,{verCheck:()=>{toast('กำลังตรวจสอบ…');checkUpdate(1)}});
setTimeout(()=>{try{if(new URLSearchParams(location.search).has('install')&&!PUSH.standalone())instOpen()}catch(e){}},600);
setTimeout(checkUpdate,3000);setInterval(checkUpdate,5*60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});

/* ======================= ลิ้นชักเงินสด (เงินทอนตั้งต้น · นับเงินตอนปิดร้าน) — ทุกร้าน ======================= */
function cashBoot(db){db.collection('cash_sessions').where('at','>=',sod()-40*DAY).onSnapshot(s=>{S.cashS=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at);renderSoon();if(S.sheet&&/^cash/.test(S.sheet.type))renderSheet()},()=>{})}
const cashShop=()=>isPo()?'po':isKn()?'kn':'noodle';
const cashCur=(sh=cashShop())=>(S.cashS||[]).find(x=>x.shop===sh&&!x.closeAt)||null;
const cashLast=(sh=cashShop())=>(S.cashS||[]).find(x=>x.shop===sh&&x.closeAt)||null;
const shopNm=sh=>sh==='po'?(poCfg().shopName||'ข้าวมันไก่'):sh==='kn'?(knCfg().shopName||'ล้านฅนเมียง'):'เนื้อล้วนๆ';
// ยอดขายตั้งแต่เปิดลิ้นชัก แยกเงินสด / โอน
function cashSales(c){const t0=+c.at||sod(),t1=+c.closeAt||Infinity,sh=c.shop;let cash=0,qr=0,n=0;
  if(sh==='kn')(S.knSales||[]).filter(o=>knLive(o)&&+o.at>=t0&&+o.at<t1).forEach(o=>{n++;if(o.pay==='cash')cash+=+o.total||0;else qr+=+o.total||0});
  else if(sh==='po')(S.poAll||[]).filter(o=>o.payStatus==='paid'&&+o.payAt>=t0&&+o.payAt<t1).forEach(o=>{n++;if(o.payMethod==='cash')cash+=+o.paidAmt||+o.total||0;else qr+=+o.paidAmt||+o.total||0});
  else (S.today||[]).filter(o=>+o.paidAt>=t0&&+o.paidAt<t1).forEach(o=>{n++;if(o.method==='cash')cash+=+o.total||0;else qr+=+o.total||0});
  return {cash:r2(cash),qr:r2(qr),n}}
function sheetCashOpen(){const s=S.sheet,sh=cashShop(),last=cashLast(sh),def=s.f??(last&&last.float)??knCfg().floatDef??500,KN=sh==='kn',off=KN?S.knMenu.filter(m=>m.active===false):[];
  $('#panel').innerHTML=head('💵 เปิดร้าน · เงินทอนตั้งต้น',shopNm(sh)+' · ใส่เงินที่เตรียมไว้ทอนในลิ้นชัก')+`<div class="sh-body">
   <div class="knp-tot"><small>เงินทอนตั้งต้น</small><b id="cfShow">${baht(+def||0)}</b></div>
   <div class="field"><label for="cfIn">จำนวนเงินทอนในลิ้นชัก (บาท)</label><input id="cfIn" inputmode="decimal" value="${def}"></div>
   <div class="chips">${[0,300,500,1000].map(v=>`<button type="button" class="chip" data-act="cfSet" data-v="${v}">${v?baht(v):'ไม่มี'}</button>`).join('')}</div>
   ${off.length?`<label class="check"><input type="checkbox" id="cfReact" checked> เปิดขายเมนูที่หมดเมื่อวาน (${off.length} เมนู: ${esc(off.slice(0,4).map(m=>m.name).join(', '))}${off.length>4?'…':''})</label>`:''}
   <p class="help" style="margin:0">ตอนปิดร้าน ระบบจะหักเงินทอนนี้ออกจากเงินที่นับได้ให้เอง</p></div>
   ${KN?`<button type="button" class="btn wide cfscan" data-act="cfScan">📱 ไม่มีเงินทอน · รับสแกน/โอนอย่างเดียว<small>ลูกค้าจ่ายพร้อมเพย์ทั้งหมด · ปิดการรับเงินสดวันนี้</small></button>`:''}</div>
   <div class="sh-foot"><button class="btn" data-act="close" type="button">ข้าม</button><button class="btn pri wide" data-act="cfSave" type="button">🔓 เปิดร้าน · เริ่มขาย</button></div>`;
  const i=$('#cfIn');i.addEventListener('input',()=>{s.f=i.value.replace(/[^0-9.]/g,'');$('#cfShow').textContent=baht(+s.f||0)})}
function knPotRows(t0,t1){const M={};(S.knMenu||[]).forEach(m=>M[m.id]={m,q:0,s:0,pot:0,pack:0,ing:[]});
  (S.knSales||[]).filter(o=>knLive(o)&&+o.at>=t0&&+o.at<t1).forEach(o=>(o.items||[]).forEach(l=>{const r=M[l.menuId];if(!r)return;const q=+l.qty||0;r.q+=q;r.s+=((+l.price||0)+(+l.extra||0))*q;r.pack+=cpUnitKn(l.menuId)*q}));
  (S.wdN||[]).filter(w=>w.shop==='kn'&&w.menuId&&+w.at>=t0&&+w.at<t1).forEach(w=>{const r=M[w.menuId];if(!r)return;(w.items||[]).forEach(x=>{r.pot+=(+x.q||0)*(+x.uc||0);r.ing.push(x)})});
  return Object.values(M).filter(r=>r.q||r.pot).map(r=>({...r,cost:r.pot+r.pack,per:r.q?(r.pot+r.pack)/r.q:0,pf:r.s-r.pot-r.pack})).sort((a,b)=>b.s-a.s)}
function cpUnitKn(mid){const m=(S.knMenu||[]).find(x=>x.id===mid);let c=0;(m&&m.recipe||[]).forEach(g=>{const t=(S.stock||[]).find(x=>x.id===g.stockId);if(t&&stCut(t)==='sale')c+=(+g.qty||0)*(+t.unitCost||0)});return c}

   ${edit?`<div class="kpr-l" data-lm="${r.m.id}"><span>ของที่เหลือ:</span><button type="button" class="chip" aria-pressed="${lf.st==='out'}" data-act="cfLeft" data-id="${r.m.id}" data-v="out">หมดพอดี</button><button type="button" class="chip" aria-pressed="${lf.st==='left'}" data-act="cfLeft" data-id="${r.m.id}" data-v="left">เหลือ</button>${lf.st==='left'?`<input class="kpr-q" data-lq="${r.m.id}" inputmode="decimal" value="${lf.q??''}" placeholder="กี่ถุง"><small>ถุง</small>`:''}</div>`:lf.st?`<small class="muted">${lf.st==='out'?'หมดพอดี':'เหลือ '+num(lf.q||0)+' ถุง'}</small>`:''}</div>`}).join('')}</div>`}
function sheetCashClose(){const s=S.sheet,sh=cashShop(),c=cashCur(sh);if(!c){$('#panel').innerHTML=head('💵 ปิดร้าน · นับเงิน')+`<div class="sh-body"><div class="empty"><b>ยังไม่ได้เปิดลิ้นชักวันนี้</b>ไม่มีเงินทอนตั้งต้นให้หัก</div></div><div class="sh-foot"><button class="btn wide" data-act="close" type="button">ปิด</button></div>`;return}
  const X=cashSales(c),exp=r2((+c.float||0)+X.cash),cnt=s.cnt===''||s.cnt==null?null:+s.cnt,diff=cnt==null?null:r2(cnt-exp);if(!s.left)s.left={};
  $('#panel').innerHTML=head('💵 ปิดร้าน · นับเงินสด',shopNm(sh)+' · เปิดตั้งแต่ '+hm(c.at))+`<div class="sh-body">
   <div class="cash-k"><div><small>เงินทอนตั้งต้น</small><b>${baht(c.float||0)}</b></div><div><small>ขายเงินสด</small><b>${baht(X.cash)}</b></div><div><small>โอน / สแกน</small><b>${baht(X.qr)}</b></div><div class="hl"><small>ควรมีเงินในลิ้นชัก</small><b>${baht(exp)}</b></div></div>
   ${c.scanOnly&&!X.cash?'<p class="help" style="margin:0">📱 วันนี้รับสแกนอย่างเดียว · ไม่ต้องนับเงินสด</p><input type="hidden" id="ccIn" value="">':`<div class="field"><label for="ccIn">นับเงินสดในลิ้นชักได้ (บาท)</label><input id="ccIn" inputmode="decimal" value="${s.cnt??''}" placeholder="${num(exp)}"></div>`}
   <div class="cash-r" id="ccRes">${cashResHtml(c,X,cnt,diff)}</div>
   ${sh==='kn'?knPotHtml(+c.at,Infinity,1,s.left):''}
   <div class="field"><label for="ccNote">หมายเหตุ (ไม่บังคับ)</label><input id="ccNote" maxlength="80" value="${esc(s.note||'')}" placeholder="เช่น ทอนผิด 20 บาท"></div></div>
   <div class="sh-foot"><button class="btn" data-act="close" type="button">ยังไม่ปิด</button><button class="btn pri wide" data-act="ccSave" type="button">🔒 ปิดร้าน · บันทึกยอด</button></div>`;
  const i=$('#ccIn');i.addEventListener('input',()=>{s.cnt=i.value.replace(/[^0-9.]/g,'');const v=s.cnt===''?null:+s.cnt;$('#ccRes').innerHTML=cashResHtml(c,X,v,v==null?null:r2(v-exp))});
  $('#ccNote').addEventListener('input',e=>s.note=e.target.value);document.querySelectorAll('[data-lq]').forEach(e=>e.addEventListener('input',()=>{s.left[e.dataset.lq]={st:'left',q:e.value.replace(/[^0-9.]/g,'')}}))}
function cashResHtml(c,X,cnt,diff){const net=cnt==null?X.cash:r2(cnt-(+c.float||0));
  return `<div class="kv tot"><span>เงินสดจากการขาย (หักเงินทอนแล้ว)</span><b>${baht(net)}</b></div><div class="kv"><span>รวมรายได้วันนี้ (สด + โอน)</span><b>${baht(r2(net+X.qr))}</b></div>
   ${diff==null?'<p class="help" style="margin:0">ใส่ยอดที่นับได้ เพื่อเช็กเงินขาด/เกิน</p>':Math.abs(diff)<0.01?'<div class="cash-ok">✅ เงินตรงพอดี</div>':`<div class="cash-bad ${diff>0?'over':''}">${diff>0?'⬆️ เงินเกิน':'⚠️ เงินขาด'} ${baht(Math.abs(diff))}</div>`}`}
function cashHistHtml(sh){const L=(S.cashS||[]).filter(x=>x.shop===sh).slice(0,10);if(!L.length)return '';

Object.assign(ACT,{
  cfSet:d=>{const i=$('#cfIn');i.value=d.v;S.sheet.f=d.v;$('#cfShow').textContent=baht(+d.v)},

  cfSave:async()=>{const sh=cashShop(),f=+(S.sheet.f??val('cfIn'))||0;if(cashCur(sh)){closeSheet();return toast('ลิ้นชักเปิดอยู่แล้ว')}const now=Date.now(),id=sh+'-'+now,doc={shop:sh,at:now,float:S.sheet.scan?0:r2(f),by:S.me||'',...(S.sheet.scan?{scanOnly:true}:{}),...(sh==='kn'?{qk:newQrKey()+newQrKey()}:{})};

    const ok=await write('cash_sessions/'+c.id,r=>r.update(upd));if(!ok)return;Object.assign(c,upd);

    closeSheet();render();toast('🔒 ปิดร้านแล้ว · เงินสดสุทธิ '+baht(upd.net)+(upd.diff!=null&&Math.abs(upd.diff)>=.01?(upd.diff>0?' · เกิน ':' · ขาด ')+baht(Math.abs(upd.diff)):''))},

/* ======================= ร้านล้านฅนเมียง (ขายหน้าร้าน ไม่มีโต๊ะ) ======================= */
function knBoot(db){

  db.collection('kn_sales').where('at','>=',sod()-40*DAY).onSnapshot(s=>{const prev=S.knSeen;S.knSales=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at);S.knSeen=new Set(S.knSales.map(o=>o.id));const pSl=S.knSlipSeen;S.knSlipSeen=new Map(S.knSales.filter(o=>o.slipAt).map(o=>[o.id,o.slipAt]));
    if(prev&&isKn()&&S.state==='ready'){const nw=S.knSales.filter(o=>o.src==='qr'&&!prev.has(o.id)),sl=S.knSales.filter(o=>o.slipAt&&o.status==='unpaid'&&(pSl&&pSl.get(o.id))!==o.slipAt);
      if(sl.length){toast('💳 ลูกค้าแนบสลิปแล้ว '+sl.map(o=>o.no+' คุณ'+(o.name||'')+' '+baht(o.total)).join(', ')+' · รอตรวจยอด');try{Bell.ring('pay',null,'ลูกค้าแนบสลิปแล้ว คิว '+sl[0].no+' กรุณาตรวจยอดค่ะ')}catch(e){}}
      else if(nw.length){toast('📱 ออร์เดอร์ใหม่ '+nw.map(o=>o.no+' คุณ'+(o.name||'')+' · '+baht(o.total)).join(', '));try{Bell.ring('staff',null,'มีออร์เดอร์ใหม่ คิว '+nw[0].no+' ค่ะ')}catch(e){}}}if(isKn())renderSoon();if(S.sheet&&S.sheet.type==='knSale')renderSheet()},()=>{})}
const knLive=o=>!o.status||o.status==='paid';
const knTok=()=>[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join('');
const knRcUrl=o=>{const u=new URL('receipt.html',location.href);return u.origin+u.pathname+'?s=kn&r='+encodeURIComponent(o.id)+'&t='+encodeURIComponent(o.tok||'')};
const knOrderUrl=()=>{const u=new URL('kn-order.html',location.href),c=cashCur('kn');return u.origin+u.pathname+(c?'?k='+encodeURIComponent(c.qk||c.id):'')};
const knToday=()=>(S.knSales||[]).filter(o=>+o.at>=sod());

function t24Norm(v){v=String(v||'').trim();if(!v)return '';let h,mi;const c=v.match(/^(\d{1,2})[:.](\d{1,2})$/);

let SCAN=null;
function stopScan(){if(!SCAN)return;SCAN.stop=true;try{SCAN.stream&&SCAN.stream.getTracks().forEach(t=>t.stop())}catch(e){}SCAN=null}
function scanFound(txt){let id='';try{const u=new URL(txt);id=u.searchParams.get('o')||''}catch(e){const m=String(txt).match(/[?&]o=([^&]+)/);if(m)id=decodeURIComponent(m[1])}
  const o=id&&(S.poOrders||[]).find(x=>x.id===id);if(!o){toast('QR นี้ไม่ใช่ออร์เดอร์ข้าวมันไก่ หรือไม่อยู่ในรายการ','bad');return false}
  try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}stopScan();openSheet({type:'poPick',id:o.id});return true}
async function sheetPoScan(){$('#panel').innerHTML=head('📷 สแกน QR รับของ','ส่องที่ QR ในหน้าออร์เดอร์บนมือถือลูกค้า')+`<div class="sh-body"><div class="scanbox"><video id="scV" playsinline muted autoplay></video><span class="scfr"></span></div><p class="help" id="scMsg" style="margin:0;text-align:center">กำลังเปิดกล้อง…</p>
   <div class="field"><label for="scTxt">หรือพิมพ์เลข KMK / เบอร์ 4 ตัวท้าย</label><input id="scTxt" inputmode="numeric" placeholder="เช่น 6 หรือ 0755"></div></div>
   <div class="sh-foot"><button class="btn" data-act="close" type="button">ปิด</button><button class="btn pri wide" data-act="scGo" type="button">ค้นหา</button></div>`;
  stopScan();const me=SCAN={stop:false};const msg=t=>{const e=$('#scMsg');if(e)e.textContent=t};
  try{me.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}catch(e){msg('เปิดกล้องไม่ได้ · อนุญาตกล้องในตั้งค่า หรือพิมพ์เลขด้านล่างแทน');return}
  if(me.stop){me.stream.getTracks().forEach(t=>t.stop());return}
  const v=$('#scV');if(!v)return stopScan();v.srcObject=me.stream;try{await v.play()}catch(e){}msg('ส่องให้ QR อยู่ในกรอบ');
  let det=null;if('BarcodeDetector' in window){try{det=new BarcodeDetector({formats:['qr_code']})}catch(e){det=null}}
  if(!det&&!window.jsQR){try{await loadScript('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js')}catch(e){msg('โหลดตัวอ่าน QR ไม่ได้ · พิมพ์เลขด้านล่างแทน');return}}
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  const tick=async()=>{if(me.stop||!v.isConnected)return;try{if(v.readyState>=2){let txt='';
      if(det){const r=await det.detect(v);if(r&&r[0])txt=r[0].rawValue}
      else{const w=Math.min(640,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);const r=window.jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'});if(r)txt=r.data}
      if(txt&&scanFound(txt))return}}catch(e){}setTimeout(()=>requestAnimationFrame(tick),120)};tick()}

    if(n.menuId!==l.menuId)out.push(l.name+(+l.qty>1?' ×'+l.qty:'')+' → '+n.name+(+n.qty>1?' ×'+n.qty:''));else if(+n.qty!==+l.qty)out.push(l.name+' ×'+l.qty+' → ×'+n.qty)});
  items.filter(x=>x._o==null&&x.qty).forEach(x=>out.push('เพิ่ม '+x.name+' ×'+x.qty));return out}

function consignSell(items){const q={};(items||[]).forEach(l=>{const m=S.nMenu.find(x=>x.id===l.menuId);if(m&&m.consign)q[m.id]=(q[m.id]||0)+(+l.qty||0)});

    write('menu/'+id,r=>r.transform(d=>{const sold=(+d.consignSold||0)+n,left=(+d.consignIn||0)-sold-(+d.consignRet||0);return {consignSold:sold,...(d.consignIn&&left<=0?{active:false}:{})}}))})}
function viewConsign(){const L=S.nMenu.filter(m=>m.consign);const ed=can('menu_edit');
  let h=`<div class="sec-h"><h2>สินค้าฝากขาย</h2>${ed?'<button class="btn pri sm" data-act="consignNew" type="button">+ เพิ่มสินค้าฝากขาย</button>':''}</div>
   <p class="help" style="margin:0">สินค้าฝากขายอยู่ในเมนูตามหมวดที่เลือก ขายได้เหมือนเมนูปกติ · ขายแล้วระบบนับให้เอง · ของหมดระบบปิดขายให้อัตโนมัติ</p>`;
  if(!L.length)return h+`<div class="empty"><b>ยังไม่มีสินค้าฝากขาย</b>กด "+ เพิ่มสินค้าฝากขาย" ใส่ชื่อ ราคาขาย ราคาที่ต้องจ่ายผู้ฝาก (ต้นทุน) และหมวดในเมนู</div>`;
  const by={};L.forEach(m=>{(by[m.consign.owner]=by[m.consign.owner]||[]).push(m)});
  const tot=L.reduce((a,m)=>a+consignOwe(m),0);

async function consignAdj(id,kind){const m=S.nMenu.find(x=>x.id===id);if(!m)return;

/* ===================== Raptor Rider: ไรเดอร์ส่งเองของร้าน ===================== */
CH.rider={n:'Raptor Rider',c:'#ff7a00'};
const RD_DEF={speed:25,on:false,lat:null,lng:null,base:20,baseKm:3,perKm:7,maxKm:8,factor:1.3,minOrder:0,smallFee:0,freeOver:0,rainFee:10,minFee:0,maxFee:0,timeout:60,auto:true,gOn:false,gKey:'',gRoad:false,gCap:300,gWarn:8000,gMax:9500,gAutoOff:true};
const rdCfg=()=>Object.assign({},RD_DEF,S.settings.rider||{});
const rdRain=()=>!!(S.lists&&S.lists.riderState&&S.lists.riderState.rain);
const rdOn=()=>rdCfg().on&&can('rider');
const isRd=o=>o&&chOf(o)==='rider';
function haversine(a,b){const R=6371,t=x=>x*Math.PI/180,dLa=t(b.lat-a.lat),dLo=t(b.lng-a.lng);const h=Math.sin(dLa/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function rdDist(lat,lng,c=rdCfg()){if(!(c.lat&&c.lng&&lat&&lng))return null;return Math.round(haversine({lat:+c.lat,lng:+c.lng},{lat:+lat,lng:+lng})*(+c.factor||1.3)*10)/10}
// ค่าส่ง = เริ่มต้น (รวมระยะแรก) + กม.ที่เกิน × ต่อ กม. (ปัดขึ้น) + ยอดน้อย + ฝนตก → ต่ำสุด/สูงสุด → ส่งฟรีเมื่อยอดถึง
function rdFee(km,food,c=rdCfg(),rain=rdRain()){if(km==null)return null;if(+c.maxKm&&km>+c.maxKm)return {over:true,fee:null};
  let f=+c.base||0;const ex=km-(+c.baseKm||0);if(ex>0)f+=Math.ceil(ex-1e-9)*(+c.perKm||0);
  const parts=[`เริ่มต้น ${baht(+c.base||0)}`+(ex>0?` + ${Math.ceil(ex-1e-9)} กม. × ${baht(+c.perKm||0)}`:'')];
  if(+c.minOrder&&food!=null&&food<+c.minOrder&&+c.smallFee){f+=+c.smallFee;parts.push(`ยอดน้อย +${baht(c.smallFee)}`)}
  if(rain&&+c.rainFee){f+=+c.rainFee;parts.push(`ฝนตก +${baht(c.rainFee)}`)}
  if(+c.minFee)f=Math.max(f,+c.minFee);if(+c.maxFee)f=Math.min(f,+c.maxFee);
  if(+c.freeOver&&food!=null&&food>=+c.freeOver){f=0;parts.push('ส่งฟรี (ยอดถึง '+baht(c.freeOver)+')')}
  return {fee:Math.round(f),why:parts.join(' · ')}}
const rdFoodTotal=o=>linesTotal((o.items||[]).filter(l=>!l.fee));
const rdFeeLine=(fee,km,via)=>({id:'fee',name:(via==='lineman'?'ค่าส่ง LINE MAN':'ค่าส่ง Raptor Rider')+(km?` (${km} กม.)`:''),price:fee,qty:1,served:true,fee:true,cost:fee,menuId:'',at:Date.now()});
/* ---------- ส่งด้วย LINE MAN (ร้านเรียกให้) ---------- */
const gPin=(lat,lng)=>lat&&lng?`https://maps.google.com/?q=${lat},${lng}`:'';

function parseGLink(s){s=String(s||'').trim();let m;

  if(m=s.match(/[?&](?:q|query|destination|ll|daddr)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i))return {lat:+m[1],lng:+m[2]};
  if(m=s.match(/^(-?\d{1,2}\.\d+)\s*,\s*(-?\d{2,3}\.\d+)$/))return {lat:+m[1],lng:+m[2]};
  return null}

async function rdTick(){if(!rdCfg().on||!S.db||RDBUSY||document.hidden)return;RDBUSY=true;try{const c=rdCfg(),now=Date.now(),to=(+c.timeout||60)*1000;

    await write('deliveries/'+d.id,r=>r.transform(x=>x.status==='offer'&&x.offerTo===who?(moved=true,{status:'wait',offerTo:null,skip:[...(x.skip||[]),who]}):null));
    if(moved){d.status='wait';d.offerTo=null;d.skip=[...(d.skip||[]),who];write('riders/'+who,r=>r.transform(x=>x.ready?{readyAt:Date.now()}:null))}}
  if(c.auto)for(const d of (S.dlv||[]).filter(d=>d.status==='wait').sort((a,b)=>a.at-b.at)){const q=rdReadyQueue().filter(r=>!r.offered);if(!q.length)break;

  const min=Math.max(1,Math.round(km/sp*60));const age=Math.round((Date.now()-(+L.at||0))/60000);return ` · ห่างลูกค้า ~${km.toFixed(1)} กม. ≈ ${min} นาที${age>=3?` (ตำแหน่ง ${age} นาทีที่แล้ว)`:''}`}

   <div class="grid2">${n('rdMinOrder',c.minOrder,'ยอดอาหารขั้นต่ำ (บาท)','ต่ำกว่านี้บวกค่าบริการ')}${n('rdSmall',c.smallFee,'ค่าบริการยอดน้อย (บาท)')}</div>
   <div class="grid2">${n('rdFree',c.freeOver,'ส่งฟรีเมื่อยอดถึง (บาท)','0 = ไม่มีส่งฟรี')}${n('rdRainFee',c.rainFee,'บวกช่วงฝนตก (บาท)','พนักงานกดเปิดในแผง Raptor Rider')}</div>
   <div class="grid2">${n('rdMinFee',c.minFee,'ค่าส่งต่ำสุด (บาท)','0 = ไม่กำหนด')}${n('rdMaxFee',c.maxFee,'ค่าส่งสูงสุด (บาท)','0 = ไม่กำหนด')}</div>
   <div class="grid2">${n('rdFactor',c.factor,'ตัวคูณระยะถนน','ระยะเส้นตรง × ตัวนี้ (ปกติ 1.3 · ถนนอ้อมเยอะใช้ 1.4)')}${n('rdTimeout',c.timeout,'เวลากดรับงาน (วินาที)','ไม่กดรับ ส่งต่อคิวถัดไป')}</div>
   ${n('rdSpeed',c.speed,'ความเร็วเฉลี่ยไรเดอร์ (กม./ชม.)','ใช้ประมาณเวลาถึงที่ลูกค้าเห็น (ปกติ 20–30)')}
   <label class="check"><input type="checkbox" id="rdAuto" ${c.auto!==false?'checked':''}> ส่งงานให้ไรเดอร์คิวแรกอัตโนมัติ (ปิด = พนักงานเลือกไรเดอร์เอง)</label>

    ${n('rdGCap',c.gCap||300,'เพดานคำนวณระยะถนน / วัน','เกินแล้ววันนั้นใช้สูตรตัวคูณแทน')}

   <div class="field"><label for="rdSelfNote">ข้อความบนหน้าสั่ง (ไม่บังคับ)</label><input id="rdSelfNote" maxlength="200" value="${esc(c.selfNote||'')}" placeholder="เช่น เปิด 10:00–20:00 · ส่งในรัศมี 8 กม."></div>
   <div class="inrow"><input readonly value="${esc(dlUrl())}" aria-label="ลิงก์สั่งเดลิเวอรี่"><button class="btn sm" data-act="rdCopyLink" data-v="${esc(dlUrl())}" type="button">คัดลอก</button><button class="btn sm" data-act="dlLink" type="button">QR</button></div></div>`}
function rdReadCfg(){const g=id=>{const e=$('#'+id);return e?Math.max(0,parseFloat(e.value)||0):0};const sh=S.sheet.rdShop||{};const c=rdCfg();
  if(!$('#rdOn'))return S.settings.rider||null;
  return {on:$('#rdOn').checked,lat:sh.lat??c.lat,lng:sh.lng??c.lng,base:g('rdBase'),baseKm:g('rdBaseKm'),perKm:g('rdPerKm'),maxKm:g('rdMaxKm'),minOrder:g('rdMinOrder'),smallFee:g('rdSmall'),freeOver:g('rdFree'),rainFee:g('rdRainFee'),minFee:g('rdMinFee'),maxFee:g('rdMaxFee'),factor:g('rdFactor')||1.3,speed:g('rdSpeed')||25,timeout:Math.max(20,g('rdTimeout')||60),auto:$('#rdAuto').checked,selfOn:!!$('#rdSelf')?.checked,selfNote:($('#rdSelfNote')?.value||'').trim().slice(0,200),gOn:!!$('#rdGOn')?.checked,gKey:($('#rdGKey')?.value||'').trim().slice(0,100),gRoad:!!$('#rdGRoad')?.checked,gCap:Math.max(1,Math.round(g('rdGCap')||300)),gWarn:Math.max(1,Math.round(g('rdGWarn')||8000)),gMax:Math.max(1,Math.round(g('rdGMax')||9500)),gAutoOff:!!$('#rdGAuto')?.checked}}
function rdShopTxt(){const sh=S.sheet.rdShop||rdCfg();const t=$('#rdShopTxt');if(t)t.textContent=sh.lat?`ร้านอยู่ที่ ${sh.lat}, ${sh.lng} · ลากหมุดสีทองให้ตรงหน้าร้าน แล้วกด "บันทึกการตั้งค่า"`:'ยังไม่ได้ปักหมุดร้าน · กดใช้ตำแหน่งปัจจุบันตอนอยู่ที่ร้าน หรือแตะแผนที่'}
function rdExample(){const box=$('#rdEx');if(!box)return;const c=rdReadCfg();if(!c)return;
  box.innerHTML='ตัวอย่างค่าส่ง (ยอดอาหาร ฿150 ไม่มีฝน): '+[1.5,3,4.2,6,8.5].map(k=>{const r=rdFee(k,150,c,false);return `${k} กม. = ${r.over?'ไม่รับ':baht(r.fee)}`}).join(' · ')}
const GM_KIND=[['map','🗺️ เปิดแผนที่'],['pick','📍 เลือกสถานที่'],['ac','🔎 ค้นหาไม่ได้เลือก'],['route','🛣️ ระยะถนน']];
function gmUseView(){const el=$('#rdGUse');if(!el||!SB)return;
  SB.from('docs').select('data').eq('collection','lists').eq('id','gmapUse').maybeSingle().then(({data})=>{const box=$('#rdGUse');if(!box)return;const u=data&&data.data||{},c=rdCfg();
    const mon=new Date(Date.now()+7*3600e3).toISOString().slice(0,7),m=u.mon===mon?u.m||{}:{},mx=+c.gMax||9500,wn=+c.gWarn||8000,day=new Date(Date.now()+7*3600e3).toISOString().slice(0,10);

  const c=rdCfg();mountMap('rdShopMap',c.lat?{lat:c.lat,lng:c.lng}:null,(lat,lng)=>{if(!S.sheet||S.sheet.type!=='settings')return;S.sheet.rdShop={lat,lng};S.sheet.dirty=true;rdShopTxt()},{shopMode:true,quiet:true}).then(m=>{if(S.sheet&&S.sheet.type==='settings')S.sheet.rdMap=m})}

/* ---------- ออร์เดอร์เดลิเวอรี่ออนไลน์: ลูกค้าสั่งเองจากลิงก์ / ปุ่มใน LINE OA ----------
   ลำดับ: ลูกค้าสั่ง (new) → ร้านกดรับ (accepted) → ลูกค้าโอน+แนบสลิป (slip) → ร้านยืนยันยอด (paid: สร้างบิล เข้าคิวครัว หาไรเดอร์) */
const canDl=()=>can('rider')||can('pay');
const dlUrl=()=>new URL('delivery.html',location.href).href.split('?')[0];

const dlWaiting=()=>canDl()?(S.dlReq||[]).filter(q=>q.status==='new'||q.status==='slip'):[];
const DL_ST={new:['🆕 ใหม่ · รอร้านกดรับ','warn'],accepted:['⏳ รอลูกค้าโอนเงิน','info'],slip:['📎 แนบสลิปแล้ว · รอตรวจยอด','warn'],paid:['✅ จ่ายแล้ว · เข้าคิวครัว','ok'],rejected:['❌ ร้านปฏิเสธ','mute'],cancelled:['ลูกค้ายกเลิก','mute']};

function dlDoneAlert(d){if(!canDl())return;const n=dlNo({orderNo:d.orderNo||d.billNo});
  toast('✅ ออร์เดอร์ลำดับที่ '+n+' จัดส่งเสร็จสิ้น'+(d.riderName?' · '+d.riderName:''));Bell.ring('staff',null,'ออร์เดอร์ลำดับที่ '+n.slice(1)+' จัดส่งเสร็จสิ้น',null)}
const dlCallCard=q=>`<div class="callcard${q.status==='slip'?' paid':''}" role="alert"><span style="font-size:22px">🛵</span><div class="grow"><b>${q.status==='slip'?'แนบสลิปแล้ว':'เดลิเวอรี่ใหม่'} ${esc(dlNo(q))} · คุณ${esc(q.name||'')}</b><small>${baht(q.amount??q.total)} · ${esc(String(q.km??'?'))} กม. · ${(q.items||[]).reduce((a,l)=>a+(+l.qty||0),0)} รายการ · ${ago(dlAt(q)).replace('เพิ่งเปิด','เมื่อสักครู่')}${/นาที|ชม/.test(ago(dlAt(q)))?'ที่แล้ว':''}</small></div><button class="btn sm" data-act="dlOpen" data-id="${esc(q.id)}" type="button">${q.status==='slip'?'ตรวจสลิป':'ดู / กดรับ'}</button></div>`;

async function dlPay(noSlip){if(!can('pay'))return deny();const s=S.sheet,q=(S.dlReq||[]).find(x=>x.id===s.id);if(!q||!['accepted','slip'].includes(q.status))return;

    const via=q.via==='lineman'?'lineman':'rider';
    const items=[...(q.items||[]).map(l=>({...l,served:false,by:'customer',cname:q.name,at:now})),rdFeeLine(fee,km,via)];
    const food0=+q.food||linesTotal(q.items||[]),cpnF=Math.min(food0,+q.cpnFood||0),cpnFe=Math.min(fee,+q.cpnFee||0),redeem=Math.min(food0-cpnF,+q.ptsDisc||0),use=+q.ptsUse||0;

    if(!ok)return;if(!won){toast('ออร์เดอร์นี้ยืนยันไปแล้วจากอีกเครื่อง','bad');return}
    const deliv={name:q.name,phone:q.phone,addr:q.addr,note:q.note||'',lat:q.lat,lng:q.lng,km,fee,manual:false,...(via==='lineman'?{via}:{})};
    const order={status:'paid',table:'TA',channel:'rider',online:true,dlReq:id,label:(via==='lineman'?'LINE MAN · คุณ':'Raptor Rider · คุณ')+q.name,customerName:q.name,deliv,openedAt:now,orderNo:q.orderNo||'',items,
      ...(memPh?{memberPhone:memPh,memberName:q.memberName||q.name,ptsUsed:use,ptsEarned:earn,redeem}:{}),...((q.cpns||[]).length?{cpns:q.cpns.map(c=>({...c,disc:c.type==='fee'?cpnFe:c.disc}))}:{}),
      paidAt:now,billNo,method:'promptpay',subtotal:r2(sub),discount:r2(cpnF+cpnFe),total:vc.total,cost:r2(linesCost(items)),received:vc.total,change:0,ref:'',gp:0,net:vc.total,
      vat:vc.vat,vatRate:vc.rate,vatMode:vc.mode,beforeVat:vc.beforeVat,roundOff:vc.round||0,rcptTok:rcTok()};
    const ok2=await write('orders/'+id,r=>r.set(order));
    if(!ok2){await write('dl_req/'+id,r=>r.transform(x=>x.status==='paid'&&x.orderId===id?{status:q.status,orderId:null,payAt:null}:null));return}
    S.today=[...(S.today||[]).filter(o=>o.id!==id),{id,...order}];
    const food=items.filter(l=>!l.fee);deductStock(food);consignSell(food);
    if((q.cpns||[]).length)SB.rpc('cpn_commit',{p_ref:id}).then(()=>{},()=>{});
    if(memPh){try{const bal=await applyPoints(memPh,q.memberName||q.name,use,earn,vc.total,'บิล '+billNo+' (เดลิเวอรี่)');write('orders/'+id,r=>r.update({ptsBalance:bal}))}catch(e){toast('บันทึกแต้มไม่สำเร็จ: '+errMsg(e),'bad')}}
    await rdCreateJob({id,...order});

    closeSheet();render()}
  finally{S.dlPaying=false}}

async function oaBroadcast(text,why){text=String(text||'').trim();if(!text)return toast(oaErr('empty'),'bad');

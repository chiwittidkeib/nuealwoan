<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="app-version" content="2026.10.17-1900">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#a0560a">
<title>สั่งล่วงหน้า · พรีออเดอร์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@400;500&display=swap">
<style>
/* Layout: jade header with table number, scrolling menu grid, sticky cart bar at the bottom. */
:root{
  --bg:#f3f5f0; --surface:#ffffff; --sunk:#e9ece5; --line:#d9ded4;
  --fg:#1c2420; --muted:#5f6b64;
  --jade:#17694f; --jade-soft:#dcefe5; --on-jade:#ffffff;
  --chili:#b23d27; --amber:#946207; --amber-soft:#f5e8cc;
  --f-display:"Mitr","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111614; --surface:#1a201d; --sunk:#151a18; --line:#2b3430;
  --fg:#e8eee9; --muted:#9aa69f;
  --jade:#5ec59c; --jade-soft:#1c3a2e; --on-jade:#0b1912;
  --chili:#f08c74; --amber:#e4b75c; --amber-soft:#382d16; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;line-height:1.25;text-wrap:balance}
header{background:var(--jade);color:var(--on-jade);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px}
header .in{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-size:22px}
.hlogo{width:52px;height:52px;border-radius:12px;background:#fff;object-fit:contain;padding:3px;flex:none}
header small{opacity:.85}
.tno{font-family:var(--f-display);text-align:right;line-height:1}
.tno span{display:block;font-size:12px;opacity:.85;font-family:var(--f-body)}
.tno b{font-size:34px;font-weight:500}
main{flex:1;overflow-y:auto}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:16px 24px;display:flex;flex-direction:column;gap:14px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:0;overflow:hidden;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;position:relative}
.ph{width:100%;aspect-ratio:4/3;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:34px;color:var(--muted)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.item .tx{padding:8px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.item p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item.big{grid-column:1/-1}
.mini{width:44px;height:44px;border-radius:8px;overflow:hidden;flex:none;background:var(--sunk)}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.item:active{transform:scale(.98)}
.item b{font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1.3}
.item span{margin-top:auto;font-weight:600;color:var(--jade);font-variant-numeric:tabular-nums}
.item em{position:absolute;top:8px;right:8px;box-shadow:0 1px 4px rgba(0,0,0,.25);font-style:normal;background:var(--jade);color:var(--on-jade);border-radius:999px;min-width:24px;height:24px;line-height:24px;text-align:center;font-weight:600;font-size:13px;padding:0 6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .g{flex:1;min-width:0}
.row .r{font-variant-numeric:tabular-nums;white-space:nowrap}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stepper button{border:0;background:none;width:38px;height:38px;cursor:pointer;font-size:18px}
.stepper span{min-width:24px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px;min-height:46px}
.qn{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;font-weight:500}
.pill.ok{background:var(--jade-soft);color:var(--jade)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
footer{background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
footer .in{max-width:900px;margin:0 auto;display:flex;gap:10px;align-items:center}
.tot{flex:1;display:flex;flex-direction:column;min-width:0}
.tot small{color:var(--muted);font-size:12.5px}
.tot b{font-family:var(--f-display);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 16px;min-height:48px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{flex:1}
.msg{text-align:center;padding:48px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.msg h2{font-size:24px}
.muted{color:var(--muted)}
.err{color:var(--chili)}
.namebox{max-width:420px;width:100%;margin:24px auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px}
.namebox h2{font-size:24px}
.lnk-w{border:0;background:none;color:inherit;text-decoration:underline;cursor:pointer;padding:0;font:inherit;opacity:.95}
.lnk-g{border:0;background:none;color:var(--jade);cursor:pointer;padding:4px 0;font:inherit;font-weight:500}
.who{font-size:12px;color:var(--muted)}

/* ---- พื้นหลังรูปหน้าร้าน (หน้าต้อนรับลูกค้า) ---- */
body.welcome::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(8,6,5,0) 0%,rgba(8,6,5,.1) 35vw,#0b0a09 100vw),url(images/bg-m.jpg?v=20261016b) 50% 0/100% auto no-repeat,url(bg-m.jpg?v=20261016b) 50% 0/100% auto no-repeat,#0b0a09}
@media (min-width:701px){body.welcome::before{background:linear-gradient(180deg,rgba(8,6,5,.3),rgba(8,6,5,.85)),url(images/bg.jpg?v=20261016b) center 40%/cover no-repeat,url(bg.jpg?v=20261016b) center 40%/cover no-repeat}}
body.welcome header,body.welcome main{position:relative;z-index:1}
body.welcome header{background:transparent}
body.welcome main{display:flex;align-items:flex-end}
body.welcome .wrap{width:100%}
body.welcome .namebox{--surface:rgba(18,15,12,.62);--fg:#f6efe4;--muted:#cdbfae;--line:rgba(255,230,190,.18);--jade:#d9a65a;--on-jade:#1d1307;
  color:var(--fg);background:var(--surface);border-color:var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);margin-bottom:max(24px,env(safe-area-inset-bottom));box-shadow:0 20px 50px rgba(0,0,0,.5)}
body.welcome .namebox input{background:rgba(0,0,0,.35);color:var(--fg)}
body.welcome .namebox .btn.pri{background:linear-gradient(180deg,#e2b265,#c48d3d);border-color:#c48d3d;color:#1d1307}
@media (min-width:701px) and (orientation:portrait){body.welcome::before{background:linear-gradient(180deg,rgba(8,6,5,.25),rgba(8,6,5,.8)),url(images/bg-m.jpg?v=20261016b) center 30%/cover no-repeat,url(bg-m.jpg?v=20261016b) center 30%/cover no-repeat,#0b0a09}}

/* มือถือ: ช่องกรอกตัวอักษร 16px ขึ้นไป กัน iPhone ซูมเข้าเองตอนแตะช่องกรอก และกันหน้าเลื่อนออกด้านข้าง */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{max-width:100%;overflow-x:clip}
@media (pointer:coarse),(max-width:820px){input:not([type=checkbox]):not([type=radio]):not([type=range]),select,textarea{font-size:16px!important}}
/* ตัวเลือกเมนู (แบบ LINE MAN) */
.opop{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.op-card{position:relative;background:var(--bg);color:var(--fg);width:100%;max-width:520px;max-height:92%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -10px 40px rgba(0,0,0,.45)}
@media (min-width:700px){.opop{align-items:center}.op-card{border-radius:18px;max-height:88%}}
.op-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.op-img{margin:0 -16px;aspect-ratio:16/9;max-height:220px;overflow:hidden;background:var(--sunk)}
.op-img img{width:100%;height:100%;object-fit:cover;display:block}
.op-hd{display:flex;gap:12px;align-items:flex-start;padding-top:14px;padding-right:34px}
.op-hd .op-t{flex:1;min-width:0}.op-hd h2{margin:0;font-size:20px;line-height:1.3}.op-hd p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.op-hd>b{font-size:18px;white-space:nowrap}
.op-g{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.op-gh{display:flex;align-items:center;gap:8px;justify-content:space-between}.op-gh b{font-size:16px}
.op-rule{font-size:12px;color:var(--muted);background:var(--sunk);padding:2px 8px;border-radius:99px;white-space:nowrap}
.op-rule.req{color:#ffd58a;background:rgba(255,190,80,.14)}
.op-g.bad .op-rule.req{color:#fff;background:var(--chili)}
.op-c{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.op-c span{flex:1}.op-c em{font-style:normal;color:var(--muted);font-size:14px}
.op-c i{flex:none;width:20px;height:20px;border:2px solid var(--muted);border-radius:50%;position:relative}
.op-c i.ck{border-radius:5px}
.op-c.on{border-color:var(--jade);background:var(--jade-soft)}
.op-c.on i{border-color:var(--jade);background:var(--jade)}
.op-c.on i.rd::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--bg)}
.op-c.on i.ck::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid var(--on-jade,#fff);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.op-g input{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:9px;padding:10px 12px;min-height:44px;width:100%;font:inherit}
.op-qn{display:flex;gap:6px;flex-wrap:wrap}
.op-foot{display:flex;gap:10px;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.op-foot .op-add{flex:1;min-height:48px}
.op-x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:20px;line-height:1;cursor:pointer}
.optx{font-size:13px;color:#ffd58a;line-height:1.4}
.chip{cursor:pointer}

/* คิว / เรียกพนักงาน / ชำระเงิน */
.callb{flex:none;border:0;border-radius:999px;background:rgba(0,0,0,.28);color:#fff;font:inherit;font-weight:600;font-size:13.5px;padding:8px 12px;min-height:40px;cursor:pointer;white-space:nowrap}
.callb.on{background:#ffd58a;color:#3a2600}
body.welcome .callb{display:none}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px;text-align:center}
.qcard small{color:var(--muted)}.qcard b{font-family:var(--f-display);font-size:34px;line-height:1.15;color:#ffd58a}
.qcard.ok b{color:var(--jade);font-size:26px}
.qcard .t{font-size:14px}
.tm{font-size:12px;color:var(--muted)}
.bill .row.sum{font-size:18px}.bill .row.sum b{font-size:22px}
.payqr{background:#fff;color:#111;border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.payqr svg{width:220px;height:220px;max-width:70vw}
.payqr b{font-size:22px}.payqr small{color:#555}
.stack{display:flex;flex-direction:column;gap:10px}
.callpop{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.callpop .cc{background:var(--bg);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.callpop h2{font-size:20px}
@media (min-width:700px){.callpop{align-items:center}.callpop .cc{border-radius:18px}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#ffd58a;color:#3a2600;padding:10px 16px;border-radius:12px;font-weight:600;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:90vw;text-align:center}
.updbar{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:99;background:#ffd58a;color:#2b1c00;border-radius:12px;padding:8px 10px 8px 14px;display:flex;gap:10px;align-items:center;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.45);white-space:nowrap}
.updbar button{border:0;border-radius:9px;background:#2b1c00;color:#ffd58a;font:inherit;padding:6px 12px;cursor:pointer}
.pushbtn{display:flex;flex-direction:column;align-items:center;gap:2px;white-space:normal;text-align:center;border-color:#ffd58a;color:#ffd58a}
.pushbtn small{font-weight:400;font-size:12.5px;color:var(--muted)}
.pushc{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;text-align:center}
.pushc.on{color:var(--jade);border-style:solid}
.imgview{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.imgview img{max-width:100%;max-height:calc(100% - 60px);object-fit:contain;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.imgview .iv-cap{color:#fff;margin-top:12px;font-size:16px;text-align:center}
.imgview .iv-x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:24px;cursor:pointer}
.zoomable{cursor:zoom-in}
.stamp{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);width:92px;height:92px;border:3px solid #e5383b;border-radius:50%;color:#ff4d4f;font-weight:800;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;background:rgba(25,6,6,.82);box-shadow:inset 0 0 0 3px rgba(229,56,59,.35),0 0 0 2px rgba(229,56,59,.25);pointer-events:none;z-index:2}
.item.is-out{cursor:not-allowed}.item.is-out .ph img{filter:grayscale(1);opacity:.45}.item.is-out .tx{opacity:.55}
.leftq{display:inline-block;font-size:12px;font-weight:700;color:#ffd58a;background:rgba(255,190,80,.14);border-radius:999px;padding:1px 8px;align-self:flex-start}
.leftq.low{color:#fff;background:#c2410c}
.stamp{flex-direction:column;gap:3px}
.stamp b{display:block;font-weight:800;font-size:1em;line-height:1.15;padding-bottom:3px;border-bottom:2px solid currentColor;color:inherit;opacity:1;margin:0}
.stamp i{display:block;font-style:normal;font-weight:800;font-size:.62em;letter-spacing:.6px;text-transform:uppercase;line-height:1;color:inherit;opacity:1}
.stamp b,.stamp i{color:var(--jade)!important;opacity:1!important;font-family:var(--f-body)}
.item .stamp b{font-size:17px}

/* ---- ร้านพรีออเดอร์: สีเหลืองข้าวมันไก่ ---- */
:root{--jade:#a0560a;--jade-soft:#f6e6cf;--on-jade:#fff}
@media (prefers-color-scheme:dark){:root{--jade:#f0a54a;--jade-soft:#3a2a14;--on-jade:#1f1300}}
.notice{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:10px 14px;font-weight:500;white-space:pre-line}
.pohero{position:relative;overflow:hidden;border-radius:18px;padding:16px 18px 14px;background:linear-gradient(135deg,var(--jade),color-mix(in srgb,var(--jade) 70%,#000));color:var(--on-jade);box-shadow:0 8px 24px color-mix(in srgb,var(--jade) 35%,transparent);display:flex;flex-direction:column;gap:10px}
.pohero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.pohero .pill{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.18);border-radius:99px;padding:4px 12px 4px 10px;font-size:13px;font-weight:600}
.pohero .pill i{width:9px;height:9px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:pdot 1.6s infinite}
@keyframes pdot{70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.pohero .lb{font-size:13px;opacity:.85}
.pohero .big{font-family:var(--f-display);font-weight:500;font-size:26px;line-height:1.15}
.pohero .wtime{font-family:var(--f-display);font-size:17px;opacity:.95}
.pohero .cd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:rgba(0,0,0,.18);border-radius:12px;padding:10px 12px}
.pohero .cd small{display:block;font-size:12.5px;opacity:.85}
.pohero .cd b{font-family:var(--f-display);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.pohero .cd.hurry{background:#c0392b;animation:hurry 1.2s ease-in-out infinite}
@keyframes hurry{50%{background:#e04b3a}}
.pohero.soon .pill i{background:#facc15;animation:none}.pohero.soon{background:linear-gradient(135deg,color-mix(in srgb,var(--jade) 60%,#334),color-mix(in srgb,var(--jade) 40%,#000))}
.pohero.off{background:var(--surface);color:var(--fg);border:2px solid var(--chili);box-shadow:none}
.pohero.off::after{display:none}.pohero.off .pill{background:var(--chili);color:#fff}.pohero.off .pill i{background:#fff;animation:none}
@media (prefers-reduced-motion:reduce){.pohero .pill i,.pohero .cd.hurry{animation:none}}
.pobar{border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);background:var(--surface)}
.pobar b{font-family:var(--f-display);font-weight:500;font-size:17px}.pobar span{font-size:13.5px;color:var(--muted)}
.pobar.on{border-color:var(--jade);background:var(--jade-soft)}.pobar.on b{color:var(--jade)}
.pobar.off{border-color:var(--chili)}.pobar.off b{color:var(--chili)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.box h3{font-size:17px}
.seg{display:flex;gap:8px}.segb{flex:1;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:600;cursor:pointer}
.segb[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}

  background:radial-gradient(circle at 88% 12%,rgba(255,213,138,.38),transparent 46%),radial-gradient(circle at 8% 100%,rgba(200,16,46,.35),transparent 50%),linear-gradient(135deg,#3a1a0c,#120a06 58%,#5a2e14);
  border:1.5px solid #d9a441;box-shadow:0 18px 50px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.06);animation:mcPop .35s cubic-bezier(.2,1.4,.4,1)}

.mc-top{display:flex;align-items:center;justify-content:space-between}

<body>
<header><div class="in"><img id="logo" class="hlogo" alt="" hidden><div style="flex:1;min-width:0"><h1 id="shop">กำลังโหลด…</h1><small id="sub">สั่งล่วงหน้า รับพรุ่งนี้</small></div></div></header>
<main><div class="wrap" id="view"><div class="msg"><p class="muted">กำลังโหลดเมนู…</p></div></div></main>
<input id="slipIn" type="file" accept="image/*" hidden aria-hidden="true"><input id="slipLate" type="file" accept="image/*" hidden aria-hidden="true">
<footer id="foot" hidden><div class="in" id="footIn"></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="js/config.js"></script>
<script>
"use strict";
/* ---------- บัตรสมาชิก (ใช้ได้ทั้งร้านเนื้อล้วนๆ และข้าวมันไก่) ---------- */
function showMemberCard(m){const o=document.getElementById('mCardOv');if(o)o.remove();if(!m)return;
  const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pts=(+m.points||0).toLocaleString('th-TH');
  const el=document.createElement('div');el.id='mCardOv';el.className='mcard-ov';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','บัตรสมาชิก');
  const bg=[...String(m.phone||m.name||'')].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7)%2?'po':'nl';
  el.innerHTML=`<div class="mcard mc-${bg}" style="--mcbg:url(images/card-${bg}.png)"><div class="mc-top"><div class="mc-logos"><img src="images/logo-nl.png?v=20261016b" alt=""><img src="images/logo-po.png" alt=""></div><span>MEMBER CARD</span></div>
    <div class="mc-mid"><b>${m.name?'คุณ'+e(m.name):'สมาชิก'}</b><span>${e(m.phone||'')}</span></div>
    <div class="mc-bot"><div><small>แต้มสะสม</small><strong>${pts}</strong></div><em>ใช้ได้ทั้ง 2 ร้าน<br>เนื้อล้วนๆ · ข้าวมันไก่</em></div><i class="mc-shine"></i></div>
    ${m.note?`<p class="mc-note">${e(m.note)}</p>`:''}
    ${m.exp&&+m.exp.pts?`<p class="mc-warn">⚠️ ${(+m.exp.pts).toLocaleString('th-TH')} แต้มจะหมดอายุ ${new Date(+m.exp.at).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit',timeZone:'Asia/Bangkok'})} · ใช้ก่อนหมดอายุนะ</p>`:''}
    ${m.action?`<button type="button" class="mc-act" data-mc="act">${e(m.action)}</button>`:''}
    <button type="button" class="mc-x" data-mc="x">ปิด</button>`;
  const close=()=>{el.remove();window.removeEventListener('keydown',k,true)};const k=ev=>{if(ev.key==='Escape'){ev.stopPropagation();close()}};window.addEventListener('keydown',k,true);
  el.addEventListener('click',ev=>{const b=ev.target.closest('[data-mc]');if(ev.target===el||(b&&b.dataset.mc==='x'))return close();if(b&&b.dataset.mc==='act'){close();m.onAction&&m.onAction()}});
  document.body.appendChild(el);}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const baht=n=>'฿'+(Math.round((+n||0)*100)/100).toLocaleString('th-TH',{maximumFractionDigits:2});
const optLine=e=>e.opts&&e.opts.length?`<div class="optx">${esc(optNames(e.opts))}</div>`:'';

/* ---------- ตัวเลือกเมนู (แบบ LINE MAN) ใช้ร่วมกันทั้งหน้าพนักงานและหน้าลูกค้า ---------- */
const optGroups=m=>Array.isArray(m&&m.options)?m.options.filter(g=>g&&g.name&&(g.choices||[]).length):[];
const hasOpts=m=>optGroups(m).length>0;
const optKey=opts=>(opts||[]).map(o=>o.cid||o.n).join(',');
const optNames=opts=>(opts||[]).map(o=>o.n).join(', ');
const optRule=g=>g.req?(+g.max===1?'ต้องเลือก 1':'ต้องเลือก'+(+g.max>1?' สูงสุด '+g.max:'อย่างน้อย 1')):(+g.max===1?'เลือกได้ 1':'เลือกได้'+(+g.max>1?' สูงสุด '+g.max:'หลายอย่าง'));
const minPrice=m=>(+m.price||0)+optGroups(m).filter(g=>g.req).reduce((s,g)=>s+Math.min(...g.choices.map(c=>+c.price||0)),0);

/* ---------- ดูรูปเต็มจอ ---------- */
function viewImg(src,cap){if(!src)return;const o=document.getElementById('imgView');if(o)o.remove();const el=document.createElement('div');el.id='imgView';el.className='imgview';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');
  el.innerHTML=`<img src="${esc(src)}" alt="${esc(cap||'')}">${cap?`<div class="iv-cap">${esc(cap)}</div>`:''}<button type="button" class="iv-x" aria-label="ปิด">×</button>`;
  const close=()=>{el.remove();window.removeEventListener('keydown',k,true)};const k=e=>{if(e.key==='Escape'){e.stopPropagation();close()}};window.addEventListener('keydown',k,true);
  el.addEventListener('click',e=>{e.stopPropagation();close()});document.body.appendChild(el)}
function optPick(m,cfg){cfg=cfg||{};const G=optGroups(m);const pick={};G.forEach(g=>pick[g.id]=[]);let qty=1,note='',warn=false;
  const mul=cfg.mul||(x=>x);
  const old=document.getElementById('optPop');if(old)old.remove();
  const el=document.createElement('div');el.id='optPop';el.className='opop';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');document.body.appendChild(el);
  const sel=()=>{const opts=[];G.forEach(g=>g.choices.forEach(c=>{if(pick[g.id].includes(c.id))opts.push({gid:g.id,cid:c.id,g:g.name,n:c.name,p:+c.price||0})}));return opts};
  const unit=()=>mul((+m.price||0)+sel().reduce((s,o)=>s+o.p,0));
  const missing=()=>G.filter(g=>g.req&&!pick[g.id].length);
  const close=()=>{el.remove();window.removeEventListener('keydown',onKey,true)};
  const onKey=e=>{if(e.key==='Escape'){e.stopPropagation();close()}};window.addEventListener('keydown',onKey,true);
  function draw(){const miss=missing(),keepNote=el.querySelector('#opNote')?.value,sc=el.querySelector('.op-body')?.scrollTop||0;
    el.innerHTML=`<div class="op-card"><div class="op-body">
      ${m.img?`<div class="op-img zoomable" data-oimg="1"><img src="${esc(m.img)}" alt=""></div>`:''}
      <div class="op-hd"><div class="op-t"><h2>${esc(m.name)}</h2>${m.desc?`<p>${esc(m.desc)}</p>`:''}</div><b>${baht(mul(+m.price||0))}</b></div>
      ${G.map(g=>{const bad=warn&&miss.includes(g);return `<section class="op-g${bad?' bad':''}" data-g="${esc(g.id)}"><div class="op-gh"><b>${esc(g.name)}</b><span class="op-rule${g.req?' req':''}">${optRule(g)}</span></div>
        ${g.choices.map(c=>{const on=pick[g.id].includes(c.id);return `<button type="button" class="op-c${on?' on':''}" data-og="${esc(g.id)}" data-oc="${esc(c.id)}" aria-pressed="${on}"><i class="${+g.max===1?'rd':'ck'}"></i><span>${esc(c.name)}</span><em>${+c.price?'+'+baht(mul(+c.price)).replace('฿',''):''}</em></button>`}).join('')}</section>`}).join('')}
      <section class="op-g"><div class="op-gh"><b>บอกครัว</b><span class="op-rule">ไม่บังคับ</span></div>
        <input id="opNote" maxlength="80" placeholder="เช่น ไม่ใส่ผัก ไม่เผ็ด" autocomplete="off">
        ${(cfg.notes||[]).length?`<div class="op-qn">${cfg.notes.map(n=>`<button type="button" class="chip" data-on="${esc(n)}">${esc(n)}</button>`).join('')}</div>`:''}</section>
    </div>
    <div class="op-foot"><div class="stepper"><button type="button" data-oq="-1" aria-label="ลด">−</button><span>${qty}</span><button type="button" data-oq="1" aria-label="เพิ่ม">+</button></div>
      <button type="button" class="btn pri wide op-add" data-oadd="1">${miss.length&&warn?'ยังไม่ได้เลือก: '+esc(miss[0].name):(cfg.addLabel||'ใส่ตะกร้า')+' '+baht(unit()*qty)}</button></div>
    <button type="button" class="op-x" data-ox="1" aria-label="ปิด">×</button></div>`;
    const n=el.querySelector('#opNote');n.value=keepNote!=null?keepNote:note;n.addEventListener('input',()=>note=n.value);
    el.querySelector('.op-body').scrollTop=sc;}
  let downBg=false;el.addEventListener('pointerdown',e=>{downBg=e.target===el});
  el.addEventListener('click',e=>{if(e.target===el){if(downBg)close();return}if(e.target.closest('[data-oimg]'))return viewImg(m.img,m.name);const b=e.target.closest('button');if(!b)return;e.stopPropagation();
    if(b.dataset.ox)return close();
    if(b.dataset.og){const g=G.find(x=>x.id===b.dataset.og),cid=b.dataset.oc,a=pick[g.id];
      if(+g.max===1)pick[g.id]=a.includes(cid)&&!g.req?[]:[cid];
      else if(a.includes(cid))pick[g.id]=a.filter(x=>x!==cid);
      else{if(+g.max>1&&a.length>=+g.max)return;a.push(cid)}
      return draw()}
    if(b.dataset.on){const n=el.querySelector('#opNote');n.value=n.value?n.value+', '+b.dataset.on:b.dataset.on;note=n.value;return}
    if(b.dataset.oq){qty=Math.max(1,Math.min(20,qty+ +b.dataset.oq));return draw()}
    if(b.dataset.oadd){const miss=missing();if(miss.length){warn=true;draw();const s=el.querySelector('.op-g.bad');if(s)s.scrollIntoView({block:'center',behavior:'smooth'});return}
      note=(el.querySelector('#opNote')?.value||'').trim();const opts=sel();close();cfg.onAdd&&cfg.onAdd({opts,qty,note,unit:unit()})}});
  draw();}

const hm=t=>new Date(t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
const r2=n=>Math.round((+n||0)*100)/100;
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function ppPayload(id,amount){
  let t=String(id||'').replace(/\D/g,''),tag;
  if(t.length===15)tag='03';else if(t.length>=13){tag='02';t=t.slice(0,13)}else{tag='01';t=('0000000000000'+t.replace(/^0/,'66')).slice(-13)}
  const f=(k,v)=>k+String(v.length).padStart(2,'0')+v;
  let p=f('00','01')+f('01',amount>0?'12':'11')+f('29',f('00','A000000677010111')+f(tag,t))+f('58','TH')+f('53','764');

function shrink(file){return new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=no;fr.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{
  let w=im.width,h=im.height,mx=1400;if(Math.max(w,h)>mx){const r=mx/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r)}
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
  let q=.8,u=c.toDataURL('image/jpeg',q);while(u.length>600000&&q>.35){q-=.1;u=c.toDataURL('image/jpeg',q)}
  if(u.length>650000){const c2=document.createElement('canvas');c2.width=Math.round(w*.6);c2.height=Math.round(h*.6);c2.getContext('2d').drawImage(c,0,0,c2.width,c2.height);u=c2.toDataURL('image/jpeg',.6)}
  ok(u)};im.src=fr.result};fr.readAsDataURL(file)})}

const cutAt=st=>{const d=st.closeDate||st.today||new Date(Date.now()+7*3600e3).toISOString().slice(0,10);const t=/^\d\d:\d\d$/.test(st.cutoff||'')?st.cutoff:'20:00';return Date.parse(d+'T'+t+':00+07:00')};
const cdTxt=ms=>{if(!(ms>0))return 'ปิดรับแล้ว';const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>String(n).padStart(2,'0');return (d?d+' วัน ':'')+p(h)+':'+p(m)+':'+p(x)};
const openAt=st=>Date.parse((st.openDate||st.today||new Date(Date.now()+7*3600e3).toISOString().slice(0,10))+'T'+(st.openFrom||'00:00')+':00+07:00');

   <div class="cd${ms>0&&ms<2*3600e3?' hurry':''}" id="poCd"><div><small>${ms>0&&ms<2*3600e3?'⚡ ใกล้ปิดรับแล้ว! รีบสั่งเลย':'⏰ ปิดรับออร์เดอร์ใน'}</small><small>${esc(closeTxt(st))}</small></div><b id="poCdT">${cdTxt(ms)}</b></div></div>`}

  if(ms<=0&&ms>-1500)loadShop().then(()=>S.view==='menu'&&render())},1000);

        ${S.lateDraft?`<div class="slipbox"><b>ตรวจสลิปก่อนส่ง</b><img class="slipprev" src="${S.lateDraft}" alt="สลิป" data-a="slipView" data-v="late"><div class="seg"><button class="btn" data-a="lateClear" type="button">ลบ เลือกใหม่</button><button class="btn pri" data-a="lateSend" type="button" ${S.lateBusy?'disabled':''}>${S.lateBusy?'กำลังส่ง…':'ยืนยันส่งสลิป'}</button></div></div>`
          :`${o.hasSlip?`<div class="slipok"><span style="font-size:26px">📎</span><div><b>⏳ รอตรวจสอบยอดชำระ</b><small>ส่งสลิปแล้ว ร้านกำลังตรวจยอด · ถ้าแนบผิด แนบใหม่ได้</small></div></div>`:''}<label class="btn ${o.payStatus==='waiting'||o.payStatus==='cod'?'pri ':''}slipbtn" for="slipLate">${o.hasSlip?'📎 แนบสลิปเพิ่ม'+(+o.slipCount>0?' (แนบแล้ว '+o.slipCount+' ใบ)':''):'📎 โอนแล้ว แนบสลิป'}</label>`}`:''}
      ${!cx&&o.payStatus==='paid'?`<button class="btn pri" data-a="rcpt" type="button">🧾 ดู / บันทึกใบเสร็จ</button>`:''}
      ${o.shopPhone?`<a class="btn" href="tel:${esc(String(o.shopPhone).replace(/[^\d+]/g,''))}">โทรหาร้าน ${esc(o.shopPhone)}</a>`:''}
      ${o.canCancel?`<button class="btn danger" data-a="cancel" type="button">ยกเลิกออร์เดอร์</button><p class="tm" style="margin:-4px 0 0;text-align:center">ยกเลิกเองได้ถึง ${o.cancelUntil?esc(new Date(+o.cancelUntil).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Bangkok'}))+' น.':''}</p>`
        :['new','confirmed'].includes(o.status)?`<div class="cxinfo">ต้องการยกเลิกออร์เดอร์? เลยเวลายกเลิกเองแล้ว · ติดต่อร้านได้เลย${o.line?` <a class="btn sm" href="${esc(o.line)}" target="_blank" rel="noopener">💬 LINE</a>`:''}</div>`:''}
      <p class="tm" style="margin:0;text-align:center">อัปเดตสถานะอัตโนมัติ</p>`}
    ft=`<button class="btn" data-a="mine" type="button">ออร์เดอร์ของฉัน</button><button class="btn pri wide" data-a="new" type="button">สั่งเพิ่ม</button>`;
  }
  v.innerHTML=h;f.innerHTML=ft;$('#foot').hidden=false;
  if(S.view==='board'){renderBoard();const bi=$('#bq');if(bi)bi.addEventListener('input',()=>{S.bq=bi.value.trim();clearTimeout(BT);BT=setTimeout(()=>{S.board=null;renderBoard();loadBoard()},350)})}
  Object.entries(keep).forEach(([k,val])=>{const i=document.getElementById(k);if(i&&i.type!=='file')i.value=val});
}
async function send(){
  if(S.sending||!cartN())return;const c=S.cfg||{};
  const name=($('#pName').value||'').trim().replace(/\s+/g,' '),phone=($('#pPhone').value||'').replace(/\D/g,''),note=($('#pNote').value||'').trim();
  const err=t=>{S.err=t;render();const e=$('#sendErr');if(e)e.scrollIntoView({block:'center',behavior:'smooth'})};
  if(!name)return err('ใส่ชื่อผู้รับก่อน');if(phone.length<9||phone.length>10)return err('เบอร์โทรไม่ถูกต้อง (ตัวเลข 9–10 หลัก)');
  if(S.method==='point'&&!S.point)return err('เลือกจุดรับของก่อน');
  if(S.pay==='before'&&!S.slip)return err('โอนเงินแล้วแนบสลิปก่อน ถึงจะยืนยันสั่งได้ (หรือเลือก "จ่ายตอนรับของ")');
  S.err='';S.sending=true;render();
  lsSet(ME_KEY,{name,phone,method:S.method,point:S.point,pay:S.pay});
  const items=Object.values(S.cart).map(e=>({menuId:e.menuId,qty:e.qty,note:e.note||'',opts:(e.opts||[]).map(o=>o.cid)}));
  try{const {data,error}=await sb.rpc('po_order_add',{p_items:items,p_name:name,p_phone:phone,p_method:S.method,p_point:S.method==='point'?S.point:null,p_note:note,p_pay:S.pay,p_slip:S.pay==='before'?S.slip:null});
    S.sending=false;
    if(error){await loadShop();return err(rpcErr(error))}
    rememberOrder(data.id,data.token,data.orderNo,data.deliverDate);S.cart={};S.slip=null;S.justSent=true;S.justMerged=!!data.merged;
    if(S.memOn!==false){try{const mr=await sb.rpc('po_member',{p_id:data.id,p_token:data.token,p_on:true});if(!mr.error&&mr.data){S.memInfo=mr.data;setTimeout(()=>showMemberCard({...mr.data,note:'แต้มจะเข้าเมื่อร้านยืนยันรับเงิน · ใช้ได้ทั้ง 2 ร้าน'}),600)}}catch(x){}}
    openOrder(data.id,data.token);
  }catch(e){S.sending=false;err('เชื่อมต่อไม่ได้ ลองอีกครั้ง')}}
let armT=null;
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='cat'){S.cat=b.dataset.v;render()}
  else if(a==='add'){const m=S.menu.find(x=>x.id===b.dataset.m);if(!m||m.soldOut)return;if(!canOrder())return toast(stateLine(S.cfg.state).replace(/<[^>]+>/g,''));
    if(hasOpts(m))optPick(m,{addLabel:'ใส่ตะกร้า',onAdd:sel=>putCart(m,sel)});else{putCart(m,{opts:[],note:'',qty:1});toast('ใส่ตะกร้าแล้ว: '+m.name)}}
  else if(a==='qty'){const e2=S.cart[b.dataset.k];if(!e2)return;e2.qty+=+b.dataset.d;if(e2.qty<=0)delete S.cart[b.dataset.k];if(!cartN())S.view='menu';render()}
  else if(a==='view'){S.view=b.dataset.v;S.err='';if(S.view==='board'){S.board=null;loadBoard()}render();$('main').scrollTop=0}
  else if(a==='method'){S.method=b.dataset.v;render()}
  else if(a==='point'){S.point=b.dataset.v;render()}
  else if(a==='pay'){S.pay=b.dataset.v;render()}
  else if(a==='send')send();
  else if(a==='mine'){S.view='mine';S.justSent=false;S.justMerged=false;render()}
  else if(a==='open')openOrder(b.dataset.id,b.dataset.t);
  else if(a==='bopen')askPhone(b.dataset.id);
  else if(a==='ppCopy'){try{await navigator.clipboard.writeText(b.dataset.v);toast('คัดลอกเบอร์พร้อมเพย์แล้ว')}catch(e){prompt('คัดลอกเบอร์พร้อมเพย์',b.dataset.v)}}
  else if(a==='new'){S.view='menu';S.justSent=false;try{const u=new URL(location.href);u.searchParams.delete('o');u.searchParams.delete('t');history.replaceState(null,'',u.href)}catch(e){}await loadShop();render()}
  else if(a==='cancel')askCancel();
});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='pMem')S.memOn=e.target.checked});
const focusEl=sel=>setTimeout(()=>{const el=document.querySelector(sel);if(el)el.scrollIntoView({block:'center',behavior:'smooth'})},80);
document.addEventListener('change',async e=>{const i=e.target;if(i.type!=='file'||!i.files||!i.files[0])return;const f=i.files[0];i.value='';
  toast('กำลังเปิดรูป…');let img;try{img=await shrink(f)}catch(x){return toast('เปิดรูปไม่ได้ ลองรูปอื่น')}document.querySelector('.toast')?.remove();
  if(i.id==='slipIn'){S.slip=img;render();focusEl('.slipok')}
  else if(i.id==='slipLate'){S.lateDraft=img;render();focusEl('.slipbox')}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='poCard'||a==='poMemOn'){b.disabled=true;try{const {data,error}=await sb.rpc('po_member',{p_id:S.cur.id,p_token:S.cur.token,p_on:true});b.disabled=false;
      if(error){const m=String(error.message||'');return toast(/points_off/.test(m)?'ร้านปิดระบบสะสมแต้มอยู่':/po_member|function|PGRST20/i.test(m)?'ร้านยังไม่ได้เปิดระบบสมาชิก':'ทำรายการไม่สำเร็จ ลองอีกครั้ง')}
      showMemberCard({...data,note:data.paid?(+data.earned?`ได้รับ +${+data.earned} แต้มจากออร์เดอร์นี้ 🎉`:''):'แต้มจะเข้าเมื่อร้านยืนยันรับเงิน · ใช้ได้ทั้ง 2 ร้าน'});await loadOrder();render()}catch(x){b.disabled=false;toast('เชื่อมต่อไม่ได้ ลองอีกครั้ง')}return}
  if(a==='rcpt'){b.disabled=true;try{const {data,error}=await sb.rpc('po_receipt_link',{p_id:S.cur.id,p_token:S.cur.token});if(error||!data){b.disabled=false;return toast('ยังเปิดใบเสร็จไม่ได้ รอร้านยืนยันการชำระเงิน')}
    const u=new URL('receipt.html',location.href);location.href=u.origin+u.pathname+'?s=po&r='+encodeURIComponent(data.id)+'&t='+encodeURIComponent(data.tok)}catch(x){b.disabled=false;toast('เชื่อมต่อไม่ได้ ลองอีกครั้ง')}return}
  if(a==='slipView')return viewImg(b.getAttribute('src'),'สลิป');
  if(a==='slipClear'){S.slip=null;render();return}
  if(a==='lateClear'){S.lateDraft=null;render();setTimeout(()=>$('#slipLate').click(),50);return}
  if(a==='lateSend'&&S.lateDraft&&!S.lateBusy){S.lateBusy=true;render();
    try{const {error}=await sb.rpc('po_order_slip',{p_id:S.cur.id,p_token:S.cur.token,p_img:S.lateDraft});S.lateBusy=false;
      if(error){render();return toast(rpcErr(error))}S.lateDraft=null;toast('✓ ส่งสลิปสำเร็จ รอร้านตรวจสอบ');await loadOrder();render();focusEl('.slipok')}
    catch(x){S.lateBusy=false;render();toast('ส่งสลิปไม่สำเร็จ ลองอีกครั้ง')}}});
start();

async function checkUpdate(){try{const r=await fetch(location.pathname+'?vcheck='+Date.now(),{cache:'no-store'});if(!r.ok)return;const t=await r.text();const m=t.match(/name="app-version" content="([^"]+)"/);
  if(m&&APP_VER&&m[1]!==APP_VER&&!document.getElementById('updBar')){const b=document.createElement('div');b.id='updBar';b.className='updbar';b.innerHTML='มีเวอร์ชันใหม่ของเว็บ <button type="button">อัปเดตเลย</button>';
    b.querySelector('button').onclick=()=>{const u=new URL(location.href);u.searchParams.set('v',m[1]);location.replace(u.href)};document.body.appendChild(b)}}catch(e){}}
setTimeout(checkUpdate,3000);setInterval(checkUpdate,5*60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
</script>
